<svg xmlns="http://www.w3.org/2000/svg" id="water-spirits-kelpie-kelpie-eyes-root" viewBox="0 0 80 80" role="img" aria-label="Green Kelpie Eyes / 幽绿马眼" stroke-linecap="round" stroke-linejoin="round"><title>Green Kelpie Eyes / 幽绿马眼</title><desc>A pair of eerie green horse eyes glowing out of the loch mist. / 湖雾里亮起的一对幽绿马眼。</desc><style>#water-spirits-kelpie-kelpie-eyes-root,#water-spirits-kelpie-kelpie-eyes-root g{animation-play-state:inherit}.water-spirits-kelpie-kelpie-eyes-motion{animation:water-spirits-kelpie-kelpie-eyes-pulse 2.4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 40px}@keyframes water-spirits-kelpie-kelpie-eyes-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}@media (prefers-reduced-motion:reduce){.water-spirits-kelpie-kelpie-eyes-motion{animation:none!important;transform:none!important}}</style><defs><path id="water-spirits-kelpie-kelpie-eyes-1" d="M10 48 Q14 36 28 38 Q36 28 50 34 Q66 32 70 46 Q72 56 58 56 H20 Q8 56 10 48Z"/><clipPath id="water-spirits-kelpie-kelpie-eyes-1c"><use href="#water-spirits-kelpie-kelpie-eyes-1"/></clipPath></defs><use href="#water-spirits-kelpie-kelpie-eyes-1" fill="#FFFFFF"/><g clip-path="url(#water-spirits-kelpie-kelpie-eyes-1c)"><path d="M52 0 H80 V80 H52Z" fill="#E07A6A" opacity="0.5"/></g><use href="#water-spirits-kelpie-kelpie-eyes-1" fill="none" stroke="currentColor" stroke-width="2"/><g class="water-spirits-kelpie-kelpie-eyes-motion"><circle cx="30" cy="45" r="5.5" fill="#D5EBE6" stroke="currentColor" stroke-width="1"/><circle cx="30" cy="45" r="2.5" fill="#1E3358"/><circle cx="28.4" cy="43.1" r="1.4" fill="#FFFFFF"/><circle cx="50" cy="45" r="5.5" fill="#D5EBE6" stroke="currentColor" stroke-width="1"/><circle cx="50" cy="45" r="2.5" fill="#1E3358"/><circle cx="48.4" cy="43.1" r="1.4" fill="#FFFFFF"/></g></svg>