<svg xmlns="http://www.w3.org/2000/svg" id="water-spirits-kelpie-water-mane-root" viewBox="0 0 80 80" role="img" aria-label="Weedy Mane / 水草鬃毛" stroke-linecap="round" stroke-linejoin="round"><title>Weedy Mane / 水草鬃毛</title><desc>A wavy mane tangled with green waterweed, flowing like a current. / 缠着绿色水草、波浪般飘动的鬃毛。</desc><style>#water-spirits-kelpie-water-mane-root,#water-spirits-kelpie-water-mane-root g{animation-play-state:inherit}.water-spirits-kelpie-water-mane-motion{animation:water-spirits-kelpie-water-mane-sway 2.8s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 18px}@keyframes water-spirits-kelpie-water-mane-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}@media (prefers-reduced-motion:reduce){.water-spirits-kelpie-water-mane-motion{animation:none!important;transform:none!important}}</style><defs><path id="water-spirits-kelpie-water-mane-1" d="M30 16 Q44 14 50 18 Q42 30 52 42 Q44 52 50 64 Q38 60 34 50 Q28 40 34 30 Q26 24 30 16Z"/><clipPath id="water-spirits-kelpie-water-mane-1c"><use href="#water-spirits-kelpie-water-mane-1"/></clipPath></defs><g class="water-spirits-kelpie-water-mane-motion"><use href="#water-spirits-kelpie-water-mane-1" fill="#7BA05B"/><g clip-path="url(#water-spirits-kelpie-water-mane-1c)"><path d="M44 0 H80 V80 H44Z" fill="#1F7A78" opacity="0.5"/><path d="M38 22 Q34 34 40 44 Q38 52 44 60" fill="none" stroke="#1F7A78" stroke-width="1.2"/></g><use href="#water-spirits-kelpie-water-mane-1" fill="none" stroke="currentColor" stroke-width="2"/><path d="M30 30 q-6 4 -4 10 M50 34 q6 4 4 10" fill="none" stroke="currentColor" stroke-width="4.6"/><path d="M30 30 q-6 4 -4 10 M50 34 q6 4 4 10" fill="none" stroke="#7BA05B" stroke-width="2"/></g></svg>