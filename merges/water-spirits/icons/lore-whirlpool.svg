<svg xmlns="http://www.w3.org/2000/svg" id="water-spirits-lore-whirlpool-root" viewBox="0 0 80 80" role="img" aria-label="Whirlpool / 漩涡" stroke-linecap="round" stroke-linejoin="round"><title>Whirlpool / 漩涡</title><desc>A dark river whirlpool that swallows boats. / 吞没船只的幽暗河中旋涡。</desc><style>#water-spirits-lore-whirlpool-root,#water-spirits-lore-whirlpool-root g{animation-play-state:inherit}.water-spirits-lore-whirlpool-motion{animation:water-spirits-lore-whirlpool-spin 6s linear infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 40px}@keyframes water-spirits-lore-whirlpool-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.water-spirits-lore-whirlpool-motion{animation:none!important;transform:none!important}}</style><defs><circle id="water-spirits-lore-whirlpool-1" cx="40" cy="40" r="24"/><clipPath id="water-spirits-lore-whirlpool-1c"><use href="#water-spirits-lore-whirlpool-1"/></clipPath></defs><g class="water-spirits-lore-whirlpool-motion"><use href="#water-spirits-lore-whirlpool-1" fill="#1E3358"/><g clip-path="url(#water-spirits-lore-whirlpool-1c)"><path d="M40 14 H66 V66 H40Z" fill="#1E3358" opacity="0.5"/></g><use href="#water-spirits-lore-whirlpool-1" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M40 40 m-4 0 a4 4 0 1 1 8 0 a8 8 0 1 1 -16 0 a12 12 0 1 1 24 0 a16 16 0 1 1 -32 0" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></g></svg>