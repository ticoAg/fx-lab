<svg xmlns="http://www.w3.org/2000/svg" id="celtic-fae-banshee-flowing-hair-root" viewBox="0 0 80 80" role="img" aria-label="Flowing Hair / 飘动长发" stroke-linecap="round" stroke-linejoin="round"><title>Flowing Hair / 飘动长发</title><desc>A long lock of silver-white hair streaming in the night wind, its ends curling into arcs. / 一束随夜风飘扬的银白长发，发梢卷成弧线。</desc><style>#celtic-fae-banshee-flowing-hair-root,#celtic-fae-banshee-flowing-hair-root g{animation-play-state:inherit}.celtic-fae-banshee-flowing-hair-motion{animation:celtic-fae-banshee-flowing-hair-sway 4.2s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 14px}@keyframes celtic-fae-banshee-flowing-hair-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion:reduce){.celtic-fae-banshee-flowing-hair-motion{animation:none!important;transform:none!important}}</style><defs><path id="celtic-fae-banshee-flowing-hair-1" d="M30 12 Q44 10 50 14 Q46 30 56 44 Q64 56 56 68 Q54 58 46 56 Q40 62 30 66 Q36 54 30 44 Q22 30 30 12Z"/><clipPath id="celtic-fae-banshee-flowing-hair-1c"><use href="#celtic-fae-banshee-flowing-hair-1"/></clipPath><path id="celtic-fae-banshee-flowing-hair-2" d="M30 14 Q40 10 50 14 L50 19 Q40 15 30 19Z"/></defs><g class="celtic-fae-banshee-flowing-hair-motion"><use href="#celtic-fae-banshee-flowing-hair-1" fill="#7FA0B5"/><g clip-path="url(#celtic-fae-banshee-flowing-hair-1c)"><path d="M46 0 H80 V80 H46Z" fill="#7FA0B5" opacity="0.55"/><path d="M36 16 Q34 30 40 42 Q46 52 40 62 M44 16 Q42 30 50 44" fill="none" stroke="#7FA0B5" stroke-width="1" opacity="0.9"/></g><use href="#celtic-fae-banshee-flowing-hair-1" fill="none" stroke="currentColor" stroke-width="2"/><use href="#celtic-fae-banshee-flowing-hair-2" fill="#A33B4A"/><use href="#celtic-fae-banshee-flowing-hair-2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M33 22 Q31 32 35 40" fill="none" stroke="#FFFFFF" stroke-width="1.3" opacity="0.7"/></g></svg>