<svg xmlns="http://www.w3.org/2000/svg" id="celtic-fae-banshee-harp-root" viewBox="0 0 80 80" role="img" aria-label="Celtic Harp / 竖琴" stroke-linecap="round" stroke-linejoin="round"><title>Celtic Harp / 竖琴</title><desc>A curved-neck Irish harp with a graceful pillar and a row of silver strings. / 弯颈爱尔兰竖琴，琴柱弧线优美，银弦静静排列。</desc><style>#celtic-fae-banshee-harp-root,#celtic-fae-banshee-harp-root g{animation-play-state:inherit}.celtic-fae-banshee-harp-motion{animation:celtic-fae-banshee-harp-sway 4.0s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 68px}@keyframes celtic-fae-banshee-harp-sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}@media (prefers-reduced-motion:reduce){.celtic-fae-banshee-harp-motion{animation:none!important;transform:none!important}}</style><ellipse cx="40" cy="70" rx="18" ry="2" fill="#7FA0B5" opacity=".16"/><g class="celtic-fae-banshee-harp-motion"><path d="M26 60 V26 M32 56 V22 M38 52 V20 M44 48 V20 M50 44 V22" fill="none" stroke="#7FA0B5" stroke-width="1.1"/><path d="M22 66 L56 40 Q62 34 58 22 Q52 14 42 18 Q30 22 22 18 V66" fill="none" stroke="currentColor" stroke-width="6.2"/><path d="M22 66 L56 40 Q62 34 58 22 Q52 14 42 18 Q30 22 22 18 V66" fill="none" stroke="#7FA0B5" stroke-width="3.6"/><circle cx="22" cy="17" r="2.6" fill="#A33B4A" stroke="currentColor" stroke-width="1.2"/></g></svg>