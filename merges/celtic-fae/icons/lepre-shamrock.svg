<svg xmlns="http://www.w3.org/2000/svg" id="celtic-fae-lepre-shamrock-root" viewBox="0 0 80 80" role="img" aria-label="Shamrock / 三叶草" stroke-linecap="round" stroke-linejoin="round"><title>Shamrock / 三叶草</title><desc>Irish shamrock with three heart-shaped leaves. / 三片心形叶的爱尔兰三叶草。</desc><style>#celtic-fae-lepre-shamrock-root,#celtic-fae-lepre-shamrock-root g{animation-play-state:inherit}.celtic-fae-lepre-shamrock-motion{animation:celtic-fae-lepre-shamrock-sway 3s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:46px 66px}@keyframes celtic-fae-lepre-shamrock-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}@media (prefers-reduced-motion:reduce){.celtic-fae-lepre-shamrock-motion{animation:none!important;transform:none!important}}</style><ellipse cx="42" cy="70" rx="14" ry="2.4" fill="#3A2C22" opacity=".16"/><g class="celtic-fae-lepre-shamrock-motion"><path d="M40 44 Q42 58 48 66" fill="none" stroke="currentColor" stroke-width="5.6"/><path d="M40 44 Q42 58 48 66" fill="none" stroke="#3E6B3A" stroke-width="3"/><circle cx="40" cy="26" r="10" fill="#3E6B3A" stroke="currentColor" stroke-width="1.3"/><circle cx="48.7" cy="41" r="10" fill="#3E6B3A" stroke="currentColor" stroke-width="1.3"/><circle cx="31.3" cy="41" r="10" fill="#3E6B3A" stroke="currentColor" stroke-width="1.3"/><circle cx="40" cy="36" r="3.5" fill="#3E6B3A"/><path d="M28 24 Q32 20 36 22" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5"/></g></svg>