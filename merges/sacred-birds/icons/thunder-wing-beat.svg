<svg xmlns="http://www.w3.org/2000/svg" id="sacred-birds-thunder-wing-beat-root" viewBox="0 0 80 80" role="img" aria-label="Mighty Wingbeat / 巨翼拍击" stroke-linecap="round" stroke-linejoin="round"><title>Mighty Wingbeat / 巨翼拍击</title><desc>One huge wing sweeping down, pushing out three gusts of wind. / 一只巨大翅膀向下扇动，带出三道风线</desc><style>#sacred-birds-thunder-wing-beat-root,#sacred-birds-thunder-wing-beat-root g{animation-play-state:inherit}.sacred-birds-thunder-wing-beat-motion{animation:sacred-birds-thunder-wing-beat-float 2.4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 36px}@keyframes sacred-birds-thunder-wing-beat-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@media (prefers-reduced-motion:reduce){.sacred-birds-thunder-wing-beat-motion{animation:none!important;transform:none!important}}</style><defs><path id="sacred-birds-thunder-wing-beat-1" d="M18 20 Q44 10 62 26 L56 30 L64 36 L54 38 L60 46 L48 46 L52 54 L40 50 Q24 42 18 20Z"/><clipPath id="sacred-birds-thunder-wing-beat-1c"><use href="#sacred-birds-thunder-wing-beat-1"/></clipPath></defs><path d="M14 60 q8 -3 16 0" fill="none" stroke="#2E6B8A" stroke-width="2"/><path d="M30 66 q10 -3 20 0" fill="none" stroke="#2E6B8A" stroke-width="2"/><path d="M50 60 q7 -3 14 0" fill="none" stroke="#2E6B8A" stroke-width="2"/><g class="sacred-birds-thunder-wing-beat-motion"><use href="#sacred-birds-thunder-wing-beat-1" fill="#2E6B8A"/><g clip-path="url(#sacred-birds-thunder-wing-beat-1c)"><path d="M18 34 H66 V56 H18Z" fill="#2E6B8A" opacity="0.8"/><path d="M26 24 L48 32 M28 30 L46 40" fill="none" stroke="#F2C14E" stroke-width="1.6"/></g><use href="#sacred-birds-thunder-wing-beat-1" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M24 22 Q40 16 54 24" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.6"/></g></svg>