<svg xmlns="http://www.w3.org/2000/svg" id="sacred-birds-thunder-downpour-root" viewBox="0 0 80 80" role="img" aria-label="Downpour / 暴雨" stroke-linecap="round" stroke-linejoin="round"><title>Downpour / 暴雨</title><desc>Slanting sheets of rain pouring from a dark cloud. / 乌云下倾泻的斜雨线</desc><style>#sacred-birds-thunder-downpour-root,#sacred-birds-thunder-downpour-root g{animation-play-state:inherit}.sacred-birds-thunder-downpour-motion{animation:sacred-birds-thunder-downpour-float 2.8s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 30px}@keyframes sacred-birds-thunder-downpour-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}@media (prefers-reduced-motion:reduce){.sacred-birds-thunder-downpour-motion{animation:none!important;transform:none!important}}</style><defs><path id="sacred-birds-thunder-downpour-1" d="M40 15 A13 13 0 0 1 60.3 19.9 A7.5 7.5 0 0 1 65.3 30.9 A10.3 10.3 0 0 1 51.3 39.7 A14 14 0 0 1 28.7 39.7 A10.3 10.3 0 0 1 14.7 30.9 A7.5 7.5 0 0 1 19.7 19.9 A13 13 0 0 1 40 15Z"/><clipPath id="sacred-birds-thunder-downpour-1c"><use href="#sacred-birds-thunder-downpour-1"/></clipPath></defs><path d="M22 44 l-4 9" fill="none" stroke="#2E6B8A" stroke-width="2.2"/><path d="M32 48 l-4 9" fill="none" stroke="#2E6B8A" stroke-width="2.2"/><path d="M42 44 l-4 9" fill="none" stroke="#2E6B8A" stroke-width="2.2"/><path d="M52 48 l-4 9" fill="none" stroke="#2E6B8A" stroke-width="2.2"/><path d="M60 44 l-4 9" fill="none" stroke="#2E6B8A" stroke-width="2.2"/><path d="M28 58 l-4 9" fill="none" stroke="#2E6B8A" stroke-width="2.2"/><path d="M38 62 l-4 9" fill="none" stroke="#2E6B8A" stroke-width="2.2"/><path d="M48 58 l-4 9" fill="none" stroke="#2E6B8A" stroke-width="2.2"/><path d="M58 62 l-4 9" fill="none" stroke="#2E6B8A" stroke-width="2.2"/><g class="sacred-birds-thunder-downpour-motion"><use href="#sacred-birds-thunder-downpour-1" fill="#2E6B8A"/><g clip-path="url(#sacred-birds-thunder-downpour-1c)"><path d="M