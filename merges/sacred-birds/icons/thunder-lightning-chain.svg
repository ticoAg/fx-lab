<svg xmlns="http://www.w3.org/2000/svg" id="sacred-birds-thunder-lightning-chain-root" viewBox="0 0 80 80" role="img" aria-label="Lightning Bolt / 闪电链" stroke-linecap="round" stroke-linejoin="round"><title>Lightning Bolt / 闪电链</title><desc>A forked zigzag gold lightning bolt. / 一道分叉的锯齿金色闪电</desc><style>#sacred-birds-thunder-lightning-chain-root,#sacred-birds-thunder-lightning-chain-root g{animation-play-state:inherit}.sacred-birds-thunder-lightning-chain-motion{animation:sacred-birds-thunder-lightning-chain-pulse 1.6s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 40px}@keyframes sacred-birds-thunder-lightning-chain-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}@media (prefers-reduced-motion:reduce){.sacred-birds-thunder-lightning-chain-motion{animation:none!important;transform:none!important}}</style><defs><path id="sacred-birds-thunder-lightning-chain-1" d="M44 8 L24 40 H36 L28 72 L56 32 H44 L54 8Z"/><clipPath id="sacred-birds-thunder-lightning-chain-1c"><use href="#sacred-birds-thunder-lightning-chain-1"/></clipPath></defs><g class="sacred-birds-thunder-lightning-chain-motion"><use href="#sacred-birds-thunder-lightning-chain-1" fill="#F2C14E"/><g clip-path="url(#sacred-birds-thunder-lightning-chain-1c)"><path d="M44 8 L54 8 L44 32 H56 L28 72Z" fill="#F2C14E" opacity="0.6"/></g><use href="#sacred-birds-thunder-lightning-chain-1" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M30 40 L18 52" fill="none" stroke="currentColor" stroke-width="4"/><path d="M30 40 L18 52" fill="none" stroke="#F2C14E" stroke-width="1.4"/><path d="M42 14 L30 36" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.6"/></g></svg>