<svg xmlns="http://www.w3.org/2000/svg" id="sacred-birds-alkonost-calm-sea-root" viewBox="0 0 80 80" role="img" aria-label="Calm Sea / 平静海浪" stroke-linecap="round" stroke-linejoin="round"><title>Calm Sea / 平静海浪</title><desc>The windless sea of the brooding days: three soft layers of gentle waves. / 神鸟孵卵时风平浪静的海面，三层柔和波纹。</desc><style>#sacred-birds-alkonost-calm-sea-root,#sacred-birds-alkonost-calm-sea-root g{animation-play-state:inherit}.sacred-birds-alkonost-calm-sea-motion{animation:sacred-birds-alkonost-calm-sea-float 4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 40px}@keyframes sacred-birds-alkonost-calm-sea-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}@media (prefers-reduced-motion:reduce){.sacred-birds-alkonost-calm-sea-motion{animation:none!important;transform:none!important}}</style><defs><path id="sacred-birds-alkonost-calm-sea-1" d="M8 42 Q16 37 24 42 Q32 37 40 42 Q48 37 56 42 Q64 37 72 42 V50 H8Z"/><path id="sacred-birds-alkonost-calm-sea-2" d="M8 52 Q16 47 24 52 Q32 47 40 52 Q48 47 56 52 Q64 47 72 52 V60 H8Z"/><path id="sacred-birds-alkonost-calm-sea-3" d="M8 62 Q16 57 24 62 Q32 57 40 62 Q48 57 56 62 Q64 57 72 62 V70 H8Z"/></defs><circle cx="40" cy="26" r="9" fill="#F2C14E" stroke="currentColor" stroke-width="1.6"/><g class="sacred-birds-alkonost-calm-sea-motion"><use href="#sacred-birds-alkonost-calm-sea-1" fill="#2E6B8A"/><use href="#sacred-birds-alkonost-calm-sea-1" fill="none" stroke="currentColor" stroke-width="1.8"/><use href="#sacred-birds-alkonost-calm-sea-2" fill="#2E6B8A"/><use href="#sacred-birds-alkonost-calm-sea-2" fill="none" stroke="currentColor" stroke-width="1.8"/><use href="#sacred-birds-alkonost-calm-sea-3" fill="#2E6B8A"/><use href="#sacred-birds-alkonost-calm-sea-3" fill="none" stroke="currentColor" stroke-width="1.8"/></g></svg>