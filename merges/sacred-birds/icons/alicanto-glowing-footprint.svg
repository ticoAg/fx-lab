<svg xmlns="http://www.w3.org/2000/svg" id="sacred-birds-alicanto-glowing-footprint-root" viewBox="0 0 80 80" role="img" aria-label="Glowing Footprints / 发光足迹" stroke-linecap="round" stroke-linejoin="round"><title>Glowing Footprints / 发光足迹</title><desc>A trail of glowing three-toed bird prints across the sand. / 沙地上一串发金光的三趾鸟爪印。</desc><style>#sacred-birds-alicanto-glowing-footprint-root,#sacred-birds-alicanto-glowing-footprint-root g{animation-play-state:inherit}.sacred-birds-alicanto-glowing-footprint-motion{animation:sacred-birds-alicanto-glowing-footprint-pulse 2.8s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 42px}@keyframes sacred-birds-alicanto-glowing-footprint-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}@media (prefers-reduced-motion:reduce){.sacred-birds-alicanto-glowing-footprint-motion{animation:none!important;transform:none!important}}</style><path d="M6 69 Q10 63 40.0 64 Q70 63 74 69Z" fill="#F2C14E" stroke="currentColor" stroke-width="1.2"/><g class="sacred-birds-alicanto-glowing-footprint-motion"><circle cx="18" cy="55" r="6" fill="#F4E1B5" opacity=".4"/><circle cx="34" cy="45" r="6" fill="#F4E1B5" opacity=".4"/><circle cx="50" cy="35" r="6" fill="#F4E1B5" opacity=".4"/><circle cx="64" cy="23" r="6" fill="#F4E1B5" opacity=".4"/><path d="M18 58 l-4 -6 M18 58 l0 -7 M18 58 l4 -6 M18 58 l0 4" fill="none" stroke="#F2C14E" stroke-width="2.4" transform="rotate(30 18 58)"/><path d="M34 48 l-4 -6 M34 48 l0 -7 M34 48 l4 -6 M34 48 l0 4" fill="none" stroke="#F2C14E" stroke-width="2.4" transform="rotate(40 34 48)"/><path d="M50 38 l-4 -6 M50 38 l0 -7 M50 38 l4 -6 M50 38 l0 4" fill="none" stroke="#F2C14E" stroke-width="2.4" transform="rotate(30 50 38)"/><path d="M64 26 l-4 -6 M64 26 l0 -7 M64 26 l4 -6 M64 26 l0 4" fill="none" stroke="#F2C14E" stroke-width="2.4" transform="rotate(40 64 26)"/><path d="M26 19 L27.1 20.9 L29 22 L27.1 23.1 L26 25 L24.9 23.1 L23 22 L24.9 20.9Z" fill="#F4E1B5" stroke="curren