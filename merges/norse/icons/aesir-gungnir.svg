<svg id="norse-aesir-gungnir-root" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" class="norse-aesir-gungnir-root"><title id="norse-aesir-gungnir-title">永恒之枪 / Gungnir</title><desc id="norse-aesir-gungnir-desc">奥丁的永恒之枪冈格尼尔：螺旋皮缠的白蜡长杆、刻有如尼文与中脊的叶形枪刃、带交织纹的金色翼形枪銎，以及鸦羽流苏。 Gungnir, Odin's never-missing spear: a long ash shaft with spiral leather wrapping, a leaf-shaped blade engraved with runes and a central fuller, a gold winged socket with interlace, and a raven-feather tassel.</desc><style>.norse-aesir-gungnir-root,.norse-aesir-gungnir-root *{animation-play-state:inherit}.norse-aesir-gungnir-motion{animation:norse-aesir-gungnir-sway 5s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 40px}@keyframes norse-aesir-gungnir-sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}@media(prefers-reduced-motion:reduce){.norse-aesir-gungnir-motion{animation:none!important;transform:none!important}}</style><defs><linearGradient id="norse-aesir-gungnir-a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D5DDE3"/><stop offset="1" stop-color="#1E3A4C"/></linearGradient><linearGradient id="norse-aesir-gungnir-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C4A15A"/><stop offset="1" stop-color="#6B5344"/></linearGradient><linearGradient id="norse-aesir-gungnir-d" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C4A15A"/><stop offset="1" stop-color="#3A2C22"/></linearGradient></defs><g class="norse-aesir-gungnir-motion" stroke-linejoin="round" stroke-linecap="round"><path d="M38 32H42V64H38Z" fill="url(#norse-aesir-gungnir-d)" stroke="currentColor" stroke-width="0.6"/><path d="M40 34V60" fill="none" stroke="#C4A15A" stroke-width="0.5"/><path d="M40 12L48 32H32Z" fill="url(#norse-aesir-gungnir-a)" stroke="currentColor"/><path d="M40 16V30" fill="none" stroke="#C4A15A" stroke-width="0.6"/><path d="M36 22H44M37 26H43" fill="none" stroke="#C4A15A" stroke-width="0.5"/><path d="M28 32H52L48 38H32Z" fill="url(#norse-aesir-gungnir-b)" stroke="currentColor" stroke-width="0.6"/><path d="M34 36L40 32L46 36" fill="none" stroke="#6B5344" stroke-width="0.6"/><path d="M36 62L30 70M40 64V70M44 62L50 70" fill="none" stroke="#1E3A4C" stroke-width="1.3"/></g></svg>
