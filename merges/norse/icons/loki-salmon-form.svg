<svg xmlns="http://www.w3.org/2000/svg" id="norse-loki-salmon-form-root" viewBox="0 0 80 80" role="img" aria-label="Salmon form / 变身鲑鱼" stroke-linecap="round" stroke-linejoin="round"><title>Salmon form / 变身鲑鱼</title><desc>Loki as a pink-orange salmon floating above blue ripples and water drops. / 洛基变成的橙粉色鲑鱼浮在蓝色水波与水滴之上。</desc><style>#norse-loki-salmon-form-root,#norse-loki-salmon-form-root g{animation-play-state:inherit}.norse-loki-salmon-form-motion{animation:norse-loki-salmon-form-float 3.2s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 40px}@keyframes norse-loki-salmon-form-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}@media (prefers-reduced-motion:reduce){.norse-loki-salmon-form-motion{animation:none!important;transform:none!important}}</style><defs><path id="norse-loki-salmon-form-1" d="M20.0 38 Q35.0 26.75 52.5 34.25 L62.5 28.0 L60.0 38 L62.5 48.0 L52.5 41.75 Q35.0 49.25 20.0 38Z"/><clipPath id="norse-loki-salmon-form-1c"><use href="#norse-loki-salmon-form-1"/></clipPath></defs><path d="M8 62 Q18 58 28 62 T48 62 T68 62 M14 70 Q24 66 34 70 T54 70" fill="none" stroke="#3E6F8C" stroke-width="1.8"/><circle cx="20" cy="52" r="1.8" fill="#D5DDE3" stroke="currentColor" stroke-width="1"/><circle cx="62" cy="50" r="1.6" fill="#D5DDE3" stroke="currentColor" stroke-width="1"/><g class="norse-loki-salmon-form-motion"><use href="#norse-loki-salmon-form-1" fill="#C4A15A"/><g clip-path="url(#norse-loki-salmon-form-1c)"><path d="M17.5 39.25 H65.0 V50.5 H17.5Z" fill="#8E2F2B" opacity="0.6"/><path d="M32.5 33.0 q2 4 0 8" fill="none" stroke="#8E2F2B" stroke-width="1"/><circle cx="37.5" cy="35.5" r="0.9" fill="#3E6F8C"/><circle cx="43.8" cy="39.2" r="0.9" fill="#3E6F8C"/></g><use href="#norse-loki-salmon-form-1" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="26.2" cy="36.1" r="1.3" fill="#3A2C22"/><circle cx="26.7" cy="35.6" r="0.5" fill="#FFFFFF"/></g></svg>