<svg xmlns="http://www.w3.org/2000/svg" id="norse-thor-mjolnir-root" viewBox="0 0 80 80" role="img" aria-label="Mjolnir / 雷神之锤" stroke-linecap="round" stroke-linejoin="round"><title>Mjolnir / 雷神之锤</title><desc>A short-handled war hammer etched with golden runes. / 刻满符文的短柄战锤。</desc><style>#norse-thor-mjolnir-root,#norse-thor-mjolnir-root g{animation-play-state:inherit}.norse-thor-mjolnir-motion{animation:norse-thor-mjolnir-pulse 2.6s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 30px}@keyframes norse-thor-mjolnir-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}@media (prefers-reduced-motion:reduce){.norse-thor-mjolnir-motion{animation:none!important;transform:none!important}}</style><defs><path id="norse-thor-mjolnir-1" d="M26 16 H54 Q56 24 54 32 H26 Q24 24 26 16Z"/><clipPath id="norse-thor-mjolnir-1c"><use href="#norse-thor-mjolnir-1"/></clipPath></defs><ellipse cx="40" cy="72" rx="12" ry="2.4" fill="#3A2C22" opacity=".16"/><g class="norse-thor-mjolnir-motion"><path d="M40 32 V54" fill="none" stroke="currentColor" stroke-width="5.8"/><path d="M40 32 V54" fill="none" stroke="#6B5344" stroke-width="3.2"/><path d="M38 38 H42 M38 43 H42 M38 48 H42" fill="none" stroke="#6B5344" stroke-width="1"/><use href="#norse-thor-mjolnir-1" fill="#D5DDE3"/><g clip-path="url(#norse-thor-mjolnir-1c)"><path d="M42 0 H80 V80 H42Z" fill="#3E6F8C" opacity="0.45"/><path d="M29 19 H44" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.6"/></g><use href="#norse-thor-mjolnir-1" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M33 21 V27 M33 21 L35 23 L33 25 M38 21 V27 L40 24 M43 21 L45 27 L47 21" fill="none" stroke="#C4A15A" stroke-width="1"/></g></svg>