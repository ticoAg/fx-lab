<svg id="norse-aesir-odin-root" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" class="norse-aesir-odin-root"><title id="norse-aesir-odin-title">奥丁 / Odin</title><desc id="norse-aesir-odin-desc">独眼的众神之父奥丁：宽檐旅人帽、眼罩与一只金光独眼、层叠长须、深色斗篷配瓦尔克努特（三角结）胸针、渡鸦羽领，肩后斜倚刻有如尼文的长枪。 Odin, the one-eyed Allfather: wide-brimmed wanderer hat, eye patch and single gold-lit eye, long layered beard, dark cloak with valknut brooch, raven-feather collar and a rune-etched spear behind his shoulder.</desc><style>.norse-aesir-odin-root,.norse-aesir-odin-root *{animation-play-state:inherit}.norse-aesir-odin-motion{animation:norse-aesir-odin-float 4.6s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 40px}@keyframes norse-aesir-odin-float{0%,100%{transform:translateY(-1.2px)}50%{transform:translateY(1.2px)}}@media(prefers-reduced-motion:reduce){.norse-aesir-odin-motion{animation:none!important;transform:none!important}}</style><defs><linearGradient id="norse-aesir-odin-a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D5DDE3"/><stop offset="1" stop-color="#1E3A4C"/></linearGradient><linearGradient id="norse-aesir-odin-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C4A15A"/><stop offset="1" stop-color="#6B5344"/></linearGradient><linearGradient id="norse-aesir-odin-c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C4A15A"/><stop offset="1" stop-color="#C4A15A"/></linearGradient><linearGradient id="norse-aesir-odin-d" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C4A15A"/><stop offset="1" stop-color="#3A2C22"/></linearGradient></defs><g class="norse-aesir-odin-motion" stroke-linejoin="round" stroke-linecap="round"><path d="M58 16L66 62" fill="none" stroke="#3A2C22" stroke-width="2.4"/><path d="M58 14L66 24L54 20Z" fill="url(#norse-aesir-odin-b)" stroke="currentColor"/><path d="M60 20L62 26" fill="none" stroke="#C4A15A" stroke-width="0.6"/><path d="M16 69L24 