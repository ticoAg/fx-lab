<svg id="norse-aesir-norn-spindle-root" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" class="norse-aesir-norn-spindle-root"><title id="norse-aesir-norn-spindle-title">诺恩纺锤 / Norn Spindle</title><desc id="norse-aesir-norn-spindle-desc">诺恩的纺锤：骨色纺杆、旧金纺轮，冰青丝线从顶端绕下。命运之线的器物，不是三位女神的人像。 The Norns' spindle: a bone shaft, an old-gold whorl, and an ice-blue thread. The tool of fate, not a portrait of the three women.</desc><style>.norse-aesir-norn-spindle-root,.norse-aesir-norn-spindle-root *{animation-play-state:inherit}.norse-aesir-norn-spindle-motion{animation:norse-aesir-norn-spindle-sway 5s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 40px}@keyframes norse-aesir-norn-spindle-sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}@media(prefers-reduced-motion:reduce){.norse-aesir-norn-spindle-motion{animation:none!important;transform:none!important}}</style><defs><linearGradient id="norse-aesir-norn-spindle-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C4A15A"/><stop offset="1" stop-color="#6B5344"/></linearGradient><linearGradient id="norse-aesir-norn-spindle-d" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C4A15A"/><stop offset="1" stop-color="#3A2C22"/></linearGradient></defs><g class="norse-aesir-norn-spindle-motion" stroke-linejoin="round" stroke-linecap="round"><path d="M38 16H42V62H38Z" fill="url(#norse-aesir-norn-spindle-d)" stroke="currentColor" stroke-width="0.6"/><path d="M34 14H46" fill="none" stroke="#C4A15A" stroke-width="1.4"/><ellipse cx="40" cy="64" rx="3.2" ry="2.2" fill="#3A2C22" stroke="currentColor" stroke-width="0.5"/><ellipse cx="40" cy="48" rx="14" ry="5.2" fill="url(#norse-aesir-norn-spindle-b)" stroke="currentColor"/><ellipse cx="40" cy="48" rx="6" ry="2.2" fill="#C4A15A" stroke="#6B5344" stroke-width="0.5"/><path d="M40 16Q54 24 50 36Q44 44 40 46" fill="none" stroke="#3E6F8C" stroke-width="1.2"/><path d="M40 18Q28 26 32 34" fill="none" stroke="#D5DDE3" stroke-width="0.7"/><circle cx="50" cy="36" r="1" fill="#D5DDE3"/></g></svg>
