<svg xmlns="http://www.w3.org/2000/svg" id="norse-loki-net-ashes-root" viewBox="0 0 80 80" role="img" aria-label="Net ashes / 渔网灰烬" stroke-linecap="round" stroke-linejoin="round"><title>Net ashes / 渔网灰烬</title><desc>Grey ashes on crossed logs still show the net grid, with glowing embers fading. / 交叉木柴上的灰烬仍留着网格印，余烬闪烁渐熄。</desc><style>#norse-loki-net-ashes-root,#norse-loki-net-ashes-root g{animation-play-state:inherit}.norse-loki-net-ashes-motion{animation:norse-loki-net-ashes-pulse 3.2s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 50px}@keyframes norse-loki-net-ashes-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}@media (prefers-reduced-motion:reduce){.norse-loki-net-ashes-motion{animation:none!important;transform:none!important}}</style><defs><path id="norse-loki-net-ashes-1" d="M14 62 Q40 46 66 62 Q40 70 14 62Z"/><clipPath id="norse-loki-net-ashes-1c"><use href="#norse-loki-net-ashes-1"/></clipPath></defs><ellipse cx="40" cy="70" rx="26" ry="2.4" fill="#3A2C22" opacity=".16"/><path d="M18 66 L46 58 M62 66 L34 58" fill="none" stroke="currentColor" stroke-width="6.6"/><path d="M18 66 L46 58 M62 66 L34 58" fill="none" stroke="#6B5344" stroke-width="4"/><use href="#norse-loki-net-ashes-1" fill="#1E3A4C"/><g clip-path="url(#norse-loki-net-ashes-1c)"><path d="M18 56 L20.5 66 M24 56 L26.5 66 M30 56 L32.5 66 M36 56 L38.5 66 M42 56 L44.5 66 M48 56 L50.5 66 M54 56 L56.5 66 M18 56 Q38.0 59 60.5 56 M18 62 Q38.0 65 60.5 62 " fill="none" stroke="#C4A15A" stroke-width="1"/></g><use href="#norse-loki-net-ashes-1" fill="none" stroke="currentColor" stroke-width="2.4"/><g class="norse-loki-net-ashes-motion"><circle cx="32" cy="54" r="2.2" fill="#C4A15A" stroke="currentColor" stroke-width="1"/><circle cx="46" cy="52" r="1.8" fill="#C4A15A" stroke="currentColor" stroke-width="1"/><circle cx="40" cy="46" r="1.4" fill="#C4A15A"/></g></svg>