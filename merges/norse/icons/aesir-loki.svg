<svg id="norse-aesir-loki-root" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" class="norse-aesir-loki-root"><title id="norse-aesir-loki-title">洛基 / Loki</title><desc id="norse-aesir-loki-desc">变形诡计之神洛基：火焰般后掠的发型、细长斜眼与狡黠歪笑，身后燃着火舌光环，一条带鳞青蛇盘绕双肩。 Loki, the shape-shifting trickster: swept flame-like hair, narrow slanted eyes and a sly crooked smile, a halo of licking fire behind him and a scaled green serpent coiled across his shoulders.</desc><style>.norse-aesir-loki-root,.norse-aesir-loki-root *{animation-play-state:inherit}.norse-aesir-loki-motion{animation:norse-aesir-loki-sway 5s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 40px}@keyframes norse-aesir-loki-sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}@media(prefers-reduced-motion:reduce){.norse-aesir-loki-motion{animation:none!important;transform:none!important}}</style><defs><linearGradient id="norse-aesir-loki-a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D5DDE3"/><stop offset="1" stop-color="#1E3A4C"/></linearGradient><linearGradient id="norse-aesir-loki-c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C4A15A"/><stop offset="1" stop-color="#C4A15A"/></linearGradient></defs><g class="norse-aesir-loki-motion" stroke-linejoin="round" stroke-linecap="round"><path d="M18 28Q28 14 36 26Q30 18 24 20" fill="none" stroke="#8E2F2B" stroke-width="3.2"/><path d="M46 24Q58 12 66 26Q60 16 52 22" fill="none" stroke="#C4A15A" stroke-width="2.6"/><path d="M20 36Q30 22 34 34" fill="none" stroke="#C4A15A" stroke-width="1.4"/><path d="M16 69L24 48Q40 42 56 48L64 69Z" fill="url(#norse-aesir-loki-a)" stroke="currentColor"/><path d="M16 62Q30 56 44 62Q58 68 66 58" fill="none" stroke="#6B5344" stroke-width="3.6"/><path d="M20 64Q36 70 50 62" fill="none" stroke="#1E3A4C" stroke-width="1.1"/><circle cx="66" cy="56" r="2.4" fill="#1E3A4C" stroke="currentColor" stroke-width="0.5"/><circle cx=