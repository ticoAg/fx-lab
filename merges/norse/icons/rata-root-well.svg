<svg xmlns="http://www.w3.org/2000/svg" id="norse-rata-root-well-root" viewBox="0 0 80 80" role="img" aria-label="Root Well / 树根之泉" stroke-linecap="round" stroke-linejoin="round"><title>Root Well / 树根之泉</title><desc>A blue spring with a ripple, circled by tree roots. / 树根环绕的一汪蓝色泉水与涟漪。</desc><style>#norse-rata-root-well-root,#norse-rata-root-well-root g{animation-play-state:inherit}.norse-rata-root-well-motion{animation:norse-rata-root-well-pulse 2.8s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 54px}@keyframes norse-rata-root-well-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@media (prefers-reduced-motion:reduce){.norse-rata-root-well-motion{animation:none!important;transform:none!important}}</style><defs><path id="norse-rata-root-well-1" d="M14 54 Q14 44 40 44 Q66 44 66 54 Q66 64 40 64 Q14 64 14 54Z"/><clipPath id="norse-rata-root-well-1c"><use href="#norse-rata-root-well-1"/></clipPath></defs><path d="M10 40 Q22 36 28 46 M70 40 Q58 36 52 46 M40 12 V40" fill="none" stroke="currentColor" stroke-width="5.6"/><path d="M10 40 Q22 36 28 46 M70 40 Q58 36 52 46 M40 12 V40" fill="none" stroke="#6B5344" stroke-width="3"/><use href="#norse-rata-root-well-1" fill="#D5DDE3"/><g clip-path="url(#norse-rata-root-well-1c)"><path d="M44 0 H80 V80 H44Z" fill="#3E6F8C" opacity="0.45"/></g><use href="#norse-rata-root-well-1" fill="none" stroke="currentColor" stroke-width="2.4"/><g class="norse-rata-root-well-motion"><ellipse cx="40" cy="54" rx="10" ry="3.4" fill="none" stroke="currentColor" stroke-width="1.2"/><ellipse cx="40" cy="54" rx="4" ry="1.4" fill="#FFFFFF"/></g></svg>