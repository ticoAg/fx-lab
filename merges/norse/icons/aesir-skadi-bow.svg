<svg id="norse-aesir-skadi-bow-root" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" class="norse-aesir-skadi-bow-root"><title id="norse-aesir-skadi-bow-title">斯卡蒂猎弓 / Skadi's Bow</title><desc id="norse-aesir-skadi-bow-desc">斯卡蒂的猎弓：焦木反曲弓竖着，弦上搭一支骨色箭，弓梢有一小簇冰霜。这是弓，不是长枪。 Skadi's hunting bow: a charred recurve stood upright, a bone-colored arrow on the string, and a small frost tuft at the tip. A bow, not a spear.</desc><style>.norse-aesir-skadi-bow-root,.norse-aesir-skadi-bow-root *{animation-play-state:inherit}.norse-aesir-skadi-bow-motion{animation:norse-aesir-skadi-bow-sway 5s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 40px}@keyframes norse-aesir-skadi-bow-sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}@media(prefers-reduced-motion:reduce){.norse-aesir-skadi-bow-motion{animation:none!important;transform:none!important}}</style><defs><linearGradient id="norse-aesir-skadi-bow-d" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C4A15A"/><stop offset="1" stop-color="#3A2C22"/></linearGradient></defs><g class="norse-aesir-skadi-bow-motion" stroke-linejoin="round" stroke-linecap="round"><path d="M30 14Q14 40 30 66" fill="none" stroke="url(#norse-aesir-skadi-bow-d)" stroke-width="3.4"/><path d="M30 14Q14 40 30 66" fill="none" stroke="currentColor" stroke-width="0.8"/><path d="M30 16V64" fill="none" stroke="#C4A15A" stroke-width="0.8"/><rect x="26" y="36" width="8" height="8" fill="#3A2C22" stroke="#C4A15A" stroke-width="0.5"/><path d="M28 40H62" fill="none" stroke="#C4A15A" stroke-width="1.3"/><path d="M58 36L66 40L58 44Z" fill="#D5DDE3" stroke="currentColor" stroke-width="0.6"/><path d="M30 36L26 40L30 44" fill="none" stroke="#3E6F8C" stroke-width="1"/><path d="M24 12L30 16L20 18Z" fill="#D5DDE3" stroke="#1E3A4C" stroke-width="0.5"/><circle cx="22" cy="14" r="1" fill="#C4A15A"/></g></svg>
