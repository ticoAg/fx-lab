<svg xmlns="http://www.w3.org/2000/svg" id="norse-sigurd-shield-root" viewBox="0 0 80 80" role="img" aria-label="Round Shield / 圆盾" stroke-linecap="round" stroke-linejoin="round"><title>Round Shield / 圆盾</title><desc>A bronze-toned round shield with a gold boss. / 青铜色木圆盾，金色盾钉。</desc><style>#norse-sigurd-shield-root,#norse-sigurd-shield-root g{animation-play-state:inherit}.norse-sigurd-shield-motion{animation:norse-sigurd-shield-sway 3.4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 66px}@keyframes norse-sigurd-shield-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion:reduce){.norse-sigurd-shield-motion{animation:none!important;transform:none!important}}</style><defs><circle id="norse-sigurd-shield-1" cx="40" cy="40" r="25"/><clipPath id="norse-sigurd-shield-1c"><use href="#norse-sigurd-shield-1"/></clipPath><circle id="norse-sigurd-shield-2" cx="40" cy="40" r="6"/><clipPath id="norse-sigurd-shield-2c"><use href="#norse-sigurd-shield-2"/></clipPath></defs><ellipse cx="40" cy="71" rx="16" ry="2.2" fill="#3A2C22" opacity=".16"/><g class="norse-sigurd-shield-motion"><use href="#norse-sigurd-shield-1" fill="#6B5344"/><g clip-path="url(#norse-sigurd-shield-1c)"><path d="M40 14 H68 V68 H40Z" fill="#3A2C22" opacity="0.55"/><path d="M40 15 V65 M15 40 H65" fill="none" stroke="#3A2C22" stroke-width="1.2"/><path d="M24 26 C28 21 33 18 38 17" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.6"/></g><use href="#norse-sigurd-shield-1" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="40" cy="40" r="22" fill="none" stroke="#C4A15A" stroke-width="1.6"/><use href="#norse-sigurd-shield-2" fill="#C4A15A"/><g clip-path="url(#norse-sigurd-shield-2c)"><path d="M41 33 H48 V47 H41Z" fill="#C4A15A" opacity="0.6"/></g><use href="#norse-sigurd-shield-2" fill="none" stroke="currentColor" stroke-width="1.6"/></g></svg>