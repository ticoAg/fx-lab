<svg xmlns="http://www.w3.org/2000/svg" id="norse-loki-franang-falls-root" viewBox="0 0 80 80" role="img" aria-label="Franang falls / 弗拉南瀑布" stroke-linecap="round" stroke-linejoin="round"><title>Franang falls / 弗拉南瀑布</title><desc>A pale blue waterfall pours between grey rocks into a blue pool where Loki hides. / 浅蓝瀑布从两侧灰岩间倾泻进蓝色水潭，洛基藏身于此。</desc><style>#norse-loki-franang-falls-root,#norse-loki-franang-falls-root g{animation-play-state:inherit}.norse-loki-franang-falls-motion{animation:norse-loki-franang-falls-float 3.2s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 40px}@keyframes norse-loki-franang-falls-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}@media (prefers-reduced-motion:reduce){.norse-loki-franang-falls-motion{animation:none!important;transform:none!important}}</style><defs><path id="norse-loki-franang-falls-1" d="M8 70 V24 Q14 16 26 18 V70Z M54 70 V20 Q64 14 72 22 V70Z"/><clipPath id="norse-loki-franang-falls-1c"><use href="#norse-loki-franang-falls-1"/></clipPath><path id="norse-loki-franang-falls-2" d="M26 18 H54 V64 H26Z"/><clipPath id="norse-loki-franang-falls-2c"><use href="#norse-loki-franang-falls-2"/></clipPath></defs><use href="#norse-loki-franang-falls-1" fill="#1E3A4C"/><g clip-path="url(#norse-loki-franang-falls-1c)"><path d="M8 40 H26 V70 H8Z M60 40 H72 V70 H60Z" fill="#3A2C22" opacity="0.6"/></g><use href="#norse-loki-franang-falls-1" fill="none" stroke="currentColor" stroke-width="2.4"/><ellipse cx="40" cy="66" rx="24" ry="5" fill="#3E6F8C" stroke="currentColor" stroke-width="1.4"/><g class="norse-loki-franang-falls-motion"><use href="#norse-loki-franang-falls-2" fill="#D5DDE3"/><g clip-path="url(#norse-loki-franang-falls-2c)"><path d="M32 20 V60 M40 22 V62 M48 20 V60" fill="none" stroke="#D5DDE3" stroke-width="1.6" opacity="0.8"/></g><use href="#norse-loki-franang-falls-2" fill="none" stroke="currentColor" stroke-width="2.4"/></g><ellipse cx="30" cy="64" rx="4" ry="2" fill="#D5DDE3" stroke="currentColor" stroke-width="1"/><ellipse cx="50" cy="64" rx="4" ry="2" fill="#D5DDE3" stroke="currentColor" stroke-width="1"/></svg>