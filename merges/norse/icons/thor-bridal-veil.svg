<svg xmlns="http://www.w3.org/2000/svg" id="norse-thor-bridal-veil-root" viewBox="0 0 80 80" role="img" aria-label="Bridal Veil / 新娘面纱" stroke-linecap="round" stroke-linejoin="round"><title>Bridal Veil / 新娘面纱</title><desc>A white bridal veil topped with a flower crown. / 缀着花冠的白色新娘头纱。</desc><style>#norse-thor-bridal-veil-root,#norse-thor-bridal-veil-root g{animation-play-state:inherit}.norse-thor-bridal-veil-motion{animation:norse-thor-bridal-veil-sway 3.6s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 12px}@keyframes norse-thor-bridal-veil-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion:reduce){.norse-thor-bridal-veil-motion{animation:none!important;transform:none!important}}</style><defs><path id="norse-thor-bridal-veil-1" d="M40 12 Q16 20 16 66 Q28 62 40 68 Q52 62 64 66 Q64 20 40 12Z"/><clipPath id="norse-thor-bridal-veil-1c"><use href="#norse-thor-bridal-veil-1"/></clipPath></defs><g class="norse-thor-bridal-veil-motion"><use href="#norse-thor-bridal-veil-1" fill="#C4A15A"/><g clip-path="url(#norse-thor-bridal-veil-1c)"><path d="M46 0 H80 V80 H46Z" fill="#C4A15A" opacity="0.5"/><path d="M24 40 Q26 24 36 18" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.6"/></g><use href="#norse-thor-bridal-veil-1" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M30 30 Q34 48 30 62 M50 30 Q46 48 50 62" fill="none" stroke="#C4A15A" stroke-width="0.9" opacity="0.8"/><circle cx="32" cy="16" r="2.2" fill="#C4A15A" stroke="currentColor" stroke-width="1"/><circle cx="40" cy="12" r="2.2" fill="#FFFFFF" stroke="currentColor" stroke-width="1"/><circle cx="48" cy="16" r="2.2" fill="#C4A15A" stroke="currentColor" stroke-width="1"/></g></svg>