<svg xmlns="http://www.w3.org/2000/svg" id="norse-loki-hearth-fire-root" viewBox="0 0 80 80" role="img" aria-label="Hearth fire / 炉火" stroke-linecap="round" stroke-linejoin="round"><title>Hearth fire / 炉火</title><desc>A hurried fire of crossed logs ringed by stones, its orange-gold flame flickering. / 石圈围着交叉木柴，仓促点起的橙金火焰跳动。</desc><style>#norse-loki-hearth-fire-root,#norse-loki-hearth-fire-root g{animation-play-state:inherit}.norse-loki-hearth-fire-motion{animation:norse-loki-hearth-fire-pulse 3.2s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 56px}@keyframes norse-loki-hearth-fire-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}@media (prefers-reduced-motion:reduce){.norse-loki-hearth-fire-motion{animation:none!important;transform:none!important}}</style><defs><path id="norse-loki-hearth-fire-1" d="M40 14 Q50 28 54 40 Q56 54 40 56 Q24 54 26 40 Q28 30 34 24 Q36 34 40 34 Q38 24 40 14Z"/><clipPath id="norse-loki-hearth-fire-1c"><use href="#norse-loki-hearth-fire-1"/></clipPath></defs><path d="M22 60 L56 54 M58 60 L24 54" fill="none" stroke="currentColor" stroke-width="6"/><path d="M22 60 L56 54 M58 60 L24 54" fill="none" stroke="#6B5344" stroke-width="3.4"/><g class="norse-loki-hearth-fire-motion"><use href="#norse-loki-hearth-fire-1" fill="#C4A15A"/><g clip-path="url(#norse-loki-hearth-fire-1c)"><path d="M30 40 Q40 30 50 42 Q48 54 40 54 Q32 54 30 40Z" fill="#C4A15A"/></g><use href="#norse-loki-hearth-fire-1" fill="none" stroke="currentColor" stroke-width="2.4"/></g><circle cx="20" cy="66" r="5" fill="#C4A15A" stroke="currentColor" stroke-width="1.3"/><circle cx="30" cy="66" r="5" fill="#C4A15A" stroke="currentColor" stroke-width="1.3"/><circle cx="40" cy="66" r="5" fill="#C4A15A" stroke="currentColor" stroke-width="1.3"/><circle cx="50" cy="66" r="5" fill="#C4A15A" stroke="currentColor" stroke-width="1.3"/><circle cx="60" cy="66" r="5" fill="#C4A15A" stroke="currentColor" stroke-width="1.3"/></svg>