<svg xmlns="http://www.w3.org/2000/svg" id="norse-rata-trunk-climb-root" viewBox="0 0 80 80" role="img" aria-label="Trunk Climb / 树干攀爬" stroke-linecap="round" stroke-linejoin="round"><title>Trunk Climb / 树干攀爬</title><desc>A tiny squirrel racing up and down a thick trunk. / 沿着粗树干上下奔跑的小松鼠。</desc><style>#norse-rata-trunk-climb-root,#norse-rata-trunk-climb-root g{animation-play-state:inherit}.norse-rata-trunk-climb-motion{animation:norse-rata-trunk-climb-float 2.2s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 40px}@keyframes norse-rata-trunk-climb-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@media (prefers-reduced-motion:reduce){.norse-rata-trunk-climb-motion{animation:none!important;transform:none!important}}</style><defs><path id="norse-rata-trunk-climb-1" d="M28 74 Q30 40 26 6 H54 Q50 40 52 74Z"/><clipPath id="norse-rata-trunk-climb-1c"><use href="#norse-rata-trunk-climb-1"/></clipPath></defs><use href="#norse-rata-trunk-climb-1" fill="#6B5344"/><g clip-path="url(#norse-rata-trunk-climb-1c)"><path d="M42 0 H80 V80 H42Z" fill="#3A2C22" opacity="0.45"/><path d="M34 16 Q36 30 34 44 M46 36 Q48 52 46 66" fill="none" stroke="#3A2C22" stroke-width="1.4"/></g><use href="#norse-rata-trunk-climb-1" fill="none" stroke="currentColor" stroke-width="2.4"/><g class="norse-rata-trunk-climb-motion"><circle cx="40" cy="40" r="6" fill="#C4A15A" stroke="currentColor" stroke-width="1.4"/><path d="M34 40 Q26 46 30 54 Q34 50 36 44Z" fill="#6B5344" stroke="currentColor" stroke-width="1.2"/><circle cx="42" cy="38" r="1.4" fill="#3A2C22"/><circle cx="42.5" cy="37.5" r="0.5" fill="#FFFFFF"/><path d="M38 34 L39 30 L41 34Z" fill="#C4A15A" stroke="currentColor" stroke-width="1"/></g></svg>