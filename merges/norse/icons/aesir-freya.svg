<svg id="norse-aesir-freya-root" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" class="norse-aesir-freya-root"><title id="norse-aesir-freya-title">芙蕾雅 / Freya</title><desc id="norse-aesir-freya-desc">爱与塞兹魔法女神芙蕾雅：飘逸金色长发、细碎花冠、金珠项链布里希嘉曼、层叠鹰羽披风与柔和琥珀光晕。 Freya, goddess of love and seidr: long flowing golden hair, a crown of tiny flowers, the gold-bead Brisingamen necklace, a falcon-feather cloak with layered plumes and a soft amber glow.</desc><style>.norse-aesir-freya-root,.norse-aesir-freya-root *{animation-play-state:inherit}.norse-aesir-freya-motion{animation:norse-aesir-freya-float 4.6s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 40px}@keyframes norse-aesir-freya-float{0%,100%{transform:translateY(-1.2px)}50%{transform:translateY(1.2px)}}@media(prefers-reduced-motion:reduce){.norse-aesir-freya-motion{animation:none!important;transform:none!important}}</style><defs><linearGradient id="norse-aesir-freya-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C4A15A"/><stop offset="1" stop-color="#6B5344"/></linearGradient><linearGradient id="norse-aesir-freya-c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C4A15A"/><stop offset="1" stop-color="#C4A15A"/></linearGradient><linearGradient id="norse-aesir-freya-d" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C4A15A"/><stop offset="1" stop-color="#3A2C22"/></linearGradient><linearGradient id="norse-aesir-freya-e" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D5DDE3"/><stop offset="1" stop-color="#1E3A4C"/></linearGradient></defs><g class="norse-aesir-freya-motion" stroke-linejoin="round" stroke-linecap="round"><path d="M14 66Q18 40 28 36Q22 48 16 44Z" fill="url(#norse-aesir-freya-e)" stroke="currentColor" stroke-width="0.7"/><path d="M66 66Q62 40 52 36Q58 48 64 44Z" fill="#3E6F8C" stroke="currentColor" stroke-width="0.7"/><path d="M18 62Q24 46 32 50" fill="none" stroke="#D5DDE3" stroke-width="1.2"/><path d="M62 62Q56 46 48 50" fill="none" stroke="#D5DDE3" stroke-width="1.2"/><ellipse cx="22" cy="54" rx="6" ry="10" fill="#C4A15A" stroke="currentColor" stroke-width="0.6"/><ellipse cx="58" cy="54" rx="6" ry="10" fill="#C4A15A" stroke="currentColor" stroke-width="0.6"/><path d="M16 69L24 48Q40 42 56 48L64 69Z" fill="url(#norse-aesir-freya-d)" stroke="currentColor"/><path d="M22 34Q14 46 20 62Q30 48 32 38Z" fill="url(#norse-aesir-freya-b)" stroke="currentColor" stroke-width="0.7"/><path d="M58 34Q66 46 60 62Q50 48 48 38Z" fill="#C4A15A" stroke="currentColor" stroke-width="0.7"/><ellipse cx="40" cy="38" rx="10" ry="11" fill="url(#norse-aesir-freya-c)" stroke="currentColor"/><path d="M30 30Q40 22 50 30" fill="none" stroke="#6B5344" stroke-width="0.7"/><circle cx="33" cy="28" r="1.5" fill="#8E2F2B"/><circle cx="40" cy="26" r="1.5" fill="#6B5344"/><circle cx="47" cy="28" r="1.5" fill="#C4A15A"/><circle cx="36" cy="38" r="1.2" fill="#1E3A4C"/><circle cx="44" cy="38" r="1.2" fill="#1E3A4C"/><circle cx="35.7" cy="37.7" r="0.4" fill="#C4A15A"/><circle cx="43.7" cy="37.7" r="0.4" fill="#C4A15A"/><path d="M36 43Q40 45 44 43" fill="none" stroke="#8E2F2B" stroke-width="0.7"/><circle cx="32" cy="50" r="1.7" fill="#C4A15A" stroke="#6B5344" stroke-width="0.4"/><circle cx="36" cy="50" r="1.7" fill="#C4A15A" stroke="#6B5344" stroke-width="0.4"/><circle cx="40" cy="50" r="1.7" fill="#C4A15A" stroke="#6B5344" stroke-width="0.4"/><circle cx="44" cy="50" r="1.7" fill="#C4A15A" stroke="#6B5344" stroke-width="0.4"/><circle cx="48" cy="50" r="1.7" fill="#C4A15A" stroke="#6B5344" stroke-width="0.4"/><circle cx="40" cy="54" r="2.2" fill="#8E2F2B" stroke="#6B5344" stroke-width="0.5"/></g></svg>
