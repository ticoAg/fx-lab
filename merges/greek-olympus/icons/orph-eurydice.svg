-width="1"/></g><use href="#greek-olympus-orph-eurydice-2" fill="none" stroke="currentColor" stroke-width="2.4"/><use href="#greek-olympus-orph-eurydice-3" fill="#1F6A8A"/><use href="#greek-olympus-orph-eurydice-3" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M36 22 Q36 13 44 14 Q50 16 49 23 Q49 30 44 32 Q46 24 36 22Z" fill="#16384A" stroke="currentColor" stroke-width="1"/><circle cx="47.5" cy="17" r="1.6" fill="#F3E6D0" stroke="currentColor" stroke-width="0.8"/><circle cx="47.5" cy="17" r="0.7" fill="#C9A24A"/></g></svg>