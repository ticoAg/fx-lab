<svg xmlns="http://www.w3.org/2000/svg" id="greek-olympus-mino-labyrinth-map-root" viewBox="0 0 80 80" role="img" aria-label="Labyrinth map / 迷宫圆图" stroke-linecap="round" stroke-linejoin="round"><title>Labyrinth map / 迷宫圆图</title><desc>A round ivory labyrinth with concentric ink corridors, ochre-red wall marks and a red center, slowly spinning. / 象牙白圆盘上的同心迷宫通道，墨线回廊与赭红隔墙，中心红点为迷宫核心，缓慢旋转。</desc><style>#greek-olympus-mino-labyrinth-map-root,#greek-olympus-mino-labyrinth-map-root g{animation-play-state:inherit}.greek-olympus-mino-labyrinth-map-motion{animation:greek-olympus-mino-labyrinth-map-spin 22.0s linear infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 40px}@keyframes greek-olympus-mino-labyrinth-map-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.greek-olympus-mino-labyrinth-map-motion{animation:none!important;transform:none!important}}</style><defs><circle id="greek-olympus-mino-labyrinth-map-1" cx="40" cy="40" r="30"/><clipPath id="greek-olympus-mino-labyrinth-map-1c"><use href="#greek-olympus-mino-labyrinth-map-1"/></clipPath></defs><g class="greek-olympus-mino-labyrinth-map-motion"><use href="#greek-olympus-mino-labyrinth-map-1" fill="#F3E6D0"/><g clip-path="url(#greek-olympus-mino-labyrinth-map-1c)"><path d="M49 1A30 30 0 0 1 40 79H100Z" fill="#F3E6D0" opacity="0.55"/></g><use href="#greek-olympus-mino-labyrinth-map-1" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M40 16A24 24 0 1 1 22 24M40 22A18 18 0 1 0 54 29M58 50A18 18 0 0 1 28 54M40 28A12 12 0 1 1 30 33M46 50A12 12 0 0 1 34 49" fill="none" stroke="#3A2C22" stroke-width="1.8"/><path d="M40 10V16M22 24L18 20M54 29L60 26M40 22V28M30 33L26 31" fill="none" stroke="#C4653A" stroke-width="2"/><circle cx="40" cy="40" r="4" fill="#C4653A" stroke="currentColor" stroke-width="1.3"/></g></svg>