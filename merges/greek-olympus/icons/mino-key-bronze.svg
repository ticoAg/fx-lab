<svg xmlns="http://www.w3.org/2000/svg" id="greek-olympus-mino-key-bronze-root" viewBox="0 0 80 80" role="img" aria-label="Bronze key / 青铜钥匙" stroke-linecap="round" stroke-linejoin="round"><title>Bronze key / 青铜钥匙</title><desc>A bronze key with a ring bow, gold bead and stepped bit, spinning around its center. / 环形握柄的青铜钥匙，金色饰珠与阶梯钥齿，绕中心匀速旋转。</desc><style>#greek-olympus-mino-key-bronze-root,#greek-olympus-mino-key-bronze-root g{animation-play-state:inherit}.greek-olympus-mino-key-bronze-motion{animation:greek-olympus-mino-key-bronze-spin 16.2s linear infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 40px}@keyframes greek-olympus-mino-key-bronze-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.greek-olympus-mino-key-bronze-motion{animation:none!important;transform:none!important}}</style><defs><path id="greek-olympus-mino-key-bronze-1" d="M40 8A11 11 0 1 1 39.9 8ZM40 14A5 5 0 1 0 40.1 14Z"/><clipPath id="greek-olympus-mino-key-bronze-1c"><use href="#greek-olympus-mino-key-bronze-1"/></clipPath></defs><g class="greek-olympus-mino-key-bronze-motion"><path d="M40 30V64" fill="none" stroke="currentColor" stroke-width="6.6"/><path d="M40 30V64" fill="none" stroke="#C9A24A" stroke-width="4"/><path d="M40 52H50V56H46V60H50V64H40Z" fill="#C9A24A" stroke="currentColor" stroke-width="1.4"/><use href="#greek-olympus-mino-key-bronze-1" fill="#C9A24A"/><g clip-path="url(#greek-olympus-mino-key-bronze-1c)"><path d="M44 4H54V32H44Z" fill="#C9A24A" opacity="0.6"/></g><use href="#greek-olympus-mino-key-bronze-1" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="40" cy="34" r="2.4" fill="#C9A24A" stroke="currentColor" stroke-width="1.1"/><path d="M33 16Q34 12 38 11" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/></g></svg>