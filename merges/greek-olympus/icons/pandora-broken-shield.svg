mpus-pandora-broken-shield-2c)"><path d="M50 16 H66 V64 H50Z" fill="#3A2C22" opacity="0.6"/></g><use href="#greek-olympus-pandora-broken-shield-2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="30" cy="34" r="3" fill="#C9A24A" stroke="currentColor" stroke-width="1.1"/></g></svg>