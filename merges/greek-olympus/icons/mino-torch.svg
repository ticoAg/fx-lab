<svg xmlns="http://www.w3.org/2000/svg" id="greek-olympus-mino-torch-root" viewBox="0 0 80 80" role="img" aria-label="Torch / 青铜火把" stroke-linecap="round" stroke-linejoin="round"><title>Torch / 青铜火把</title><desc>A bronze torch with an ochre-red flame and gold core, the flame pulsing. / 青铜火把架上燃烧的赭红火焰，中心金色焰芯，火焰呼吸跳动。</desc><style>#greek-olympus-mino-torch-root,#greek-olympus-mino-torch-root g{animation-play-state:inherit}.greek-olympus-mino-torch-motion{animation:greek-olympus-mino-torch-pulse 3.2s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 40px}@keyframes greek-olympus-mino-torch-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}@media (prefers-reduced-motion:reduce){.greek-olympus-mino-torch-motion{animation:none!important;transform:none!important}}</style><defs><path id="greek-olympus-mino-torch-1" d="M40 8Q50 20 48 30Q46 39 40 40Q34 39 32 30Q31 20 40 8Z"/><clipPath id="greek-olympus-mino-torch-1c"><use href="#greek-olympus-mino-torch-1"/></clipPath></defs><ellipse cx="40" cy="72" rx="10" ry="2.4" fill="#3A2C22" opacity=".16"/><path d="M40 58V72" fill="none" stroke="currentColor" stroke-width="5.6"/><path d="M40 58V72" fill="none" stroke="#C9A24A" stroke-width="3"/><path d="M34 40H46L44 54H36Z" fill="#C9A24A" stroke="currentColor" stroke-width="1.6"/><path d="M35 45H45" fill="none" stroke="#C9A24A" stroke-width="1.1"/><path d="M33 54H47L45 60H35Z" fill="#C9A24A" stroke="currentColor" stroke-width="1.4"/><g class="greek-olympus-mino-torch-motion"><use href="#greek-olympus-mino-torch-1" fill="#C4653A"/><g clip-path="url(#greek-olympus-mino-torch-1c)"><path d="M42 6H52V42H42Z" fill="#C4653A" opacity="0.4"/></g><use href="#greek-olympus-mino-torch-1" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M40 20Q45 27 43 33Q40 37 37 33Q35 27 40 20Z" fill="#C9A24A"/></g></svg>