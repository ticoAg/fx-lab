<svg xmlns="http://www.w3.org/2000/svg" id="greek-olympus-pers-mirror-shield-root" viewBox="0 0 80 80" role="img" aria-label="Mirrored Shield / 镜面盾牌" stroke-linecap="round" stroke-linejoin="round"><title>Mirrored Shield / 镜面盾牌</title><desc>Athena's gold-rimmed mirrored bronze shield. / 雅典娜赠予的金边镜面青铜盾。</desc><style>#greek-olympus-pers-mirror-shield-root,#greek-olympus-pers-mirror-shield-root g{animation-play-state:inherit}.greek-olympus-pers-mirror-shield-motion{animation:greek-olympus-pers-mirror-shield-pulse 2.6s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 38px}@keyframes greek-olympus-pers-mirror-shield-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}@media (prefers-reduced-motion:reduce){.greek-olympus-pers-mirror-shield-motion{animation:none!important;transform:none!important}}</style><defs><circle id="greek-olympus-pers-mirror-shield-1" cx="40" cy="38" r="24"/><clipPath id="greek-olympus-pers-mirror-shield-1c"><use href="#greek-olympus-pers-mirror-shield-1"/></clipPath><circle id="greek-olympus-pers-mirror-shield-2" cx="40" cy="38" r="18"/><clipPath id="greek-olympus-pers-mirror-shield-2c"><use href="#greek-olympus-pers-mirror-shield-2"/></clipPath></defs><ellipse cx="40" cy="68" rx="16" ry="2.2" fill="#3A2C22" opacity=".16"/><g class="greek-olympus-pers-mirror-shield-motion"><use href="#greek-olympus-pers-mirror-shield-1" fill="#C9A24A"/><g clip-path="url(#greek-olympus-pers-mirror-shield-1c)"><path d="M40 12 H66 V64 H40Z" fill="#C9A24A" opacity="0.6"/></g><use href="#greek-olympus-pers-mirror-shield-1" fill="none" stroke="currentColor" stroke-width="2.4"/><use href="#greek-olympus-pers-mirror-shield-2" fill="#1F6A8A"/><g clip-path="url(#greek-olympus-pers-mirror-shield-2c)"><path d="M40 18 H60 V58 H40Z" fill="#1F6A8A" opacity="0.7"/><path d="M28 30 C30 26 33 24 36 22" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/><path d="M30 36 L32 33" fill="none" stroke="#FFFFFF" stroke-width="1.4"