<svg xmlns="http://www.w3.org/2000/svg" id="slavic-myth-perun-thunder-axe-root" viewBox="0 0 80 80" role="img" aria-label="Thunder Axe / 雷斧" stroke-linecap="round" stroke-linejoin="round"><title>Thunder Axe / 雷斧</title><desc>Perun’s double-bladed thunder axe with gleaming gold-edged blades and a leather-wrapped haft, spinning about its center. / 佩伦的双刃雷斧，斧刃泛着金光，柄缠皮绳，绕中心旋转。</desc><style>#slavic-myth-perun-thunder-axe-root,#slavic-myth-perun-thunder-axe-root g{animation-play-state:inherit}.slavic-myth-perun-thunder-axe-motion{animation:slavic-myth-perun-thunder-axe-spin 5.0s linear infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 40px}@keyframes slavic-myth-perun-thunder-axe-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.slavic-myth-perun-thunder-axe-motion{animation:none!important;transform:none!important}}</style><defs><path id="slavic-myth-perun-thunder-axe-1" d="M40 22 Q26 14 18 26 Q24 32 18 38 Q26 48 40 38Z"/><clipPath id="slavic-myth-perun-thunder-axe-1c"><use href="#slavic-myth-perun-thunder-axe-1"/></clipPath><path id="slavic-myth-perun-thunder-axe-2" d="M40 22 Q54 14 62 26 Q56 32 62 38 Q54 48 40 38Z"/><clipPath id="slavic-myth-perun-thunder-axe-2c"><use href="#slavic-myth-perun-thunder-axe-2"/></clipPath></defs><g class="slavic-myth-perun-thunder-axe-motion"><path d="M40 14 V66" fill="none" stroke="currentColor" stroke-width="5.6"/><path d="M40 14 V66" fill="none" stroke="#3A2C22" stroke-width="3"/><path d="M38 52 l4 -2 M38 56 l4 -2 M38 60 l4 -2" fill="none" stroke="#3A2C22" stroke-width="1"/><use href="#slavic-myth-perun-thunder-axe-1" fill="#E0B15A"/><g clip-path="url(#slavic-myth-perun-thunder-axe-1c)"><path d="M30 0 H80 V80 H30Z" fill="#C23A2E" opacity="0.45"/><path d="M19 26 Q24 32 19 38" fill="none" stroke="#E0B15A" stroke-width="2"/></g><use href="#slavic-myth-perun-thunder-axe-1" fill="none" stroke="currentColor" stroke-width="1.6"/><use href="#slavic-myth-perun-thunder-axe-2" fill="#E0B15A"/