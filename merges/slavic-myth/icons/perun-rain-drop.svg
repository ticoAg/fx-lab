<svg xmlns="http://www.w3.org/2000/svg" id="slavic-myth-perun-rain-drop-root" viewBox="0 0 80 80" role="img" aria-label="Rain Drop / 甘霖" stroke-linecap="round" stroke-linejoin="round"><title>Rain Drop / 甘霖</title><desc>One big glistening raindrop with two little ones beside it, rain soaking the land after the battle. / 一颗晶莹的大雨滴，旁边两颗小雨滴，战后滋润大地。</desc><style>#slavic-myth-perun-rain-drop-root,#slavic-myth-perun-rain-drop-root g{animation-play-state:inherit}.slavic-myth-perun-rain-drop-motion{animation:slavic-myth-perun-rain-drop-pulse 2.4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 44px}@keyframes slavic-myth-perun-rain-drop-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}@media (prefers-reduced-motion:reduce){.slavic-myth-perun-rain-drop-motion{animation:none!important;transform:none!important}}</style><defs><path id="slavic-myth-perun-rain-drop-1" d="M40 12 Q56 36 56 48 Q56 64 40 64 Q24 64 24 48 Q24 36 40 12Z"/><clipPath id="slavic-myth-perun-rain-drop-1c"><use href="#slavic-myth-perun-rain-drop-1"/></clipPath></defs><path d="M16 44 Q22 54 22 58 Q22 63 16 63 Q10 63 10 58 Q10 54 16 44Z" fill="#243028" stroke="currentColor" stroke-width="1.3"/><path d="M64 30 Q70 40 70 44 Q70 49 64 49 Q58 49 58 44 Q58 40 64 30Z" fill="#243028" stroke="currentColor" stroke-width="1.3"/><g class="slavic-myth-perun-rain-drop-motion"><use href="#slavic-myth-perun-rain-drop-1" fill="#243028"/><g clip-path="url(#slavic-myth-perun-rain-drop-1c)"><path d="M46 0 H80 V80 H46Z" fill="#243028" opacity="0.45"/><path d="M32 44 q0 -8 4 -14" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/></g><use href="#slavic-myth-perun-rain-drop-1" fill="none" stroke="currentColor" stroke-width="1.6"/></g></svg>