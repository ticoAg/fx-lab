<svg xmlns="http://www.w3.org/2000/svg" id="slavic-myth-leshy-echo-whistle-root" viewBox="0 0 80 80" role="img" aria-label="Echo Whistle / 回声口哨" stroke-linecap="round" stroke-linejoin="round"><title>Echo Whistle / 回声口哨</title><desc>A carved wooden whistle with red folk paint and curved sound waves ringing out. / 林中回荡的木质口哨</desc><style>#slavic-myth-leshy-echo-whistle-root,#slavic-myth-leshy-echo-whistle-root g{animation-play-state:inherit}.slavic-myth-leshy-echo-whistle-motion{animation:slavic-myth-leshy-echo-whistle-pop 2.8s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 60px}@keyframes slavic-myth-leshy-echo-whistle-pop{0%,62%,100%{transform:translateY(0) scale(1)}72%{transform:translateY(-3px) scale(1.025)}82%{transform:translateY(0) scale(.985,1.01)}90%{transform:translateY(0) scale(1.005)}}@media (prefers-reduced-motion:reduce){.slavic-myth-leshy-echo-whistle-motion{animation:none!important;transform:none!important}}</style><defs><path id="slavic-myth-leshy-echo-whistle-1" d="M16 48 Q14 40 22 38 L52 34 Q60 34 60 42 Q60 50 52 50 L22 54 Q16 54 16 48Z"/><clipPath id="slavic-myth-leshy-echo-whistle-1c"><use href="#slavic-myth-leshy-echo-whistle-1"/></clipPath></defs><ellipse cx="40" cy="62" rx="20" ry="2.4" fill="#3A2C22" opacity=".16"/><g class="slavic-myth-leshy-echo-whistle-motion"><use href="#slavic-myth-leshy-echo-whistle-1" fill="#3A2C22"/><g clip-path="url(#slavic-myth-leshy-echo-whistle-1c)"><path d="M40 0 H80 V80 H40Z" fill="#3A2C22" opacity="0.3"/><path d="M30 38 V52 M44 36 V50" fill="none" stroke="#C23A2E" stroke-width="2"/></g><use href="#slavic-myth-leshy-echo-whistle-1" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="48" cy="42" r="2.6" fill="#3A2C22" stroke="currentColor" stroke-width="1.2"/><path d="M64 34 Q68 40 64 46" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M68 30 Q74 40 68 50" fill="none" stroke="currentColor" stroke-width="1.6"/></g></svg>