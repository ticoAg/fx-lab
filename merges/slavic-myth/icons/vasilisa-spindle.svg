<svg xmlns="http://www.w3.org/2000/svg" id="slavic-myth-vasilisa-spindle-root" viewBox="0 0 80 80" role="img" aria-label="Spindle / 纺锤" stroke-linecap="round" stroke-linejoin="round"><title>Spindle / 纺锤</title><desc>A wooden spindle wound with yarn, spinning fast. / 缠着毛线的木纺锤飞快旋转。</desc><style>#slavic-myth-vasilisa-spindle-root,#slavic-myth-vasilisa-spindle-root g{animation-play-state:inherit}.slavic-myth-vasilisa-spindle-motion{animation:slavic-myth-vasilisa-spindle-spin 5s linear infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 40px}@keyframes slavic-myth-vasilisa-spindle-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.slavic-myth-vasilisa-spindle-motion{animation:none!important;transform:none!important}}</style><defs><path id="slavic-myth-vasilisa-spindle-1" d="M38 10 H42 L43 38 Q52 44 43 50 L42 70 H38 L37 50 Q28 44 37 38Z"/><clipPath id="slavic-myth-vasilisa-spindle-1c"><use href="#slavic-myth-vasilisa-spindle-1"/></clipPath></defs><g class="slavic-myth-vasilisa-spindle-motion"><use href="#slavic-myth-vasilisa-spindle-1" fill="#E0B15A"/><g clip-path="url(#slavic-myth-vasilisa-spindle-1c)"><path d="M40 6 H54 V74 H40Z" fill="#3A2C22" opacity="0.6"/><path d="M33 44 H47" fill="none" stroke="#E0B15A" stroke-width="2"/></g><use href="#slavic-myth-vasilisa-spindle-1" fill="none" stroke="currentColor" stroke-width="2.4"/><ellipse cx="40" cy="28" rx="5" ry="7" fill="#E4E0D4" stroke="currentColor" stroke-width="1.4"/></g></svg>