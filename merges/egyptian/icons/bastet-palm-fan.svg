<svg xmlns="http://www.w3.org/2000/svg" id="egyptian-bastet-palm-fan-root" viewBox="0 0 80 80" role="img" aria-label="Palm Fan / 棕榈扇" stroke-linecap="round" stroke-linejoin="round"><title>Palm Fan / 棕榈扇</title><desc>A long-handled palm-frond fan swishing back and forth. / 长柄棕榈羽扇来回扇动。</desc><style>#egyptian-bastet-palm-fan-root,#egyptian-bastet-palm-fan-root g{animation-play-state:inherit}.egyptian-bastet-palm-fan-motion{animation:egyptian-bastet-palm-fan-sway 3s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 72px}@keyframes egyptian-bastet-palm-fan-sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}@media (prefers-reduced-motion:reduce){.egyptian-bastet-palm-fan-motion{animation:none!important;transform:none!important}}</style><defs><linearGradient id="egyptian-bastet-palm-fan-1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F8A7A"/><stop offset="1" stop-color="#1F8A7A"/></linearGradient><path id="egyptian-bastet-palm-fan-2" d="M40 38 C22 36 12 22 18 12 Q28 6 40 10 Q52 6 62 12 C68 22 58 36 40 38Z"/><clipPath id="egyptian-bastet-palm-fan-2c"><use href="#egyptian-bastet-palm-fan-2"/></clipPath></defs><ellipse cx="40" cy="74" rx="8" ry="1.2" fill="#3A2C22" opacity=".16"/><g class="egyptian-bastet-palm-fan-motion"><path d="M40 72 V36" fill="none" stroke="currentColor" stroke-width="5"/><path d="M40 72 V36" fill="none" stroke="#C4652F" stroke-width="2.6"/><use href="#egyptian-bastet-palm-fan-2" fill="url(#egyptian-bastet-palm-fan-1)"/><g clip-path="url(#egyptian-bastet-palm-fan-2c)"><path d="M40 36 L22 14 M40 36 L31 9 M40 36 V9 M40 36 L49 9 M40 36 L58 14" fill="none" stroke="#1F8A7A" stroke-width="1.4"/></g><use href="#egyptian-bastet-palm-fan-2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="40" cy="38" r="3.4" fill="#E7D3A1" stroke="currentColor" stroke-width="1.4"/></g></svg>