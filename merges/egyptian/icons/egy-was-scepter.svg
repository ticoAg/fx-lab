<svg id="egyptian-egy-was-scepter-root" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-labelledby="egyptian-egy-was-scepter-title egyptian-egy-was-scepter-desc" class="egyptian-egy-was-scepter-root" style="animation-play-state:inherit">
<title id="egyptian-egy-was-scepter-title">瓦斯权杖与安卡 / Was sceptre &amp; ankh</title>
<desc id="egyptian-egy-was-scepter-desc">两根兽首、叉足的瓦斯杖夹着一枚大安卡，安卡下有一小段杰德，最上是缀了三颗星的天空横条，最下是地平线。 Two animal-headed, forked was sceptres frame a large ankh, a short djed beneath it, a sky bar with three stars above and a ground line below.</desc>
<style>.egyptian-egy-was-scepter-root,.egyptian-egy-was-scepter-root *{animation-play-state:inherit}.egyptian-egy-was-scepter-motion{animation:egyptian-egy-was-scepter-pop 3.8s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 42px}@keyframes egyptian-egy-was-scepter-pop{0%,100%{transform:scale(.988)}45%{transform:scale(1)}72%{transform:scale(.994)}}@media(prefers-reduced-motion:reduce){.egyptian-egy-was-scepter-motion{animation:none!important;transform:none!important}}</style>
