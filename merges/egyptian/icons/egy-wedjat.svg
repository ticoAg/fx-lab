<svg id="egyptian-egy-wedjat-root" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-labelledby="egyptian-egy-wedjat-title egyptian-egy-wedjat-desc" class="egyptian-egy-wedjat-root" style="animation-play-state:inherit">
<title id="egyptian-egy-wedjat-title">乌加特·荷鲁斯之眼 / Wedjat — eye of Horus</title>
<desc id="egyptian-egy-wedjat-desc">荷鲁斯之眼横放在小台座上：粗眉用青金石，眼白是骨色，眼线拉长，下面垂着一枚卷纹。 The Eye of Horus rests on a small stand: a heavy lapis brow, bone white, a long cosmetic line and a curl hanging below.</desc>
<style>.egyptian-egy-wedjat-root,.egyptian-egy-wedjat-root *{animation-play-state:inherit}.egyptian-egy-wedjat-motion{animation:egyptian-egy-wedjat-pulse 4.8s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 42px}@keyframes egyptian-egy-wedjat-pulse{0%,100%{transform:scale(.992);opacity:.95}50%{transform:scale(1);opacity:1}}@media(prefers-reduced-motion:reduce){.egyptian-egy-wedjat-motion{animation:none!important;transform:none!important}}</style>
