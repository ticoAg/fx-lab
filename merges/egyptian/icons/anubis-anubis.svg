<svg xmlns="http://www.w3.org/2000/svg" id="egyptian-anubis-anubis-root" viewBox="0 0 80 80" role="img" aria-label="Anubis / 阿努比斯" stroke-linecap="round" stroke-linejoin="round"><title>Anubis / 阿努比斯</title><desc>A black jackal-headed guide god in profile with gold collar, white kilt and a gold staff, gazing ahead. / 侧身而立的黑色胡狼头引路神，金领饰白短裙，手持金杖凝视前方。</desc><style>#egyptian-anubis-anubis-root,#egyptian-anubis-anubis-root g{animation-play-state:inherit}.egyptian-anubis-anubis-motion{animation:egyptian-anubis-anubis-float 3.2s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 30px}@keyframes egyptian-anubis-anubis-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}@media (prefers-reduced-motion:reduce){.egyptian-anubis-anubis-motion{animation:none!important;transform:none!important}}</style><defs><path id="egyptian-anubis-anubis-1" d="M30 44 Q40 40 50 44 L48 58 H32Z"/><path id="egyptian-anubis-anubis-2" d="M29.0 34.0 Q27.0 22.0 36.0 21.0 Q42.0 21.0 46.0 26.0 L55.0 30.0 Q56.0 33.0 53.0 34.0 L42.0 35.0 Q38.0 40.0 29.0 34.0Z"/><clipPath id="egyptian-anubis-anubis-2c"><use href="#egyptian-anubis-anubis-2"/></clipPath></defs><ellipse cx="40" cy="73" rx="16" ry="2.4" fill="#3A2C22" opacity=".16"/><path d="M58 34 V72" fill="none" stroke="currentColor" stroke-width="4.6"/><path d="M58 34 V72" fill="none" stroke="#C4922A" stroke-width="2"/><path d="M56 32 Q58 28 62 30" fill="none" stroke="currentColor" stroke-width="1.4"/><use href="#egyptian-anubis-anubis-1" fill="#3A2C22"/><use href="#egyptian-anubis-anubis-1" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M30 44 Q40 55.0 50 44 Q40 49.0 30 44Z" fill="#C4922A" stroke="currentColor" stroke-width="1"/><path d="M32.5 45.5 Q40 53.0 47.5 45.5" fill="none" stroke="#1F4E79" stroke-width="1.3"/><path d="M30 58 H50 L52 70 H28Z" fill="#FFFFFF" stroke="currentColor" stroke-width="1.2"/><path d="M40.0 58 L42.0 70" fill="none" stroke="#E7D3A1" stroke-width="0.8"/><g class="egyptian-anubis-anubis-motion"><path d="M32.0 24.0 L34.0 8.0 L40.0 22.0Z" fill="#3A2C22" stroke="currentColor" stroke-width="1.1"/><path d="M33.5 22.0 L34.2 12.0 L38.0 21.0Z" fill="#C4922A"/><use href="#egyptian-anubis-anubis-2" fill="#3A2C22"/><g clip-path="url(#egyptian-anubis-anubis-2c)"><path d="M32.0 25.0 Q36.0 22.0 42.0 24.0" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.35"/></g><use href="#egyptian-anubis-anubis-2" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M38.0 26.0 Q41.0 24.0 44.0 26.4 Q41.0 27.6 38.0 26.0Z" fill="#FFFFFF"/><circle cx="41.4" cy="26" r="1" fill="#C4922A"/><path d="M44.0 26.4 L47.0 27.0" fill="none" stroke="#C4922A" stroke-width="0.9"/><circle cx="54" cy="31" r="1" fill="#C4922A"/></g></svg>