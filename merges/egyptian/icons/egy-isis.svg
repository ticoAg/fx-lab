<svg id="egyptian-egy-isis-root" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-labelledby="egyptian-egy-isis-title egyptian-egy-isis-desc" class="egyptian-egy-isis-root" style="animation-play-state:inherit">
<title id="egyptian-egy-isis-title">伊西斯·王座与展翼 / Isis — throne and outspread wings</title>
<desc id="egyptian-egy-isis-desc">伊西斯以王座形冠和向两侧展开的三层羽翼占满画幅，骨色侧脸、青金石紧身裙，裙上有一枚小号泰特结。 Isis fills the frame with a throne-shaped crown and three tiers of wings. A bone profile and lapis sheath dress carry a small tyet.</desc>
<style>.egyptian-egy-isis-root,.egyptian-egy-isis-root *{animation-play-state:inherit}.egyptian-egy-isis-motion{animation:egyptian-egy-isis-pulse 4.8s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 42px}@keyframes egyptian-egy-isis-pulse{0%,100%{transform:scale(.992);opacity:.95}50%{transform:scale(1);opacity:1}}@media(prefers-reduced-motion:reduce){.egyptian-egy-isis-motion{animation:none!important;transform:none!important}}</style>
