<svg id="egyptian-egy-horus-root" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-labelledby="egyptian-egy-horus-title egyptian-egy-horus-desc" class="egyptian-egy-horus-root" style="animation-play-state:inherit">
<title id="egyptian-egy-horus-title">荷鲁斯·双冠神鹰 / Horus — falcon of the double crown</title>
<desc id="egyptian-egy-horus-desc">立姿荷鲁斯侧身向右：白冠套在红冠里，钩喙突出，青金石身上三排收拢的翼羽，尾羽和两只爪子落在石灰岩台座上。 Standing Horus faces right: the white crown sits in the red crown, the beak hooks outward, three feather rows mark the folded lapis wing, and the tail and talons meet a limestone plinth.</desc>
<style>.egyptian-egy-horus-root,.egyptian-egy-horus-root *{animation-play-state:inherit}.egyptian-egy-horus-motion{animation:egyptian-egy-horus-float 5.6s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 42px}@keyframes egyptian-egy-horus-float{0%,100%{transform:translateY(.85px)}50%{transform:translateY(-.85px)}}@media(prefers-reduced-motion:reduce){.egyptian-egy-horus-motion{animation:none!important;transform:none!important}}</style>
