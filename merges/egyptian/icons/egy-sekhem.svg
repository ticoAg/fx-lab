<svg id="egyptian-egy-sekhem-root" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-labelledby="egyptian-egy-sekhem-title egyptian-egy-sekhem-desc" class="egyptian-egy-sekhem-root" style="animation-play-state:inherit">
<title id="egyptian-egy-sekhem-title">塞赫美特·烈日母狮 / Sekhmet — lioness of the sun</title>
<desc id="egyptian-egy-sekhem-desc">塞赫美特是侧面母狮首，鬃边围着脸，头顶沙金日盘和一条小圣蛇，左侧留一丛纸莎草。 Sekhmet is a lioness head in profile, a ruff around the face, a sand-gold sun disk and small uraeus above, with a papyrus clump to the left.</desc>
<style>.egyptian-egy-sekhem-root,.egyptian-egy-sekhem-root *{animation-play-state:inherit}.egyptian-egy-sekhem-motion{animation:egyptian-egy-sekhem-pulse 4.8s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 42px}@keyframes egyptian-egy-sekhem-pulse{0%,100%{transform:scale(.992);opacity:.95}50%{transform:scale(1);opacity:1}}@media(prefers-reduced-motion:reduce){.egyptian-egy-sekhem-motion{animation:none!important;transform:none!important}}</style>
