<svg xmlns="http://www.w3.org/2000/svg" id="egyptian-ra-papyrus-scroll-root" viewBox="0 0 80 80" role="img" aria-label="Papyrus Scroll / 纸莎草卷轴" stroke-linecap="round" stroke-linejoin="round"><title>Papyrus Scroll / 纸莎草卷轴</title><desc>An unrolled papyrus with a sun, hill motif and decorative dashed lines. / 展开的纸莎草卷，绘着日轮、山形与装饰纹线。</desc><style>#egyptian-ra-papyrus-scroll-root,#egyptian-ra-papyrus-scroll-root g{animation-play-state:inherit}.egyptian-ra-papyrus-scroll-motion{animation:egyptian-ra-papyrus-scroll-float 3.4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 40px}@keyframes egyptian-ra-papyrus-scroll-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}@media (prefers-reduced-motion:reduce){.egyptian-ra-papyrus-scroll-motion{animation:none!important;transform:none!important}}</style><defs><circle id="egyptian-ra-papyrus-scroll-1" cx="52" cy="32" r="4"/><clipPath id="egyptian-ra-papyrus-scroll-1c"><use href="#egyptian-ra-papyrus-scroll-1"/></clipPath><path id="egyptian-ra-papyrus-scroll-2" d="M18 20 H62 V60 H18Z"/><clipPath id="egyptian-ra-papyrus-scroll-2c"><use href="#egyptian-ra-papyrus-scroll-2"/></clipPath><path id="egyptian-ra-papyrus-scroll-3" d="M14 16 H22 V64 H14Z"/><clipPath id="egyptian-ra-papyrus-scroll-3c"><use href="#egyptian-ra-papyrus-scroll-3"/></clipPath><path id="egyptian-ra-papyrus-scroll-4" d="M58 16 H66 V64 H58Z"/><clipPath id="egyptian-ra-papyrus-scroll-4c"><use href="#egyptian-ra-papyrus-scroll-4"/></clipPath></defs><ellipse cx="40" cy="70" rx="26" ry="2.2" fill="#16324F" opacity=".16"/><g class="egyptian-ra-papyrus-scroll-motion"><use href="#egyptian-ra-papyrus-scroll-2" fill="#E7D3A1"/><g clip-path="url(#egyptian-ra-papyrus-scroll-2c)"><path d="M18 54 H62 V60 H18Z" fill="#E7D3A1" opacity="0.6"/><path d="M24 28 h19" fill="none" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="3 2"/><path d="M24 34 h19" fill="none" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="3 2"/><path d="M24 40 h19" fill="none" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="3 2"/><path d="M24 46 h19" fill="none" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="3 2"/><use href="#egyptian-ra-papyrus-scroll-1" fill="#C4922A"/><g clip-path="url(#egyptian-ra-papyrus-scroll-1c)"><path d="M52 26A4 4 0 0 1 52 38Z" fill="#C4922A" opacity="0.45"/><path d="M49.6 30.8A2.8 2.8 0 0 1 51.6 29.2" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.7"/></g><use href="#egyptian-ra-papyrus-scroll-1" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M46 46 L52 40 L58 46Z" fill="#1F8A7A" stroke="currentColor" stroke-width="1"/></g><use href="#egyptian-ra-papyrus-scroll-2" fill="none" stroke="currentColor" stroke-width="2.4"/><use href="#egyptian-ra-papyrus-scroll-3" fill="#E7D3A1"/><g clip-path="url(#egyptian-ra-papyrus-scroll-3c)"><path d="M16 20 V60" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/></g><use href="#egyptian-ra-papyrus-scroll-3" fill="none" stroke="currentColor" stroke-width="2.4"/><use href="#egyptian-ra-papyrus-scroll-4" fill="#E7D3A1"/><g clip-path="url(#egyptian-ra-papyrus-scroll-4c)"><path d="M60 20 V60" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/></g><use href="#egyptian-ra-papyrus-scroll-4" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 40 H24" fill="none" stroke="currentColor" stroke-width="4.2"/><path d="M12 40 H24" fill="none" stroke="#C4652F" stroke-width="1.6"/></g></svg>