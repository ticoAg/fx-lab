<svg id="egyptian-egy-ptah-root" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-labelledby="egyptian-egy-ptah-title egyptian-egy-ptah-desc" class="egyptian-egy-ptah-root" style="animation-play-state:inherit">
<title id="egyptian-egy-ptah-title">普塔·神龛中的造物主 / Ptah — creator in his shrine</title>
<desc id="egyptian-egy-ptah-desc">普塔立在凹弧檐的神龛里，戴贴头的青金石小帽和直须，木乃伊形身体前合握一根复合权杖。 Ptah stands inside a cavetto shrine, wearing a close lapis cap and a straight beard, both hands together on one composite staff.</desc>
<style>.egyptian-egy-ptah-root,.egyptian-egy-ptah-root *{animation-play-state:inherit}.egyptian-egy-ptah-motion{animation:egyptian-egy-ptah-float 5.6s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 42px}@keyframes egyptian-egy-ptah-float{0%,100%{transform:translateY(.85px)}50%{transform:translateY(-.85px)}}@media(prefers-reduced-motion:reduce){.egyptian-egy-ptah-motion{animation:none!important;transform:none!important}}</style>
