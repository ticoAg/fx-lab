<svg xmlns="http://www.w3.org/2000/svg" id="qilin-auspicious-beast-kunpeng-transform-swirl-root" viewBox="0 0 80 80" role="img" aria-label="Transformation Swirl / 化鹏漩涡" stroke-linecap="round" stroke-linejoin="round"><title>Transformation Swirl / 化鹏漩涡</title><desc>A tri-color swirl of the fish turning into a bird. / 蓝金三色旋转的变化光旋。</desc><style>#qilin-auspicious-beast-kunpeng-transform-swirl-root,#qilin-auspicious-beast-kunpeng-transform-swirl-root g{animation-play-state:inherit}.qilin-auspicious-beast-kunpeng-transform-swirl-motion{animation:qilin-auspicious-beast-kunpeng-transform-swirl-spin 6s linear infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 40px}@keyframes qilin-auspicious-beast-kunpeng-transform-swirl-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.qilin-auspicious-beast-kunpeng-transform-swirl-motion{animation:none!important;transform:none!important}}</style><defs><path id="qilin-auspicious-beast-kunpeng-transform-swirl-1" d="M40 40 Q40 20 58 18 Q48 24 46 36Z"/><path id="qilin-auspicious-beast-kunpeng-transform-swirl-2" d="M40 40 Q40 20 58 18 Q48 24 46 36Z"/><path id="qilin-auspicious-beast-kunpeng-transform-swirl-3" d="M40 40 Q40 20 58 18 Q48 24 46 36Z"/></defs><g class="qilin-auspicious-beast-kunpeng-transform-swirl-motion"><g transform="rotate(0 40 40)"><use href="#qilin-auspicious-beast-kunpeng-transform-swirl-1" fill="#2F6B4F"/><use href="#qilin-auspicious-beast-kunpeng-transform-swirl-1" fill="none" stroke="currentColor" stroke-width="1.6"/></g><g transform="rotate(120 40 40)"><use href="#qilin-auspicious-beast-kunpeng-transform-swirl-2" fill="#2F6B4F"/><use href="#qilin-auspicious-beast-kunpeng-transform-swirl-2" fill="none" stroke="currentColor" stroke-width="1.6"/></g><g transform="rotate(240 40 40)"><use href="#qilin-auspicious-beast-kunpeng-transform-swirl-3" fill="#E2B33A"/><use href="#qilin-auspicious-beast-kunpeng-transform-swirl-3" fill="none" stroke="currentColor" stroke-width="1.6"/></g><circle cx="40" cy="40" r="6" fill="#FFFFFF" stroke="currentColor" stroke-width="1.6"/><circle cx="40" cy="40" r="2.4" fill="#E2B33A"/></g></svg>