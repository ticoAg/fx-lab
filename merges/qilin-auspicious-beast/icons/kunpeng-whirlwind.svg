<svg xmlns="http://www.w3.org/2000/svg" id="qilin-auspicious-beast-kunpeng-whirlwind-root" viewBox="0 0 80 80" role="img" aria-label="Rising Whirlwind / 扶摇羊角" stroke-linecap="round" stroke-linejoin="round"><title>Rising Whirlwind / 扶摇羊角</title><desc>A spiraling whirlwind rising in rings. / 层层上升的螺旋旋风。</desc><style>#qilin-auspicious-beast-kunpeng-whirlwind-root,#qilin-auspicious-beast-kunpeng-whirlwind-root g{animation-play-state:inherit}.qilin-auspicious-beast-kunpeng-whirlwind-motion{animation:qilin-auspicious-beast-kunpeng-whirlwind-sway 3s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 64px}@keyframes qilin-auspicious-beast-kunpeng-whirlwind-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}@media (prefers-reduced-motion:reduce){.qilin-auspicious-beast-kunpeng-whirlwind-motion{animation:none!important;transform:none!important}}</style><ellipse cx="40" cy="68" rx="10" ry="2.4" fill="#3A2C22" opacity=".16"/><g class="qilin-auspicious-beast-kunpeng-whirlwind-motion"><ellipse cx="40" cy="22" rx="22" ry="3.6" fill="#2F6B4F" stroke="currentColor" stroke-width="1.8"/><ellipse cx="40" cy="32" rx="17" ry="3.6" fill="#FFFFFF" stroke="currentColor" stroke-width="1.8"/><ellipse cx="40" cy="42" rx="12" ry="3.6" fill="#2F6B4F" stroke="currentColor" stroke-width="1.8"/><ellipse cx="40" cy="52" rx="8" ry="3.6" fill="#FFFFFF" stroke="currentColor" stroke-width="1.8"/><ellipse cx="40" cy="60" rx="4" ry="3.6" fill="#2F6B4F" stroke="currentColor" stroke-width="1.8"/><path d="M20 22 Q40 28 60 22" fill="none" stroke="#E2B33A" stroke-width="1"/></g></svg>