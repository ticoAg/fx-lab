<svg xmlns="http://www.w3.org/2000/svg" id="giant-heroes-bunyan-giant-axe-root" viewBox="0 0 80 80" role="img" aria-label="Giant Axe / 巨斧" stroke-linecap="round" stroke-linejoin="round"><title>Giant Axe / 巨斧</title><desc>A huge double-bit axe with a handle longer than a pine, its blade glinting. / 柄比松树还长的巨斧，斧刃闪着亮光。</desc><style>#giant-heroes-bunyan-giant-axe-root,#giant-heroes-bunyan-giant-axe-root g{animation-play-state:inherit}.giant-heroes-bunyan-giant-axe-motion{animation:giant-heroes-bunyan-giant-axe-sway 2.4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:34px 62px}@keyframes giant-heroes-bunyan-giant-axe-sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}@media (prefers-reduced-motion:reduce){.giant-heroes-bunyan-giant-axe-motion{animation:none!important;transform:none!important}}</style><defs><path id="giant-heroes-bunyan-giant-axe-1" d="M42 10 Q52 18 64 12 Q70 22 62 34 Q54 28 46 32 Q40 22 42 10Z"/><clipPath id="giant-heroes-bunyan-giant-axe-1c"><use href="#giant-heroes-bunyan-giant-axe-1"/></clipPath></defs><g class="giant-heroes-bunyan-giant-axe-motion"><path d="M24 70 L52 18" fill="none" stroke="currentColor" stroke-width="6.6"/><path d="M24 70 L52 18" fill="none" stroke="#8C5A32" stroke-width="4"/><use href="#giant-heroes-bunyan-giant-axe-1" fill="#3A6EA5"/><g clip-path="url(#giant-heroes-bunyan-giant-axe-1c)"><path d="M56 0 H80 V80 H56Z" fill="#3A6EA5" opacity="0.6"/><path d="M46 16 Q54 20 62 16" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.8"/></g><use href="#giant-heroes-bunyan-giant-axe-1" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M48 20 L56 26" fill="none" stroke="#A33B2B" stroke-width="3"/></g></svg>