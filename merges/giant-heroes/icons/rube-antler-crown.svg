th="1" transform="rotate(-20 30 53)"/><ellipse cx="50" cy="53" rx="4" ry="2" fill="#2F4A32" stroke="currentColor" stroke-width="1" transform="rotate(20 50 53)"/><use href="#giant-heroes-rube-antler-crown-2" fill="#E4C99A"/><use href="#giant-heroes-rube-antler-crown-2" fill="none" stroke="currentColor" stroke-width="1.3"/></g></svg>