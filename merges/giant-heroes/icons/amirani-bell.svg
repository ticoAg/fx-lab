<svg xmlns="http://www.w3.org/2000/svg" id="giant-heroes-amirani-bell-root" viewBox="0 0 80 80" role="img" aria-label="Village Bell / 古钟" stroke-linecap="round" stroke-linejoin="round"><title>Village Bell / 古钟</title><desc>A bronze bell under a stone arch in a mountain village, swinging to sound the alarm. / 山村石拱下的青铜古钟，左右摆动报信。</desc><style>#giant-heroes-amirani-bell-root,#giant-heroes-amirani-bell-root g{animation-play-state:inherit}.giant-heroes-amirani-bell-motion{animation:giant-heroes-amirani-bell-sway 2.4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 10px}@keyframes giant-heroes-amirani-bell-sway{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}@media (prefers-reduced-motion:reduce){.giant-heroes-amirani-bell-motion{animation:none!important;transform:none!important}}</style><defs><path id="giant-heroes-amirani-bell-1" d="M28 46 Q28 18 40 18 Q52 18 52 46 Q56 50 58 54 H22 Q24 50 28 46Z"/><clipPath id="giant-heroes-amirani-bell-1c"><use href="#giant-heroes-amirani-bell-1"/></clipPath></defs><path d="M14 70 V18 Q14 8 40 8 Q66 8 66 18 V70" fill="none" stroke="currentColor" stroke-width="7.6"/><path d="M14 70 V18 Q14 8 40 8 Q66 8 66 18 V70" fill="none" stroke="#8C5A32" stroke-width="5"/><g class="giant-heroes-amirani-bell-motion"><path d="M40 10 V18" fill="none" stroke="currentColor" stroke-width="4.6"/><path d="M40 10 V18" fill="none" stroke="#5C6570" stroke-width="2"/><use href="#giant-heroes-amirani-bell-1" fill="#E4C99A"/><g clip-path="url(#giant-heroes-amirani-bell-1c)"><path d="M46 0 H80 V80 H46Z" fill="#8C5A32" opacity="0.45"/><path d="M32 40 Q32 26 38 22" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.6"/></g><use href="#giant-heroes-amirani-bell-1" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="40" cy="57" r="3" fill="#5C6570" stroke="currentColor" stroke-width="1.4"/></g></svg>