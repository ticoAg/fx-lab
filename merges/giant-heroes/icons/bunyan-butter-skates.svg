<svg xmlns="http://www.w3.org/2000/svg" id="giant-heroes-bunyan-butter-skates-root" viewBox="0 0 80 80" role="img" aria-label="Butter Skates / 黄油滑冰鞋" stroke-linecap="round" stroke-linejoin="round"><title>Butter Skates / 黄油滑冰鞋</title><desc>A pair of boots with butter slabs strapped on, gliding to grease the giant griddle. / 鞋底绑着黄油块的一双靴子，在巨锅上滑行抹油。</desc><style>#giant-heroes-bunyan-butter-skates-root,#giant-heroes-bunyan-butter-skates-root g{animation-play-state:inherit}.giant-heroes-bunyan-butter-skates-motion{animation:giant-heroes-bunyan-butter-skates-float 2.4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 40px}@keyframes giant-heroes-bunyan-butter-skates-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}@media (prefers-reduced-motion:reduce){.giant-heroes-bunyan-butter-skates-motion{animation:none!important;transform:none!important}}</style><path d="M6 66 H30 M10 72 H40" fill="none" stroke="#3A6EA5" stroke-width="1.6" opacity="0.7"/><g class="giant-heroes-bunyan-butter-skates-motion"><path d="M12 52 V34 H24 V44 Q34 44 34 52Z" fill="#3A2C22" stroke="currentColor" stroke-width="2"/><path d="M10 52 H38 V58 H10Z" fill="#E4C99A" stroke="currentColor" stroke-width="1.8"/><path d="M14 40 H24" fill="none" stroke="#A33B2B" stroke-width="2"/><path d="M42 46 V28 H54 V38 Q64 38 64 46Z" fill="#3A2C22" stroke="currentColor" stroke-width="2"/><path d="M40 46 H68 V52 H40Z" fill="#E4C99A" stroke="currentColor" stroke-width="1.8"/><path d="M44 34 H54" fill="none" stroke="#A33B2B" stroke-width="2"/></g></svg>