<svg xmlns="http://www.w3.org/2000/svg" id="giant-heroes-amirani-chain-root" viewBox="0 0 80 80" role="img" aria-label="Iron Chain / 铁链" stroke-linecap="round" stroke-linejoin="round"><title>Iron Chain / 铁链</title><desc>A heavy iron chain hanging from a ring in the rock, its links gently swinging. / 从山岩铁环上垂下的粗大铁链，一节节轻轻摇晃。</desc><style>#giant-heroes-amirani-chain-root,#giant-heroes-amirani-chain-root g{animation-play-state:inherit}.giant-heroes-amirani-chain-motion{animation:giant-heroes-amirani-chain-sway 2.6s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 8px}@keyframes giant-heroes-amirani-chain-sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@media (prefers-reduced-motion:reduce){.giant-heroes-amirani-chain-motion{animation:none!important;transform:none!important}}</style><defs><path id="giant-heroes-amirani-chain-1" d="M30 8 H50 V14 H30Z"/><clipPath id="giant-heroes-amirani-chain-1c"><use href="#giant-heroes-amirani-chain-1"/></clipPath></defs><use href="#giant-heroes-amirani-chain-1" fill="#8C5A32"/><g clip-path="url(#giant-heroes-amirani-chain-1c)"><path d="M44 0 H80 V80 H44Z" fill="#8C5A32" opacity="0.45"/></g><use href="#giant-heroes-amirani-chain-1" fill="none" stroke="currentColor" stroke-width="2"/><g class="giant-heroes-amirani-chain-motion"><ellipse cx="40" cy="18" rx="5" ry="3.2" fill="#3A6EA5" stroke="currentColor" stroke-width="1.6" transform="rotate(90 40 18)"/><path d="M38 18 H42" fill="none" stroke="#5C6570" stroke-width="1.1"/><ellipse cx="40" cy="27" rx="5" ry="3.2" fill="#3A6EA5" stroke="currentColor" stroke-width="1.6"/><path d="M38 27 H42" fill="none" stroke="#5C6570" stroke-width="1.1"/><ellipse cx="40" cy="36" rx="5" ry="3.2" fill="#3A6EA5" stroke="currentColor" stroke-width="1.6" transform="rotate(90 40 36)"/><path d="M38 36 H42" fill="none" stroke="#5C6570" stroke-width="1.1"/><ellipse cx="40" cy="45" rx="5" ry="3.2" fill="#3A6EA5" stroke="currentColor" stroke-width="1.6"/><path d="M38 45 H42" fill="none" stroke="#5C6570" stroke-width="1.1"/><ellipse cx="40" cy="54" rx="5" ry="3.2" fill="#3A6EA5" stroke="currentColor" stroke-width="1.6" transform="rotate(90 40 54)"/><path d="M38 54 H42" fill="none" stroke="#5C6570" stroke-width="1.1"/><ellipse cx="40" cy="63" rx="5" ry="3.2" fill="#3A6EA5" stroke="currentColor" stroke-width="1.6"/><path d="M38 63 H42" fill="none" stroke="#5C6570" stroke-width="1.1"/><circle cx="40" cy="68" r="3" fill="#5C6570" stroke="currentColor" stroke-width="1.4"/></g></svg>