<svg xmlns="http://www.w3.org/2000/svg" id="giant-heroes-gloos-frog-monster-root" viewBox="0 0 80 80" role="img" aria-label="Frog Monster / 青蛙怪" stroke-linecap="round" stroke-linejoin="round"><title>Frog Monster / 青蛙怪</title><desc>A big round-bellied cartoon frog with bulging eyes, not scary at all. / 鼓着大眼、肚子圆滚的Q版大青蛙，一点也不吓人。</desc><style>#giant-heroes-gloos-frog-monster-root,#giant-heroes-gloos-frog-monster-root g{animation-play-state:inherit}.giant-heroes-gloos-frog-monster-motion{animation:giant-heroes-gloos-frog-monster-pulse 2.8s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 50px}@keyframes giant-heroes-gloos-frog-monster-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}@media (prefers-reduced-motion:reduce){.giant-heroes-gloos-frog-monster-motion{animation:none!important;transform:none!important}}</style><defs><path id="giant-heroes-gloos-frog-monster-1" d="M12 60 Q10 34 40 30 Q70 34 68 60Z"/><clipPath id="giant-heroes-gloos-frog-monster-1c"><use href="#giant-heroes-gloos-frog-monster-1"/></clipPath></defs><ellipse cx="40" cy="66" rx="26" ry="2.4" fill="#3A2C22" opacity=".16"/><g class="giant-heroes-gloos-frog-monster-motion"><use href="#giant-heroes-gloos-frog-monster-1" fill="#2F4A32"/><g clip-path="url(#giant-heroes-gloos-frog-monster-1c)"><path d="M46 0 H80 V80 H46Z" fill="#2F4A32" opacity="0.4"/><circle cx="24" cy="44" r="2" fill="#2F4A32"/><circle cx="52" cy="42" r="2" fill="#2F4A32"/><circle cx="40" cy="52" r="2" fill="#2F4A32"/></g><use href="#giant-heroes-gloos-frog-monster-1" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="28" cy="30" r="7" fill="#2F4A32" stroke="currentColor" stroke-width="1.2"/><circle cx="52" cy="30" r="7" fill="#2F4A32" stroke="currentColor" stroke-width="1.2"/><circle cx="28" cy="30" r="2.4" fill="#3A2C22"/><circle cx="28.9" cy="29.1" r="0.9" fill="#FFFFFF"/><circle cx="52" cy="30" r="2.4" fill="#3A2C22"/><circle cx="52.9" cy="29.1" r="0.9" fill="#FFFFF