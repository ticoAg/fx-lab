<svg xmlns="http://www.w3.org/2000/svg" id="giant-heroes-amirani-shield-root" viewBox="0 0 80 80" role="img" aria-label="Bronze Shield / 铜圆盾" stroke-linecap="round" stroke-linejoin="round"><title>Bronze Shield / 铜圆盾</title><desc>The round bronze shield that held off the giants, its boss glowing. / 抵挡巨怪的铜圆盾，盾心发出光芒。</desc><style>#giant-heroes-amirani-shield-root,#giant-heroes-amirani-shield-root g{animation-play-state:inherit}.giant-heroes-amirani-shield-motion{animation:giant-heroes-amirani-shield-pulse 2.6s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 40px}@keyframes giant-heroes-amirani-shield-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}@media (prefers-reduced-motion:reduce){.giant-heroes-amirani-shield-motion{animation:none!important;transform:none!important}}</style><defs><path id="giant-heroes-amirani-shield-1" d="M14 40 A26 26 0 1 1 66 40 A26 26 0 1 1 14 40Z"/><clipPath id="giant-heroes-amirani-shield-1c"><use href="#giant-heroes-amirani-shield-1"/></clipPath></defs><g class="giant-heroes-amirani-shield-motion"><use href="#giant-heroes-amirani-shield-1" fill="#E4C99A"/><g clip-path="url(#giant-heroes-amirani-shield-1c)"><path d="M48 0 H80 V80 H48Z" fill="#8C5A32" opacity="0.45"/><path d="M40 16 V64 M16 40 H64" fill="none" stroke="#8C5A32" stroke-width="1.4" opacity="0.6"/><path d="M22 28 Q28 20 36 17" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/></g><use href="#giant-heroes-amirani-shield-1" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="40" cy="40" r="7" fill="#A33B2B" stroke="currentColor" stroke-width="1.8"/><circle cx="38" cy="38" r="2" fill="#FFFFFF"/></g></svg>