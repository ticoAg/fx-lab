<svg xmlns="http://www.w3.org/2000/svg" id="mythic-beasts-sphinx-golden-key-root" viewBox="0 0 80 80" role="img" aria-label="Riddle Key / 解谜钥匙" stroke-linecap="round" stroke-linejoin="round"><title>Riddle Key / 解谜钥匙</title><desc>A golden key with an ankh-shaped bow, spinning to unlock. / 安卡十字形把手的金钥匙，绕中心旋转开锁。</desc><style>#mythic-beasts-sphinx-golden-key-root,#mythic-beasts-sphinx-golden-key-root g{animation-play-state:inherit}.mythic-beasts-sphinx-golden-key-motion{animation:mythic-beasts-sphinx-golden-key-spin 5s linear infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 40px}@keyframes mythic-beasts-sphinx-golden-key-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.mythic-beasts-sphinx-golden-key-motion{animation:none!important;transform:none!important}}</style><defs><path id="mythic-beasts-sphinx-golden-key-1" d="M40 30 Q30 26 32 18 Q34 12 40 12 Q46 12 48 18 Q50 26 40 30Z M40 26 Q36 24 37 19 Q38 16 40 16 Q42 16 43 19 Q44 24 40 26Z"/><clipPath id="mythic-beasts-sphinx-golden-key-1c"><use href="#mythic-beasts-sphinx-golden-key-1"/></clipPath></defs><g class="mythic-beasts-sphinx-golden-key-motion"><path d="M40 30 V64" fill="none" stroke="currentColor" stroke-width="6.6"/><path d="M40 30 V64" fill="none" stroke="#C9A227" stroke-width="4"/><path d="M40 56 H48 M40 62 H46" fill="none" stroke="currentColor" stroke-width="6"/><path d="M40 56 H48 M40 62 H46" fill="none" stroke="#C9A227" stroke-width="3.4"/><path d="M30 32 H50" fill="none" stroke="currentColor" stroke-width="6.6"/><path d="M30 32 H50" fill="none" stroke="#C9A227" stroke-width="4"/><use href="#mythic-beasts-sphinx-golden-key-1" fill="#C9A227"/><g clip-path="url(#mythic-beasts-sphinx-golden-key-1c)"><path d="M46 0 H80 V80 H46Z" fill="#C9A227" opacity="0.45"/></g><use href="#mythic-beasts-sphinx-golden-key-1" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="40" cy="32" r="2" fill="#4A6741" stroke="currentColor" stroke-width="1"/></g></svg>