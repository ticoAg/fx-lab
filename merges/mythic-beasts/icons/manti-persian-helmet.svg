<svg xmlns="http://www.w3.org/2000/svg" id="mythic-beasts-manti-persian-helmet-root" viewBox="0 0 80 80" role="img" aria-label="Persian helmet / 波斯头盔（光泽闪动）" stroke-linecap="round" stroke-linejoin="round"><title>Persian helmet / 波斯头盔（光泽闪动）</title><desc>A spiked steel helmet with gold band, nasal guard and dark mail aventail, a white glint pulsing at upper left. / 尖顶钢盔、金色额带、鼻甲与深色锁子护颈，左上白色光点闪动。</desc><style>#mythic-beasts-manti-persian-helmet-root,#mythic-beasts-manti-persian-helmet-root g{animation-play-state:inherit}.mythic-beasts-manti-persian-helmet-motion{animation:mythic-beasts-manti-persian-helmet-pulse 2s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:30px 31.5px}@keyframes mythic-beasts-manti-persian-helmet-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}@media (prefers-reduced-motion:reduce){.mythic-beasts-manti-persian-helmet-motion{animation:none!important;transform:none!important}}</style><defs><path id="mythic-beasts-manti-persian-helmet-1" d="M18 50 Q18 22 40 14 Q62 22 62 50Z"/><clipPath id="mythic-beasts-manti-persian-helmet-1c"><use href="#mythic-beasts-manti-persian-helmet-1"/></clipPath><path id="mythic-beasts-manti-persian-helmet-2" d="M16 48 H64 V54 H16Z"/><clipPath id="mythic-beasts-manti-persian-helmet-2c"><use href="#mythic-beasts-manti-persian-helmet-2"/></clipPath><path id="mythic-beasts-manti-persian-helmet-3" d="M18 54 H62 L60 68 Q40 74 20 68Z"/><clipPath id="mythic-beasts-manti-persian-helmet-3c"><use href="#mythic-beasts-manti-persian-helmet-3"/></clipPath></defs><use href="#mythic-beasts-manti-persian-helmet-3" fill="#1E4E8C"/><g clip-path="url(#mythic-beasts-manti-persian-helmet-3c)"><path d="M18 58 H62" fill="none" stroke="#1E4E8C" stroke-width="1" opacity="0.6" stroke-dasharray="2 2"/><path d="M18 62 H62" fill="none" stroke="#1E4E8C" stroke-width="1" opacity="0.6" stroke-dasharray="2 2"/><path d="M18 66 H62" fill="none" stroke="#1E4E8C" stroke-width="1" opacity="0.6" stroke-dasharray="2 2"/></g><use href="#mythic-beasts-manti-persian-helmet-3" fill="none" stroke="currentColor" stroke-width="2.4"/><use href="#mythic-beasts-manti-persian-helmet-1" fill="#F0E2C4"/><g clip-path="url(#mythic-beasts-manti-persian-helmet-1c)"><path d="M42 12 H66 V52 H42Z" fill="#C9A227" opacity="0.6"/><path d="M24 40 Q24 26 36 20" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/><path d="M18 42 H62" fill="none" stroke="#C9A227" stroke-width="2"/></g><use href="#mythic-beasts-manti-persian-helmet-1" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M38 14 L40 4 L42 14Z" fill="#C9A227" stroke="currentColor" stroke-width="1.2"/><use href="#mythic-beasts-manti-persian-helmet-2" fill="#C9A227"/><g clip-path="url(#mythic-beasts-manti-persian-helmet-2c)"><path d="M16 52 H64 V56 H16Z" fill="#C9A227" opacity="0.6"/></g><use href="#mythic-beasts-manti-persian-helmet-2" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M38 50 H42 V64 H38Z" fill="#F0E2C4" stroke="currentColor" stroke-width="1"/><g class="mythic-beasts-manti-persian-helmet-motion"><path d="M30 26 l1.5 4 l4 1.5 l-4 1.5 l-1.5 4 l-1.5 -4 l-4 -1.5 l4 -1.5Z" fill="#FFFFFF" stroke="currentColor" stroke-width="0.8"/></g></svg>