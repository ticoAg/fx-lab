<svg xmlns="http://www.w3.org/2000/svg" id="mythic-beasts-grif-eagle-eye-root" viewBox="0 0 80 80" role="img" aria-label="Eagle Eye / 鹰眼" stroke-linecap="round" stroke-linejoin="round"><title>Eagle Eye / 鹰眼</title><desc>A sharp eagle eye with a golden iris under a heavy brow ridge. / 金色虹膜的锐利鹰眼，上方压着一道眉骨。</desc><style>#mythic-beasts-grif-eagle-eye-root,#mythic-beasts-grif-eagle-eye-root g{animation-play-state:inherit}.mythic-beasts-grif-eagle-eye-motion{animation:mythic-beasts-grif-eagle-eye-pulse 2.4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 40px}@keyframes mythic-beasts-grif-eagle-eye-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}@media (prefers-reduced-motion:reduce){.mythic-beasts-grif-eagle-eye-motion{animation:none!important;transform:none!important}}</style><defs><path id="mythic-beasts-grif-eagle-eye-1" d="M10 42 Q40 18 70 42 Q40 62 10 42Z"/></defs><use href="#mythic-beasts-grif-eagle-eye-1" fill="#F0E2C4"/><use href="#mythic-beasts-grif-eagle-eye-1" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 36 Q40 10 70 34 L66 26 Q40 6 12 28Z" fill="#8A6232" stroke="currentColor" stroke-width="1.6"/><g class="mythic-beasts-grif-eagle-eye-motion"><circle cx="40" cy="42" r="11" fill="#C9A227" stroke="currentColor" stroke-width="1.6"/><circle cx="40" cy="42" r="5" fill="#3A2C22"/><circle cx="37" cy="39" r="1.6" fill="#FFFFFF"/></g></svg>