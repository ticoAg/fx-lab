<svg xmlns="http://www.w3.org/2000/svg" id="mythic-beasts-manti-tail-spike-volley-root" viewBox="0 0 80 80" role="img" aria-label="Tail spike volley / 尾刺齐射（刺针飞出）" stroke-linecap="round" stroke-linejoin="round"><title>Tail spike volley / 尾刺齐射（刺针飞出）</title><desc>Four teal tail spikes fanning out from the tail base with orange sparks, popping outward playfully. / 尾根处扇形射出四枚青色尾刺，伴橙色火星，轻快跳出。</desc><style>#mythic-beasts-manti-tail-spike-volley-root,#mythic-beasts-manti-tail-spike-volley-root g{animation-play-state:inherit}.mythic-beasts-manti-tail-spike-volley-motion{animation:mythic-beasts-manti-tail-spike-volley-pop 2.2s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 42px}@keyframes mythic-beasts-manti-tail-spike-volley-pop{0%,62%,100%{transform:translateY(0) scale(1)}72%{transform:translateY(-3px) scale(1.025)}82%{transform:translateY(0) scale(.985,1.01)}90%{transform:translateY(0) scale(1.005)}}@media (prefers-reduced-motion:reduce){.mythic-beasts-manti-tail-spike-volley-motion{animation:none!important;transform:none!important}}</style><defs><path id="mythic-beasts-manti-tail-spike-volley-1" d="M14 70 C14 56 22 46 34 42 L38 50 C28 54 24 60 24 70Z"/><clipPath id="mythic-beasts-manti-tail-spike-volley-1c"><use href="#mythic-beasts-manti-tail-spike-volley-1"/></clipPath><path id="mythic-beasts-manti-tail-spike-volley-2" d="M30 38 L44 34 L42 48 L34 50Z"/><clipPath id="mythic-beasts-manti-tail-spike-volley-2c"><use href="#mythic-beasts-manti-tail-spike-volley-2"/></clipPath></defs><use href="#mythic-beasts-manti-tail-spike-volley-1" fill="#8E1E2A"/><g clip-path="url(#mythic-beasts-manti-tail-spike-volley-1c)"><path d="M24 50 L40 52 L24 72Z" fill="#8E1E2A" opacity="0.6"/></g><use href="#mythic-beasts-manti-tail-spike-volley-1" fill="none" stroke="currentColor" stroke-width="2.4"/><use href="#mythic-beasts-manti-tail-spike-volley-2" fill="#C9A227"/><g clip-path="url(#mythic-beasts-manti-tail-spike-volley-2c)"><path d="M38 34 L46 34 L42 50Z" fill="#C9A227" opacity="0.6"/></g><use href="#mythic-beasts-manti-tail-spike-volley-2" fill="none" stroke="currentColor" stroke-width="2.4"/><g class="mythic-beasts-manti-tail-spike-volley-motion"><g transform="rotate(-40 40 42)"><path d="M48 42 L66 39 L66 45Z" fill="#1E4E8C" stroke="currentColor" stroke-width="1.2"/><path d="M50 42 L64 42" fill="none" stroke="#1E4E8C" stroke-width="1"/></g><g transform="rotate(-15 40 42)"><path d="M48 42 L66 39 L66 45Z" fill="#1E4E8C" stroke="currentColor" stroke-width="1.2"/><path d="M50 42 L64 42" fill="none" stroke="#1E4E8C" stroke-width="1"/></g><g transform="rotate(10 40 42)"><path d="M48 42 L66 39 L66 45Z" fill="#1E4E8C" stroke="currentColor" stroke-width="1.2"/><path d="M50 42 L64 42" fill="none" stroke="#1E4E8C" stroke-width="1"/></g><g transform="rotate(35 40 42)"><path d="M48 42 L66 39 L66 45Z" fill="#1E4E8C" stroke="currentColor" stroke-width="1.2"/><path d="M50 42 L64 42" fill="none" stroke="#1E4E8C" stroke-width="1"/></g><circle cx="70" cy="30" r="1.6" fill="#C9A227"/><circle cx="72" cy="46" r="1.6" fill="#C9A227"/></g></svg>