<svg xmlns="http://www.w3.org/2000/svg" id="mythic-beasts-uni-horn-bugle-root" viewBox="0 0 80 80" role="img" aria-label="Hunting Horn / 狩猎号角" stroke-linecap="round" stroke-linejoin="round"><title>Hunting Horn / 狩猎号角</title><desc>A curved golden hunting horn on a red cord, sound waves drifting out. / 红绳金色弯号角吹响，音波飘出。</desc><style>#mythic-beasts-uni-horn-bugle-root,#mythic-beasts-uni-horn-bugle-root g{animation-play-state:inherit}.mythic-beasts-uni-horn-bugle-motion{animation:mythic-beasts-uni-horn-bugle-sway 2.4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:30px 50px}@keyframes mythic-beasts-uni-horn-bugle-sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@media (prefers-reduced-motion:reduce){.mythic-beasts-uni-horn-bugle-motion{animation:none!important;transform:none!important}}</style><defs><path id="mythic-beasts-uni-horn-bugle-1" d="M14 50 Q30 52 48 38 L56 26 Q62 30 60 38 Q52 46 50 46 Q32 58 14 54Z"/><clipPath id="mythic-beasts-uni-horn-bugle-1c"><use href="#mythic-beasts-uni-horn-bugle-1"/></clipPath></defs><path d="M22 52 Q30 66 46 46" fill="none" stroke="#8E1E2A" stroke-width="1.8"/><g class="mythic-beasts-uni-horn-bugle-motion"><use href="#mythic-beasts-uni-horn-bugle-1" fill="#C9A227"/><g clip-path="url(#mythic-beasts-uni-horn-bugle-1c)"><path d="M44 0 H80 V80 H44Z" fill="#C9A227" opacity="0.45"/><path d="M30 50 L32 46 M40 46 L42 42" fill="none" stroke="#C9A227" stroke-width="1.2"/></g><use href="#mythic-beasts-uni-horn-bugle-1" fill="none" stroke="currentColor" stroke-width="1.8"/><ellipse cx="58" cy="32" rx="4" ry="7" fill="#C9A227" stroke="currentColor" stroke-width="1.4" transform="rotate(36 58 32)"/><path d="M64 22 q4 -2 6 2 M66 30 q4 -1 6 2" fill="none" stroke="#1E4E8C" stroke-width="1.4"/></g></svg>