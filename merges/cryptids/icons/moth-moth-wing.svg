th-wing-1c)"><path d="M50 0 H80 V80 H50Z" fill="#C8B89A" opacity="0.45"/><path d="M24 38 L60 18 M24 39 L66 30" fill="none" stroke="#C8B89A" stroke-width="1.1" opacity="0.8"/><path d="M30 26 Q40 18 54 17" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.6"/></g><use href="#cryptids-moth-moth-wing-1" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="48" cy="26" r="5" fill="#C47A2A" stroke="currentColor" stroke-width="1.2"/><circle cx="48" cy="26" r="2.4" fill="#3E4650"/><circle cx="47" cy="25" r="0.8" fill="#FFFFFF"/></g><ellipse cx="20" cy="40" rx="3" ry="5" fill="#3E4650" stroke="currentColor" stroke-width="1.4"/></svg>