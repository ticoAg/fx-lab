<svg xmlns="http://www.w3.org/2000/svg" id="cryptids-hodag-spear-tail-root" viewBox="0 0 80 80" role="img" aria-label="Spear Tail / 长尾矛尖" stroke-linecap="round" stroke-linejoin="round"><title>Spear Tail / 长尾矛尖</title><desc>A curling green tail ending in a white spearhead. / 弯曲绿尾末端的白色矛尖。</desc><style>#cryptids-hodag-spear-tail-root,#cryptids-hodag-spear-tail-root g{animation-play-state:inherit}.cryptids-hodag-spear-tail-motion{animation:cryptids-hodag-spear-tail-sway 3.6s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:12px 68px}@keyframes cryptids-hodag-spear-tail-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion:reduce){.cryptids-hodag-spear-tail-motion{animation:none!important;transform:none!important}}</style><defs><path id="cryptids-hodag-spear-tail-1" d="M56 30 L52 22 L64 8 L62 26Z"/><clipPath id="cryptids-hodag-spear-tail-1c"><use href="#cryptids-hodag-spear-tail-1"/></clipPath></defs><ellipse cx="30" cy="71" rx="18" ry="2.4" fill="#3A2C22" opacity=".16"/><g class="cryptids-hodag-spear-tail-motion"><path d="M10 68 Q40 66 50 40 Q54 30 56 26" fill="none" stroke="currentColor" stroke-width="6.6"/><path d="M10 68 Q40 66 50 40 Q54 30 56 26" fill="none" stroke="#2F4A32" stroke-width="4"/><use href="#cryptids-hodag-spear-tail-1" fill="#C8B89A"/><g clip-path="url(#cryptids-hodag-spear-tail-1c)"><path d="M60 0 H80 V80 H60Z" fill="#C8B89A" opacity="0.45"/></g><use href="#cryptids-hodag-spear-tail-1" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M50 30 l-5 -3 M58 32 l4 3" fill="none" stroke="currentColor" stroke-width="1.4"/></g></svg>