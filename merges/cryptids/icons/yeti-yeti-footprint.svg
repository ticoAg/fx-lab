<svg xmlns="http://www.w3.org/2000/svg" id="cryptids-yeti-yeti-footprint-root" viewBox="0 0 80 80" role="img" aria-label="Yeti Footprint / 雪人足印" stroke-linecap="round" stroke-linejoin="round"><title>Yeti Footprint / 雪人足印</title><desc>A big ice-blue footprint in the snow with four round toes. / 雪地上冰蓝色的大脚印，四个圆脚趾。</desc><style>#cryptids-yeti-yeti-footprint-root,#cryptids-yeti-yeti-footprint-root g{animation-play-state:inherit}.cryptids-yeti-yeti-footprint-motion{animation:cryptids-yeti-yeti-footprint-pop 2.6s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 60px}@keyframes cryptids-yeti-yeti-footprint-pop{0%,62%,100%{transform:translateY(0) scale(1)}72%{transform:translateY(-2px) scale(1.025)}82%{transform:translateY(0) scale(.985,1.01)}90%{transform:translateY(0) scale(1.005)}}@media (prefers-reduced-motion:reduce){.cryptids-yeti-yeti-footprint-motion{animation:none!important;transform:none!important}}</style><defs><path id="cryptids-yeti-yeti-footprint-1" d="M34 66 Q24 64 26 48 Q28 36 38 34 Q48 36 48 48 Q48 64 34 66Z"/><clipPath id="cryptids-yeti-yeti-footprint-1c"><use href="#cryptids-yeti-yeti-footprint-1"/></clipPath></defs><circle cx="58" cy="50" r="1.4" fill="#3E4650" stroke="currentColor" stroke-width="1"/><circle cx="62" cy="40" r="1" fill="#3E4650" stroke="currentColor" stroke-width="1"/><circle cx="16" cy="56" r="1.2" fill="#3E4650" stroke="currentColor" stroke-width="1"/><g class="cryptids-yeti-yeti-footprint-motion"><use href="#cryptids-yeti-yeti-footprint-1" fill="#3E4650"/><g clip-path="url(#cryptids-yeti-yeti-footprint-1c)"><path d="M42 0 H80 V80 H42Z" fill="#3E4650" opacity="0.45"/></g><use href="#cryptids-yeti-yeti-footprint-1" fill="none" stroke="currentColor" stroke-width="2.4"/><ellipse cx="26" cy="28" rx="3.2" ry="4" fill="#3E4650" stroke="currentColor" stroke-width="1.2"/><ellipse cx="33" cy="24" rx="3.2" ry="4" fill="#3E4650" stroke="currentColor" stroke-width="1.2"/><ellipse cx="41" cy="24" rx="3.2"