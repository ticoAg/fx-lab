<svg xmlns="http://www.w3.org/2000/svg" id="cryptids-jersey-pine-barrens-root" viewBox="0 0 80 80" role="img" aria-label="Pine Barrens / 松林荒原" stroke-linecap="round" stroke-linejoin="round"><title>Pine Barrens / 松林荒原</title><desc>Three short pitch pines on sandy ground, sparse boughs swaying in the night wind. / 沙地上三棵矮小的刚松，枝叶稀疏，在夜风里轻摇。</desc><style>#cryptids-jersey-pine-barrens-root,#cryptids-jersey-pine-barrens-root g{animation-play-state:inherit}.cryptids-jersey-pine-barrens-motion{animation:cryptids-jersey-pine-barrens-sway 4.2s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 70px}@keyframes cryptids-jersey-pine-barrens-sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}@media (prefers-reduced-motion:reduce){.cryptids-jersey-pine-barrens-motion{animation:none!important;transform:none!important}}</style><defs><path id="cryptids-jersey-pine-barrens-1" d="M10 70 Q40 62 70 70Z"/><path id="cryptids-jersey-pine-barrens-2" d="M24 28 L30.05 46.0 H27.3 L35 63.2 H13 L20.7 46.0 H17.95Z"/><clipPath id="cryptids-jersey-pine-barrens-2c"><use href="#cryptids-jersey-pine-barrens-2"/></clipPath><path id="cryptids-jersey-pine-barrens-3" d="M56 34 L61.5 49.3 H59.0 L66 63.92 H46 L53.0 49.3 H50.5Z"/><clipPath id="cryptids-jersey-pine-barrens-3c"><use href="#cryptids-jersey-pine-barrens-3"/></clipPath><path id="cryptids-jersey-pine-barrens-4" d="M40 18 L47.15 41.4 H43.9 L53 63.76 H27 L36.1 41.4 H32.85Z"/><clipPath id="cryptids-jersey-pine-barrens-4c"><use href="#cryptids-jersey-pine-barrens-4"/></clipPath></defs><use href="#cryptids-jersey-pine-barrens-1" fill="#C8B89A"/><use href="#cryptids-jersey-pine-barrens-1" fill="none" stroke="currentColor" stroke-width="1.6"/><g class="cryptids-jersey-pine-barrens-motion"><path d="M24 63.2 V68" fill="none" stroke="currentColor" stroke-width="4.4"/><path d="M24 63.2 V68" fill="none" stroke="#C47A2A" stroke-width="1.8"/><use href="#cryptids-jersey-pine-barrens-2" fill="#2F4A32"/><g clip-path="url(#cryptids-jersey-pine-barrens-2c)"><path d="M24.5 0 H80 V80 H24.5Z" fill="#2F4A32" opacity="0.6"/></g><use href="#cryptids-jersey-pine-barrens-2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M56 63.92 V68" fill="none" stroke="currentColor" stroke-width="4.4"/><path d="M56 63.92 V68" fill="none" stroke="#C47A2A" stroke-width="1.8"/><use href="#cryptids-jersey-pine-barrens-3" fill="#3E4650"/><g clip-path="url(#cryptids-jersey-pine-barrens-3c)"><path d="M56.5 0 H80 V80 H56.5Z" fill="#3E4650" opacity="0.6"/></g><use href="#cryptids-jersey-pine-barrens-3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M40 63.76 V70" fill="none" stroke="currentColor" stroke-width="4.4"/><path d="M40 63.76 V70" fill="none" stroke="#C47A2A" stroke-width="1.8"/><use href="#cryptids-jersey-pine-barrens-4" fill="#2F4A32"/><g clip-path="url(#cryptids-jersey-pine-barrens-4c)"><path d="M40.5 0 H80 V80 H40.5Z" fill="#2F4A32" opacity="0.6"/></g><use href="#cryptids-jersey-pine-barrens-4" fill="none" stroke="currentColor" stroke-width="1.6"/></g></svg>