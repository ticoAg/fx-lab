<svg xmlns="http://www.w3.org/2000/svg" id="cryptids-bunyip-swamp-root" viewBox="0 0 80 80" role="img" aria-label="Swamp / 沼泽" stroke-linecap="round" stroke-linejoin="round"><title>Swamp / 沼泽</title><desc>A water lily floating among reeds in the night swamp. / 月夜芦苇间静静漂浮的睡莲。</desc><style>#cryptids-bunyip-swamp-root,#cryptids-bunyip-swamp-root g{animation-play-state:inherit}.cryptids-bunyip-swamp-motion{animation:cryptids-bunyip-swamp-float 3.6s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 56px}@keyframes cryptids-bunyip-swamp-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}@media (prefers-reduced-motion:reduce){.cryptids-bunyip-swamp-motion{animation:none!important;transform:none!important}}</style><path d="M8 60 Q40.0 54 72 60 Q40.0 68 8 60Z" fill="#3E4650" stroke="currentColor" stroke-width="1.6"/><path d="M18 61 h12 M50 62 h10" fill="none" stroke="#C8B89A" stroke-width="1" opacity="0.6"/><path d="M16 60 Q17 40 19 30" fill="none" stroke="currentColor" stroke-width="4.6"/><path d="M16 60 Q17 40 19 30" fill="none" stroke="#2F4A32" stroke-width="2"/><path d="M22 60 Q23 40 25 36" fill="none" stroke="currentColor" stroke-width="4.6"/><path d="M22 60 Q23 40 25 36" fill="none" stroke="#2F4A32" stroke-width="2"/><path d="M58 60 Q59 40 61 32" fill="none" stroke="currentColor" stroke-width="4.6"/><path d="M58 60 Q59 40 61 32" fill="none" stroke="#2F4A32" stroke-width="2"/><path d="M64 60 Q65 40 67 40" fill="none" stroke="currentColor" stroke-width="4.6"/><path d="M64 60 Q65 40 67 40" fill="none" stroke="#2F4A32" stroke-width="2"/><g class="cryptids-bunyip-swamp-motion"><ellipse cx="40" cy="60" rx="8" ry="2.4" fill="#2F4A32" stroke="currentColor" stroke-width="1.2"/><circle cx="40" cy="56" r="2.4" fill="#FFFFFF" stroke="currentColor" stroke-width="1"/></g></svg>