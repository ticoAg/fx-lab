<svg xmlns="http://www.w3.org/2000/svg" id="cryptids-drop-helmet-root" viewBox="0 0 80 80" role="img" aria-label="Anti-Bear Helmet / 防熊头盔" stroke-linecap="round" stroke-linejoin="round"><title>Anti-Bear Helmet / 防熊头盔</title><desc>An over-the-top protective helmet bristling with spikes, a glint flashing across it. / 夸张的护具头盔顶着尖刺，盔面闪过一道反光。</desc><style>#cryptids-drop-helmet-root,#cryptids-drop-helmet-root g{animation-play-state:inherit}.cryptids-drop-helmet-motion{animation:cryptids-drop-helmet-pulse 2.4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 40px}@keyframes cryptids-drop-helmet-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}@media (prefers-reduced-motion:reduce){.cryptids-drop-helmet-motion{animation:none!important;transform:none!important}}</style><defs><path id="cryptids-drop-helmet-1" d="M14 50 Q14 18 40 18 Q66 18 66 50Z"/><clipPath id="cryptids-drop-helmet-1c"><use href="#cryptids-drop-helmet-1"/></clipPath></defs><g class="cryptids-drop-helmet-motion"><path d="M23 26 L26 16 L29 26Z" fill="#3E4650" stroke="currentColor" stroke-width="1.2"/><path d="M37 18 L40 8 L43 18Z" fill="#3E4650" stroke="currentColor" stroke-width="1.2"/><path d="M51 26 L54 16 L57 26Z" fill="#3E4650" stroke="currentColor" stroke-width="1.2"/><use href="#cryptids-drop-helmet-1" fill="#C47A2A"/><g clip-path="url(#cryptids-drop-helmet-1c)"><path d="M48 0 H80 V80 H48Z" fill="#C47A2A" opacity="0.45"/><path d="M22 40 Q24 28 34 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" opacity="0.7"/></g><use href="#cryptids-drop-helmet-1" fill="none" stroke="currentColor" stroke-width="2"/><path d="M46 26 L49 22 L50 30Z" fill="#FFFFFF"/><path d="M10 52 H70" fill="none" stroke="currentColor" stroke-width="5.6"/><path d="M10 52 H70" fill="none" stroke="#C47A2A" stroke-width="3"/><path d="M18 52 Q20 64 30 66 M62 52 Q60 64 50 66" fill="none" stroke="#3A2C22" stroke-width="2"/></g></svg>