<svg xmlns="http://www.w3.org/2000/svg" id="cryptids-jersey-trap-net-root" viewBox="0 0 80 80" role="img" aria-label="Trap Net / 捕兽网" stroke-linecap="round" stroke-linejoin="round"><title>Trap Net / 捕兽网</title><desc>A round rope net hanging from a branch, its mouth drawn tight and nothing inside. / 挂在树枝下的圆形绳网，网口收紧，里面空空的。</desc><style>#cryptids-jersey-trap-net-root,#cryptids-jersey-trap-net-root g{animation-play-state:inherit}.cryptids-jersey-trap-net-motion{animation:cryptids-jersey-trap-net-sway 4.0s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 12px}@keyframes cryptids-jersey-trap-net-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion:reduce){.cryptids-jersey-trap-net-motion{animation:none!important;transform:none!important}}</style><defs><path id="cryptids-jersey-trap-net-1" d="M40 22 Q60 34 56 52 Q50 66 40 66 Q30 66 24 52 Q20 34 40 22Z"/><clipPath id="cryptids-jersey-trap-net-1c"><use href="#cryptids-jersey-trap-net-1"/></clipPath></defs><path d="M10 12 H70" fill="none" stroke="currentColor" stroke-width="5.6"/><path d="M10 12 H70" fill="none" stroke="#C47A2A" stroke-width="3"/><g class="cryptids-jersey-trap-net-motion"><path d="M40 12 V22" fill="none" stroke="currentColor" stroke-width="1.6"/><use href="#cryptids-jersey-trap-net-1" fill="#C8B89A"/><g clip-path="url(#cryptids-jersey-trap-net-1c)"><path d="M28 30 L56 58 M24 42 L48 66 M52 30 L24 58 M56 42 L32 66 M40 22 V66" fill="none" stroke="#3A2C22" stroke-width="1.1" opacity="0.9"/></g><use href="#cryptids-jersey-trap-net-1" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="40" cy="23" r="2.4" fill="#C47A2A" stroke="currentColor" stroke-width="1.2"/></g></svg>