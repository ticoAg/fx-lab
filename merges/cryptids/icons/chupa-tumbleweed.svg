<svg xmlns="http://www.w3.org/2000/svg" id="cryptids-chupa-tumbleweed-root" viewBox="0 0 80 80" role="img" aria-label="Tumbleweed / 风滚草" stroke-linecap="round" stroke-linejoin="round"><title>Tumbleweed / 风滚草</title><desc>A dry tumbleweed ball rolling in the night wind. / 被夜风吹着滚动的干枯风滚草团。</desc><style>#cryptids-chupa-tumbleweed-root,#cryptids-chupa-tumbleweed-root g{animation-play-state:inherit}.cryptids-chupa-tumbleweed-motion{animation:cryptids-chupa-tumbleweed-spin 3s linear infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 40px}@keyframes cryptids-chupa-tumbleweed-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.cryptids-chupa-tumbleweed-motion{animation:none!important;transform:none!important}}</style><defs><path id="cryptids-chupa-tumbleweed-1" d="M40 16 A24 24 0 1 1 39.9 16Z"/></defs><g class="cryptids-chupa-tumbleweed-motion"><use href="#cryptids-chupa-tumbleweed-1" fill="#C47A2A" fill-opacity=".35"/><use href="#cryptids-chupa-tumbleweed-1" fill="none" stroke="currentColor" stroke-width="2"/><path d="M22 30 Q40 50 58 28 M20 46 Q40 28 60 50 M30 20 Q48 40 34 62 M50 20 Q30 40 48 62" fill="none" stroke="#6B5A3E" stroke-width="1.6"/></g></svg>