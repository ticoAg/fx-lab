<svg xmlns="http://www.w3.org/2000/svg" id="cryptids-ness-sonar-screen-root" viewBox="0 0 80 80" role="img" aria-label="Sonar Screen / 声呐屏幕" stroke-linecap="round" stroke-linejoin="round"><title>Sonar Screen / 声呐屏幕</title><desc>A round dark sonar screen with a sweeping beam and a gold blip. / 深蓝圆形声呐屏上扫描线旋转，亮起一个金色光点。</desc><style>#cryptids-ness-sonar-screen-root,#cryptids-ness-sonar-screen-root g{animation-play-state:inherit}.cryptids-ness-sonar-screen-motion{animation:cryptids-ness-sonar-screen-spin 4s linear infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 40px}@keyframes cryptids-ness-sonar-screen-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.cryptids-ness-sonar-screen-motion{animation:none!important;transform:none!important}}</style><circle cx="40" cy="40" r="26" fill="#3E4650" stroke="currentColor" stroke-width="1.6"/><circle cx="40" cy="40" r="17" fill="none" stroke="#2F4A32" stroke-width="1"/><circle cx="40" cy="40" r="8" fill="none" stroke="#2F4A32" stroke-width="1"/><circle cx="50" cy="32" r="2.6" fill="#C8B89A"/><g class="cryptids-ness-sonar-screen-motion"><path d="M40 40 L40 15 A25 25 0 0 1 58 22Z" fill="#2F4A32" opacity=".6"/></g></svg>