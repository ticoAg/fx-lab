<svg xmlns="http://www.w3.org/2000/svg" id="cryptids-ness-long-neck-root" viewBox="0 0 80 80" role="img" aria-label="Long Neck / 长脖子" stroke-linecap="round" stroke-linejoin="round"><title>Long Neck / 长脖子</title><desc>A gently curved long neck with a round smiling head and pale spots. / 弯弯的长脖子顶着圆脑袋，带浅色斑点。</desc><style>#cryptids-ness-long-neck-root,#cryptids-ness-long-neck-root g{animation-play-state:inherit}.cryptids-ness-long-neck-motion{animation:cryptids-ness-long-neck-sway 3.6s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:36px 70px}@keyframes cryptids-ness-long-neck-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion:reduce){.cryptids-ness-long-neck-motion{animation:none!important;transform:none!important}}</style><defs><path id="cryptids-ness-long-neck-1" d="M28 70 Q24 40 34 22 Q40 12 52 12 Q62 14 62 22 Q60 28 52 28 Q44 28 42 40 Q40 56 44 70Z"/><clipPath id="cryptids-ness-long-neck-1c"><use href="#cryptids-ness-long-neck-1"/></clipPath></defs><g class="cryptids-ness-long-neck-motion"><use href="#cryptids-ness-long-neck-1" fill="#3E4650"/><g clip-path="url(#cryptids-ness-long-neck-1c)"><path d="M44 0 H80 V80 H44Z" fill="#3E4650" opacity="0.4"/><circle cx="36" cy="44" r="2" fill="#3E4650"/><circle cx="36" cy="54" r="2" fill="#3E4650"/><circle cx="36" cy="62" r="2" fill="#3E4650"/></g><use href="#cryptids-ness-long-neck-1" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="54" cy="18" r="2" fill="#3E4650"/><circle cx="54.8" cy="17.2" r="0.7" fill="#FFFFFF"/><path d="M57 24 q2 1 4 -1" fill="none" stroke="#3E4650" stroke-width="1.2"/><circle cx="58" cy="21" r="1.4" fill="#FFFFFF"/></g></svg>