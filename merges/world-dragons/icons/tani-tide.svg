<svg xmlns="http://www.w3.org/2000/svg" id="world-dragons-tani-tide-root" viewBox="0 0 80 80" role="img" aria-label="Rising Tide / 潮汐" stroke-linecap="round" stroke-linejoin="round"><title>Rising Tide / 潮汐</title><desc>Layered tide lines rolling up onto the sand. / 一层层起伏的潮汐线涌上沙滩。</desc><style>#world-dragons-tani-tide-root,#world-dragons-tani-tide-root g{animation-play-state:inherit}.world-dragons-tani-tide-motion{animation:world-dragons-tani-tide-float 3.6s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 40px}@keyframes world-dragons-tani-tide-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@media (prefers-reduced-motion:reduce){.world-dragons-tani-tide-motion{animation:none!important;transform:none!important}}</style><defs><path id="world-dragons-tani-tide-1" d="M8 60 Q40 52 72 60 V68 H8Z"/><clipPath id="world-dragons-tani-tide-1c"><use href="#world-dragons-tani-tide-1"/></clipPath></defs><use href="#world-dragons-tani-tide-1" fill="#E0B15A"/><g clip-path="url(#world-dragons-tani-tide-1c)"><path d="M50 0 H80 V80 H50Z" fill="#E0B15A" opacity="0.5"/></g><use href="#world-dragons-tani-tide-1" fill="none" stroke="currentColor" stroke-width="2"/><g class="world-dragons-tani-tide-motion"><path d="M8 30 Q18 24 28 30 Q38 36 48 30 Q58 24 72 30 V40 Q58 34 48 40 Q38 46 28 40 Q18 34 8 40Z" fill="#2F6B45" stroke="currentColor" stroke-width="1.6"/><path d="M8 44 Q18 38 28 44 Q38 50 48 44 Q58 38 72 44 V50 Q58 46 48 50 Q38 54 28 50 Q18 46 8 50Z" fill="#2F6B45" stroke="currentColor" stroke-width="1.4"/></g></svg>