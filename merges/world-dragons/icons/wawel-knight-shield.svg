<svg xmlns="http://www.w3.org/2000/svg" id="world-dragons-wawel-knight-shield-root" viewBox="0 0 80 80" role="img" aria-label="Knight Shield / 骑士盾" stroke-linecap="round" stroke-linejoin="round"><title>Knight Shield / 骑士盾</title><desc>A red-and-white knight shield with a gold boss, no lettering. / 红白分色骑士盾，中间一块金色方饰，无文字纹章。</desc><style>#world-dragons-wawel-knight-shield-root,#world-dragons-wawel-knight-shield-root g{animation-play-state:inherit}.world-dragons-wawel-knight-shield-motion{animation:world-dragons-wawel-knight-shield-sway 3.4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 70px}@keyframes world-dragons-wawel-knight-shield-sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}@media (prefers-reduced-motion:reduce){.world-dragons-wawel-knight-shield-motion{animation:none!important;transform:none!important}}</style><defs><path id="world-dragons-wawel-knight-shield-1" d="M18 14 H62 V38 Q62 60 40 70 Q18 60 18 38Z"/><clipPath id="world-dragons-wawel-knight-shield-1c"><use href="#world-dragons-wawel-knight-shield-1"/></clipPath></defs><ellipse cx="40" cy="72" rx="14" ry="2.4" fill="#3A2C22" opacity=".16"/><g class="world-dragons-wawel-knight-shield-motion"><use href="#world-dragons-wawel-knight-shield-1" fill="#D85A2A"/><g clip-path="url(#world-dragons-wawel-knight-shield-1c)"><path d="M40 0 H80 V80 H40Z" fill="#D85A2A" opacity="0.4"/><path d="M18 14 H40 V80 H18Z" fill="#FFFFFF" opacity="0.35"/></g><use href="#world-dragons-wawel-knight-shield-1" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M34 32 h12 v12 h-12Z" fill="#E0B15A" stroke="currentColor" stroke-width="1"/></g></svg>