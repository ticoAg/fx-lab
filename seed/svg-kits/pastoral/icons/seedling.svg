<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-seedling-root" viewBox="0 0 80 80" role="img" aria-label="Seedling pot / 幼苗盆栽" stroke-linecap="round" stroke-linejoin="round"><title>Seedling pot / 幼苗盆栽</title><desc>A two-leaf seedling sprouting from a terracotta pot, a water drop by its leaf and a plant tag in the soil, the sprout gently swaying. For sowing, new beginnings and growth. / 陶土花盆里冒出一株两叶幼苗，叶尖挂着一滴水，盆边插着小标签，嫩芽轻轻摇摆。用于播种、新开始与成长。</desc><style>#pastoral-seedling-root,#pastoral-seedling-root g{animation-play-state:inherit}.pastoral-seedling-motion{animation:pastoral-seedling-sway 3.4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 47px}@keyframes pastoral-seedling-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}@media (prefers-reduced-motion:reduce){.pastoral-seedling-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-seedling-1" d="M23.6 50 H56.4 L52.4 70.6 Q52 72 50.6 72 H29.4 Q28 72 27.6 70.6Z"/><clipPath id="pastoral-seedling-1c"><use href="#pastoral-seedling-1"/></clipPath><path id="pastoral-seedling-2" d="M20.6 45.4 Q20.6 44 22 44 H58 Q59.4 44 59.4 45.4 V50.4 Q59.4 51.8 58 51.8 H22 Q20.6 51.8 20.6 50.4Z"/><clipPath id="pastoral-seedling-2c"><use href="#pastoral-seedling-2"/></clipPath></defs><ellipse cx="40" cy="73" rx="15" ry="1.8" fill="#4B3A2A" opacity=".16"/><g class="pastoral-seedling-motion"><path d="M40 44.6 Q38.6 36 40 26" fill="none" stroke="currentColor" stroke-width="5"/><path d="M40 44.6 Q38.6 36 40 26" fill="none" stroke="#6F9442" stroke-width="2.4"/><path d="M39.6 30 C36 22 28 18 19.6 20 C22 28 30 33 39.6 30Z" fill="#93B45A" stroke="currentColor" stroke-width="1.7"/><path d="M38.6 29.4 Q30 26.6 23 21.6" fill="none" stroke="#557A35" stroke-width="1"/><path d="M40.4 27.6 C44 18.6 52 14 60.6 15.6 C58.6 24.6 50 29.6 40.4 27.6Z" fill="#6F9442" stroke="currentColor" stroke-width="1.7"/><path d="M41.4 27 Q50 23 57 17.4" fill="none" stroke="#5