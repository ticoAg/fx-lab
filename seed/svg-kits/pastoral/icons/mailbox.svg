<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-mailbox-root" viewBox="0 0 80 80" role="img" aria-label="Mailbox / 乡村邮箱" stroke-linecap="round" stroke-linejoin="round"><title>Mailbox / 乡村邮箱</title><desc>Blue rural mailbox on a wooden post with a letter peeking out and a red flag gently waving, little flowers at its foot. For letters, country lanes and greetings. / 木桩上的蓝色乡村邮箱，门口探出一封信，红色小旗轻轻摆动，脚下开着小花。用于来信、乡间小路与问候。</desc><style>#pastoral-mailbox-root,#pastoral-mailbox-root g{animation-play-state:inherit}.pastoral-mailbox-motion{animation:pastoral-mailbox-sway 3.4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:58px 44px}@keyframes pastoral-mailbox-sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}@media (prefers-reduced-motion:reduce){.pastoral-mailbox-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-mailbox-1" d="M18 30 Q18 18 32 18 H54 Q62 18 62 30 V46 H18Z"/><clipPath id="pastoral-mailbox-1c"><use href="#pastoral-mailbox-1"/></clipPath></defs><ellipse cx="40" cy="72" rx="18" ry="2.4" fill="#4B3A2A" opacity=".16"/><path d="M40 46 V72" fill="none" stroke="currentColor" stroke-width="5.8"/><path d="M40 46 V72" fill="none" stroke="#B88352" stroke-width="3.2"/><g class="pastoral-mailbox-motion"><path d="M58 44 V14" fill="none" stroke="currentColor" stroke-width="4.2"/><path d="M58 44 V14" fill="none" stroke="#BF5340" stroke-width="1.6"/><path d="M58 14 H68 V22 H58Z" fill="#BF5340" stroke="currentColor" stroke-width="1.4"/></g><use href="#pastoral-mailbox-1" fill="#5E8FA8"/><g clip-path="url(#pastoral-mailbox-1c)"><path d="M18 40 H62 V46 H18Z" fill="#47738A" opacity="0.8"/><path d="M22 28 Q24 22 30 22" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.6"/></g><use href="#pastoral-mailbox-1" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M18 30 Q18 22 24 20 V46 H18Z" fill="#47738A" stroke="currentColor" stroke-width="1.4"/><path d="M10 34 L22 30