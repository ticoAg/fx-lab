<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-honeybee-root" viewBox="0 0 80 80" role="img" aria-label="Honeybee / 小蜜蜂" stroke-linecap="round" stroke-linejoin="round"><title>Honeybee / 小蜜蜂</title><desc>Striped yellow-and-black honeybee with clear wings and antennae, a dotted flight trail behind it and a small white flower below, gently hovering. For pollination, gardens and spring. / 黄黑条纹的小蜜蜂，透明翅膀和触角，身后一道虚线飞行轨迹，下方一朵小白花，蜜蜂轻轻漂浮。用于授粉、花园与春天。</desc><style>#pastoral-honeybee-root,#pastoral-honeybee-root g{animation-play-state:inherit}.pastoral-honeybee-motion{animation:pastoral-honeybee-float 2.8s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:42px 42px}@keyframes pastoral-honeybee-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.4px)}}@media (prefers-reduced-motion:reduce){.pastoral-honeybee-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-honeybee-1" d="M28 42 Q28 30 42 30 Q58 30 60 42 Q58 54 42 54 Q28 54 28 42Z"/><clipPath id="pastoral-honeybee-1c"><use href="#pastoral-honeybee-1"/></clipPath></defs><path d="M10 64 Q20 52 30 60 Q38 66 46 54" fill="none" stroke="#AFA799" stroke-width="1.1" opacity="0.9" stroke-dasharray="2 3"/><ellipse cx="58" cy="60" rx="2.5" ry="4" fill="#FFFDF7" stroke="currentColor" stroke-width="1" transform="rotate(0 58 64)"/><ellipse cx="58" cy="60" rx="2.5" ry="4" fill="#FFFDF7" stroke="currentColor" stroke-width="1" transform="rotate(72 58 64)"/><ellipse cx="58" cy="60" rx="2.5" ry="4" fill="#FFFDF7" stroke="currentColor" stroke-width="1" transform="rotate(144 58 64)"/><ellipse cx="58" cy="60" rx="2.5" ry="4" fill="#FFFDF7" stroke="currentColor" stroke-width="1" transform="rotate(216 58 64)"/><ellipse cx="58" cy="60" rx="2.5" ry="4" fill="#FFFDF7" stroke="currentColor" stroke-width="1" transform="rotate(288 58 64)"/><circle cx="58" cy="64" r="2.5" fill="#EBB23E" stroke="currentColor" stroke-width="1"/><path d="M58 69 V74" fill="none" stroke="currentColor" stroke-width="4"/><path d="M58 69 V74" fill="none" stroke="#93B45A" stroke-width="1.4"/><g class="pastoral-honeybee-motion"><ellipse cx="36" cy="26" rx="8" ry="11" fill="#E6F1F5" stroke="currentColor" stroke-width="1.4" transform="rotate(-25 36 26)"/><ellipse cx="48" cy="26" rx="8" ry="11" fill="#E6F1F5" stroke="currentColor" stroke-width="1.4" transform="rotate(25 48 26)"/><path d="M60 41 L66 42 L60 44Z" fill="#3A2C22" stroke="currentColor" stroke-width="1"/><use href="#pastoral-honeybee-1" fill="#EBB23E"/><g clip-path="url(#pastoral-honeybee-1c)"><path d="M40 26 H45 V58 H40Z" fill="#3A2C22"/><path d="M50 26 H55 V58 H50Z" fill="#3A2C22"/><path d="M32 38 Q34 33 40 33" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.6"/></g><use href="#pastoral-honeybee-1" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="26" cy="42" r="7.6" fill="#3A2C22" stroke="currentColor" stroke-width="2"/><circle cx="24" cy="40" r="1.5" fill="#FFFDF7"/><circle cx="24.6" cy="39.4" r="0.5" fill="#FFFFFF"/><path d="M24 35 Q20 28 16 28 M28 35 Q28 28 26 24" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="23" cy="40" r="0.6" fill="#FFFDF7"/></g></svg>