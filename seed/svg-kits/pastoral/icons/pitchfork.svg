<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Pitchfork / 干草叉"><title>Pitchfork / 干草叉</title><desc>Wooden pitchfork with three curved iron tines resting by a tuft of hay. For chores, hay making and farm work. / 木柄干草叉，三根弯曲铁齿，倚在一小堆干草旁。用于农活、晒草与农场劳作。</desc><style>.pastoral-sway{animation:pastoral-sway 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes pastoral-sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@media (prefers-reduced-motion:reduce){.pastoral-float,.pastoral-sway,.pastoral-spin,.pastoral-pulse,.pastoral-pop,.pastoral-drip{animation:none!important}}</style><g class="pastoral-sway"><path d="M14 70 Q24 58 34 70 M22 70 Q30 60 40 70" fill="#F2D98D" stroke="#C4A35A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g transform="rotate(16 40 42)"><path d="M40 74 V34" fill="none" stroke="#8B5E3C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M29 14 V28 Q29 36 40 36 Q51 36 51 28 V14 M40 36 V10" fill="none" stroke="#7A7A7A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>
