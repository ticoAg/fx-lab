<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-tomato-root" viewBox="0 0 80 80" role="img" aria-label="Tomato vine / 番茄藤" stroke-linecap="round" stroke-linejoin="round"><title>Tomato vine / 番茄藤</title><desc>A tomato vine tied to a wooden stake, hanging red, orange and green tomatoes with starry calyxes and leaves, swaying lightly. For kitchen gardens, summer harvest and fresh food. / 绑在木桩上的番茄藤，挂着红、橙、青三颗番茄，绿色萼片与叶片随风轻摆。用于菜园、夏季收获与新鲜食材。</desc><style>#pastoral-tomato-root,#pastoral-tomato-root g{animation-play-state:inherit}.pastoral-tomato-motion{animation:pastoral-tomato-sway 4.2s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:34px 72px}@keyframes pastoral-tomato-sway{0%,100%{transform:rotate(-2.6deg)}50%{transform:rotate(2.6deg)}}@media (prefers-reduced-motion:reduce){.pastoral-tomato-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-tomato-1" d="M30.6 72 V12.6 L32.6 10 L34.6 12.6 V72Z"/><clipPath id="pastoral-tomato-1c"><use href="#pastoral-tomato-1"/></clipPath><circle id="pastoral-tomato-2" cx="49.6" cy="40" r="7.4"/><clipPath id="pastoral-tomato-2c"><use href="#pastoral-tomato-2"/></clipPath><circle id="pastoral-tomato-3" cx="30.6" cy="52" r="6.2"/><clipPath id="pastoral-tomato-3c"><use href="#pastoral-tomato-3"/></clipPath><circle id="pastoral-tomato-4" cx="49" cy="59" r="5.4"/><clipPath id="pastoral-tomato-4c"><use href="#pastoral-tomato-4"/></clipPath></defs><use href="#pastoral-tomato-1" fill="#B88352"/><g clip-path="url(#pastoral-tomato-1c)"><path d="M33 8 H36 V74 H33Z" fill="#93633A"/></g><use href="#pastoral-tomato-1" fill="none" stroke="currentColor" stroke-width="1.6"/><ellipse cx="36" cy="73" rx="14" ry="1.8" fill="#4B3A2A" opacity=".16"/><g class="pastoral-tomato-motion"><path d="M34 72 Q42 60 38 50 Q34 40 42 30 Q46 24 42 16" fill="none" stroke="currentColor" stroke-width="4.8"/><path d="M34 72 Q42 60 38 50 Q34 40 42 30 Q46 24 42 16" fill="none" stroke="#6F9442" st