<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-pumpkin-root" viewBox="0 0 80 80" role="img" aria-label="Pumpkin / 南瓜" stroke-linecap="round" stroke-linejoin="round"><title>Pumpkin / 南瓜</title><desc>Plump three-lobed orange pumpkin with a woody stem, a curly tendril and a leaf, popping up from the ground. For autumn, harvest festivals and Halloween. / 三瓣饱满的橙色南瓜，带木质瓜柄、卷曲藤须和一片叶子，从地面弹起。用于秋天、丰收节与万圣节。</desc><style>#pastoral-pumpkin-root,#pastoral-pumpkin-root g{animation-play-state:inherit}.pastoral-pumpkin-motion{animation:pastoral-pumpkin-pop 3.6s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 70px}@keyframes pastoral-pumpkin-pop{0%,62%,100%{transform:translateY(0) scale(1)}72%{transform:translateY(-2px) scale(1.025)}82%{transform:translateY(0) scale(.985,1.01)}90%{transform:translateY(0) scale(1.005)}}@media (prefers-reduced-motion:reduce){.pastoral-pumpkin-motion{animation:none!important;transform:none!important}}</style><defs><ellipse id="pastoral-pumpkin-1" cx="26" cy="51" rx="14.6" ry="17"/><clipPath id="pastoral-pumpkin-1c"><use href="#pastoral-pumpkin-1"/></clipPath><ellipse id="pastoral-pumpkin-2" cx="54" cy="51" rx="14.6" ry="17"/><clipPath id="pastoral-pumpkin-2c"><use href="#pastoral-pumpkin-2"/></clipPath><ellipse id="pastoral-pumpkin-3" cx="40" cy="51" rx="13" ry="19.4"/><clipPath id="pastoral-pumpkin-3c"><use href="#pastoral-pumpkin-3"/></clipPath></defs><ellipse cx="40" cy="70" rx="28" ry="2" fill="#4B3A2A" opacity=".16"/><g class="pastoral-pumpkin-motion"><use href="#pastoral-pumpkin-1" fill="#E8863A"/><g clip-path="url(#pastoral-pumpkin-1c)"><path d="M26 32 Q42.6 51 26 70 H44.6 V32Z" fill="#C66A24" opacity="0.75"/><path d="M17.2 47.6 Q18 40.8 23.1 37.4" fill="none" stroke="#FFFFFF" stroke-width="1.3" opacity="0.5"/></g><use href="#pastoral-pumpkin-1" fill="none" stroke="currentColor" stroke-width="2"/><use href="#pastoral-pumpkin-2" fill="#E8863A"/><g clip-path="url(#pastoral-pumpkin-2c)"><path d="M5