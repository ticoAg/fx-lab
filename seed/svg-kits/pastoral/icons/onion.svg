<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-onion-root" viewBox="0 0 80 80" role="img" aria-label="Onion / 洋葱" stroke-linecap="round" stroke-linejoin="round"><title>Onion / 洋葱</title><desc>Brown-skinned onion with two dry tops and wispy roots beside a cut half showing its rings, the whole onion gently swaying. For gardens, kitchens and cooking. / 褐色外皮的洋葱，顶上两根干叶、底下几缕须根，旁边半个切开的洋葱露出圈层，整颗轻轻摇摆。用于菜园、厨房与烹饪。</desc><style>#pastoral-onion-root,#pastoral-onion-root g{animation-play-state:inherit}.pastoral-onion-motion{animation:pastoral-onion-sway 4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 66px}@keyframes pastoral-onion-sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}@media (prefers-reduced-motion:reduce){.pastoral-onion-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-onion-1" d="M40 24 Q30 34 26 46 Q24 62 40 66 Q56 62 54 46 Q50 34 40 24Z"/><clipPath id="pastoral-onion-1c"><use href="#pastoral-onion-1"/></clipPath><path id="pastoral-onion-2" d="M54 70 Q54 58 64 58 Q74 58 74 70Z"/><clipPath id="pastoral-onion-2c"><use href="#pastoral-onion-2"/></clipPath></defs><ellipse cx="44" cy="72" rx="24" ry="2.4" fill="#4B3A2A" opacity=".16"/><g class="pastoral-onion-motion"><path d="M38 26 Q38 16 36 10 M42 26 Q42 16 46 10" fill="none"/><path d="M39 26 Q38 16 35 10" fill="none" stroke="currentColor" stroke-width="3.8"/><path d="M39 26 Q38 16 35 10" fill="none" stroke="#C9875A" stroke-width="1.2"/><path d="M41 26 Q42 16 46 12" fill="none" stroke="currentColor" stroke-width="3.8"/><path d="M41 26 Q42 16 46 12" fill="none" stroke="#C9875A" stroke-width="1.2"/><use href="#pastoral-onion-1" fill="#C9875A"/><g clip-path="url(#pastoral-onion-1c)"><path d="M42 26 Q60 40 52 64 H44Z" fill="#A86A42" opacity="0.7"/><path d="M34 36 Q30 50 36 64 M46 36 Q50 50 44 64 M40 28 V66" fill="none" stroke="#A86A42" stroke-width="0.9"/></g><use href="#pastoral-onion-1" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M36 66 Q34 70 32 71 M40 66 V72 M44 66 Q46 70 48 71" fill="none" stroke="currentColor" stroke-width="1"/><path d="M31 46 Q32 38 36 34" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.55"/></g><use href="#pastoral-onion-2" fill="#F3E3D3"/><g clip-path="url(#pastoral-onion-2c)"><path d="M58 70 Q58 62 64 62 Q70 62 70 70 M61 70 Q61 65 64 65 Q67 65 67 70" fill="none" stroke="#D7B9C8" stroke-width="1.1"/></g><use href="#pastoral-onion-2" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>