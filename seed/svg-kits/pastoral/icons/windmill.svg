<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-windmill-root" viewBox="0 0 80 80" role="img" aria-label="Windmill / 风车" stroke-linecap="round" stroke-linejoin="round"><title>Windmill / 风车</title><desc>Cream plank windmill with a red cap, a gallery and an arched door, four lattice sails turning steadily above a flowered hill. For energy, countryside and the turning of seasons. / 奶油色木板风车塔，红色塔顶、环形平台和拱门，四片格栅风帆在花草小丘上稳稳转动。用于能源、乡村与四季流转。</desc><style>#pastoral-windmill-root,#pastoral-windmill-root g{animation-play-state:inherit}.pastoral-windmill-motion{animation:pastoral-windmill-spin 12s linear infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 31px}@keyframes pastoral-windmill-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.pastoral-windmill-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-windmill-1" d="M6 74 Q20 63.6 40 63.4 Q60 63.6 74 74Z"/><clipPath id="pastoral-windmill-1c"><use href="#pastoral-windmill-1"/></clipPath><path id="pastoral-windmill-2" d="M29 72 L33 38 H47 L51 72Z"/><clipPath id="pastoral-windmill-2c"><use href="#pastoral-windmill-2"/></clipPath><path id="pastoral-windmill-3" d="M30.6 39.6 Q30.6 28 40 25.6 Q49.4 28 49.4 39.6Z"/><clipPath id="pastoral-windmill-3c"><use href="#pastoral-windmill-3"/></clipPath></defs><use href="#pastoral-windmill-1" fill="#93B45A"/><g clip-path="url(#pastoral-windmill-1c)"><path d="M6 74 Q40 66 74 74Z" fill="#6F9442"/><path d="M16 69 Q24 65.6 32 65" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.45"/></g><use href="#pastoral-windmill-1" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="17" cy="70.6" r="1.1" fill="#FFFDF7" stroke="currentColor" stroke-width="0.9"/><circle cx="22" cy="68.4" r="1.1" fill="#EBB23E" stroke="currentColor" stroke-width="0.9"/><circle cx="58.6" cy="68.6" r="1.1" fill="#FFFDF7" stroke="currentColor" stroke-width="0.9"/><circle cx="63.4" cy="70.6" r="1.1" fill="#EBB2