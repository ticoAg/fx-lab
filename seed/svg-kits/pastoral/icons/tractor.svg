<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-tractor-root" viewBox="0 0 80 80" role="img" aria-label="Tractor / 小拖拉机" stroke-linecap="round" stroke-linejoin="round"><title>Tractor / 小拖拉机</title><desc>Vintage red tractor with a big rear wheel, a small front wheel, a cream canopy and a blue window, puffing from its exhaust as the body bobs over the field. For ploughing, farm machinery and country rides. / 复古红色小拖拉机，大后轮、小前轮、奶油色顶篷和蓝色车窗，排气管冒烟，车身随路面轻轻颠动。用于耕作、农机与乡村出行。</desc><style>#pastoral-tractor-root,#pastoral-tractor-root g{animation-play-state:inherit}.pastoral-tractor-motion{animation:pastoral-tractor-float 1.6s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 50px}@keyframes pastoral-tractor-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}@media (prefers-reduced-motion:reduce){.pastoral-tractor-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-tractor-1" d="M10.6 45 Q10.6 37.6 17 37.6 H42 V56 H12.6 Q10.6 56 10.6 54Z"/><clipPath id="pastoral-tractor-1c"><use href="#pastoral-tractor-1"/></clipPath><path id="pastoral-tractor-2" d="M40 47 V24.6 H63.4 V47Z"/><clipPath id="pastoral-tractor-2c"><use href="#pastoral-tractor-2"/></clipPath></defs><ellipse cx="40" cy="72.6" rx="30" ry="1.8" fill="#4B3A2A" opacity=".16"/><circle cx="54" cy="57" r="14.4" fill="#4A4540" stroke="currentColor" stroke-width="2.2"/><circle cx="54" cy="57" r="8.6" fill="#EBB23E" stroke="currentColor" stroke-width="1.6"/><path d="M62.6 57 L66.6 57 M61.4 61.3 L64.9 63.3 M58.3 64.4 L60.3 67.9 M54 65.6 L54 69.6 M49.7 64.4 L47.7 67.9 M46.6 61.3 L43.1 63.3 M45.4 57 L41.4 57 M46.6 52.7 L43.1 50.7 M49.7 49.6 L47.7 46.1 M54 48.4 L54 44.4 M58.3 49.6 L60.3 46.1 M61.4 52.7 L64.9 50.7 " fill="none" stroke="#6A635B" stroke-width="1.6"/><circle cx="54" cy="57" r="3" fill="#C98E28" stroke="currentColor" stroke-width="1.4"/><path d="M54 57 L59.7 62.7 M54 57 L48.3 62.7 M54 57 L48.3 51.3 M54 57 L59.7 51