<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-plough-root" viewBox="0 0 80 80" role="img" aria-label="Plough / 犁" stroke-linecap="round" stroke-linejoin="round"><title>Plough / 犁</title><desc>Old wooden plough with a grey share and front wheel turning brown furrows, the plough gently rocking. For spring ploughing, tilling and traditional farming. / 老式木犁，灰色犁铧和前轮，翻开一道道褐色土垄，犁身轻轻晃动。用于春耕、耕地与传统农业。</desc><style>#pastoral-plough-root,#pastoral-plough-root g{animation-play-state:inherit}.pastoral-plough-motion{animation:pastoral-plough-sway 4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 66px}@keyframes pastoral-plough-sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}@media (prefers-reduced-motion:reduce){.pastoral-plough-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-plough-1" d="M34 40 L44 40 L48 60 L26 64 Q30 58 34 52Z"/><clipPath id="pastoral-plough-1c"><use href="#pastoral-plough-1"/></clipPath><path id="pastoral-plough-2" d="M6 70 Q20 62 30 66 Q44 70 58 64 Q70 62 74 70Z"/><clipPath id="pastoral-plough-2c"><use href="#pastoral-plough-2"/></clipPath></defs><ellipse cx="40" cy="72" rx="26" ry="2.4" fill="#4B3A2A" opacity=".16"/><use href="#pastoral-plough-2" fill="#93633A"/><g clip-path="url(#pastoral-plough-2c)"><path d="M14 68 Q24 64 32 68 M44 68 Q54 64 66 66" fill="none" stroke="#6E4A2E" stroke-width="1"/></g><use href="#pastoral-plough-2" fill="none" stroke="currentColor" stroke-width="2.4"/><g class="pastoral-plough-motion"><path d="M10 40 L56 40" fill="none" stroke="currentColor" stroke-width="5.4"/><path d="M10 40 L56 40" fill="none" stroke="#B88352" stroke-width="2.8"/><path d="M52 40 L70 26" fill="none" stroke="currentColor" stroke-width="5"/><path d="M52 40 L70 26" fill="none" stroke="#B88352" stroke-width="2.4"/><path d="M60 34 L70 40" fill="none" stroke="currentColor" stroke-width="4.6"/><path d="M60 34 L70 40" fill="none" stroke="#93633A" strok