<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-cherries-root" viewBox="0 0 80 80" role="img" aria-label="Cherries / 樱桃" stroke-linecap="round" stroke-linejoin="round"><title>Cherries / 樱桃</title><desc>Pair of red cherries on joined green stems with a leaf at the top, gently swaying. For early summer fruit, desserts and cute themes. / 一对红樱桃挂在相连的绿茎上，顶端一片叶子，轻轻摇摆。用于初夏水果、甜点与可爱主题。</desc><style>#pastoral-cherries-root,#pastoral-cherries-root g{animation-play-state:inherit}.pastoral-cherries-motion{animation:pastoral-cherries-sway 4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:44px 14px}@keyframes pastoral-cherries-sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@media (prefers-reduced-motion:reduce){.pastoral-cherries-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-cherries-1" d="M44 14 Q56 6 66 14 Q56 22 44 14Z"/><clipPath id="pastoral-cherries-1c"><use href="#pastoral-cherries-1"/></clipPath></defs><ellipse cx="40" cy="72" rx="22" ry="2.4" fill="#4B3A2A" opacity=".16"/><g class="pastoral-cherries-motion"><path d="M30 50 Q34 30 44 14" fill="none" stroke="currentColor" stroke-width="4"/><path d="M30 50 Q34 30 44 14" fill="none" stroke="#6F9442" stroke-width="1.4"/><path d="M52 52 Q50 32 44 14" fill="none" stroke="currentColor" stroke-width="4"/><path d="M52 52 Q50 32 44 14" fill="none" stroke="#6F9442" stroke-width="1.4"/><use href="#pastoral-cherries-1" fill="#93B45A"/><g clip-path="url(#pastoral-cherries-1c)"><path d="M46 14 H64" fill="none" stroke="#6F9442" stroke-width="0.9"/></g><use href="#pastoral-cherries-1" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="28" cy="58" r="10" fill="#BF5340" stroke="currentColor" stroke-width="2.2"/><path d="M30 66 Q38 62 38 56" fill="#97402F"/><path d="M22 54 Q23 50 27 49" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.7"/><circle cx="52" cy="60" r="10" fill="#BF5340" stroke="currentColor" stro