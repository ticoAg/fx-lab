<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Carrot / 胡萝卜"><title>Carrot / 胡萝卜</title><desc>Plump orange carrot with ridge lines and three leafy green tops, swaying in the breeze. For vegetables, harvest and healthy food. / 饱满的橙色胡萝卜带横纹与三簇绿叶，在微风中摇摆。用于蔬菜、收获与健康饮食。</desc><style>.pastoral-sway{animation:pastoral-sway 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes pastoral-sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@media (prefers-reduced-motion:reduce){.pastoral-float,.pastoral-sway,.pastoral-spin,.pastoral-pulse,.pastoral-pop,.pastoral-drip{animation:none!important}}</style><g class="pastoral-sway"><g fill="none" stroke="#6B8F3C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M40 30 Q33 18 25 15"/><path d="M40 30 Q40 16 41 9"/><path d="M40 30 Q47 18 56 16"/></g><path d="M40 72 L28 35 Q40 26 52 35Z" fill="#E08A4A" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M32 44 H37 M44 50 H48 M34 56 H38 M41 62 H44"/></g></g></svg>
