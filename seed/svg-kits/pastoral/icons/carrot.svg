<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-carrot-root" viewBox="0 0 80 80" role="img" aria-label="Carrot / 胡萝卜" stroke-linecap="round" stroke-linejoin="round"><title>Carrot / 胡萝卜</title><desc>Plump orange carrot with side shading, ridge lines and four feathery leaves fanning out on top, swaying as a whole. For vegetables, harvest and healthy food. / 饱满的橙色胡萝卜，侧面带阴影和横纹，四片羽状绿叶在顶部张开，整根随风摇摆。用于蔬菜、收获与健康饮食。</desc><style>#pastoral-carrot-root,#pastoral-carrot-root g{animation-play-state:inherit}.pastoral-carrot-motion{animation:pastoral-carrot-sway 3.6s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:39px 72px}@keyframes pastoral-carrot-sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@media (prefers-reduced-motion:reduce){.pastoral-carrot-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-carrot-1" d="M29.6 33 Q40 26.6 50.4 33 Q53 38 47.6 52 L41.4 70 Q39.6 74 37.8 70 L31.4 52 Q26 38 29.6 33Z"/><clipPath id="pastoral-carrot-1c"><use href="#pastoral-carrot-1"/></clipPath></defs><g class="pastoral-carrot-motion"><g transform="rotate(-32 40 31)"><path d="M40 31 C34.6 24 33.6 14 37.4 7.4 C42.6 13 44.4 23 40 31Z" fill="#6F9442" stroke="currentColor" stroke-width="1.6"/><path d="M40 29 Q38.6 20 37.6 11" fill="none" stroke="#557A35" stroke-width="0.9" opacity="0.8"/></g><g transform="rotate(30 40 31)"><path d="M40 31 C34.6 24 33.6 14 37.4 7.4 C42.6 13 44.4 23 40 31Z" fill="#6F9442" stroke="currentColor" stroke-width="1.6"/><path d="M40 29 Q38.6 20 37.6 11" fill="none" stroke="#557A35" stroke-width="0.9" opacity="0.8"/></g><g transform="rotate(-8 40 31)"><path d="M40 31 C34.6 24 33.6 14 37.4 7.4 C42.6 13 44.4 23 40 31Z" fill="#93B45A" stroke="currentColor" stroke-width="1.6"/><path d="M40 29 Q38.6 20 37.6 11" fill="none" stroke="#557A35" stroke-width="0.9" opacity="0.8"/></g><g transform="rotate(12 40 31)"><path d="M40 31 C34.6 24 33.6 14 37.4 7.4 C42.6 13 44.4 23 40 31Z" fill="#93B45A" stroke="currentColor" stroke-width="1.6"/><path d="M40 29 Q38.6 20 37.6 11" fill="none" stroke="#557A35" stroke-width="0.9" opacity="0.8"/></g><use href="#pastoral-carrot-1" fill="#E8863A"/><g clip-path="url(#pastoral-carrot-1c)"><path d="M44 26 Q56 36 49 52 L42 74 H60 V26Z" fill="#C66A24" opacity="0.8"/><path d="M31 38 H35.6 M45 43 H49.4 M33 49 H37 M42.4 54.6 H46 M35.4 60.4 H38.4 M40.6 65 H42.4" fill="none" stroke="#C66A24" stroke-width="1.3"/><path d="M33 36 Q32.6 42 35.4 50" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.6"/></g><use href="#pastoral-carrot-1" fill="none" stroke="currentColor" stroke-width="2.4"/></g></svg>