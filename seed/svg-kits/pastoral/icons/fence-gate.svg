<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Fence gate / 篱笆门"><title>Fence gate / 篱笆门</title><desc>Rustic wooden field gate with a diagonal brace between two posts, grass tufts swaying at its feet. For entrances, boundaries and welcome. / 乡村木质田间门，两根门柱之间有斜撑，脚下草丛随风摇摆。用于入口、边界与欢迎。</desc><style>.pastoral-sway{animation:pastoral-sway 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes pastoral-sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@media (prefers-reduced-motion:reduce){.pastoral-float,.pastoral-sway,.pastoral-spin,.pastoral-pulse,.pastoral-pop,.pastoral-drip{animation:none!important}}</style><g fill="#D9B58A" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="22" width="8" height="48" rx="2"/><rect x="60" y="22" width="8" height="48" rx="2"/></g><g fill="none" stroke="#8B5E3C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 32 H60 M20 46 H60 M20 60 H60 M20 60 L60 32"/></g><path d="M8 70 H72" fill="none" stroke="#6B8F3C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="pastoral-sway" fill="none" stroke="#6B8F3C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M26 70 L24 63 M29 70 L30 62 M48 70 L46 64 M52 70 L53 62 M56 70 L58 64"/></g></svg>
