<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Milk churn / 牛奶罐"><title>Milk churn / 牛奶罐</title><desc>Classic dairy milk churn with a domed lid, side handles and a blue band, a drop of milk on top. For dairy, breakfast and fresh farm goods. / 经典奶场牛奶罐，圆顶盖、两侧提手与蓝色腰带，顶上一滴牛奶。用于乳制品、早餐与新鲜农产。</desc><style>.pastoral-float{animation:pastoral-float 3s ease-in-out infinite}@keyframes pastoral-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@media (prefers-reduced-motion:reduce){.pastoral-float,.pastoral-sway,.pastoral-spin,.pastoral-pulse,.pastoral-pop,.pastoral-drip{animation:none!important}}</style><g class="pastoral-float"><path d="M31 22 H49 V28 L55 35 V64 Q55 69 50 69 H30 Q25 69 25 64 V35 L31 28Z" fill="#FFFDF6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M29 22 Q40 13 51 22Z" fill="#E8D5B5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M25 46 H55" fill="none" stroke="#8DB6C9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M25 40 Q17 42 21 50 M55 40 Q63 42 59 50" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 6 Q36 11 40 13 Q44 11 40 6Z" fill="#FFFFFF" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
