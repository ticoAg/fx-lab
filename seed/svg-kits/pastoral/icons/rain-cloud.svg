<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-rain-cloud-root" viewBox="0 0 80 80" role="img" aria-label="Rain cloud / 及时雨" stroke-linecap="round" stroke-linejoin="round"><title>Rain cloud / 及时雨</title><desc>White rain cloud dropping pale blue raindrops onto the ground where a little sprout appears, the drops gently falling. For weather, spring rain and sowing season. / 一朵白色雨云洒下浅蓝雨滴，下方地面冒出一棵小嫩芽，雨滴轻轻飘落。用于天气、春雨与播种季节。</desc><style>#pastoral-rain-cloud-root,#pastoral-rain-cloud-root g{animation-play-state:inherit}.pastoral-rain-cloud-motion{animation:pastoral-rain-cloud-float 1.4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 56px}@keyframes pastoral-rain-cloud-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.4px)}}@media (prefers-reduced-motion:reduce){.pastoral-rain-cloud-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-rain-cloud-1" d="M18 44 Q10 44 10 36 Q10 28 19 28 Q20 16 32 16 Q40 16 44 22 Q48 18 54 20 Q64 22 64 30 Q70 32 70 38 Q70 44 62 44Z"/><clipPath id="pastoral-rain-cloud-1c"><use href="#pastoral-rain-cloud-1"/></clipPath></defs><path d="M15 72 L16 68 M18 72 L18 67 M21 72 L20 68" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10 72 H70" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M60 72 V64" fill="none" stroke="currentColor" stroke-width="4"/><path d="M60 72 V64" fill="none" stroke="#93B45A" stroke-width="1.4"/><ellipse cx="57" cy="63" rx="3" ry="1.6" fill="#93B45A" stroke="currentColor" stroke-width="1" transform="rotate(20 57 63)"/><ellipse cx="63" cy="63" rx="3" ry="1.6" fill="#93B45A" stroke="currentColor" stroke-width="1" transform="rotate(-20 63 63)"/><g class="pastoral-rain-cloud-motion"><path d="M26 50 Q23.6 54 26 55.6 Q28.4 54 26 50Z" fill="#9CC5D6" stroke="currentColor" stroke-width="1.1"/><path d="M38 54 Q35.6 58 38 59.6 Q40.4 58 38 54Z" fill="#9CC5D6" stroke="currentColor" stroke-width="1.1"/><path d="M50 50 Q47.6 54 50 55.6 Q52.4 54 50 50Z" fill="#9CC5D6" stroke="currentColor" stroke-width="1.1"/><path d="M32 62 Q29.6 66 32 67.6 Q34.4 66 32 62Z" fill="#9CC5D6" stroke="currentColor" stroke-width="1.1"/><path d="M46 63 Q43.6 67 46 68.6 Q48.4 67 46 63Z" fill="#9CC5D6" stroke="currentColor" stroke-width="1.1"/></g><use href="#pastoral-rain-cloud-1" fill="#FFFDF7"/><g clip-path="url(#pastoral-rain-cloud-1c)"><path d="M14 40 Q40 46 70 38 V46 H10Z" fill="#D6D1C6" opacity="0.8"/></g><use href="#pastoral-rain-cloud-1" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M16 33 Q17 29 21 29" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.6"/></svg>