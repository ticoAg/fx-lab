<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-duck-root" viewBox="0 0 80 80" role="img" aria-label="Pond duck / 池塘小鸭" stroke-linecap="round" stroke-linejoin="round"><title>Pond duck / 池塘小鸭</title><desc>White duck with an orange bill bobbing on a rippled blue pond, beside a lily pad holding a pink blossom. For ponds, summer and lazy days. / 白色鸭子和橙色扁嘴，在带波纹的蓝色池塘上漂浮，旁边一片睡莲叶托着粉色小花。用于池塘、夏天与悠闲。</desc><style>#pastoral-duck-root,#pastoral-duck-root g{animation-play-state:inherit}.pastoral-duck-motion{animation:pastoral-duck-float 2.8s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 48px}@keyframes pastoral-duck-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.8px)}}@media (prefers-reduced-motion:reduce){.pastoral-duck-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-duck-1" d="M20 48 C20 40 28 38 34 40 L52 40 C58 40 63 38 65 40 C67 52 60 62 44 62 H32 C24 62 20 56 20 48Z"/><clipPath id="pastoral-duck-1c"><use href="#pastoral-duck-1"/></clipPath><circle id="pastoral-duck-2" cx="27.6" cy="29.6" r="9"/><clipPath id="pastoral-duck-2c"><use href="#pastoral-duck-2"/></clipPath></defs><g class="pastoral-duck-motion"><path d="M58.6 40 L67.6 33 L64.6 44Z" fill="#FFFDF7" stroke="currentColor" stroke-width="1.6"/><use href="#pastoral-duck-1" fill="#FFFDF7"/><g clip-path="url(#pastoral-duck-1c)"><path d="M16 52 Q42 64 70 46 V66 H16Z" fill="#EBD9B6"/><path d="M38 43.6 H52" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.9"/></g><use href="#pastoral-duck-1" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M21.6 35 Q22 42 24 44 H33.6 Q33 39 34 35Z" fill="#FFFDF7"/><path d="M21.4 36 Q21.4 41 23.4 43.6" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M36 47.6 C42 42 54 42.6 58.6 47.6 C54 54 42 55.6 36 47.6Z" fill="#EBD9B6" stroke="currentColor" stroke-width="1.5"/><path d="M41 48.6 Q47 46.6 54 48.4" fill="none" stroke="#D9C7A5" stroke-width="