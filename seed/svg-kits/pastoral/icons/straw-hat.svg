oke-linejoin="round"/><ellipse cx="52" cy="41.8" rx="1.6" ry="2.6" transform="rotate(240 52 45)" fill="#FFFDF6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="52" cy="41.8" rx="1.6" ry="2.6" transform="rotate(300 52 45)" fill="#FFFDF6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="52" cy="45" r="1.8" fill="#E9B949"/></g></svg>
