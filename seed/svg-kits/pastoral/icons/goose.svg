<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-goose-root" viewBox="0 0 80 80" role="img" aria-label="Goose / 大白鹅" stroke-linecap="round" stroke-linejoin="round"><title>Goose / 大白鹅</title><desc>Long-necked white goose with an orange bill and feet and a pale blue bow on its neck, giving a little hop. For farmyards, ponds and playful themes. / 长脖子大白鹅，橙色喙和脚掌，颈上系着淡蓝蝴蝶结，轻快地蹦一下。用于农家院子、池塘与童趣主题。</desc><style>#pastoral-goose-root,#pastoral-goose-root g{animation-play-state:inherit}.pastoral-goose-motion{animation:pastoral-goose-pop 3.4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:36px 70px}@keyframes pastoral-goose-pop{0%,62%,100%{transform:translateY(0) scale(1)}72%{transform:translateY(-2px) scale(1.025)}82%{transform:translateY(0) scale(.985,1.01)}90%{transform:translateY(0) scale(1.005)}}@media (prefers-reduced-motion:reduce){.pastoral-goose-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-goose-1" d="M14 48 Q14 40 26 40 L48 42 Q58 44 58 54 Q58 62 46 62 H26 Q16 62 14 54Z"/><clipPath id="pastoral-goose-1c"><use href="#pastoral-goose-1"/></clipPath><path id="pastoral-goose-2" d="M22 46 Q34 42 46 48 Q42 56 28 55 Q22 52 22 46Z"/><clipPath id="pastoral-goose-2c"><use href="#pastoral-goose-2"/></clipPath><path id="pastoral-goose-3" d="M48 46 Q52 34 50 26 Q48 16 56 14 Q63 14 63 21 L60 24 Q56 26 57 34 Q58 42 56 48Z"/><clipPath id="pastoral-goose-3c"><use href="#pastoral-goose-3"/></clipPath></defs><ellipse cx="36" cy="72" rx="18" ry="2.4" fill="#4B3A2A" opacity=".16"/><path d="M61 72 L62 68 M64 72 L64 67 M67 72 L66 68" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M30 61 L26 70 H34Z" fill="#E8863A" stroke="currentColor" stroke-width="1.2"/><path d="M42 61 L38 70 H46Z" fill="#E8863A" stroke="currentColor" stroke-width="1.2"/><g class="pastoral-goose-motion"><path d="M15 46 L8 42 L12 50Z" fill="#FFFDF7" stroke="currentColor" stroke-width="1.4"/><use href="#pastoral-goose-1" fill="#FFFDF7"/><g clip-path="url(#pastoral-goose-1c)"><path d="M16 56 Q36 64 58 54 V64 H16Z" fill="#D6D1C6" opacity="0.8"/></g><use href="#pastoral-goose-1" fill="none" stroke="currentColor" stroke-width="2.4"/><use href="#pastoral-goose-2" fill="#FFF6E2"/><g clip-path="url(#pastoral-goose-2c)"><path d="M28 50 H40 M30 53 H38" fill="none" stroke="#EBD9B6" stroke-width="1"/></g><use href="#pastoral-goose-2" fill="none" stroke="currentColor" stroke-width="2.4"/><use href="#pastoral-goose-3" fill="#FFFDF7"/><g clip-path="url(#pastoral-goose-3c)"><path d="M58 24 Q60 34 58 48 H64 V24Z" fill="#D6D1C6" opacity="0.7"/></g><use href="#pastoral-goose-3" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M62 18 L71 21 L62 23Z" fill="#E8863A" stroke="currentColor" stroke-width="1.3"/><path d="M62.5 20.5 L68 21" fill="none" stroke="currentColor" stroke-width="0.9"/><circle cx="57" cy="18" r="1.6" fill="#3A2C22"/><circle cx="57.6" cy="17.4" r="0.6" fill="#FFFFFF"/><path d="M50 34 L45 31 L45 37Z" fill="#9CC5D6" stroke="currentColor" stroke-width="1.1"/><path d="M54 34 L59 31 L59 37Z" fill="#9CC5D6" stroke="currentColor" stroke-width="1.1"/><circle cx="52" cy="34" r="1.5" fill="#77A7BC" stroke="currentColor" stroke-width="1"/></g></svg>