<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-cheese-wheel-root" viewBox="0 0 80 80" role="img" aria-label="Cheese wedge / 奶酪" stroke-linecap="round" stroke-linejoin="round"><title>Cheese wedge / 奶酪</title><desc>A big wedge of cheese with an orange rind and holes across the cut face, a small slice already cut in front. For dairy, picnics and farmhouse food. / 带橙色外皮的大块楔形奶酪，切面布满气孔，前面还切下一小片。用于乳制品、野餐与农家美食。</desc><style>#pastoral-cheese-wheel-root,#pastoral-cheese-wheel-root g{animation-play-state:inherit}.pastoral-cheese-wheel-motion{animation:pastoral-cheese-wheel-pop 3.6s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 66px}@keyframes pastoral-cheese-wheel-pop{0%,62%,100%{transform:translateY(0) scale(1)}72%{transform:translateY(-2px) scale(1.025)}82%{transform:translateY(0) scale(.985,1.01)}90%{transform:translateY(0) scale(1.005)}}@media (prefers-reduced-motion:reduce){.pastoral-cheese-wheel-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-cheese-wheel-1" d="M10 51.4 L70 40.6 V57.4 L10 66Z"/><clipPath id="pastoral-cheese-wheel-1c"><use href="#pastoral-cheese-wheel-1"/></clipPath><path id="pastoral-cheese-wheel-2" d="M10 51.4 L53.6 27.6 L70 40.6Z"/><clipPath id="pastoral-cheese-wheel-2c"><use href="#pastoral-cheese-wheel-2"/></clipPath></defs><ellipse cx="40" cy="70" rx="30" ry="2" fill="#4B3A2A" opacity=".16"/><g class="pastoral-cheese-wheel-motion"><use href="#pastoral-cheese-wheel-1" fill="#F2C55E"/><g clip-path="url(#pastoral-cheese-wheel-1c)"><ellipse cx="22" cy="56.6" rx="3.4" ry="2.6" fill="#D9A23E" stroke="currentColor" stroke-width="1.1"/><ellipse cx="35" cy="52" rx="2.4" ry="2" fill="#D9A23E" stroke="currentColor" stroke-width="1.1"/><ellipse cx="44" cy="59" rx="3.8" ry="2.8" fill="#D9A23E" stroke="currentColor" stroke-width="1.1"/><ellipse cx="56" cy="51.6" rx="2.6" ry="2" fill="#D9A23E" stroke="currentColor" stroke-width="1.1"/><ellipse cx="31" cy="62" rx="1.8" ry="1.4" fill="#D9A23E" stroke="currentColor" stroke-width="1.1"/><path d="M10 62 L70 52 V60 L10 70Z" fill="#D9A23E" opacity="0.6"/><path d="M64.6 40 L71 39 V60 L64.6 60Z" fill="#D88A34"/></g><use href="#pastoral-cheese-wheel-1" fill="none" stroke="currentColor" stroke-width="2"/><use href="#pastoral-cheese-wheel-2" fill="#F8DC8C"/><g clip-path="url(#pastoral-cheese-wheel-2c)"><path d="M53.6 26 L72 40.6 L64 41.6 L48.6 30.4Z" fill="#D88A34"/><ellipse cx="42" cy="39.6" rx="3" ry="1.6" fill="#D9A23E" stroke="currentColor" stroke-width="1"/><ellipse cx="30" cy="45" rx="2" ry="1.2" fill="#D9A23E" stroke="currentColor" stroke-width="1"/><ellipse cx="54" cy="37" rx="1.8" ry="1" fill="#D9A23E" stroke="currentColor" stroke-width="1"/></g><use href="#pastoral-cheese-wheel-2" fill="none" stroke="currentColor" stroke-width="2"/></g><path d="M48 64 L68 60.6 L68 68.6 L48 72Z" fill="#F2C55E" stroke="currentColor" stroke-width="1.6"/><path d="M48 64 L60 57.6 L68 60.6Z" fill="#F8DC8C" stroke="currentColor" stroke-width="1.6"/><ellipse cx="56" cy="67.4" rx="1.8" ry="1.2" fill="#D9A23E" stroke="currentColor" stroke-width="1"/></svg>