<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-cow-root" viewBox="0 0 80 80" role="img" aria-label="Cow / 奶牛" stroke-linecap="round" stroke-linejoin="round"><title>Cow / 奶牛</title><desc>Front-facing spotted cow with a pink muzzle, cream horns and a forelock tuft, a golden bell on its collar, breathing softly. For pastures, dairy and cute animals. / 正面的黑白花奶牛，粉色口鼻、奶油色小角、额前一撮毛，脖子上挂着金色牛铃，轻轻呼吸。用于牧场、乳制品与可爱动物。</desc><style>#pastoral-cow-root,#pastoral-cow-root g{animation-play-state:inherit}.pastoral-cow-motion{animation:pastoral-cow-pulse 3.2s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 46px}@keyframes pastoral-cow-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}@media (prefers-reduced-motion:reduce){.pastoral-cow-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-cow-1" d="M14 75 Q15.6 60 28 57 H52 Q64.4 60 66 75Z"/><clipPath id="pastoral-cow-1c"><use href="#pastoral-cow-1"/></clipPath><path id="pastoral-cow-2" d="M26.4 30 Q26.4 17.6 40 17.6 Q53.6 17.6 53.6 30 L52.6 47 Q52 52.4 40 52.4 Q28 52.4 27.4 47Z"/><clipPath id="pastoral-cow-2c"><use href="#pastoral-cow-2"/></clipPath><ellipse id="pastoral-cow-3" cx="40" cy="50" rx="13.6" ry="9"/><clipPath id="pastoral-cow-3c"><use href="#pastoral-cow-3"/></clipPath></defs><g class="pastoral-cow-motion"><use href="#pastoral-cow-1" fill="#FFFDF7"/><g clip-path="url(#pastoral-cow-1c)"><path d="M48 52 Q62 58 64 76 H70 V52Z" fill="#EBD9B6"/><path d="M16 62 Q22 58 28 62 Q30 70 22 72 Q16 72 15 68Z" fill="#6B4A3A"/></g><use href="#pastoral-cow-1" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M28 60.4 Q40 66 52 60.4" fill="none" stroke="#CF7448" stroke-width="2.6"/><path d="M28 60.4 Q40 66 52 60.4" fill="none" stroke="currentColor" stroke-width="0.7"/><path d="M37 65.6 H43 L44.6 72 Q40 73.6 35.4 72Z" fill="#EBB23E" stroke="currentColor" stroke-width="1.4"/><circle cx="40" cy="72.6" r="1" fill="#C98E28"/><path d="M