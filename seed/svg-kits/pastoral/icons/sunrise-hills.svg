<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-sunrise-hills-root" viewBox="0 0 80 80" role="img" aria-label="Sunrise over hills / 山丘日出" stroke-linecap="round" stroke-linejoin="round"><title>Sunrise over hills / 山丘日出</title><desc>A round country vignette: the sun rising behind layered green hills and a furrowed wheat field, its rays slowly turning, with two little trees and birds in the distance. For mornings, hope and rural landscapes. / 圆形取景里的田园晨景：太阳从层层绿丘和麦田后升起，光芒缓缓旋转，远处有两棵小树和飞鸟。用于清晨、希望与田园风景。</desc><style>#pastoral-sunrise-hills-root,#pastoral-sunrise-hills-root g{animation-play-state:inherit}.pastoral-sunrise-hills-motion{animation:pastoral-sunrise-hills-spin 24s linear infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 36px}@keyframes pastoral-sunrise-hills-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.pastoral-sunrise-hills-motion{animation:none!important;transform:none!important}}</style><defs><circle id="pastoral-sunrise-hills-1" cx="40" cy="36" r="10.4"/><clipPath id="pastoral-sunrise-hills-1c"><use href="#pastoral-sunrise-hills-1"/></clipPath><clipPath id="pastoral-sunrise-hills-2"><circle cx="40" cy="40" r="33"/></clipPath></defs><path d="M8.4 31 A33 33 0 0 1 71.6 31" fill="none" stroke="#C98E28" stroke-width="1.2" opacity="0.7" stroke-dasharray="1.6 3.2"/><g class="pastoral-sunrise-hills-motion"><path d="M38.5 22.2 L40 15 L41.5 22.2Z" transform="rotate(0 40 36)" fill="#EBB23E" stroke="currentColor" stroke-width="1.1"/><path d="M38.5 22.2 L40 15 L41.5 22.2Z" transform="rotate(30 40 36)" fill="#EBB23E" stroke="currentColor" stroke-width="1.1"/><path d="M38.5 22.2 L40 15 L41.5 22.2Z" transform="rotate(60 40 36)" fill="#EBB23E" stroke="currentColor" stroke-width="1.1"/><path d="M38.5 22.2 L40 15 L41.5 22.2Z" transform="rotate(90 40 36)" fill="#EBB23E" stroke="currentColor" stroke-width="1.1"/><path d="M38.5 22.2 L40 15 L41.5 22.2Z" transform="rotate(120 40 36)" fill="#EBB23E" stroke="currentCol