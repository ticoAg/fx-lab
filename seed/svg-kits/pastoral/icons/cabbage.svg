<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-cabbage-root" viewBox="0 0 80 80" role="img" aria-label="Cabbage / 卷心菜" stroke-linecap="round" stroke-linejoin="round"><title>Cabbage / 卷心菜</title><desc>Layered green cabbage with veined outer leaves and a small snail beside it, softly breathing. For vegetable gardens, greens and healthy food. / 层层包裹的绿色卷心菜，外叶有叶脉，旁边一只小蜗牛，菜心轻轻呼吸。用于菜园、蔬菜与健康饮食。</desc><style>#pastoral-cabbage-root,#pastoral-cabbage-root g{animation-play-state:inherit}.pastoral-cabbage-motion{animation:pastoral-cabbage-pulse 3.4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 68px}@keyframes pastoral-cabbage-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}@media (prefers-reduced-motion:reduce){.pastoral-cabbage-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-cabbage-1" d="M40 28 A10.4 10.4 0 0 1 56.7 32.7 A8.9 8.9 0 0 1 65.6 44.5 A8.3 8.3 0 0 1 62.5 58 A9.7 9.7 0 0 1 48.9 66.8 A10.7 10.7 0 0 1 31.1 66.8 A9.7 9.7 0 0 1 17.5 58 A8.3 8.3 0 0 1 14.4 44.5 A8.9 8.9 0 0 1 23.3 32.7 A10.4 10.4 0 0 1 40 28Z"/><clipPath id="pastoral-cabbage-1c"><use href="#pastoral-cabbage-1"/></clipPath><path id="pastoral-cabbage-2" d="M40 30 A8.6 8.6 0 0 1 53.3 35.3 A7.4 7.4 0 0 1 56.6 47.1 A7.9 7.9 0 0 1 47.4 56.6 A8.9 8.9 0 0 1 32.6 56.6 A7.9 7.9 0 0 1 23.4 47.1 A7.4 7.4 0 0 1 26.7 35.3 A8.6 8.6 0 0 1 40 30Z"/><clipPath id="pastoral-cabbage-2c"><use href="#pastoral-cabbage-2"/></clipPath><path id="pastoral-cabbage-3" d="M30 42 Q30 30 40 30 Q50 30 50 42 Q46 48 40 48 Q34 48 30 42Z"/><clipPath id="pastoral-cabbage-3c"><use href="#pastoral-cabbage-3"/></clipPath></defs><ellipse cx="40" cy="72" rx="24" ry="2.4" fill="#4B3A2A" opacity=".16"/><g class="pastoral-cabbage-motion"><use href="#pastoral-cabbage-1" fill="#93B45A"/><g clip-path="url(#pastoral-cabbage-1c)"><path d="M40 40 Q66 44 70 70 H40Z" fill="#6F9442" opacity="0.5"/><path d="M18 52 Q28 48 34 52 M62 52 Q52 48 46 52" fill