<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-eggplant-root" viewBox="0 0 80 80" role="img" aria-label="Eggplant / 茄子" stroke-linecap="round" stroke-linejoin="round"><title>Eggplant / 茄子</title><desc>Plump purple eggplant with a green cap and curved stem next to a leaf, gently swaying. For vegetable gardens, produce and cooking. / 饱满的紫色茄子，绿色萼帽和弯茎，旁边一片叶子，轻轻摇摆。用于菜园、蔬菜与烹饪。</desc><style>#pastoral-eggplant-root,#pastoral-eggplant-root g{animation-play-state:inherit}.pastoral-eggplant-motion{animation:pastoral-eggplant-sway 4.2s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 70px}@keyframes pastoral-eggplant-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion:reduce){.pastoral-eggplant-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-eggplant-1" d="M30 30 Q24 44 26 58 Q30 72 44 70 Q60 66 58 52 Q56 40 46 32 Q40 26 30 30Z"/><clipPath id="pastoral-eggplant-1c"><use href="#pastoral-eggplant-1"/></clipPath><path id="pastoral-eggplant-2" d="M52 22 Q62 12 70 16 Q64 26 52 22Z"/><clipPath id="pastoral-eggplant-2c"><use href="#pastoral-eggplant-2"/></clipPath></defs><ellipse cx="42" cy="72" rx="14" ry="2.4" fill="#4B3A2A" opacity=".16"/><g class="pastoral-eggplant-motion"><use href="#pastoral-eggplant-1" fill="#7A4F8C"/><g clip-path="url(#pastoral-eggplant-1c)"><path d="M44 34 Q64 52 52 70 H62 V30Z" fill="#5C3A6B" opacity="0.8"/></g><use href="#pastoral-eggplant-1" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M30 44 Q30 36 34 34" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.55"/><path d="M24 30 Q30 22 38 24 Q42 28 48 30 Q40 32 36 38 Q34 32 24 30Z" fill="#93B45A" stroke="currentColor" stroke-width="1.4"/><path d="M33 24 Q31 16 34 10" fill="none" stroke="currentColor" stroke-width="4.6"/><path d="M33 24 Q31 16 34 10" fill="none" stroke="#6F9442" stroke-width="2"/></g><use href="#pastoral-eggplant-2" fill="#93B45A"/><g clip-path="url(#pastoral-eggplant-2c)"><path d="M54 21 Q62 18 68 16" fill="none" stroke="#6F9442" stroke-width="0.9"/></g><use href="#pastoral-eggplant-2" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>