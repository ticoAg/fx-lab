<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-goat-root" viewBox="0 0 80 80" role="img" aria-label="Goat / 山羊" stroke-linecap="round" stroke-linejoin="round"><title>Goat / 山羊</title><desc>White goat with curved grey horns, a little beard and a golden neck bell, standing side-on in the grass while its head gently sways. For pastures, hillsides and cute animals. / 白色山羊，弯弯的灰角、小胡子和颈下金铃，正侧身站在草地上，头部轻轻摆动。用于牧场、山野与可爱动物。</desc><style>#pastoral-goat-root,#pastoral-goat-root g{animation-play-state:inherit}.pastoral-goat-motion{animation:pastoral-goat-sway 4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:60px 44px}@keyframes pastoral-goat-sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@media (prefers-reduced-motion:reduce){.pastoral-goat-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-goat-1" d="M22 46 Q22 38 32 38 H52 Q60 38 60 46 V54 Q60 58 54 58 H28 Q22 58 22 54Z"/><clipPath id="pastoral-goat-1c"><use href="#pastoral-goat-1"/></clipPath><path id="pastoral-goat-2" d="M52 30 Q52 22 60 22 Q66 22 67 30 L67 38 Q67 44 61 44 Q55 44 55 38Z"/><clipPath id="pastoral-goat-2c"><use href="#pastoral-goat-2"/></clipPath></defs><ellipse cx="41" cy="72" rx="20" ry="2.4" fill="#4B3A2A" opacity=".16"/><path d="M11 72 L12 68 M14 72 L14 67 M17 72 L16 68" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M27 57 V70" fill="none" stroke="currentColor" stroke-width="5"/><path d="M27 57 V70" fill="none" stroke="#EBD9B6" stroke-width="2.4"/><path d="M33 57 V70" fill="none" stroke="currentColor" stroke-width="5"/><path d="M33 57 V70" fill="none" stroke="#EBD9B6" stroke-width="2.4"/><path d="M49 57 V70" fill="none" stroke="currentColor" stroke-width="5"/><path d="M49 57 V70" fill="none" stroke="#EBD9B6" stroke-width="2.4"/><path d="M55 57 V70" fill="none" stroke="currentColor" stroke-width="5"/><path d="M55 57 V70" fill="none" stroke="#EBD9B6" stroke-width="2.4"/><path d="M25 69 H2