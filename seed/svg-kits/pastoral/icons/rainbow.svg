<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-rainbow-root" viewBox="0 0 80 80" role="img" aria-label="Rainbow / 彩虹" stroke-linecap="round" stroke-linejoin="round"><title>Rainbow / 彩虹</title><desc>Five-color rainbow rising between two white clouds, gently breathing. For clearing skies after rain, weather and good moods. / 五色彩虹从两朵白云间升起，彩虹轻轻呼吸。用于雨后天晴、天气与好心情。</desc><style>#pastoral-rainbow-root,#pastoral-rainbow-root g{animation-play-state:inherit}.pastoral-rainbow-motion{animation:pastoral-rainbow-pulse 3.6s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 60px}@keyframes pastoral-rainbow-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}@media (prefers-reduced-motion:reduce){.pastoral-rainbow-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-rainbow-1" d="M16 56 A5 5 0 0 1 23.8 59 A3.6 3.6 0 0 1 23.8 65 A5 5 0 0 1 16 68 A5 5 0 0 1 8.2 65 A3.6 3.6 0 0 1 8.2 59 A5 5 0 0 1 16 56Z"/><clipPath id="pastoral-rainbow-1c"><use href="#pastoral-rainbow-1"/></clipPath><path id="pastoral-rainbow-2" d="M64 56 A5 5 0 0 1 71.8 59 A3.6 3.6 0 0 1 71.8 65 A5 5 0 0 1 64 68 A5 5 0 0 1 56.2 65 A3.6 3.6 0 0 1 56.2 59 A5 5 0 0 1 64 56Z"/><clipPath id="pastoral-rainbow-2c"><use href="#pastoral-rainbow-2"/></clipPath></defs><g class="pastoral-rainbow-motion"><path d="M10 60 A30 30 0 0 1 70 60" fill="none" stroke="currentColor" stroke-width="6.4"/><path d="M10 60 A30 30 0 0 1 70 60" fill="none" stroke="#BF5340" stroke-width="4.4"/><path d="M15 60 A25 25 0 0 1 65 60" fill="none" stroke="currentColor" stroke-width="6.4"/><path d="M15 60 A25 25 0 0 1 65 60" fill="none" stroke="#E8863A" stroke-width="4.4"/><path d="M20 60 A20 20 0 0 1 60 60" fill="none" stroke="currentColor" stroke-width="6.4"/><path d="M20 60 A20 20 0 0 1 60 60" fill="none" stroke="#EBB23E" stroke-width="4.4"/><path d="M25 60 A15 15 0 0 1 55 60" fill="none" stroke="currentColor" stroke-width="6.4"/><path d="M25 60 A15 15 0 0 1 55 60" fill="none" stroke="#93B45A" stroke-width="4.4"/><path d="M30 60 A10 10 0 0 1 50 60" fill="none" stroke="currentColor" stroke-width="6.4"/><path d="M30 60 A10 10 0 0 1 50 60" fill="none" stroke="#9CC5D6" stroke-width="4.4"/></g><use href="#pastoral-rainbow-1" fill="#FFFDF7"/><g clip-path="url(#pastoral-rainbow-1c)"><path d="M4 64 H26 V70 H4Z" fill="#D6D1C6" opacity="0.8"/></g><use href="#pastoral-rainbow-1" fill="none" stroke="currentColor" stroke-width="2.4"/><use href="#pastoral-rainbow-2" fill="#FFFDF7"/><g clip-path="url(#pastoral-rainbow-2c)"><path d="M54 64 H76 V70 H54Z" fill="#D6D1C6" opacity="0.8"/></g><use href="#pastoral-rainbow-2" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>