<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-silo-root" viewBox="0 0 80 80" role="img" aria-label="Silo / 筒仓" stroke-linecap="round" stroke-linejoin="round"><title>Silo / 筒仓</title><desc>Grey grain silo with a red dome and side ladder next to a small red shed, a little bird drifting in the sky. For grain storage, farms and rural skylines. / 灰色圆筒粮仓，红色圆顶和侧面铁梯，旁边一间红色小棚屋，天上一只小鸟轻轻飞过。用于粮食储存、农场与乡村天际线。</desc><style>#pastoral-silo-root,#pastoral-silo-root g{animation-play-state:inherit}.pastoral-silo-motion{animation:pastoral-silo-float 3s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:22px 20px}@keyframes pastoral-silo-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.4px)}}@media (prefers-reduced-motion:reduce){.pastoral-silo-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-silo-1" d="M30 24 H50 V70 H30Z"/><clipPath id="pastoral-silo-1c"><use href="#pastoral-silo-1"/></clipPath><path id="pastoral-silo-2" d="M28 25 Q28 8 40 8 Q52 8 52 25Z"/><clipPath id="pastoral-silo-2c"><use href="#pastoral-silo-2"/></clipPath><path id="pastoral-silo-3" d="M50 48 H70 V70 H50Z"/><clipPath id="pastoral-silo-3c"><use href="#pastoral-silo-3"/></clipPath></defs><ellipse cx="48" cy="72" rx="24" ry="2.4" fill="#4B3A2A" opacity=".16"/><path d="M17 72 L18 68 M20 72 L20 67 M23 72 L22 68" fill="none" stroke="currentColor" stroke-width="1.3"/><use href="#pastoral-silo-1" fill="#D6D1C6"/><g clip-path="url(#pastoral-silo-1c)"><path d="M44 24 H52 V70 H44Z" fill="#AFA799" opacity="0.8"/><path d="M30 32 H50 M30 42 H50 M30 52 H50 M30 62 H50" fill="none" stroke="#AFA799" stroke-width="1"/></g><use href="#pastoral-silo-1" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M34 26 V70 M38 26 V70" fill="none" stroke="currentColor" stroke-width="1"/><path d="M34 30 H38" fill="none" stroke="currentColor" stroke-width="0.9"/><path d="M34 35 H38" fill="none" stroke="currentColor" stroke-width="0.