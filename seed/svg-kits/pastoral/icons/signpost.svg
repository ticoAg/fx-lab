<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-signpost-root" viewBox="0 0 80 80" role="img" aria-label="Signpost / 路标" stroke-linecap="round" stroke-linejoin="round"><title>Signpost / 路标</title><desc>Wooden post with two signboards pointing opposite ways and a green vine curling at its base, gently swaying. For country lanes, directions and travel. / 木杆上两块指向相反方向的木牌，杆底缠着一根绿藤，路标轻轻摆动。用于乡间小路、方向与旅行。</desc><style>#pastoral-signpost-root,#pastoral-signpost-root g{animation-play-state:inherit}.pastoral-signpost-motion{animation:pastoral-signpost-sway 4.4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 72px}@keyframes pastoral-signpost-sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}@media (prefers-reduced-motion:reduce){.pastoral-signpost-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-signpost-1" d="M14 20 H54 L62 26 L54 32 H14Z"/><clipPath id="pastoral-signpost-1c"><use href="#pastoral-signpost-1"/></clipPath><path id="pastoral-signpost-2" d="M66 38 H26 L18 44 L26 50 H66Z"/><clipPath id="pastoral-signpost-2c"><use href="#pastoral-signpost-2"/></clipPath></defs><ellipse cx="40" cy="72" rx="14" ry="2.4" fill="#4B3A2A" opacity=".16"/><path d="M23 72 L24 68 M26 72 L26 67 M29 72 L28 68" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M51 72 L52 68 M54 72 L54 67 M57 72 L56 68" fill="none" stroke="currentColor" stroke-width="1.3"/><g class="pastoral-signpost-motion"><path d="M40 12 V72" fill="none" stroke="currentColor" stroke-width="5.6"/><path d="M40 12 V72" fill="none" stroke="#B88352" stroke-width="3"/><use href="#pastoral-signpost-1" fill="#EDCB7A"/><g clip-path="url(#pastoral-signpost-1c)"><path d="M18 26 H50" fill="none" stroke="#D3A752" stroke-width="1" opacity="0.8"/></g><use href="#pastoral-signpost-1" fill="none" stroke="currentColor" stroke-width="2.4"/><use href="#pastoral-signpost-2" fill="#93B45A"/><g clip-path="url(#pastoral-signpost-2c)"><path d="M30 44 H62" fill="none" stroke="#6F9442" stroke-width="1" opacity="0.8"/></g><use href="#pastoral-signpost-2" fill="none" stroke="currentColor" stroke-width="2.4"/></g><path d="M40 72 Q36 66 40 60 Q44 54 40 50" fill="none" stroke="currentColor" stroke-width="1.1"/><ellipse cx="37" cy="63" rx="2.6" ry="1.4" fill="#93B45A" stroke="currentColor" stroke-width="1" transform="rotate(30 37 63)"/><ellipse cx="43" cy="55" rx="2.6" ry="1.4" fill="#93B45A" stroke="currentColor" stroke-width="1" transform="rotate(-30 43 55)"/></svg>