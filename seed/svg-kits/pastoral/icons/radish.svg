<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-radish-root" viewBox="0 0 80 80" role="img" aria-label="Radish / 小红萝卜" stroke-linecap="round" stroke-linejoin="round"><title>Radish / 小红萝卜</title><desc>Round rose-red radish with a white tip and thin root under three green leaves, gently swaying. For vegetable gardens, produce and salads. / 圆润的玫红小萝卜，白色尖底和细根，顶着三片绿叶，轻轻摇摆。用于菜园、蔬菜与沙拉。</desc><style>#pastoral-radish-root,#pastoral-radish-root g{animation-play-state:inherit}.pastoral-radish-motion{animation:pastoral-radish-sway 4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 32px}@keyframes pastoral-radish-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion:reduce){.pastoral-radish-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-radish-1" d="M40 70 Q38 62 30 56 Q22 48 26 38 Q32 30 40 32 Q48 30 54 38 Q58 48 50 56 Q42 62 40 70Z"/><clipPath id="pastoral-radish-1c"><use href="#pastoral-radish-1"/></clipPath><path id="pastoral-radish-2" d="M38 34 Q26 26 24 12 Q34 16 40 30Z"/><clipPath id="pastoral-radish-2c"><use href="#pastoral-radish-2"/></clipPath><path id="pastoral-radish-3" d="M42 34 Q54 26 58 12 Q46 16 40 30Z"/><clipPath id="pastoral-radish-3c"><use href="#pastoral-radish-3"/></clipPath><path id="pastoral-radish-4" d="M40 32 Q36 20 40 8 Q44 20 40 32Z"/></defs><g class="pastoral-radish-motion"><use href="#pastoral-radish-2" fill="#93B45A"/><g clip-path="url(#pastoral-radish-2c)"><path d="M27 15 Q33 22 38 32" fill="none" stroke="#6F9442" stroke-width="0.9"/></g><use href="#pastoral-radish-2" fill="none" stroke="currentColor" stroke-width="2.4"/><use href="#pastoral-radish-3" fill="#93B45A"/><g clip-path="url(#pastoral-radish-3c)"><path d="M55 15 Q48 22 42 32" fill="none" stroke="#6F9442" stroke-width="0.9"/></g><use href="#pastoral-radish-3" fill="none" stroke="currentColor" stroke-width="2.4"/><use href="#pastoral-radish-4" fill="#6F9442"/><use href="#pastoral-radish-4" fill="none" stroke="currentColor" stroke-width="2.4"/><use href="#pastoral-radish-1" fill="#D9566E"/><g clip-path="url(#pastoral-radish-1c)"><path d="M44 32 Q62 44 46 62 Q44 50 44 32Z" fill="#B03E57" opacity="0.7"/><path d="M30 52 Q40 60 50 52 L46 62 H34Z" fill="#FFFDF7" opacity="0.9"/></g><use href="#pastoral-radish-1" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M40 70 Q41 73 39 75" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M30 42 Q31 37 35 36" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.6"/></g></svg>