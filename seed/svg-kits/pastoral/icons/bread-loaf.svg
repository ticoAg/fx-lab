<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-bread-loaf-root" viewBox="0 0 80 80" role="img" aria-label="Country loaf / 乡村面包" stroke-linecap="round" stroke-linejoin="round"><title>Country loaf / 乡村面包</title><desc>Golden country loaf with four scored cuts showing pale crumb and a dusting of flour, resting on a wooden board with a hanging hole and a small wheat sprig. For baking, breakfast and home cooking. / 烤得金黄的乡村面包，四道割口露出浅色内里，表面撒着面粉，放在带挂孔的木砧板上，旁边一小枝麦穗。用于烘焙、早餐与家常饭食。</desc><style>#pastoral-bread-loaf-root,#pastoral-bread-loaf-root g{animation-play-state:inherit}.pastoral-bread-loaf-motion{animation:pastoral-bread-loaf-float 3.4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 50px}@keyframes pastoral-bread-loaf-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.8px)}}@media (prefers-reduced-motion:reduce){.pastoral-bread-loaf-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-bread-loaf-1" d="M8 59 H60 Q62 56 66 56 Q72.6 56 72.6 62 Q72.6 68 66 68 Q62 68 60 65 H8 Q5.6 65 5.6 62 Q5.6 59 8 59Z"/><clipPath id="pastoral-bread-loaf-1c"><use href="#pastoral-bread-loaf-1"/></clipPath><path id="pastoral-bread-loaf-2" d="M12 50 C12 36 25 30.6 40 30.6 C55 30.6 66 36 66 50 C66 57 58 59.6 39 59.6 C20 59.6 12 57 12 50Z"/><clipPath id="pastoral-bread-loaf-2c"><use href="#pastoral-bread-loaf-2"/></clipPath></defs><ellipse cx="39" cy="70" rx="30" ry="1.6" fill="#4B3A2A" opacity=".16"/><g class="pastoral-bread-loaf-motion"><use href="#pastoral-bread-loaf-1" fill="#B88352"/><g clip-path="url(#pastoral-bread-loaf-1c)"><path d="M4 63 H74 V70 H4Z" fill="#93633A"/><path d="M14 61.4 H40 M44 62.6 H56" fill="none" stroke="#93633A" stroke-width="0.9"/></g><use href="#pastoral-bread-loaf-1" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="66.4" cy="62" r="2" fill="none" stroke="currentColor" stroke-width="1.4"/><use href="#pastoral-bread-loaf-2" fill="#D99551"/><g clip-p