<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Barn owl / 仓鸮"><title>Barn owl / 仓鸮</title><desc>Tawny barn owl with a pale heart-shaped face perched on a branch, its dark eyes softly pulsing. For night, wisdom and quiet watch. / 黄褐色仓鸮，浅色心形脸盘，栖在枝头，黑眼睛柔和闪动。用于夜晚、智慧与静静守望。</desc><style>.pastoral-pulse{animation:pastoral-pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pastoral-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.85;transform:scale(1.06)}}@media (prefers-reduced-motion:reduce){.pastoral-float,.pastoral-sway,.pastoral-spin,.pastoral-pulse,.pastoral-pop,.pastoral-drip{animation:none!important}}</style><path d="M24 64 Q15 40 27 24 Q40 14 53 24 Q65 40 56 64Z" fill="#D9B58A" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 30 Q30 21 27 33 Q29 49 40 53 Q51 49 53 33 Q50 21 40 30Z" fill="#FFFDF6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g class="pastoral-pulse" fill="currentColor"><circle cx="34" cy="38" r="3.2"/><circle cx="46" cy="38" r="3.2"/></g><path d="M40 42 L38 46 L40 48 L42 46Z" fill="#C4A35A" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 56 Q34 60 38 56 M42 56 Q46 60 50 56" fill="none" stroke="#A67C52" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 66 H70 M58 66 L64 60" fill="none" stroke="#8B5E3C" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M35 63 V67 M45 63 V67" fill="none" stroke="#C4A35A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
