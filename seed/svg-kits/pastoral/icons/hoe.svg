<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-hoe-root" viewBox="0 0 80 80" role="img" aria-label="Hoe / 锄头" stroke-linecap="round" stroke-linejoin="round"><title>Hoe / 锄头</title><desc>Wooden hoe loosening soil where two sprouts poke up from the row, the hoe gently swinging. For hoeing, planting and farm tools. / 木柄锄头正在松土，土垄上冒出两棵嫩芽，锄头轻轻摆动。用于锄地、播种与农具。</desc><style>#pastoral-hoe-root,#pastoral-hoe-root g{animation-play-state:inherit}.pastoral-hoe-motion{animation:pastoral-hoe-sway 3.6s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:56px 66px}@keyframes pastoral-hoe-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion:reduce){.pastoral-hoe-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-hoe-1" d="M48 54 L64 50 L66 64 L54 66Z"/><clipPath id="pastoral-hoe-1c"><use href="#pastoral-hoe-1"/></clipPath><path id="pastoral-hoe-2" d="M10 72 Q16 64 26 66 Q34 62 42 66 Q50 62 58 68 Q66 66 70 72Z"/></defs><use href="#pastoral-hoe-2" fill="#93633A"/><use href="#pastoral-hoe-2" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M20 66 V60" fill="none" stroke="currentColor" stroke-width="3.8"/><path d="M20 66 V60" fill="none" stroke="#93B45A" stroke-width="1.2"/><ellipse cx="17.6" cy="59.4" rx="2.4" ry="1.2" fill="#93B45A" stroke="currentColor" stroke-width="1" transform="rotate(25 17.6 59.4)"/><ellipse cx="22.4" cy="59.4" rx="2.4" ry="1.2" fill="#93B45A" stroke="currentColor" stroke-width="1" transform="rotate(-25 22.4 59.4)"/><path d="M34 66 V60" fill="none" stroke="currentColor" stroke-width="3.8"/><path d="M34 66 V60" fill="none" stroke="#93B45A" stroke-width="1.2"/><ellipse cx="31.6" cy="59.4" rx="2.4" ry="1.2" fill="#93B45A" stroke="currentColor" stroke-width="1" transform="rotate(25 31.6 59.4)"/><ellipse cx="36.4" cy="59.4" rx="2.4" ry="1.2" fill="#93B45A" stroke="currentColor" stroke-width="1" transform="rotate(-25 36.4 59.4)"/><g 