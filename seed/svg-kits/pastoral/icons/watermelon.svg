<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-watermelon-root" viewBox="0 0 80 80" role="img" aria-label="Watermelon / 西瓜" stroke-linecap="round" stroke-linejoin="round"><title>Watermelon / 西瓜</title><desc>Half-cut watermelon with red flesh, black seeds and a pale green rind next to a whole striped melon, the slice giving a hop. For summer, cooling off and fruit. / 切开的半个西瓜，红瓤黑籽、浅绿瓜皮，旁边一个条纹整瓜，切片轻轻一跳。用于夏天、解暑与水果。</desc><style>#pastoral-watermelon-root,#pastoral-watermelon-root g{animation-play-state:inherit}.pastoral-watermelon-motion{animation:pastoral-watermelon-pop 3.4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:34px 66px}@keyframes pastoral-watermelon-pop{0%,62%,100%{transform:translateY(0) scale(1)}72%{transform:translateY(-2px) scale(1.025)}82%{transform:translateY(0) scale(.985,1.01)}90%{transform:translateY(0) scale(1.005)}}@media (prefers-reduced-motion:reduce){.pastoral-watermelon-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-watermelon-1" d="M8 34 H72 Q72 66 40 66 Q8 66 8 34Z"/><clipPath id="pastoral-watermelon-1c"><use href="#pastoral-watermelon-1"/></clipPath><path id="pastoral-watermelon-2" d="M12 34 H68 Q66 56 40 56 Q14 56 12 34Z"/><clipPath id="pastoral-watermelon-2c"><use href="#pastoral-watermelon-2"/></clipPath><path id="pastoral-watermelon-3" d="M48 64 Q48 50 62 50 Q74 52 74 62 Q74 70 62 70 Q50 70 48 64Z"/><clipPath id="pastoral-watermelon-3c"><use href="#pastoral-watermelon-3"/></clipPath></defs><ellipse cx="40" cy="72" rx="28" ry="2.4" fill="#4B3A2A" opacity=".16"/><g class="pastoral-watermelon-motion"><use href="#pastoral-watermelon-1" fill="#557A35"/><g clip-path="url(#pastoral-watermelon-1c)"><path d="M8 34 H72 Q70 58 40 60 Q10 58 8 34Z" fill="#E9F0C8"/></g><use href="#pastoral-watermelon-1" fill="none" stroke="currentColor" stroke-width="2.4"/><use href="#pastoral-watermelon-2" fill="#E8636A"/><g clip-path="url(#pastoral-watermelon-2c)"><path d="