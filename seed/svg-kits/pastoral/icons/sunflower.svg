<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Sunflower / 向日葵"><title>Sunflower / 向日葵</title><desc>Golden sunflower with a seeded brown center on a tall leafy stem, nodding side to side. For summer, sunshine and happiness. / 金黄向日葵配褐色花盘，长在带叶的高茎上左右点头。用于夏天、阳光与快乐。</desc><style>.pastoral-sway{animation:pastoral-sway 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes pastoral-sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@media (prefers-reduced-motion:reduce){.pastoral-float,.pastoral-sway,.pastoral-spin,.pastoral-pulse,.pastoral-pop,.pastoral-drip{animation:none!important}}</style><g class="pastoral-sway"><path d="M40 72 V42" fill="none" stroke="#6B8F3C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 60 Q28 52 24 58 Q32 64 40 60Z M40 54 Q52 46 56 52 Q48 58 40 54Z" fill="#A9C47F" stroke="#6B8F3C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="40" cy="17" rx="3.6" ry="7" transform="rotate(0 40 28)" fill="#E9B949" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="40" cy="17" rx="3.6" ry="7" transform="rotate(30 40 28)" fill="#E9B949" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="40" cy="17" rx="3.6" ry="7" transform="rotate(60 40 28)" fill="#E9B949" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="40" cy="17" rx="3.6" ry="7" transform="rotate(90 40 28)" fill="#E9B949" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="40" cy="17" rx="3.6" ry="7" transform="rotate(120 40 28)" fill="#E9B949" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="40" cy="17" rx="3.6" ry="7" transform="rotate(150 40 28)" fill="#E9B949" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="40" cy="17" rx="3.6" ry="7" transform="rotate(180 40 28)" fill="#E9B949" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="40" cy="17" rx="3.6" ry="7" transform="rotate(210 40 28)" fill="#E9B949" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="40" cy="17" rx="3.6" ry="7" transform="rotate(240 40 28)" fill="#E9B949" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="40" cy="17" rx="3.6" ry="7" transform="rotate(270 40 28)" fill="#E9B949" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="40" cy="17" rx="3.6" ry="7" transform="rotate(300 40 28)" fill="#E9B949" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="40" cy="17" rx="3.6" ry="7" transform="rotate(330 40 28)" fill="#E9B949" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="40" cy="28" r="8" fill="#8B5E3C" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g fill="#FFFDF6" opacity=".7"><circle cx="37" cy="26" r="1"/><circle cx="42" cy="25" r="1"/><circle cx="40" cy="30" r="1"/><circle cx="44" cy="30" r="1"/><circle cx="36" cy="31" r="1"/></g></g></svg>
