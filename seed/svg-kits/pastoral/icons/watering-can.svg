<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Watering can / 洒水壶"><title>Watering can / 洒水壶</title><desc>Leaf-green watering can with an arched handle and a long spout, drops falling from the rose. For gardening, care and growth. / 叶绿色洒水壶，拱形提手配长壶嘴，水滴从喷头落下。用于园艺、照料与成长。</desc><style>.pastoral-float{animation:pastoral-float 3s ease-in-out infinite}@keyframes pastoral-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes pastoral-drip{0%{transform:translateY(-4px);opacity:0}30%{opacity:1}100%{transform:translateY(8px);opacity:0}}.pastoral-drip{animation:pastoral-drip 1.6s ease-in infinite}.pastoral-drip:nth-child(2){animation-delay:.5s}.pastoral-drip:nth-child(3){animation-delay:1s}@media (prefers-reduced-motion:reduce){.pastoral-float,.pastoral-sway,.pastoral-spin,.pastoral-pulse,.pastoral-pop,.pastoral-drip{animation:none!important}}</style><g class="pastoral-float"><path d="M20 34 H48 V62 Q48 67 43 67 H25 Q20 67 20 62Z" fill="#A9C47F" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 34 Q34 16 44 34" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M48 52 L63 34" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M60 30 L68 38" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 44 H44" fill="none" stroke="#6B8F3C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><g fill="#8DB6C9"><circle class="pastoral-drip" cx="66" cy="46" r="2"/><circle class="pastoral-drip" cx="70" cy="44" r="1.8"/><circle class="pastoral-drip" cx="62" cy="47" r="1.8"/></g></g></svg>
