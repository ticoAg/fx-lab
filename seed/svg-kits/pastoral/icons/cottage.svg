<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Cottage / 乡间小屋"><title>Cottage / 乡间小屋</title><desc>Cozy cream cottage with a terracotta roof, a round-top door and a chimney puffing soft smoke. For home, comfort and village life. / 温馨的奶油色小屋，陶土色屋顶、圆顶木门，烟囱冒出缕缕轻烟。用于家园、舒适与乡村生活。</desc><style>.pastoral-float{animation:pastoral-float 3s ease-in-out infinite}@keyframes pastoral-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@media (prefers-reduced-motion:reduce){.pastoral-float,.pastoral-sway,.pastoral-spin,.pastoral-pulse,.pastoral-pop,.pastoral-drip{animation:none!important}}</style><g class="pastoral-float" fill="#EFE7DA" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="56" cy="13" r="3"/><circle cx="61" cy="8" r="2.4"/></g><rect x="50" y="18" width="8" height="14" fill="#8B5E3C" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="18" y="38" width="44" height="32" fill="#FFFDF6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 40 L40 18 L68 40Z" fill="#C4784A" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M34 70 V56 Q40 50 46 56 V70" fill="#A67C52" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="22" y="46" width="9" height="9" fill="#8DB6C9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="49" y="46" width="9" height="9" fill="#8DB6C9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 70 H72" fill="none" stroke="#6B8F3C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
