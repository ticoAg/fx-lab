<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-sickle-root" viewBox="0 0 80 80" role="img" aria-label="Sickle / 镰刀" stroke-linecap="round" stroke-linejoin="round"><title>Sickle / 镰刀</title><desc>Crescent sickle with a wooden handle beside a bundle of wheat tied with red string, the sickle gently swinging. For reaping, autumn harvest and farm tools. / 木柄弯月镰刀，旁边一束用红绳扎好的麦穗，镰刀轻轻摆动。用于割麦、秋收与农具。</desc><style>#pastoral-sickle-root,#pastoral-sickle-root g{animation-play-state:inherit}.pastoral-sickle-motion{animation:pastoral-sickle-sway 4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:48px 66px}@keyframes pastoral-sickle-sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@media (prefers-reduced-motion:reduce){.pastoral-sickle-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-sickle-1" d="M30 50 Q16 40 22 22 Q30 8 48 10 Q36 14 32 24 Q28 36 36 46Z"/><clipPath id="pastoral-sickle-1c"><use href="#pastoral-sickle-1"/></clipPath></defs><ellipse cx="50" cy="72" rx="20" ry="2.4" fill="#4B3A2A" opacity=".16"/><path d="M54 72 Q54 56 52 44" fill="none" stroke="currentColor" stroke-width="3.6"/><path d="M54 72 Q54 56 52 44" fill="none" stroke="#EDCB7A" stroke-width="1"/><ellipse cx="52" cy="41" rx="2" ry="4.2" fill="#EDCB7A" stroke="currentColor" stroke-width="1" transform="rotate(-16 52 41)"/><path d="M60 72 Q60 56 60 44" fill="none" stroke="currentColor" stroke-width="3.6"/><path d="M60 72 Q60 56 60 44" fill="none" stroke="#EDCB7A" stroke-width="1"/><ellipse cx="60" cy="41" rx="2" ry="4.2" fill="#EDCB7A" stroke="currentColor" stroke-width="1"/><path d="M66 72 Q66 56 68 44" fill="none" stroke="currentColor" stroke-width="3.6"/><path d="M66 72 Q66 56 68 44" fill="none" stroke="#EDCB7A" stroke-width="1"/><ellipse cx="68" cy="41" rx="2" ry="4.2" fill="#EDCB7A" stroke="currentColor" stroke-width="1" transform="rotate(16 68 41)"/><path d="M53 62 Q60 65 67 62" fill="none" stroke="currentColor" stroke-width="3.8"/><path d="M53 62 Q60 65 67 62" fill="none" stroke="#BF5340" stroke-width="1.2"/><g class="pastoral-sickle-motion"><use href="#pastoral-sickle-1" fill="#D6D1C6"/><g clip-path="url(#pastoral-sickle-1c)"><path d="M22 22 Q30 8 48 10 Q36 14 32 24Z" fill="#F2F0EA" opacity="0.9"/><path d="M26 38 Q22 28 28 18" fill="none" stroke="#AFA799" stroke-width="0.9"/></g><use href="#pastoral-sickle-1" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M32 48 L48 66" fill="none" stroke="currentColor" stroke-width="5.6"/><path d="M32 48 L48 66" fill="none" stroke="#B88352" stroke-width="3"/><path d="M38 52 L42 56" fill="none" stroke="currentColor" stroke-width="1"/></g></svg>