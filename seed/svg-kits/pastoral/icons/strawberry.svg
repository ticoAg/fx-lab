<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-strawberry-root" viewBox="0 0 80 80" role="img" aria-label="Strawberry / 草莓" stroke-linecap="round" stroke-linejoin="round"><title>Strawberry / 草莓</title><desc>Red strawberry dotted with pale seeds, a green calyx and stem, with a small white blossom beside it, gently swaying. For spring and summer fruit, picking and desserts. / 红草莓上点缀浅色籽粒，顶着绿色萼片和小茎，旁边开一朵白色小花，轻轻摇摆。用于春夏水果、采摘与甜点。</desc><style>#pastoral-strawberry-root,#pastoral-strawberry-root g{animation-play-state:inherit}.pastoral-strawberry-motion{animation:pastoral-strawberry-sway 4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 70px}@keyframes pastoral-strawberry-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion:reduce){.pastoral-strawberry-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-strawberry-1" d="M40 70 Q20 56 20 40 Q20 28 32 28 Q36 30 40 30 Q44 30 48 28 Q60 28 60 40 Q60 56 40 70Z"/><clipPath id="pastoral-strawberry-1c"><use href="#pastoral-strawberry-1"/></clipPath></defs><ellipse cx="40" cy="72" rx="12" ry="2.4" fill="#4B3A2A" opacity=".16"/><g class="pastoral-strawberry-motion"><use href="#pastoral-strawberry-1" fill="#BF5340"/><g clip-path="url(#pastoral-strawberry-1c)"><path d="M46 30 Q64 40 50 66 L40 72 V30Z" fill="#97402F" opacity="0.45"/><ellipse cx="28" cy="38" rx="0.9" ry="1.4" fill="#F8E2A6"/><ellipse cx="36" cy="40" rx="0.9" ry="1.4" fill="#F8E2A6"/><ellipse cx="44" cy="40" rx="0.9" ry="1.4" fill="#F8E2A6"/><ellipse cx="52" cy="38" rx="0.9" ry="1.4" fill="#F8E2A6"/><ellipse cx="30" cy="48" rx="0.9" ry="1.4" fill="#F8E2A6"/><ellipse cx="38" cy="50" rx="0.9" ry="1.4" fill="#F8E2A6"/><ellipse cx="46" cy="50" rx="0.9" ry="1.4" fill="#F8E2A6"/><ellipse cx="54" cy="46" rx="0.9" ry="1.4" fill="#F8E2A6"/><ellipse cx="34" cy="58" rx="0.9" ry="1.4" fill="#F8E2A6"/><ellipse cx="42" cy="60" rx="0.9" ry="1.4" fill="#F8