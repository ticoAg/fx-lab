<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-rooster-root" viewBox="0 0 80 80" role="img" aria-label="Rooster / 公鸡" stroke-linecap="round" stroke-linejoin="round"><title>Rooster / 公鸡</title><desc>Proud rooster with a red comb and wattle, golden neck feathers, an orange wing and long dark green tail plumes, its head and neck swaying. For dawn, wake-up calls and farmyards. / 昂首的公鸡，红色鸡冠和肉垂、金色颈羽、橙色翅膀和墨绿长尾羽，头颈轻轻摆动。用于清晨、报晓与农家院落。</desc><style>#pastoral-rooster-root,#pastoral-rooster-root g{animation-play-state:inherit}.pastoral-rooster-motion{animation:pastoral-rooster-sway 3.6s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:54px 44px}@keyframes pastoral-rooster-sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@media (prefers-reduced-motion:reduce){.pastoral-rooster-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-rooster-1" d="M30 40 Q16 30 18 14 Q24 22 28 22 Q22 30 34 34Z"/><clipPath id="pastoral-rooster-1c"><use href="#pastoral-rooster-1"/></clipPath><path id="pastoral-rooster-2" d="M26 40 Q28 58 44 60 Q60 58 60 42 Q60 34 54 30 L50 40Z"/><clipPath id="pastoral-rooster-2c"><use href="#pastoral-rooster-2"/></clipPath><path id="pastoral-rooster-3" d="M34 44 Q40 38 50 44 Q46 54 36 52Z"/><clipPath id="pastoral-rooster-3c"><use href="#pastoral-rooster-3"/></clipPath><path id="pastoral-rooster-4" d="M48 42 Q46 30 50 22 Q54 16 60 18 Q64 22 62 30 Q60 38 58 44Z"/><clipPath id="pastoral-rooster-4c"><use href="#pastoral-rooster-4"/></clipPath></defs><ellipse cx="43" cy="72" rx="16" ry="2.4" fill="#4B3A2A" opacity=".16"/><path d="M40 59 V70 M48 59 V70" fill="none" stroke="currentColor" stroke-width="4.4"/><path d="M40 59 V70 M48 59 V70" fill="none" stroke="#EBB23E" stroke-width="1.8"/><path d="M36 71 H43 M44 71 H51" fill="none" stroke="currentColor" stroke-width="1.6"/><use href="#pastoral-rooster-1" fill="#557A35"/><g clip-path="url(#pastoral-rooster-1c)"><path d="M20 18 Q22 28 30 34" fill="none" stroke="#93B45A" stroke-width="1"/></g><use href="#pastoral-rooster-1" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M30 40 Q14 40 10 26 Q20 32 30 34Z" fill="#3E6B5A" stroke="currentColor" stroke-width="1.4"/><use href="#pastoral-rooster-2" fill="#BF5340"/><g clip-path="url(#pastoral-rooster-2c)"><path d="M30 52 Q44 64 60 50 V62 H30Z" fill="#97402F" opacity="0.8"/><path d="M36 44 Q42 48 48 44 M38 49 Q44 53 50 49" fill="none" stroke="#97402F" stroke-width="1"/></g><use href="#pastoral-rooster-2" fill="none" stroke="currentColor" stroke-width="2.4"/><use href="#pastoral-rooster-3" fill="#E8863A"/><g clip-path="url(#pastoral-rooster-3c)"><path d="M38 48 H46" fill="none" stroke="#C66A24" stroke-width="1"/></g><use href="#pastoral-rooster-3" fill="none" stroke="currentColor" stroke-width="2.4"/><g class="pastoral-rooster-motion"><use href="#pastoral-rooster-4" fill="#EBB23E"/><g clip-path="url(#pastoral-rooster-4c)"><path d="M56 20 Q66 28 58 46 H64 V18Z" fill="#C98E28" opacity="0.8"/></g><use href="#pastoral-rooster-4" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M52 18 Q51 12 54 13 Q55 9 58 11 Q61 9 61 14 Q63 15 61 19Z" fill="#BF5340" stroke="currentColor" stroke-width="1.3"/><path d="M60 28 Q60 33 62 33 Q64 32 62 27Z" fill="#BF5340" stroke="currentColor" stroke-width="1.1"/><path d="M62 23 L68 25 L62 27Z" fill="#EBB23E" stroke="currentColor" stroke-width="1.2"/><circle cx="57" cy="23" r="1.6" fill="#3A2C22"/><circle cx="57.6" cy="22.4" r="0.6" fill="#FFFFFF"/></g></svg>