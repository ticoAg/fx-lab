<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-mushroom-root" viewBox="0 0 80 80" role="img" aria-label="Mushroom / 蘑菇" stroke-linecap="round" stroke-linejoin="round"><title>Mushroom / 蘑菇</title><desc>Round red cap with cream spots and gills underneath, a little sibling sprouting beside it, popping up among the grass. For forest floors, foraging and whimsy. / 红色圆伞盖缀着奶油色斑点，伞下有菌褶，旁边冒出一朵小蘑菇，草丛中轻快弹起。用于林地、采集与童趣。</desc><style>#pastoral-mushroom-root,#pastoral-mushroom-root g{animation-play-state:inherit}.pastoral-mushroom-motion{animation:pastoral-mushroom-pop 3.4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 70px}@keyframes pastoral-mushroom-pop{0%,62%,100%{transform:translateY(0) scale(1)}72%{transform:translateY(-2px) scale(1.025)}82%{transform:translateY(0) scale(.985,1.01)}90%{transform:translateY(0) scale(1.005)}}@media (prefers-reduced-motion:reduce){.pastoral-mushroom-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-mushroom-1" d="M31.6 46 Q30.6 60 28.4 68 Q40 72.6 51.6 68 Q49.4 60 48.4 46Z"/><clipPath id="pastoral-mushroom-1c"><use href="#pastoral-mushroom-1"/></clipPath><path id="pastoral-mushroom-2" d="M14 44 C14 25 26 15 40 15 C54 15 66 25 66 44 Q66 48.6 60 48.6 H20 Q14 48.6 14 44Z"/><clipPath id="pastoral-mushroom-2c"><use href="#pastoral-mushroom-2"/></clipPath></defs><ellipse cx="40" cy="70.6" rx="22" ry="2.2" fill="#4B3A2A" opacity=".16"/><g class="pastoral-mushroom-motion"><use href="#pastoral-mushroom-1" fill="#FFF6E2"/><g clip-path="url(#pastoral-mushroom-1c)"><path d="M43 44 Q46 60 46 74 H56 V44Z" fill="#EBD9B6"/><path d="M34 56 Q36 54 35.4 50" fill="none" stroke="#EBD9B6" stroke-width="1.1"/></g><use href="#pastoral-mushroom-1" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M18.6 46.4 Q40 55 61.4 46.4 Q52 50.4 40 50.4 Q28 50.4 18.6 46.4Z" fill="#EBD9B6" stroke="currentColor" stroke-width="1.4"/><use href="#pastoral-mushroom-2" fill="#BF534