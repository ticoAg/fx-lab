<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Mushroom / 蘑菇"><title>Mushroom / 蘑菇</title><desc>Round terracotta mushroom cap with cream spots on a stout stem among grass, popping up cheerfully. For forest floors, foraging and whimsy. / 陶土色圆蘑菇伞盖缀着奶油色斑点，粗短菌柄立在草丛中欢快冒出。用于林地、采集与童趣。</desc><style>.pastoral-pop{animation:pastoral-pop 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes pastoral-pop{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.08)}90%{transform:scale(.97)}}@media (prefers-reduced-motion:reduce){.pastoral-float,.pastoral-sway,.pastoral-spin,.pastoral-pulse,.pastoral-pop,.pastoral-drip{animation:none!important}}</style><g class="pastoral-pop"><path d="M32 44 V62 Q40 67 48 62 V44" fill="#FFFDF6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 45 Q16 18 40 18 Q64 18 64 45Z" fill="#C4784A" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g fill="#FFFDF6"><circle cx="30" cy="31" r="3.5"/><circle cx="44" cy="26" r="3"/><circle cx="52" cy="37" r="2.6"/><circle cx="38" cy="39" r="2.2"/></g><path d="M14 68 H66 M20 68 L18 62 M24 68 L25 63 M58 68 L56 62 M62 68 L64 63" fill="none" stroke="#6B8F3C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
