<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Egg basket / 鸡蛋篮"><title>Egg basket / 鸡蛋篮</title><desc>Woven wicker basket brimming with fresh cream eggs under an arched handle. For breakfast, fresh produce and farm markets. / 编织柳条篮装满奶油色新鲜鸡蛋，上方是拱形提手。用于早餐、新鲜农产与农夫市集。</desc><style>.pastoral-pop{animation:pastoral-pop 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes pastoral-pop{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.08)}90%{transform:scale(.97)}}@media (prefers-reduced-motion:reduce){.pastoral-float,.pastoral-sway,.pastoral-spin,.pastoral-pulse,.pastoral-pop,.pastoral-drip{animation:none!important}}</style><g class="pastoral-pop"><path d="M17 44 Q40 6 63 44" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g fill="#FFFDF6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="30" cy="41" rx="7" ry="9"/><ellipse cx="50" cy="41" rx="7" ry="9"/><ellipse cx="40" cy="38" rx="7" ry="9.5" fill="#F3E3C6"/></g><path d="M14 44 H66 L59 68 H21Z" fill="#C9A06A" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g fill="none" stroke="#8B5E3C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 52 H63 M19 60 H61"/><path d="M28 44 L30 68 M40 44 V68 M52 44 L50 68"/></g></g></svg>
