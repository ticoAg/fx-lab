<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-rabbit-root" viewBox="0 0 80 80" role="img" aria-label="Rabbit / 野兔" stroke-linecap="round" stroke-linejoin="round"><title>Rabbit / 野兔</title><desc>Fawn rabbit sitting side-on with pink-lined long ears, a white cotton tail, a pink nose and whiskers, giving a small hop. For spring, garden visitors and cute animals. / 浅棕色兔子侧坐着，长耳朵内侧粉色，白色毛球尾巴，粉鼻头和胡须，轻轻一跳。用于春天、菜园访客与可爱动物。</desc><style>#pastoral-rabbit-root,#pastoral-rabbit-root g{animation-play-state:inherit}.pastoral-rabbit-motion{animation:pastoral-rabbit-pop 3.4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 70px}@keyframes pastoral-rabbit-pop{0%,62%,100%{transform:translateY(0) scale(1)}72%{transform:translateY(-1.8px) scale(1.025)}82%{transform:translateY(0) scale(.985,1.01)}90%{transform:translateY(0) scale(1.005)}}@media (prefers-reduced-motion:reduce){.pastoral-rabbit-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-rabbit-1" d="M30 70 C20 70 19.6 56 26 49 C33 40 52 38 61 48 C68 56 66 69.6 54 70Z"/><clipPath id="pastoral-rabbit-1c"><use href="#pastoral-rabbit-1"/></clipPath><path id="pastoral-rabbit-2" d="M26.4 32 Q22 15.6 26 9 Q33 12.6 32.6 31.4Z"/><clipPath id="pastoral-rabbit-2c"><use href="#pastoral-rabbit-2"/></clipPath><circle id="pastoral-rabbit-3" cx="28" cy="41" r="10.6"/><clipPath id="pastoral-rabbit-3c"><use href="#pastoral-rabbit-3"/></clipPath></defs><ellipse cx="43" cy="71" rx="24" ry="1.8" fill="#4B3A2A" opacity=".16"/><path d="M66.5 71 Q66.5 68.2 65.1 66.1 Q68.2 67.8 69.2 71 Q69.6 66.8 70.6 64 Q71.4 67.5 71.4 71 Q72.5 68.2 74.6 66.5 Q73.5 69.2 73.5 71Z" fill="#6F9442" stroke="currentColor" stroke-width="1.3"/><path d="M8.5 71 Q8.5 68.2 7.1 66.1 Q10.2 67.8 11.2 71 Q11.6 66.8 12.6 64 Q13.4 67.5 13.4 71 Q14.5 68.2 16.6 66.5 Q15.5 69.2 15.5 71Z" fill="#93B45A" stroke="currentColor" stroke-width="1.3"/><g class="pastoral-rabbit-motion"><path d="M33 32 Q33.6 16.