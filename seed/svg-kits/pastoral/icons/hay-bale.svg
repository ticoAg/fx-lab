<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-hay-bale-root" viewBox="0 0 80 80" role="img" aria-label="Hay bale / 方草捆" stroke-linecap="round" stroke-linejoin="round"><title>Hay bale / 方草捆</title><desc>Square hay bale bound with two twine bands, straw texture shaded on three faces, a few strands poking out and a little sparrow perched on top. For hay making, fodder and autumn. / 用两道麻绳捆好的方形干草捆，三面不同明暗的草纹，边角支出几根稻草，顶上站着一只小麻雀。用于晒草、储料与秋天。</desc><style>#pastoral-hay-bale-root,#pastoral-hay-bale-root g{animation-play-state:inherit}.pastoral-hay-bale-motion{animation:pastoral-hay-bale-pop 3.8s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 70px}@keyframes pastoral-hay-bale-pop{0%,62%,100%{transform:translateY(0) scale(1)}72%{transform:translateY(-2px) scale(1.025)}82%{transform:translateY(0) scale(.985,1.01)}90%{transform:translateY(0) scale(1.005)}}@media (prefers-reduced-motion:reduce){.pastoral-hay-bale-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-hay-bale-1" d="M9.6 41 H51.6 V69.4 H9.6Z"/><clipPath id="pastoral-hay-bale-1c"><use href="#pastoral-hay-bale-1"/></clipPath><path id="pastoral-hay-bale-2" d="M9.6 41 L24 29 H68 L51.6 41Z"/><clipPath id="pastoral-hay-bale-2c"><use href="#pastoral-hay-bale-2"/></clipPath><path id="pastoral-hay-bale-3" d="M51.6 41 L68 29 V57 L51.6 69.4Z"/><clipPath id="pastoral-hay-bale-3c"><use href="#pastoral-hay-bale-3"/></clipPath></defs><ellipse cx="40" cy="70.4" rx="30" ry="2" fill="#4B3A2A" opacity=".16"/><g class="pastoral-hay-bale-motion"><path d="M9.6 48 l-3 -1 M9.6 58 l-3.4 1 M14 69.4 l-1 3 M30 69.4 l.6 3 M46 69.4 l1.4 2.6 M20 30.6 l-1 -3 M60 29 l2 -3" fill="none" stroke="#D3A752" stroke-width="1.3"/><use href="#pastoral-hay-bale-1" fill="#EDCB7A"/><g clip-path="url(#pastoral-hay-bale-1c)"><path d="M27.5 57 l5.8 -0.1 M29.8 57.7 l3.6 0 M34.8 62.8 l3.3 -0.6 M12.7 63.2 l5.1 -1.3 M49.3 67.1 l5 0.3 M15.5 43.4 l4.6 -1.2 M16.8 49 l3.1 -0.1 M27.1