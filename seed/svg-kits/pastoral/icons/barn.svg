<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Red barn / 红谷仓"><title>Red barn / 红谷仓</title><desc>Terracotta red barn with a gambrel roof, crossed white doors and a hayloft window, breathing softly. For farms, storage and home base. / 陶土红色谷仓，复折式屋顶、交叉白色大门与草料阁楼窗，轻柔呼吸。用于农场、仓储与大本营。</desc><style>.pastoral-pulse{animation:pastoral-pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pastoral-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.85;transform:scale(1.06)}}@media (prefers-reduced-motion:reduce){.pastoral-float,.pastoral-sway,.pastoral-spin,.pastoral-pulse,.pastoral-pop,.pastoral-drip{animation:none!important}}</style><g class="pastoral-pulse"><path d="M14 70 V40 L22 26 L40 16 L58 26 L66 40 V70Z" fill="#C4784A" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 42 L22 26 L40 16 L58 26 L69 42" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="29" y="47" width="22" height="23" fill="#FFFDF6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M29 47 L51 70 M51 47 L29 70" fill="none" stroke="#C4784A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="35" y="30" width="10" height="9" fill="#F2D98D" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 70 H72" fill="none" stroke="#6B8F3C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
