<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-barn-root" viewBox="0 0 80 80" role="img" aria-label="Red barn / 红谷仓" stroke-linecap="round" stroke-linejoin="round"><title>Red barn / 红谷仓</title><desc>Red plank barn with a dark gambrel roof, white trim, crossed doors and a hay-filled loft window, breathing softly. For farms, storage and home base. / 红色木板谷仓，复折式深色屋顶、白色镶边、交叉大门和装着干草的阁楼窗，轻柔呼吸。用于农场、仓储与大本营。</desc><style>#pastoral-barn-root,#pastoral-barn-root g{animation-play-state:inherit}.pastoral-barn-motion{animation:pastoral-barn-pulse 3.2s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 46px}@keyframes pastoral-barn-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}@media (prefers-reduced-motion:reduce){.pastoral-barn-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-barn-1" d="M15 70 V43 L22.4 32.6 L40 23.4 L57.6 32.6 L65 43 V70Z"/><clipPath id="pastoral-barn-1c"><use href="#pastoral-barn-1"/></clipPath><path id="pastoral-barn-2" d="M10.6 45.6 L20.6 30.6 L40 19.6 L59.4 30.6 L69.4 45.6 L65.6 47.2 L57 33.6 L40 24.4 L23 33.6 L14.4 47.2Z"/><clipPath id="pastoral-barn-2c"><use href="#pastoral-barn-2"/></clipPath><path id="pastoral-barn-3" d="M28.6 70 V49.6 H51.4 V70Z"/></defs><g class="pastoral-barn-motion"><use href="#pastoral-barn-1" fill="#BF5340"/><g clip-path="url(#pastoral-barn-1c)"><path d="M18 30 V72 M22 30 V72 M26 30 V72 M30 30 V72 M34 30 V72 M38 30 V72 M42 30 V72 M46 30 V72 M50 30 V72 M54 30 V72 M58 30 V72 M62 30 V72 " fill="none" stroke="#97402F" stroke-width="1" opacity="0.7"/><path d="M52 20 H70 V72 H56Z" fill="#97402F" opacity="0.55"/></g><use href="#pastoral-barn-1" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M17.2 68.4 V43.6 L24 34 L40 25.6 L56 34 L62.8 43.6 V68.4" fill="none" stroke="#FFF6E2" stroke-width="1.6"/><use href="#pastoral-barn-2" fill="#7E5D4B"/><g clip-path="url(#pastoral-barn-2c)"><path d="M4 42 L40 18 L76 42 M4 46 L40 22