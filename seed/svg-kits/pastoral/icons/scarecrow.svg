<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Scarecrow / 稻草人"><title>Scarecrow / 稻草人</title><desc>Friendly scarecrow with a straw hat, stitched burlap face and patched shirt on a wooden cross, swaying. For fields, harvest and autumn fun. / 戴草帽的友好稻草人，缝线麻布脸与带补丁的衬衫挂在木十字架上，轻轻摇摆。用于田野、丰收与秋日趣味。</desc><style>.pastoral-sway{animation:pastoral-sway 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes pastoral-sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@media (prefers-reduced-motion:reduce){.pastoral-float,.pastoral-sway,.pastoral-spin,.pastoral-pulse,.pastoral-pop,.pastoral-drip{animation:none!important}}</style><g class="pastoral-sway"><path d="M40 72 V30 M14 38 H66" fill="none" stroke="#8B5E3C" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 36 H54 L50 58 H30Z" fill="#8FB1C4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="42" y="44" width="6" height="6" fill="#E9B949" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><g fill="none" stroke="#C4A35A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 38 L10 34 M14 38 L9 39 M14 38 L11 43 M66 38 L70 34 M66 38 L71 39 M66 38 L69 43"/></g><circle cx="40" cy="25" r="8" fill="#E8D5B5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M37 24 L37 24 M43 24 L43 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M36 28 Q40 31 44 28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 18 H52 M33 18 Q33 9 40 9 Q47 9 47 18" fill="#E8C872" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
