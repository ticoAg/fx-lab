<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-scarecrow-root" viewBox="0 0 80 80" role="img" aria-label="Scarecrow / 稻草人" stroke-linecap="round" stroke-linejoin="round"><title>Scarecrow / 稻草人</title><desc>Straw-hatted scarecrow with a stitched burlap smile, a patched plaid shirt and straw poking from the cuffs, a little crow perched on one arm, swaying. For fields, harvest and autumn fun. / 戴草帽的稻草人，麻布脸缝着笑容，格子衬衫打着补丁，袖口露出稻草，手臂上还停着一只小乌鸦，轻轻摇摆。用于田野、丰收与秋日趣味。</desc><style>#pastoral-scarecrow-root,#pastoral-scarecrow-root g{animation-play-state:inherit}.pastoral-scarecrow-motion{animation:pastoral-scarecrow-sway 4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 74px}@keyframes pastoral-scarecrow-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion:reduce){.pastoral-scarecrow-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-scarecrow-1" d="M30 36.6 H50 L52.6 64 Q40 66.6 27.4 64Z"/><clipPath id="pastoral-scarecrow-1c"><use href="#pastoral-scarecrow-1"/></clipPath><circle id="pastoral-scarecrow-2" cx="40" cy="29.6" r="8.6"/><clipPath id="pastoral-scarecrow-2c"><use href="#pastoral-scarecrow-2"/></clipPath></defs><ellipse cx="40" cy="74.4" rx="10" ry="1.6" fill="#4B3A2A" opacity=".16"/><g class="pastoral-scarecrow-motion"><path d="M40 74 V40 M15 40.6 H65" fill="none" stroke="currentColor" stroke-width="5.6"/><path d="M40 74 V40 M15 40.6 H65" fill="none" stroke="#B88352" stroke-width="3"/><path d="M14.6 38.6 l-5 -2.6 M14.6 41 l-6 .4 M14.6 43.4 l-5 3 M65.4 38.6 l5 -2.6 M65.4 41 l6 .4 M65.4 43.4 l5 3 M33 63 l-2 5 M37 63.6 l-.6 5.6 M43 63.6 l.6 5.6 M47 63 l2 5" fill="none" stroke="#D3A752" stroke-width="1.6"/><path d="M17 37 H34 L33 46 H17 Q15.6 41.6 17 37Z M63 37 H46 L47 46 H63 Q64.4 41.6 63 37Z" fill="#9CC5D6" stroke="currentColor" stroke-width="1.6"/><use href="#pastoral-scarecrow-1" fill="#9CC5D6"/><g clip-path="url(#pastoral-scarecrow-1c)"