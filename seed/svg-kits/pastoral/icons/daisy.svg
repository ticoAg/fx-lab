<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Daisy / 雏菊"><title>Daisy / 雏菊</title><desc>White daisy with a sunny yellow heart, its petals slowly turning like a pinwheel. For spring, freshness and simple joys. / 白色雏菊配阳光般的黄色花心，花瓣像风车一样缓缓转动。用于春天、清新与小确幸。</desc><style>.pastoral-spin{animation:pastoral-spin 10s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes pastoral-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.pastoral-float,.pastoral-sway,.pastoral-spin,.pastoral-pulse,.pastoral-pop,.pastoral-drip{animation:none!important}}</style><path d="M40 72 Q38 56 40 44" fill="none" stroke="#6B8F3C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M39 62 Q28 58 26 64 Q34 68 39 62Z" fill="#A9C47F" stroke="#6B8F3C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g class="pastoral-spin"><ellipse cx="40" cy="20" rx="3.6" ry="7" transform="rotate(0 40 30)" fill="#FFFDF6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="40" cy="20" rx="3.6" ry="7" transform="rotate(36 40 30)" fill="#FFFDF6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="40" cy="20" rx="3.6" ry="7" transform="rotate(72 40 30)" fill="#FFFDF6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="40" cy="20" rx="3.6" ry="7" transform="rotate(108 40 30)" fill="#FFFDF6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="40" cy="20" rx="3.6" ry="7" transform="rotate(144 40 30)" fill="#FFFDF6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="40" cy="20" rx="3.6" ry="7" transform="rotate(180 40 30)" fill="#FFFDF6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="40" cy="20" rx="3.6" ry="7" transform="rotate(216 40 30)" fill="#FFFDF6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="40" cy="20" rx="3.6" ry="7" transform="rotate(252 40 30)" fill="#FFFDF6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="40" cy="20" rx="3.6" ry="7" transform="rotate(288 40 30)" fill="#FFFDF6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="40" cy="20" rx="3.6" ry="7" transform="rotate(324 40 30)" fill="#FFFDF6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="40" cy="30" r="6" fill="#E9B949" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
