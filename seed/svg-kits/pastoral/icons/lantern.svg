<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-lantern-root" viewBox="0 0 80 80" role="img" aria-label="Lantern / 马灯" stroke-linecap="round" stroke-linejoin="round"><title>Lantern / 马灯</title><desc>Hanging old-fashioned lantern with dark wood cap and base and a warm yellow flame inside the glass, gently swinging. For evenings, farmhouses and cozy moments. / 挂起的老式马灯，深木色顶盖和底座，玻璃罩里燃着暖黄火焰，轻轻摇晃。用于夜晚、农舍与温暖时光。</desc><style>#pastoral-lantern-root,#pastoral-lantern-root g{animation-play-state:inherit}.pastoral-lantern-motion{animation:pastoral-lantern-sway 4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 6px}@keyframes pastoral-lantern-sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@media (prefers-reduced-motion:reduce){.pastoral-lantern-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-lantern-1" d="M30 16 H50 L54 22 H26Z"/><path id="pastoral-lantern-2" d="M28 22 H52 V54 H28Z"/><clipPath id="pastoral-lantern-2c"><use href="#pastoral-lantern-2"/></clipPath><path id="pastoral-lantern-3" d="M24 54 H56 V60 H24Z"/></defs><g class="pastoral-lantern-motion"><path d="M40 6 V12" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M34 16 Q40 6 46 16" fill="none" stroke="currentColor" stroke-width="1.6"/><use href="#pastoral-lantern-1" fill="#6E4A2E"/><use href="#pastoral-lantern-1" fill="none" stroke="currentColor" stroke-width="1.8"/><use href="#pastoral-lantern-2" fill="#FBE7A8"/><g clip-path="url(#pastoral-lantern-2c)"><path d="M44 22 H52 V54 H44Z" fill="#F2CF73" opacity="0.8"/></g><use href="#pastoral-lantern-2" fill="none" stroke="currentColor" stroke-width="2.4"/><ellipse cx="40" cy="40" rx="6" ry="8" fill="#EBB23E"/><path d="M40 32 Q36 38 40 46 Q44 38 40 32Z" fill="#E8863A" stroke="currentColor" stroke-width="1"/><path d="M34 22 V54 M46 22 V54" fill="none" stroke="currentColor" stroke-width="1.2"/><use href="#pastoral-lantern-3" fill="#6E4A2E"/><use href="#pastoral-lantern-3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M31 26 V44" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.7"/></g><ellipse cx="40" cy="70" rx="16" ry="2.4" fill="#4B3A2A" opacity=".16"/></svg>