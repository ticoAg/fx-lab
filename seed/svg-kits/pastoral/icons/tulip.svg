<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-tulip-root" viewBox="0 0 80 80" role="img" aria-label="Tulips / 郁金香" stroke-linecap="round" stroke-linejoin="round"><title>Tulips / 郁金香</title><desc>Three tulips in red, pink and yellow with two long leaves, gently swaying. For spring gardens, bouquets and celebrations. / 红、粉、黄三朵郁金香和两片长叶，轻轻摇摆。用于春天花园、花束与节日。</desc><style>#pastoral-tulip-root,#pastoral-tulip-root g{animation-play-state:inherit}.pastoral-tulip-motion{animation:pastoral-tulip-sway 4.4s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 72px}@keyframes pastoral-tulip-sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}@media (prefers-reduced-motion:reduce){.pastoral-tulip-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-tulip-1" d="M40 72 Q24 62 26 44 Q34 58 40 64Z"/><path id="pastoral-tulip-2" d="M40 72 Q56 62 54 48 Q46 60 40 66Z"/></defs><ellipse cx="40" cy="72" rx="16" ry="2.4" fill="#4B3A2A" opacity=".16"/><g class="pastoral-tulip-motion"><path d="M28 72 Q28 50 28 38" fill="none" stroke="currentColor" stroke-width="4.2"/><path d="M28 72 Q28 50 28 38" fill="none" stroke="#6F9442" stroke-width="1.6"/><path d="M21 30 Q21 42 28 42 Q35 42 35 30 L31.5 34 L28 28 L24.5 34Z" fill="#BF5340" stroke="currentColor" stroke-width="1.6"/><path d="M29 32 Q34 34 33 40 L29 41Z" fill="#97402F" opacity="0.6"/><path d="M52 72 Q52 50 52 38" fill="none" stroke="currentColor" stroke-width="4.2"/><path d="M52 72 Q52 50 52 38" fill="none" stroke="#6F9442" stroke-width="1.6"/><path d="M45 30 Q45 42 52 42 Q59 42 59 30 L55.5 34 L52 28 L48.5 34Z" fill="#EBB23E" stroke="currentColor" stroke-width="1.6"/><path d="M53 32 Q58 34 57 40 L53 41Z" fill="#C98E28" opacity="0.6"/><path d="M40 72 Q40 38 40 26" fill="none" stroke="currentColor" stroke-width="4.2"/><path d="M40 72 Q40 38 40 26" fill="none" stroke="#6F9442" stroke-width="1.6"/><path d="M33 18 Q33 30 40 30 Q47 30 47 18 L43.5 22 L40 16 L36.5 22Z" fill="#F0B0A4" stroke="currentColor" stroke-width="1.6"/><path d="M41 20 Q46 22 45 28 L41 29Z" fill="#D88C80" opacity="0.6"/><use href="#pastoral-tulip-1" fill="#93B45A"/><use href="#pastoral-tulip-1" fill="none" stroke="currentColor" stroke-width="2.4"/><use href="#pastoral-tulip-2" fill="#93B45A"/><use href="#pastoral-tulip-2" fill="none" stroke="currentColor" stroke-width="2.4"/></g></svg>