<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-farm-pond-root" viewBox="0 0 80 80" role="img" aria-label="Farm pond / 池塘" stroke-linecap="round" stroke-linejoin="round"><title>Farm pond / 池塘</title><desc>Small pale blue pond with two cattails, a little frog on a lily pad and a pink water lily, the frog giving a hop. For country waterside, summer and small creatures. / 浅蓝小池塘，岸边两根香蒲，荷叶上一只小青蛙，旁边一朵粉色睡莲，青蛙轻轻一跳。用于乡野水边、夏天与小动物。</desc><style>#pastoral-farm-pond-root,#pastoral-farm-pond-root g{animation-play-state:inherit}.pastoral-farm-pond-motion{animation:pastoral-farm-pond-pop 3s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:46px 61px}@keyframes pastoral-farm-pond-pop{0%,62%,100%{transform:translateY(0) scale(1)}72%{transform:translateY(-2px) scale(1.025)}82%{transform:translateY(0) scale(.985,1.01)}90%{transform:translateY(0) scale(1.005)}}@media (prefers-reduced-motion:reduce){.pastoral-farm-pond-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-farm-pond-1" d="M10 60 Q10 50 28 49 H52 Q70 50 70 60 Q70 70 52 71 H28 Q10 70 10 60Z"/><clipPath id="pastoral-farm-pond-1c"><use href="#pastoral-farm-pond-1"/></clipPath></defs><path d="M16 56 Q15 40 14 34" fill="none" stroke="currentColor" stroke-width="4"/><path d="M16 56 Q15 40 14 34" fill="none" stroke="#6F9442" stroke-width="1.4"/><ellipse cx="14" cy="32" rx="1.8" ry="4.4" fill="#93633A" stroke="currentColor" stroke-width="1"/><path d="M20 55 Q21 44 22 40" fill="none" stroke="currentColor" stroke-width="4"/><path d="M20 55 Q21 44 22 40" fill="none" stroke="#6F9442" stroke-width="1.4"/><ellipse cx="22" cy="38" rx="1.6" ry="4" fill="#93633A" stroke="currentColor" stroke-width="1"/><use href="#pastoral-farm-pond-1" fill="#9CC5D6"/><g clip-path="url(#pastoral-farm-pond-1c)"><path d="M10 63 Q40 70 70 62 V74 H10Z" fill="#77A7BC" opacity="0.7"/><path d="M22 56 H34 M44 60 H54" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7"/></g>