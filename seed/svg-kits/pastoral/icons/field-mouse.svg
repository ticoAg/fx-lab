tColor" stroke-width="1" transform="rotate(25 57 37)"/><ellipse cx="54" cy="24" rx="2" ry="3.6" fill="#EDCB7A" stroke="currentColor" stroke-width="1"/><g class="pastoral-field-mouse-motion"><path d="M18 66 Q8 66 10 58 Q12 52 8 48" fill="none" stroke="currentColor" stroke-width="1.3"/><use href="#pastoral-field-mouse-1" fill="#D6D1C6"/><g clip-path="url(#pastoral-field-mouse-1c)"><path d="M34 50 Q50 58 44 72 H36Z" fill="#AFA799" opacity="0.7"/><path d="M30 62 Q38 60 42 66 V70 H30Z" fill="#FFF6E2" opacity="0.8"/></g><use href="#pastoral-field-mouse-1" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="42" cy="42" r="5" fill="#D6D1C6" stroke="currentColor" stroke-width="1.4"/><circle cx="42" cy="42" r="2.8" fill="#F0B0A4"/><use href="#pastoral-field-mouse-2" fill="#D6D1C6"/><use href="#pastoral-field-mouse-2" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="49" cy="48" r="1.6" fill="#3A2C22"/><circle cx="49.6" cy="47.4" r="0.6" fill="#FFFFFF"/><circle cx="58" cy="54" r="1.4" fill="#D88C80" stroke="currentColor" stroke-width="0.8"/><path d="M54 53 L62 51 M54 55 L62 56" fill="none" stroke="currentColor" stroke-width="0.7"/><ellipse cx="48" cy="62" rx="2.4" ry="3.2" fill="#EDCB7A" stroke="currentColor" stroke-width="1.1"/></g></svg>