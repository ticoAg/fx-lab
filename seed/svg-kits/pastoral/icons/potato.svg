<svg xmlns="http://www.w3.org/2000/svg" id="pastoral-potato-root" viewBox="0 0 80 80" role="img" aria-label="Potatoes / 土豆" stroke-linecap="round" stroke-linejoin="round"><title>Potatoes / 土豆</title><desc>Burlap sack of potatoes tied with twine, one loose potato with eyes on the ground giving a hop. For harvest, root vegetables and farm storage. / 麻布袋装满土豆，袋口麻绳扎紧，地上一颗带芽眼的土豆轻轻一跳。用于秋收、根茎菜与农家储藏。</desc><style>#pastoral-potato-root,#pastoral-potato-root g{animation-play-state:inherit}.pastoral-potato-motion{animation:pastoral-potato-pop 3.2s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:60px 71px}@keyframes pastoral-potato-pop{0%,62%,100%{transform:translateY(0) scale(1)}72%{transform:translateY(-2px) scale(1.025)}82%{transform:translateY(0) scale(.985,1.01)}90%{transform:translateY(0) scale(1.005)}}@media (prefers-reduced-motion:reduce){.pastoral-potato-motion{animation:none!important;transform:none!important}}</style><defs><path id="pastoral-potato-1" d="M14 70 Q12 48 22 40 L20 34 H44 L42 40 Q52 48 50 70Z"/><clipPath id="pastoral-potato-1c"><use href="#pastoral-potato-1"/></clipPath><path id="pastoral-potato-2" d="M50 66 Q48 58 56 56 Q66 54 68 62 Q70 70 60 71 Q52 72 50 66Z"/><clipPath id="pastoral-potato-2c"><use href="#pastoral-potato-2"/></clipPath></defs><ellipse cx="40" cy="72" rx="26" ry="2.4" fill="#4B3A2A" opacity=".16"/><ellipse cx="26" cy="30" rx="6" ry="4.4" fill="#EDCB7A" stroke="currentColor" stroke-width="1.4"/><ellipse cx="38" cy="28" rx="6" ry="4.4" fill="#D3A752" stroke="currentColor" stroke-width="1.4"/><use href="#pastoral-potato-1" fill="#EBD9B6"/><g clip-path="url(#pastoral-potato-1c)"><path d="M38 34 H52 V72 H40Z" fill="#D3BE93" opacity="0.8"/><path d="M18 52 H46 M18 60 H46" fill="none" stroke="#D3BE93" stroke-width="0.9"/></g><use href="#pastoral-potato-1" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M20 38 Q32 42 44 38" fill="none" stroke="currentColor" stroke-width="4"/><path d="M20 38 Q32 42 44 38" fill="none" stroke="#B88352" stroke-width="1.4"/><g class="pastoral-potato-motion"><use href="#pastoral-potato-2" fill="#EDCB7A"/><g clip-path="url(#pastoral-potato-2c)"><path d="M60 54 Q72 60 66 72 H60Z" fill="#D3A752" opacity="0.7"/><circle cx="55" cy="62" r="0.8" fill="#93633A"/><circle cx="62" cy="60" r="0.8" fill="#93633A"/><circle cx="60" cy="67" r="0.8" fill="#93633A"/></g><use href="#pastoral-potato-2" fill="none" stroke="currentColor" stroke-width="2.4"/></g></svg>