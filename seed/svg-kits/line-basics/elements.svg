<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 820" width="800" height="820" role="img" aria-label="Line Basics Icon Kit / 简笔线条图标">
  <title>Line Basics — Icon Kit / 简笔线条图标</title>
  <defs>
    <filter id="line-soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0.6" stdDeviation="0.4" flood-color="#2C2C2C" flood-opacity=".18"/></filter>
    <style>
      .line-pop{animation:line-pop 3.2s linear infinite}
      .line-pulse{animation:line-pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .line-spin{animation:line-spin 12s linear infinite;transform-box:fill-box;transform-origin:center}
      .line-float{animation:line-float 2.8s ease-in-out infinite}
      .line-pulse{animation:line-pulse 3s steps(1) infinite}
      @keyframes line-pop{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.35}}
      @keyframes line-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.85;transform:scale(1.06)}}
      @keyframes line-spin{to{transform:rotate(360deg)}}
      @keyframes line-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      @keyframes line-sway{0%{stroke-dashoffset:100}60%,100%{stroke-dashoffset:0}}
      @keyframes line-pulse{0%,86%,100%{transform:translate(0,0)}88%{transform:translate(-1.5px,.5px)}90%{transform:translate(1.5px,-.5px)}92%{transform:translate(-.5px,0)}}
      .line-t{stroke-dasharray:100;animation:line-sway 2.6s ease-in-out infinite alternate}
      .line-d1{animation-delay:.3s}.line-d2{animation-delay:.6s}.line-d3{animation-delay:.9s}
      @media (prefers-reduced-motion:reduce){.line-pop,.line-pulse,.line-spin,.line-float,.line-sway,.line-t{animation:none!important;stroke-dasharray:none}}
    </style>
  </defs>
  
  <text x="400" y="44" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="currentColor">LINE BASICS — Icon Kit</text>
  <text x="400" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#E07A5F">简笔线条 · 16 icons · line- prefixed CSS animations</text>
  <!-- 1 sun -->
