<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Sailboat / 帆船"><title>Sailboat / 帆船</title><desc>Line sailboat with two triangular sails bobbing on soft-blue waves. For sailing, holidays, the sea and journeys. / 线条帆船，两片三角帆，在柔蓝色波浪上轻轻起伏。用于航行、度假、大海与旅程。</desc><defs><filter id="line-soft-boat" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0.6" stdDeviation="0.4" flood-color="#2C2C2C" flood-opacity=".18"/></filter></defs><style>.line-float{animation:line-float 2.8s ease-in-out infinite}@keyframes line-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@media (prefers-reduced-motion:reduce){.line-pop,.line-pulse,.line-spin,.line-float,.line-sway,.line-t{animation:none!important;stroke-dasharray:none}}</style><g filter="url(#line-soft-boat)"><g class="line-float"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 50 H66 L58 61 H22 Z"/><path d="M40 50 V14"/><path d="M42 18 L59 44 H42 Z"/><path d="M38 22 L24 44 H38 Z"/></g><path d="M10 68 Q15 64 20 68 T30 68 T40 68 T50 68 T60 68 T70 68" fill="none" stroke="#81B29A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>
