<svg xmlns="http://www.w3.org/2000/svg" id="line-basics-boat-root" viewBox="0 0 80 80" role="img" aria-label="Sailboat / 帆船" stroke-linecap="round" stroke-linejoin="round"><title>Sailboat / 帆船</title><desc>A wooden sailboat carries a cream mainsail and a small coral sail; the boat floats above two still blue ripples. / 木色帆船带着奶油主帆和珊瑚小帆，随船身轻轻漂浮，船底两道蓝色水纹保持静止。</desc><style>#line-basics-boat-root,#line-basics-boat-root g{animation-play-state:inherit}.line-basics-boat-motion{animation:line-basics-boat-float 3.6s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 53px}@keyframes line-basics-boat-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.9px)}}@media (prefers-reduced-motion:reduce){.line-basics-boat-motion{animation:none!important;transform:none!important}}</style><defs><path id="line-basics-boat-1" d="M12 54 Q39 59 67 52 L58 66 Q42 72 24 65Z"/><clipPath id="line-basics-boat-1c"><use href="#line-basics-boat-1"/></clipPath><path id="line-basics-boat-2" d="M35 18 L35 49 L14 48Z"/><clipPath id="line-basics-boat-2c"><use href="#line-basics-boat-2"/></clipPath><path id="line-basics-boat-3" d="M43 20 L65 46 H43Z"/><clipPath id="line-basics-boat-3c"><use href="#line-basics-boat-3"/></clipPath></defs><path d="M13 72 Q21 68 29 71 T45 71 T64 71" fill="none" stroke="#6497B4" stroke-width="2"/><g class="line-basics-boat-motion"><path d="M39 55 V13" fill="none" stroke="currentColor" stroke-width="4.6"/><path d="M39 55 V13" fill="none" stroke="#BE906B" stroke-width="2"/><use href="#line-basics-boat-2" fill="#FFF2D8"/><g clip-path="url(#line-basics-boat-2c)"><path d="M29 25 L35 18 V50 H27Z" fill="#E3CBA4" opacity="0.7"/></g><use href="#line-basics-boat-2" fill="none" stroke="currentColor" stroke-width="1.8"/><use href="#line-basics-boat-3" fill="#E5907B"/><g clip-path="url(#line-basics-boat-3c)"><path d="M43 34 L65 46 H43Z" fill="#BA6259" opacity="0.6"/></g><use href="#line-basics-boat-3" fill="none" stroke="currentColor" stroke-width="1.8"/><use href="#line-basics-boat-1" fill="#BE906B"/><g clip-path="url(#line-basics-boat-1c)"><path d="M12 60 H69 V73 H12Z" fill="#906246" opacity="0.5"/><path d="M23 59 Q42 65 59 58" fill="none" stroke="#FFF2D8" stroke-width="1" opacity="0.6"/></g><use href="#line-basics-boat-1" fill="none" stroke="currentColor" stroke-width="2.4"/></g></svg>
