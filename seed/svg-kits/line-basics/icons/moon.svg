<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Moon / 月亮"><title>Moon / 月亮</title><desc>Line crescent moon with two little twinkling stars beside it. For night, sleep, dark mode and bedtime stories. / 线条弯月，旁边两颗小星星一闪一闪。用于夜晚、睡眠、深色模式与睡前故事。</desc><defs><filter id="line-soft-moon" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0.6" stdDeviation="0.4" flood-color="#2C2C2C" flood-opacity=".18"/></filter></defs><style>.line-pop{animation:line-pop 3.2s linear infinite}@keyframes line-pop{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.35}}@media (prefers-reduced-motion:reduce){.line-pop,.line-pulse,.line-spin,.line-float,.line-sway,.line-t{animation:none!important;stroke-dasharray:none}}</style><g filter="url(#line-soft-moon)"><path d="M44 16 A24 24 0 1 0 64 50 A19 19 0 0 1 44 16Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="line-pop" fill="none" stroke="#E07A5F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M58 18 V26 M54 22 H62"/><path d="M64 33 V37 M62 35 H66"/></g></g></svg>
