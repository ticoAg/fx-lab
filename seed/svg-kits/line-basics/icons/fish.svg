<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Fish / 小鱼"><title>Fish / 小鱼</title><desc>Simple line fish with a triangle tail, gill curve and soft-blue bubbles, wiggling. For fish, the ocean, aquariums and food. / 简单的线条小鱼：三角尾巴、鳃线和柔蓝色气泡，摆动身体。用于鱼类、海洋、水族馆与美食。</desc><defs><filter id="line-soft-fish" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0.6" stdDeviation="0.4" flood-color="#2C2C2C" flood-opacity=".18"/></filter></defs><style>.line-pulse{animation:line-pulse 3s steps(1) infinite}@keyframes line-pulse{0%,86%,100%{transform:translate(0,0)}88%{transform:translate(-1.5px,.5px)}90%{transform:translate(1.5px,-.5px)}92%{transform:translate(-.5px,0)}}@media (prefers-reduced-motion:reduce){.line-pop,.line-pulse,.line-spin,.line-float,.line-sway,.line-t{animation:none!important;stroke-dasharray:none}}</style><g filter="url(#line-soft-fish)"><g class="line-pulse"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 42 Q34 22 56 42 Q34 62 14 42Z"/><path d="M56 42 L68 32 V52 Z"/><path d="M31 34 Q35 42 31 50"/></g><circle cx="23" cy="39.5" r="2" fill="currentColor"/><g fill="none" stroke="#81B29A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="22" r="3"/><circle cx="25" cy="14" r="2"/></g></g></g></svg>
