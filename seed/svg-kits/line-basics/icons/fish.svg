<svg xmlns="http://www.w3.org/2000/svg" id="line-basics-fish-root" viewBox="0 0 80 80" role="img" aria-label="Fish / 小鱼" stroke-linecap="round" stroke-linejoin="round"><title>Fish / 小鱼</title><desc>A golden-orange fish has coral fins, layered scales and a dark glinting eye; it gently pulses beside three pale blue bubbles. / 金橙小鱼有珊瑚色尾鳍、分层鱼鳞和深色亮眼，身体轻轻呼吸，旁边冒着三颗浅蓝气泡。</desc><style>#line-basics-fish-root,#line-basics-fish-root g{animation-play-state:inherit}.line-basics-fish-motion{animation:line-basics-fish-pulse 4.0s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:42px 41px}@keyframes line-basics-fish-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}@media (prefers-reduced-motion:reduce){.line-basics-fish-motion{animation:none!important;transform:none!important}}</style><defs><path id="line-basics-fish-1" d="M24 38 L11 26 Q7 40 12 54 L25 47Z"/><clipPath id="line-basics-fish-1c"><use href="#line-basics-fish-1"/></clipPath><path id="line-basics-fish-2" d="M20 41 Q39 15 61 31 Q72 41 60 51 Q38 66 20 41Z"/><clipPath id="line-basics-fish-2c"><use href="#line-basics-fish-2"/></clipPath></defs><ellipse cx="40" cy="72" rx="21" ry="2.4" fill="#4B3A2A" opacity=".16"/><circle cx="64" cy="20" r="3" fill="#9FC7DA" stroke="currentColor" stroke-width="1.2"/><circle cx="69" cy="11" r="1.6" fill="#9FC7DA" stroke="currentColor" stroke-width="1"/><circle cx="67" cy="59" r="2" fill="#9FC7DA" stroke="currentColor" stroke-width="1"/><g class="line-basics-fish-motion"><use href="#line-basics-fish-1" fill="#E5907B"/><g clip-path="url(#line-basics-fish-1c)"><path d="M13 33 l8 8 -8 7" fill="none" stroke="#BA6259" stroke-width="1"/></g><use href="#line-basics-fish-1" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M34 27 L39 18 L50 28 M35 54 L40 63 L49 52" fill="#E5907B" stroke="currentColor" stroke-width="1.5"/><use href="#line-basics-fish-2" fill="#EBC568"/><g clip-path="url(#line-basics-fish-2c)"><path d="M18 44 Q42 52 66 36 V66 H16Z" fill="#C9983E" opacity="0.6"/><path d="M36 31 Q44 27 50 29" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.7"/></g><use href="#line-basics-fish-2" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M51 31 Q44 41 51 51" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M30 37 q4 4 0 8 M37 34 q4 4 0 8 M38 44 q4 4 0 8" fill="none" stroke="#C9983E" stroke-width="1.1"/><circle cx="59" cy="37" r="2.1" fill="#3A2C22"/><circle cx="59.8" cy="36.2" r="0.8" fill="#FFFFFF"/><path d="M65 43 h-3" fill="none" stroke="currentColor" stroke-width="1.1"/></g></svg>
