<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Sun / 太阳"><title>Sun / 太阳</title><desc>Smiling stick-figure sun with rosy cheeks; its eight rays turn slowly. For weather, mornings, warmth and good moods. / 带红润脸颊的微笑线条太阳，八道光芒缓缓旋转。用于天气、早晨、温暖与好心情。</desc><defs><filter id="line-soft-sun" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0.6" stdDeviation="0.4" flood-color="#2C2C2C" flood-opacity=".18"/></filter></defs><style>.line-spin{animation:line-spin 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes line-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.line-pop,.line-pulse,.line-spin,.line-float,.line-sway,.line-t{animation:none!important;stroke-dasharray:none}}</style><g filter="url(#line-soft-sun)"><g class="line-spin"><path d="M58 40 L66 40 M52.7 52.7 L58.4 58.4 M40 58 L40 66 M27.3 52.7 L21.6 58.4 M22 40 L14 40 M27.3 27.3 L21.6 21.6 M40 22 L40 14 M52.7 27.3 L58.4 21.6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="40" cy="40" r="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g fill="currentColor"><circle cx="36" cy="38" r="1.6"/><circle cx="44" cy="38" r="1.6"/></g><path d="M36 43.5 Q40 47 44 43.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g fill="#E07A5F" opacity=".7"><circle cx="32.5" cy="43" r="1.8"/><circle cx="47.5" cy="43" r="1.8"/></g></g></svg>
