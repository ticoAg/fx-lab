ke="currentColor" stroke-width="1.3"/><circle cx="21" cy="55" r="2" fill="#EBC568" stroke="currentColor" stroke-width="1"/><circle cx="59" cy="55" r="2" fill="#EBC568" stroke="currentColor" stroke-width="1"/><path d="M41 55 l5 4 h4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
