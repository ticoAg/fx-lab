<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Bicycle / 自行车"><title>Bicycle / 自行车</title><desc>Stick bicycle with spoked wheels that keep turning, a simple frame, saddle and handlebar. For cycling, commuting, exercise and green travel. / 线条自行车：带辐条的车轮不停转动，简单车架、车座与车把。用于骑行、通勤、运动与绿色出行。</desc><defs><filter id="line-soft-bicycle" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0.6" stdDeviation="0.4" flood-color="#2C2C2C" flood-opacity=".18"/></filter></defs><style>.line-spin{animation:line-spin 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes line-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.line-pop,.line-pulse,.line-spin,.line-float,.line-sway,.line-t{animation:none!important;stroke-dasharray:none}}</style><g filter="url(#line-soft-bicycle)"><g class="line-spin" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="21" cy="52" r="12"/><path d="M21 52 L33 52 M21 52 L27 62.4 M21 52 L15 62.4 M21 52 L9 52 M21 52 L15 41.6 M21 52 L27 41.6" stroke-width="1.4" opacity=".55"/></g><g class="line-spin" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="59" cy="52" r="12"/><path d="M59 52 L71 52 M59 52 L65 62.4 M59 52 L53 62.4 M59 52 L47 52 M59 52 L53 41.6 M59 52 L65 41.6" stroke-width="1.4" opacity=".55"/></g><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 52 H37 L50 35 H31 Z M31 35 L29 29 M25 29 H33 M47.5 28 L59 52 M47.5 28 H54"/></g><circle cx="37" cy="52" r="2.6" fill="#E07A5F"/></g></svg>
