<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Cat / 小猫"><title>Cat / 小猫</title><desc>Line cat face with pointy ears, whiskers and a coral nose; its eyes blink now and then. For pets, cuteness, home and companionship. / 尖耳朵、胡须和珊瑚色鼻子的线条猫脸，眼睛时不时眨一下。用于宠物、可爱、居家与陪伴。</desc><defs><filter id="line-soft-cat" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0.6" stdDeviation="0.4" flood-color="#2C2C2C" flood-opacity=".18"/></filter></defs><style>.line-pop{animation:line-pop 3.2s linear infinite}@keyframes line-pop{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.35}}@media (prefers-reduced-motion:reduce){.line-pop,.line-pulse,.line-spin,.line-float,.line-sway,.line-t{animation:none!important;stroke-dasharray:none}}</style><g filter="url(#line-soft-cat)"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 34 L22 16 L36 27 Q40 26 44 27 L58 16 L56 34 Q62 45 56 54 Q49 63 40 63 Q31 63 24 54 Q18 45 24 34Z"/></g><g class="line-pop" fill="currentColor"><circle cx="33" cy="42" r="2.4"/><circle cx="47" cy="42" r="2.4"/></g><path d="M37.5 48 H42.5 L40 51 Z" fill="#E07A5F" stroke="#E07A5F" stroke-width="1.2" stroke-linejoin="round"/><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M40 51 Q38 55 35 53 M40 51 Q42 55 45 53"/><path d="M30 50 L17 48 M30 53 L17 56 M50 50 L63 48 M50 53 L63 56" opacity=".7"/></g></g></svg>
