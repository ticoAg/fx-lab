<svg xmlns="http://www.w3.org/2000/svg" id="line-basics-tree-root" viewBox="0 0 80 80" role="img" aria-label="Tree / 大树" stroke-linecap="round" stroke-linejoin="round"><title>Tree / 大树</title><desc>A rounded green canopy has layered leaf colors above a wood-grained trunk and two grass tufts; only the canopy gently pulses. / 圆润的绿树冠有分层叶色，木色树干刻着短木纹，树冠在两簇小草上轻轻呼吸。</desc><style>#line-basics-tree-root,#line-basics-tree-root g{animation-play-state:inherit}.line-basics-tree-motion{animation:line-basics-tree-pulse 3.2s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 50px}@keyframes line-basics-tree-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}@media (prefers-reduced-motion:reduce){.line-basics-tree-motion{animation:none!important;transform:none!important}}</style><defs><path id="line-basics-tree-1" d="M34 39 L46 39 L48 69 Q40 73 32 69Z"/><clipPath id="line-basics-tree-1c"><use href="#line-basics-tree-1"/></clipPath><path id="line-basics-tree-2" d="M16 46 C9 38 13 28 21 26 C21 15 35 11 42 18 C53 11 64 20 62 29 C72 34 66 48 57 48 C50 56 43 51 39 51 C28 56 22 50 16 46Z"/><clipPath id="line-basics-tree-2c"><use href="#line-basics-tree-2"/></clipPath></defs><ellipse cx="40" cy="72" rx="25" ry="2.4" fill="#4B3A2A" opacity=".16"/><use href="#line-basics-tree-1" fill="#BE906B"/><g clip-path="url(#line-basics-tree-1c)"><path d="M42 35 H52 V73 H41Z" fill="#906246" opacity="0.55"/><path d="M37 53 l-1 11 M43 59 v7" fill="none" stroke="#906246" stroke-width="1.1"/></g><use href="#line-basics-tree-1" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M17 70 l-2 -5 M19 70 l2 -4 M60 71 l-2 -5 M62 71 l3 -3" fill="none" stroke="currentColor" stroke-width="1.3"/><g class="line-basics-tree-motion"><use href="#line-basics-tree-2" fill="#9DBE8B"/><g clip-path="url(#line-basics-tree-2c)"><path d="M13 37 Q39 46 64 29 L72 57 H10Z" fill="#6D925E" opacity="0.55"/><path d="M24 27 Q26 20 34 21" fill="none" stroke="#FFFFFF" stroke-