<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Tree / 大树"><title>Tree / 大树</title><desc>Simple tree with a round leafy crown, a forked trunk and a ground line, swaying a little. For nature, parks, growth and family trees. / 简单的大树：圆圆的树冠、分叉树干和地面线，微微摇摆。用于自然、公园、成长与家谱。</desc><defs><filter id="line-soft-tree" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0.6" stdDeviation="0.4" flood-color="#2C2C2C" flood-opacity=".18"/></filter></defs><style>.line-pulse{animation:line-pulse 3s steps(1) infinite}@keyframes line-pulse{0%,86%,100%{transform:translate(0,0)}88%{transform:translate(-1.5px,.5px)}90%{transform:translate(1.5px,-.5px)}92%{transform:translate(-.5px,0)}}@media (prefers-reduced-motion:reduce){.line-pop,.line-pulse,.line-spin,.line-float,.line-sway,.line-t{animation:none!important;stroke-dasharray:none}}</style><g filter="url(#line-soft-tree)"><g class="line-pulse"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="40" cy="30" r="16"/><path d="M40 68 V40 M40 54 L32 46 M40 50 L48 43 M24 68 H56"/></g><g fill="#81B29A"><circle cx="34" cy="26" r="2"/><circle cx="46" cy="32" r="2"/></g></g></g></svg>
