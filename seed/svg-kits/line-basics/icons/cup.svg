<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Cup / 杯子"><title>Cup / 杯子</title><desc>Line mug on a saucer with three wisps of steam drawing upward. For coffee, tea, breaks and cozy mornings. / 放在碟子上的线条杯子，三缕热气向上逐笔飘起。用于咖啡、茶、休息与惬意的早晨。</desc><defs><filter id="line-soft-cup" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0.6" stdDeviation="0.4" flood-color="#2C2C2C" flood-opacity=".18"/></filter></defs><style>@keyframes line-sway{0%{stroke-dashoffset:100}60%,100%{stroke-dashoffset:0}}.line-t{stroke-dasharray:100;animation:line-sway 2.6s ease-in-out infinite alternate}@media (prefers-reduced-motion:reduce){.line-pop,.line-pulse,.line-spin,.line-float,.line-sway,.line-t{animation:none!important;stroke-dasharray:none}}</style><g filter="url(#line-soft-cup)"><g class="line-sway"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 36 H50 V52 A10 10 0 0 1 40 62 H32 A10 10 0 0 1 22 52Z"/><path d="M50 40 H54 A6 6 0 0 1 54 52 H50"/><path d="M16 67 H58"/></g><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".7"><path pathLength="100" class="line-t" d="M29 30 C26 26 32 22 29 16"/><path pathLength="100" class="line-t" d="M36 30 C33 26 39 22 36 16"/><path pathLength="100" class="line-t" d="M43 30 C40 26 46 22 43 16"/></g></g></g></svg>
