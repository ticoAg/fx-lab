<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Bird / 小鸟"><title>Bird / 小鸟</title><desc>Round little line bird with a coral beak, a tucked wing and stick legs, hopping lightly. For birds, messages, freedom and tweets. / 圆滚滚的线条小鸟：珊瑚色小嘴、收起的翅膀和细腿，轻轻跳动。用于鸟类、消息、自由与动态。</desc><defs><filter id="line-soft-bird" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0.6" stdDeviation="0.4" flood-color="#2C2C2C" flood-opacity=".18"/></filter></defs><style>.line-float{animation:line-float 2.8s ease-in-out infinite}@keyframes line-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@media (prefers-reduced-motion:reduce){.line-pop,.line-pulse,.line-spin,.line-float,.line-sway,.line-t{animation:none!important;stroke-dasharray:none}}</style><g filter="url(#line-soft-bird)"><g class="line-float"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="38" cy="43" r="16"/><path d="M26 47 Q33 56 42 49 Q33 43 26 47Z"/><path d="M34 59 V68 M42 59 V68 M31 68 H37 M39 68 H45"/><path d="M23 37 L14 32 M22.5 42 L13 42"/></g><circle cx="44" cy="38" r="2" fill="currentColor"/><path d="M53.5 40 L62 43.5 L53.5 47 Z" fill="#E07A5F" stroke="#E07A5F" stroke-width="1.5" stroke-linejoin="round"/></g></g></svg>
