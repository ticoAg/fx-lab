<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="House / 房子"><title>House / 房子</title><desc>Little line house with a chimney, door and cross-paned window, drawn stroke by stroke. For home, addresses, real estate and the main page. / 带烟囱、门和十字窗的小线条房子，一笔一笔画出来。用于家、地址、房产与首页。</desc><defs><filter id="line-soft-house" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0.6" stdDeviation="0.4" flood-color="#2C2C2C" flood-opacity=".18"/></filter></defs><style>@keyframes line-sway{0%{stroke-dashoffset:100}60%,100%{stroke-dashoffset:0}}.line-t{stroke-dasharray:100;animation:line-sway 2.6s ease-in-out infinite alternate}@media (prefers-reduced-motion:reduce){.line-pop,.line-pulse,.line-spin,.line-float,.line-sway,.line-t{animation:none!important;stroke-dasharray:none}}</style><g filter="url(#line-soft-house)"><g class="line-sway"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path pathLength="100" class="line-t" d="M16 38 L40 17 L64 38"/><path pathLength="100" class="line-t" d="M22 33 V64 H58 V33"/><path pathLength="100" class="line-t" d="M50 24 V18 H56 V29"/><path pathLength="100" class="line-t" d="M29 64 V49 H39 V64"/><path pathLength="100" class="line-t" d="M45 44 H54 V53 H45Z M49.5 44 V53 M45 48.5 H54"/></g></g></g></svg>
