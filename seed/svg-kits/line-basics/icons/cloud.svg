<svg xmlns="http://www.w3.org/2000/svg" id="line-basics-cloud-root" viewBox="0 0 80 80" role="img" aria-label="Cloud / 云朵" stroke-linecap="round" stroke-linejoin="round"><title>Cloud / 云朵</title><desc>A cream cloud with a blue shaded underside and two soft highlights floats above a faint shadow. / 奶油白云团带着蓝色底部暗面，左侧两道柔和高光，轻轻浮在浅浅的影子上。</desc><style>#line-basics-cloud-root,#line-basics-cloud-root g{animation-play-state:inherit}.line-basics-cloud-motion{animation:line-basics-cloud-float 3.4000000000000004s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 45px}@keyframes line-basics-cloud-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.9px)}}@media (prefers-reduced-motion:reduce){.line-basics-cloud-motion{animation:none!important;transform:none!important}}</style><defs><path id="line-basics-cloud-1" d="M18 58 C6 56 9 39 21 38 C20 23 37 19 45 30 C59 22 69 35 64 45 C75 54 63 61 55 59Z"/><clipPath id="line-basics-cloud-1c"><use href="#line-basics-cloud-1"/></clipPath></defs><ellipse cx="40" cy="72" rx="24" ry="2.4" fill="#4B3A2A" opacity=".16"/><g class="line-basics-cloud-motion"><use href="#line-basics-cloud-1" fill="#FFF2D8"/><g clip-path="url(#line-basics-cloud-1c)"><path d="M8 49 Q35 60 68 43 L74 65 H8Z" fill="#9FC7DA" opacity="0.8"/><path d="M25 36 Q26 27 35 28 M48 33 Q54 29 58 35" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.7"/></g><use href="#line-basics-cloud-1" fill="none" stroke="currentColor" stroke-width="2.4"/></g></svg>
