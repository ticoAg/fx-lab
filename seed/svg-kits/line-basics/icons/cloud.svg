<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Cloud / 云朵"><title>Cloud / 云朵</title><desc>Puffy outlined cloud drifting gently up and down. For weather, sky, storage and daydreaming. / 蓬松的线条云朵，轻轻上下飘动。用于天气、天空、存储与白日梦。</desc><defs><filter id="line-soft-cloud" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0.6" stdDeviation="0.4" flood-color="#2C2C2C" flood-opacity=".18"/></filter></defs><style>.line-float{animation:line-float 2.8s ease-in-out infinite}@keyframes line-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@media (prefers-reduced-motion:reduce){.line-pop,.line-pulse,.line-spin,.line-float,.line-sway,.line-t{animation:none!important;stroke-dasharray:none}}</style><g filter="url(#line-soft-cloud)"><g class="line-float"><path d="M22 54 H58 A11 11 0 0 0 56 34 A14 14 0 0 0 30 32 A12 12 0 0 0 22 54Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M33 44 Q36 41 39 44" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/></g></g></svg>
