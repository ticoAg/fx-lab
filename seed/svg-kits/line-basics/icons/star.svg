<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Star / 星星"><title>Star / 星星</title><desc>Rounded five-point line star with a soft coral glint, gently pulsing. For favorites, ratings, rewards and achievements. / 圆角五角线条星星，带一点柔珊瑚色闪光，轻轻脉动。用于收藏、评分、奖励与成就。</desc><defs><filter id="line-soft-star" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0.6" stdDeviation="0.4" flood-color="#2C2C2C" flood-opacity=".18"/></filter></defs><style>.line-pulse{animation:line-pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes line-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.85;transform:scale(1.06)}}@media (prefers-reduced-motion:reduce){.line-pop,.line-pulse,.line-spin,.line-float,.line-sway,.line-t{animation:none!important;stroke-dasharray:none}}</style><g filter="url(#line-soft-star)"><g class="line-pulse"><polygon points="40,18 46.2,33.5 62.8,34.6 50,45.2 54.1,61.4 40,52.5 25.9,61.4 30,45.2 17.2,34.6 33.8,33.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M33 38 L36 35" fill="none" stroke="#E07A5F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>
