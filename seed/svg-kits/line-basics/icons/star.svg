<svg xmlns="http://www.w3.org/2000/svg" id="line-basics-star-root" viewBox="0 0 80 80" role="img" aria-label="Star / 星星" stroke-linecap="round" stroke-linejoin="round"><title>Star / 星星</title><desc>A golden five-pointed star has warm shading, a white highlight and two small eyes; the star gently pulses. / 金色五角星带着同色暗面、白色高光和两颗小眼睛，中央主体轻轻呼吸。</desc><style>#line-basics-star-root,#line-basics-star-root g{animation-play-state:inherit}.line-basics-star-motion{animation:line-basics-star-pulse 4.0s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 40px}@keyframes line-basics-star-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}@media (prefers-reduced-motion:reduce){.line-basics-star-motion{animation:none!important;transform:none!important}}</style><defs><path id="line-basics-star-1" d="M40 12 L47.6 28.5 L65.7 30.7 L52.4 43 L55.9 60.8 L40 52 L24.1 60.8 L27.6 43 L14.3 30.7 L32.4 28.5Z"/><clipPath id="line-basics-star-1c"><use href="#line-basics-star-1"/></clipPath></defs><ellipse cx="40" cy="72" rx="22" ry="2.4" fill="#4B3A2A" opacity=".16"/><g class="line-basics-star-motion"><use href="#line-basics-star-1" fill="#EBC568"/><g clip-path="url(#line-basics-star-1c)"><path d="M44 9 L43 40 L64 63 H33Z" fill="#C9983E" opacity="0.55"/><path d="M37 25 l3 -6 5 11" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.7"/></g><use href="#line-basics-star-1" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="35" cy="40" r="1.6" fill="#3A2C22"/><circle cx="35.6" cy="39.4" r="0.6" fill="#FFFFFF"/><circle cx="45" cy="40" r="1.6" fill="#3A2C22"/><circle cx="45.6" cy="39.4" r="0.6" fill="#FFFFFF"/><path d="M37 46 Q40 49 43 46" fill="none" stroke="#3A2C22" stroke-width="1.2"/></g></svg>
