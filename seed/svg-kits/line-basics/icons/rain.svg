<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Rain / 下雨"><title>Rain / 下雨</title><desc>Small line cloud with three soft-blue raindrops drawing themselves downward. For rain, weather forecasts and watering. / 小小的线条云朵，三滴柔蓝色雨滴自上而下逐笔画出。用于下雨、天气预报与浇水。</desc><defs><filter id="line-soft-rain" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0.6" stdDeviation="0.4" flood-color="#2C2C2C" flood-opacity=".18"/></filter></defs><style>@keyframes line-sway{0%{stroke-dashoffset:100}60%,100%{stroke-dashoffset:0}}.line-t{stroke-dasharray:100;animation:line-sway 2.6s ease-in-out infinite alternate}@media (prefers-reduced-motion:reduce){.line-pop,.line-pulse,.line-spin,.line-float,.line-sway,.line-t{animation:none!important;stroke-dasharray:none}}</style><g filter="url(#line-soft-rain)"><g class="line-sway"><path d="M22 54 H58 A11 11 0 0 0 56 34 A14 14 0 0 0 30 32 A12 12 0 0 0 22 54Z" transform="translate(0 -12)" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g fill="none" stroke="#81B29A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path pathLength="100" class="line-t" d="M29 50 L26 60"/><path pathLength="100" class="line-t" d="M40 50 L37 64"/><path pathLength="100" class="line-t" d="M51 50 L48 60"/></g></g></g></svg>
