ne-basics-rain-motion"><use href="#line-basics-rain-2" fill="#9FC7DA"/><g clip-path="url(#line-basics-rain-2c)"><path d="M23 52 l-1 3" fill="none" stroke="#FFFFFF" stroke-width="1.1" opacity="0.7"/></g><use href="#line-basics-rain-2" fill="none" stroke="currentColor" stroke-width="1.5"/><use href="#line-basics-rain-3" fill="#9FC7DA"/><g clip-path="url(#line-basics-rain-3c)"><path d="M39 55 l-1 3" fill="none" stroke="#FFFFFF" stroke-width="1.1" opacity="0.7"/></g><use href="#line-basics-rain-3" fill="none" stroke="currentColor" stroke-width="1.5"/><use href="#line-basics-rain-4" fill="#9FC7DA"/><g clip-path="url(#line-basics-rain-4c)"><path d="M54 51 l-1 3" fill="none" stroke="#FFFFFF" stroke-width="1.1" opacity="0.7"/></g><use href="#line-basics-rain-4" fill="none" stroke="currentColor" stroke-width="1.5"/></g></svg>
