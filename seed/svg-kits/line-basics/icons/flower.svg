<svg xmlns="http://www.w3.org/2000/svg" id="line-basics-flower-root" viewBox="0 0 80 80" role="img" aria-label="Flower / 小花" stroke-linecap="round" stroke-linejoin="round"><title>Flower / 小花</title><desc>Five coral petals turn slowly around a golden center on a still green stem, with two leaves and a little mound of soil. / 珊瑚色五瓣花绕金色花心慢慢旋转，绿色茎叶长在一小块土堆上。</desc><style>#line-basics-flower-root,#line-basics-flower-root g{animation-play-state:inherit}.line-basics-flower-motion{animation:line-basics-flower-spin 16.4s linear infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 33px}@keyframes line-basics-flower-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.line-basics-flower-motion{animation:none!important;transform:none!important}}</style><defs><path id="line-basics-flower-1" d="M39 57 Q19 56 23 43 Q37 44 39 57Z"/><clipPath id="line-basics-flower-1c"><use href="#line-basics-flower-1"/></clipPath><path id="line-basics-flower-2" d="M40 63 Q58 59 57 49 Q43 49 40 63Z"/><clipPath id="line-basics-flower-2c"><use href="#line-basics-flower-2"/></clipPath><ellipse id="line-basics-flower-3" cx="40" cy="21" rx="7" ry="11" transform="rotate(0 40 33)"/><ellipse id="line-basics-flower-4" cx="40" cy="21" rx="7" ry="11" transform="rotate(72 40 33)"/><ellipse id="line-basics-flower-5" cx="40" cy="21" rx="7" ry="11" transform="rotate(144 40 33)"/><ellipse id="line-basics-flower-6" cx="40" cy="21" rx="7" ry="11" transform="rotate(216 40 33)"/><ellipse id="line-basics-flower-7" cx="40" cy="21" rx="7" ry="11" transform="rotate(288 40 33)"/><path id="line-basics-flower-8" d="M26 71 Q29 66 40 68 Q49 66 55 71Z"/></defs><ellipse cx="40" cy="73" rx="19" ry="1.5" fill="#4B3A2A" opacity=".16"/><use href="#line-basics-flower-8" fill="#BE906B"/><use href="#line-basics-flower-8" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M40 41 Q38 58 40 68" fill="none" stroke="currentColor" stroke-width="5.2"/><path d="M40 41 Q38 58 40 68" fill="none" stroke="#9DBE8B" stroke-width="2.6"/><use href="#line-basics-flower-1" fill="#9DBE8B"/><g clip-path="url(#line-basics-flower-1c)"><path d="M21 45 L42 60 H22Z" fill="#6D925E" opacity="0.5"/></g><use href="#line-basics-flower-1" fill="none" stroke="currentColor" stroke-width="1.6"/><use href="#line-basics-flower-2" fill="#9DBE8B"/><g clip-path="url(#line-basics-flower-2c)"><path d="M45 58 l7 -5" fill="none" stroke="#FFFFFF" stroke-width="1.1" opacity="0.7"/></g><use href="#line-basics-flower-2" fill="none" stroke="currentColor" stroke-width="1.6"/><g class="line-basics-flower-motion"><use href="#line-basics-flower-3" fill="#E5907B"/><use href="#line-basics-flower-3" fill="none" stroke="currentColor" stroke-width="1.7"/><use href="#line-basics-flower-4" fill="#E5907B"/><use href="#line-basics-flower-4" fill="none" stroke="currentColor" stroke-width="1.7"/><use href="#line-basics-flower-5" fill="#E5907B"/><use href="#line-basics-flower-5" fill="none" stroke="currentColor" stroke-width="1.7"/><use href="#line-basics-flower-6" fill="#E5907B"/><use href="#line-basics-flower-6" fill="none" stroke="currentColor" stroke-width="1.7"/><use href="#line-basics-flower-7" fill="#E5907B"/><use href="#line-basics-flower-7" fill="none" stroke="currentColor" stroke-width="1.7"/></g><circle cx="40" cy="33" r="6" fill="#EBC568" stroke="currentColor" stroke-width="1.6"/><path d="M37 31 l2 -1" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7"/></svg>
