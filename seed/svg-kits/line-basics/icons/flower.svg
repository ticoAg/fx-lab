<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Flower / 小花"><title>Flower / 小花</title><desc>Stick flower with five round petals that slowly turn around a coral center, on a stem with one leaf. For spring, gardens, gifts and kindness. / 一枝线条小花：五片圆花瓣绕珊瑚色花心缓缓旋转，茎上一片叶子。用于春天、花园、礼物与善意。</desc><defs><filter id="line-soft-flower" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0.6" stdDeviation="0.4" flood-color="#2C2C2C" flood-opacity=".18"/></filter></defs><style>.line-spin{animation:line-spin 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes line-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.line-pop,.line-pulse,.line-spin,.line-float,.line-sway,.line-t{animation:none!important;stroke-dasharray:none}}</style><g filter="url(#line-soft-flower)"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M40 70 V40"/><path d="M40 60 Q30 58 27 48 Q36 49 40 56"/></g><g class="line-spin" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="40" cy="19" r="6"/><circle cx="48.6" cy="25.2" r="6"/><circle cx="45.3" cy="35.3" r="6"/><circle cx="34.7" cy="35.3" r="6"/><circle cx="31.4" cy="25.2" r="6"/></g><circle cx="40" cy="28" r="4" fill="#E07A5F"/></g></svg>
