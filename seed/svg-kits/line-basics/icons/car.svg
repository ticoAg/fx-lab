olor" stroke-width="2.4"/><use href="#line-basics-car-2" fill="#9FC7DA"/><g clip-path="url(#line-basics-car-2c)"><path d="M32 33 l-3 6" fill="none" stroke="#FFFFFF" stroke-width="1.1" opacity="0.7"/></g><use href="#line-basics-car-2" fill="none" stroke="currentColor" stroke-width="1.3"/><use href="#line-basics-car-3" fill="#9FC7DA"/><use href="#line-basics-car-3" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M12 48 H19 V52 H12Z" fill="#FFF2D8" stroke="currentColor" stroke-width="1"/><path d="M65 46 H69 V50 H65Z" fill="#EBC568" stroke="currentColor" stroke-width="1"/><path d="M43 47 h4" fill="none" stroke="currentColor" stroke-width="1.5"/></g></svg>
