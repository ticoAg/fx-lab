<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Car / 小汽车"><title>Car / 小汽车</title><desc>Friendly line car with a cabin, two wheels and a coral headlight, bumping along. For driving, transport, parking and trips. / 可爱的线条小汽车：车厢、两个轮子和珊瑚色车灯，一路颠簸前行。用于驾驶、交通、停车与出行。</desc><defs><filter id="line-soft-car" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0.6" stdDeviation="0.4" flood-color="#2C2C2C" flood-opacity=".18"/></filter></defs><style>.line-pulse{animation:line-pulse 3s steps(1) infinite}@keyframes line-pulse{0%,86%,100%{transform:translate(0,0)}88%{transform:translate(-1.5px,.5px)}90%{transform:translate(1.5px,-.5px)}92%{transform:translate(-.5px,0)}}@media (prefers-reduced-motion:reduce){.line-pop,.line-pulse,.line-spin,.line-float,.line-sway,.line-t{animation:none!important;stroke-dasharray:none}}</style><g filter="url(#line-soft-car)"><g class="line-pulse"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 56 H12 V46 Q12 42 16 42 L25 29 H50 L60 42 H64 Q68 42 68 46 V56 H61 M33 56 H47"/><path d="M28 42 L32 33 H38 V42 M43 33 H48 L54 42"/><path d="M16 42 H64" opacity=".6"/><circle cx="26" cy="56" r="6"/><circle cx="54" cy="56" r="6"/></g><circle cx="64" cy="48" r="2" fill="#E07A5F"/></g></g></svg>
