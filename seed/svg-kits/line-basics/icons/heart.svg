<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Heart / 爱心"><title>Heart / 爱心</title><desc>Rounded line heart with a soft coral wash, beating gently. For love, likes, favorites and health. / 圆润的线条爱心，内衬淡珊瑚色，轻轻跳动。用于爱、点赞、收藏与健康。</desc><defs><filter id="line-soft-heart" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0.6" stdDeviation="0.4" flood-color="#2C2C2C" flood-opacity=".18"/></filter></defs><style>.line-pulse{animation:line-pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes line-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.85;transform:scale(1.06)}}@media (prefers-reduced-motion:reduce){.line-pop,.line-pulse,.line-spin,.line-float,.line-sway,.line-t{animation:none!important;stroke-dasharray:none}}</style><g filter="url(#line-soft-heart)"><g class="line-pulse"><path d="M40 62 C20 48 14 38 18 30 C22 22 34 20 40 30 C46 20 58 22 62 30 C66 38 60 48 40 62Z" fill="#E07A5F" fill-opacity=".22" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 32 Q26 28 30 28" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/></g></g></svg>
