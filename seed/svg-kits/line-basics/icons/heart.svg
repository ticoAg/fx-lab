<svg xmlns="http://www.w3.org/2000/svg" id="line-basics-heart-root" viewBox="0 0 80 80" role="img" aria-label="Heart / 爱心" stroke-linecap="round" stroke-linejoin="round"><title>Heart / 爱心</title><desc>A coral heart has a darker lower-right edge and a curved upper-left highlight; it pulses beside two small golden glints. / 珊瑚红爱心带着右下暗面和左上弧形高光，伴着两颗小金色光点轻轻跳动。</desc><style>#line-basics-heart-root,#line-basics-heart-root g{animation-play-state:inherit}.line-basics-heart-motion{animation:line-basics-heart-pulse 3.8000000000000003s ease-in-out infinite;animation-play-state:inherit;transform-box:view-box;transform-origin:40px 43px}@keyframes line-basics-heart-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}@media (prefers-reduced-motion:reduce){.line-basics-heart-motion{animation:none!important;transform:none!important}}</style><defs><path id="line-basics-heart-1" d="M40 64 C29 55 13 44 14 29 C15 14 33 12 40 25 C48 11 66 15 66 30 C66 44 51 56 40 64Z"/><clipPath id="line-basics-heart-1c"><use href="#line-basics-heart-1"/></clipPath></defs><ellipse cx="40" cy="72" rx="21" ry="2.4" fill="#4B3A2A" opacity=".16"/><path d="M13 53 L13.9 55.1 L16 56 L13.9 56.9 L13 59 L12.1 56.9 L10 56 L12.1 55.1Z" fill="#EBC568" stroke="currentColor" stroke-width="1"/><circle cx="66" cy="16" r="2" fill="#EBC568"/><g class="line-basics-heart-motion"><use href="#line-basics-heart-1" fill="#E5907B"/><g clip-path="url(#line-basics-heart-1c)"><path d="M54 15 C60 37 43 55 35 62 L43 70 L73 42Z" fill="#BA6259" opacity="0.6"/><path d="M21 30 Q21 20 30 22" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.7"/></g><use href="#line-basics-heart-1" fill="none" stroke="currentColor" stroke-width="2.4"/></g></svg>
