<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Fern / 蕨"><title>Fern / 蕨</title><desc>Curved fern frond with paired leaflets tapering to a curled fiddlehead tip, waving softly. For nature, growth and new beginnings. / 弯弯的蕨叶，成对小叶逐渐变短，顶端卷成小卷芽，轻柔摆动。用于自然、成长与新的开始。</desc><defs><filter id="forest-shade-fern" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.2" stdDeviation="0" flood-color="#2E3326" flood-opacity=".18"/></filter></defs><style>.forest-sway{animation:forest-sway 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes forest-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion:reduce){.forest-sway,.forest-float,.forest-pulse,.forest-glow,.forest-blink,.forest-flow,.forest-creep,.forest-sparkle,.forest-drip{animation:none!important}}</style><g filter="url(#forest-shade-fern)"><path d="M8 69 H72" fill="none" stroke="#8DB255" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 69 l2 -5 l2 5 M62 69 l2 -5 l2 5" fill="none" stroke="#8DB255" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g class="forest-sway"><path d="M40 70 Q32 42 48 18 q5 -6 1 -9 q-5 -2 -5 3 q0 3 3 3" fill="none" stroke="#2F6B3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M38.2 62.2 L52.7 52.5 M38.2 62.2 L21.4 57.8 M37.6 57.6 L51.5 49.7 M37.6 57.6 L22.4 52.4 M37.3 53.0 L50.6 46.7 M37.3 53.0 L23.9 47.3 M37.4 48.5 L49.8 43.8 M37.4 48.5 L25.7 42.4 M37.8 44.0 L49.2 40.7 M37.8 44.0 L27.8 37.8 M38.6 39.6 L48.8 37.5 M38.6 39.6 L30.2 33.4 M39.7 35.3 L48.7 34.1 M39.7 35.3 L32.9 29.4 M41.2 31.0 L48.8 30.6 M41.2 31.0 L35.8 25.6 M43.0 26.8 L49.3 26.9 M43.0 26.8 L39.0 22.0" fill="none" stroke="#4E8F45" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>
