<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Acorn / 橡果"><title>Acorn / 橡果</title><desc>Plump golden-brown acorn with a cross-hatched cap and curly stem, bobbing gently above its shadow. For seeds, saving and small beginnings. / 圆鼓鼓的金棕橡果，网格纹果帽配弯弯果柄，在影子上方轻轻浮动。用于种子、储蓄与小小起点。</desc><defs><filter id="forest-shade-acorn" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.2" stdDeviation="0" flood-color="#2E3326" flood-opacity=".18"/></filter></defs><style>.forest-float{animation:forest-float 2.8s ease-in-out infinite}@keyframes forest-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@media (prefers-reduced-motion:reduce){.forest-sway,.forest-float,.forest-pulse,.forest-glow,.forest-blink,.forest-flow,.forest-creep,.forest-sparkle,.forest-drip{animation:none!important}}</style><g filter="url(#forest-shade-acorn)"><ellipse cx="40" cy="70" rx="14" ry="2.5" fill="currentColor" opacity=".18"/><g class="forest-float"><path d="M27 33 Q26 58 40 65 Q54 58 53 33Z" fill="#C98A4B" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 40 Q31 52 37 58" fill="none" stroke="#FBF5E1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/><path d="M21 34 Q21 15 40 15 Q59 15 59 34 Q40 38 21 34Z" fill="#7A5230" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 20 L44 35 M36 16 L52 31 M24 28 L30 34 M48 17 L57 26 M52 20 L36 35 M44 16 L28 32 M57 28 L52 34 M33 17 L24 26" fill="none" stroke="#5A3B22" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 15 Q41 8 47 7" fill="none" stroke="#5A3B22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>
