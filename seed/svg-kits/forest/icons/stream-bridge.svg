<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Stream bridge / 溪上小桥"><title>Stream bridge / 溪上小桥</title><desc>Arched wooden footbridge with stick railings over a blue creek whose ripples keep flowing. For paths, connections and crossings. / 弧形木板小桥配木棍栏杆，桥下蓝色溪水波纹不停流淌。用于路径、连接与跨越。</desc><defs><filter id="forest-shade-stream-bridge" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.2" stdDeviation="0" flood-color="#2E3326" flood-opacity=".18"/></filter></defs><style>.forest-flow{animation:forest-flow 1.6s linear infinite}@keyframes forest-flow{to{stroke-dashoffset:-24}}@media (prefers-reduced-motion:reduce){.forest-sway,.forest-float,.forest-pulse,.forest-glow,.forest-blink,.forest-flow,.forest-creep,.forest-sparkle,.forest-drip{animation:none!important}}</style><g filter="url(#forest-shade-stream-bridge)"><path d="M4 60 Q40 54 76 60 V72 H4Z" fill="#6FAFC4" opacity=".45"/><path d="M10 63 H34 M44 63 H70 M18 68 H58" fill="none" stroke="#6FAFC4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 4" class="forest-flow"/><path d="M4 58 Q4 48 14 52 L12 60Z M76 58 Q76 48 66 52 L68 60Z" fill="#8DB255"/><path d="M15.7 45.7 V35.7 M27.8 39.2 V29.2 M40.0 37.0 V27.0 M52.2 39.2 V29.2 M64.3 45.7 V35.7 " fill="none" stroke="#7A5230" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 42 Q40 14 68 42" fill="none" stroke="#7A5230" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 52 Q40 22 72 52" fill="none" stroke="#5A3B22" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
