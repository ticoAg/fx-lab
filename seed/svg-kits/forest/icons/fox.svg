<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Fox / 狐狸"><title>Fox / 狐狸</title><desc>Sitting orange fox with pointed ears, a cream muzzle and a bushy white-tipped tail that wags. For curiosity, cleverness and play. / 端坐的橙色小狐狸，尖耳朵奶油色嘴套，白尖大尾巴轻轻摇摆。用于好奇、机灵与玩耍。</desc><defs><filter id="forest-shade-fox" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.2" stdDeviation="0" flood-color="#2E3326" flood-opacity=".18"/></filter></defs><style>.forest-sway{animation:forest-sway 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes forest-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion:reduce){.forest-sway,.forest-float,.forest-pulse,.forest-glow,.forest-blink,.forest-flow,.forest-creep,.forest-sparkle,.forest-drip{animation:none!important}}</style><g filter="url(#forest-shade-fox)"><path d="M8 69 H72" fill="none" stroke="#8DB255" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 69 l2 -5 l2 5 M62 69 l2 -5 l2 5" fill="none" stroke="#8DB255" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g class="forest-sway" style="transform-origin:0% 100%"><path d="M48 67 Q71 68 68 47 Q66 39 59 43 Q62 56 48 60Z" fill="#D9772E" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M68 47 Q66 39 59 43 Q64 45 66 51Z" fill="#FBF5E1"/></g><path d="M30 44 Q22 69 34 69 H48 Q58 69 50 44Z" fill="#D9772E" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M36 47 Q40 62 44 47Z" fill="#FBF5E1"/><path d="M24 14 L32 25 H48 L56 14 L56 30 Q52 45 40 46 Q28 45 24 30Z" fill="#D9772E" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M27 19 L31 25 L27 26Z M53 19 L49 25 L53 26Z" fill="currentColor"/><path d="M31 36 Q40 49 49 36 Q40 40 31 36Z" fill="#FBF5E1"/><circle cx="40" cy="42" r="2" fill="cur