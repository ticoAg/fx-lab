<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Mossy stone / 青苔石"><title>Mossy stone / 青苔石</title><desc>Rounded grey stone wearing a wavy moss cap, a tiny sprout swaying on top and a dew drop sliding off. For calm, nature and stability. / 圆润灰石披着波浪青苔，顶上小芽轻摆，一滴露珠缓缓滑落。用于宁静、自然与稳定。</desc><defs><filter id="forest-shade-mossy-stone" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.2" stdDeviation="0" flood-color="#2E3326" flood-opacity=".18"/></filter></defs><style>.forest-sway{animation:forest-sway 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.forest-drip{animation:forest-drip 2.6s ease-in infinite}@keyframes forest-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@keyframes forest-drip{0%,30%{transform:translateY(0);opacity:1}90%{transform:translateY(9px);opacity:0}100%{transform:translateY(0);opacity:0}}@media (prefers-reduced-motion:reduce){.forest-sway,.forest-float,.forest-pulse,.forest-glow,.forest-blink,.forest-flow,.forest-creep,.forest-sparkle,.forest-drip{animation:none!important}}</style><g filter="url(#forest-shade-mossy-stone)"><path d="M8 69 H72" fill="none" stroke="#8DB255" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 69 l2 -5 l2 5 M62 69 l2 -5 l2 5" fill="none" stroke="#8DB255" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 68 Q10 47 26 40 Q40 32 56 40 Q71 48 68 68Z" fill="#A4A796" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 50 Q24 37 40 36 Q56 35 64 47 Q58 44 53 49 Q47 44 41 49 Q34 44 28 50 Q22 46 17 50Z" fill="#8DB255" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 58 L36 62 L34 66" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><g class="forest-sway"><path d="M40 36 V26" fill="none" stroke="#2F6B3A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="35.5" cy="25" rx="4.5" ry="2.5" fill="#4E8F45" transform="rotate(-25 35.5 25)"/><ellipse cx="44.5" cy="23" rx="4.5" ry="2.5" fill="#4E8F45" transform="rotate(25 44.5 23)"/></g><path d="M62 49 Q65 54 62 56 Q59 54 62 49Z" fill="#6FAFC4" class="forest-drip"/></g></svg>
