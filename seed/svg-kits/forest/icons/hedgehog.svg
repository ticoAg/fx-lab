<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Hedgehog / 刺猬"><title>Hedgehog / 刺猬</title><desc>Spiky brown hedgehog with a tan face and button nose, its prickles rising and falling as it breathes. For protection, defense and coziness. / 棕色尖刺的小刺猬，浅棕小脸纽扣鼻，背刺随呼吸起伏。用于保护、防御与温馨。</desc><defs><filter id="forest-shade-hedgehog" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.2" stdDeviation="0" flood-color="#2E3326" flood-opacity=".18"/></filter></defs><style>.forest-pulse{animation:forest-pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes forest-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}@media (prefers-reduced-motion:reduce){.forest-sway,.forest-float,.forest-pulse,.forest-glow,.forest-blink,.forest-flow,.forest-creep,.forest-sparkle,.forest-drip{animation:none!important}}</style><g filter="url(#forest-shade-hedgehog)"><path d="M8 69 H72" fill="none" stroke="#8DB255" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 69 l2 -5 l2 5 M62 69 l2 -5 l2 5" fill="none" stroke="#8DB255" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g class="forest-pulse"><polygon points="22.0,64.0 15.2,61.1 22.6,59.8 16.9,55.4 24.4,55.9 20.2,50.3 27.3,52.5 24.8,46.1 31.0,50.0 30.4,43.2 35.3,48.4 36.7,41.7 40.0,47.8 43.3,41.7 44.7,48.4 49.6,43.2 49.0,50.0 55.2,46.1 52.7,52.5 59.8,50.3 55.6,55.9 63.1,55.4 57.4,59.8 64.8,61.1 58.0,64.0" fill="#5A3B22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M24 64 Q24 50 40 49 Q56 50 56 64Z" fill="#7A5230"/><path d="M52 47 Q70 51 72 61 Q68 66 52 66Z" fill="#D9BC8C" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="72" cy="60" r="2.5" fill="currentColor"/><circle cx="61" cy="54" r="1.8" fill="currentColor"/><path d="M30 66 V69 M46 66 V69" fill="none" stroke="currentColor" stroke-width="2.5" stroke-l