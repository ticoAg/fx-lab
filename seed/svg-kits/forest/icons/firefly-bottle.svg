<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Firefly bottle / 萤火虫瓶"><title>Firefly bottle / 萤火虫瓶</title><desc>Corked glass jar of night air holding four yellow-green fireflies that glow on and off in turn. For ideas, wishes, collections and night light. / 软木塞玻璃瓶装着夜色，四只黄绿萤火虫轮流明灭。用于灵感、愿望、收藏与夜灯。</desc><defs><filter id="forest-shade-firefly-bottle" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.2" stdDeviation="0" flood-color="#2E3326" flood-opacity=".18"/></filter></defs><style>.forest-glow{animation:forest-glow 1.8s ease-in-out infinite}@keyframes forest-glow{0%,100%{opacity:.35}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.forest-sway,.forest-float,.forest-pulse,.forest-glow,.forest-blink,.forest-flow,.forest-creep,.forest-sparkle,.forest-drip{animation:none!important}}</style><g filter="url(#forest-shade-firefly-bottle)"><rect x="31" y="11" width="18" height="9" rx="2" fill="#7A5230" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="29" y="19" width="22" height="6" rx="2" fill="#3B5A40" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="19" y="24" width="42" height="46" rx="10" fill="#2E4A34" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M25 34 V56" fill="none" stroke="#FBF5E1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/><path d="M29 22 Q19 24 22 32" fill="none" stroke="#D9BC8C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><g class="forest-glow" style="animation-delay:0s"><circle cx="34" cy="43" r="6" fill="#D9F25A" opacity=".3"/><circle cx="34" cy="43" r="2.8" fill="#D9F25A"/></g><g class="forest-glow" style="animation-delay:0.5s"><circle cx="48" cy="36" r="6" fill="#D9F25A" opacity=".3"/><circle cx="48" cy="36" r="2.8" fill="#D9F25A"/></g><g class="forest-glow" style="animation-delay:0.9s"><circle cx="40" cy="58" r="6" fill="#D9F25A" opacity=".3"/><circle cx="40" cy="58" r="2.8" fill="#D9F25A"/></g><g class="forest-glow" style="animation-delay:1.3s"><circle cx="51" cy="53" r="6" fill="#D9F25A" opacity=".3"/><circle cx="51" cy="53" r="2.8" fill="#D9F25A"/></g></g></svg>
