<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Pine tree / 松树"><title>Pine tree / 松树</title><desc>Three stacked green triangles on a short bark trunk, swaying gently in the breeze. For forests, outdoors, seasons and growth. / 三层绿色三角叠成的松树，短短树干，在微风里轻轻摇摆。用于森林、户外、季节与成长。</desc><defs><filter id="forest-shade-pine-tree" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.2" stdDeviation="0" flood-color="#2E3326" flood-opacity=".18"/></filter></defs><style>.forest-sway{animation:forest-sway 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes forest-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion:reduce){.forest-sway,.forest-float,.forest-pulse,.forest-glow,.forest-blink,.forest-flow,.forest-creep,.forest-sparkle,.forest-drip{animation:none!important}}</style><g filter="url(#forest-shade-pine-tree)"><path d="M8 69 H72" fill="none" stroke="#8DB255" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 69 l2 -5 l2 5 M62 69 l2 -5 l2 5" fill="none" stroke="#8DB255" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="36" y="57" width="8" height="12" fill="#7A5230" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g class="forest-sway"><polygon points="40,32 64,59 16,59" fill="#2F6B3A" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polygon points="40,20 59,45 21,45" fill="#2F6B3A" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polygon points="40,8 55,31 25,31" fill="#2F6B3A" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 52 L36 48 M48 40 L53 36" fill="none" stroke="#4E8F45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>
