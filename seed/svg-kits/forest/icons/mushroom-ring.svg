<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Mushroom ring / 蘑菇圈"><title>Mushroom ring / 蘑菇圈</title><desc>Fairy ring of small red and orange toadstools on a mossy patch, with yellow-green sparkles twinkling above. For magic, gatherings and surprises. / 苔地上一圈红橙相间的小蘑菇，围成仙女环，上方黄绿星光闪烁。用于魔法、聚会与惊喜。</desc><defs><filter id="forest-shade-mushroom-ring" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.2" stdDeviation="0" flood-color="#2E3326" flood-opacity=".18"/></filter></defs><style>.forest-sparkle{animation:forest-sparkle 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes forest-sparkle{0%,100%{opacity:.15;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}@media (prefers-reduced-motion:reduce){.forest-sway,.forest-float,.forest-pulse,.forest-glow,.forest-blink,.forest-flow,.forest-creep,.forest-sparkle,.forest-drip{animation:none!important}}</style><g filter="url(#forest-shade-mushroom-ring)"><ellipse cx="40" cy="54" rx="32" ry="14" fill="#8DB255" opacity=".5"/><g transform="translate(31.1 41.7) scale(0.81)"><rect x="-2" y="-8" width="4" height="8" fill="#FBF5E1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-6 -7 A6 6 0 0 1 6 -7Z" fill="#D9772E" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-1.5" cy="-9.5" r="1.1" fill="#FBF5E1"/></g><g transform="translate(53.0 42.5) scale(0.82)"><rect x="-2" y="-8" width="4" height="8" fill="#FBF5E1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-6 -7 A6 6 0 0 1 6 -7Z" fill="#C8443A" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-1.5" cy="-9.5" r="1.1" fill="#FBF5E1"/></g><g transform="translate(15.6 48.2) scale(0.88)"><rect x="-2" y="-8" width="4" height="8" fill="#FBF5E1" stroke="currentColor" stroke-width="1.5" stroke-lineca