<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Tree hollow / 树洞"><title>Tree hollow / 树洞</title><desc>Stout bark trunk under a rounded green crown, with a dark hollow where two firefly-yellow eyes blink. For hiding places, storage and secrets. / 圆润绿冠下的粗壮树干，漆黑树洞里一双黄绿小眼睛眨呀眨。用于藏身处、收纳与秘密。</desc><defs><filter id="forest-shade-tree-hollow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.2" stdDeviation="0" flood-color="#2E3326" flood-opacity=".18"/></filter></defs><style>.forest-blink{animation:forest-blink 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes forest-blink{0%,44%,52%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}@media (prefers-reduced-motion:reduce){.forest-sway,.forest-float,.forest-pulse,.forest-glow,.forest-blink,.forest-flow,.forest-creep,.forest-sparkle,.forest-drip{animation:none!important}}</style><g filter="url(#forest-shade-tree-hollow)"><path d="M8 69 H72" fill="none" stroke="#8DB255" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 69 l2 -5 l2 5 M62 69 l2 -5 l2 5" fill="none" stroke="#8DB255" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 69 Q32 54 30 28 H50 Q48 54 54 69Z" fill="#7A5230" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 33 Q8 19 22 15 Q28 4 41 8 Q55 3 59 15 Q73 20 65 34 Q40 40 15 33Z" fill="#2F6B3A" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 22 Q28 18 32 20 M46 18 Q51 15 55 19" fill="none" stroke="#4E8F45" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="40" cy="51" rx="7" ry="9" fill="currentColor"/><g class="forest-blink"><circle cx="37" cy="49" r="1.8" fill="#D9F25A"/><circle cx="43" cy="49" r="1.8" fill="#D9F25A"/></g><path d="M34 36 V42 M47 60 V65" fill="none" stroke="#5A3B22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
