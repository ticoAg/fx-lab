<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Forest lantern / 森林提灯"><title>Forest lantern / 森林提灯</title><desc>Hanging bark-framed lantern on a hook with a warm flame flickering inside, swinging slightly. For light, guidance and evening paths. / 挂在钩上的木框提灯，里面暖色火苗摇曳闪烁，灯身微微晃动。用于照明、指引与傍晚小径。</desc><defs><filter id="forest-shade-lantern" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.2" stdDeviation="0" flood-color="#2E3326" flood-opacity=".18"/></filter></defs><style>.forest-sway{animation:forest-sway 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.forest-glow{animation:forest-glow 1.8s ease-in-out infinite}@keyframes forest-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@keyframes forest-glow{0%,100%{opacity:.35}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.forest-sway,.forest-float,.forest-pulse,.forest-glow,.forest-blink,.forest-flow,.forest-creep,.forest-sparkle,.forest-drip{animation:none!important}}</style><g filter="url(#forest-shade-lantern)"><path d="M40 4 V10" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g class="forest-sway" style="transform-origin:50% 0%"><path d="M30 21 Q40 6 50 21" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M27 23 H53 L48 17 H32Z" fill="#7A5230" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="27" y="23" width="26" height="33" rx="3" fill="#FFF1B8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="40" cy="40" r="10" fill="#D9F25A" opacity=".55" class="forest-glow"/><path d="M40 48 Q33 41 40 30 Q47 41 40 48Z" fill="#D9772E" class="forest-glow" style="animation-delay:0.4s"/><path d="M40 47 Q37 43 40 37 Q43 43 40 47Z" fill="#D9F25A"/><path d="M34 23 V56 M46 23 V56" fill="none" stroke="#7A5230" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="25" y="56" width="30" height="6" rx="2" fill="#7A5230" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>
