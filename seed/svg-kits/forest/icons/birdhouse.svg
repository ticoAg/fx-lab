<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Birdhouse / 鸟屋"><title>Birdhouse / 鸟屋</title><desc>Little wooden birdhouse on a post with a red roof and round entry hole, and a blue bird hopping below. For nests, inbox and welcome. / 立柱上的小木鸟屋，红色屋顶与圆形洞口，下方一只蓝色小鸟蹦蹦跳跳。用于巢穴、收件箱与欢迎。</desc><defs><filter id="forest-shade-birdhouse" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.2" stdDeviation="0" flood-color="#2E3326" flood-opacity=".18"/></filter></defs><style>.forest-float{animation:forest-float 2.8s ease-in-out infinite}@keyframes forest-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@media (prefers-reduced-motion:reduce){.forest-sway,.forest-float,.forest-pulse,.forest-glow,.forest-blink,.forest-flow,.forest-creep,.forest-sparkle,.forest-drip{animation:none!important}}</style><g filter="url(#forest-shade-birdhouse)"><path d="M8 69 H72" fill="none" stroke="#8DB255" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 69 l2 -5 l2 5 M62 69 l2 -5 l2 5" fill="none" stroke="#8DB255" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="37" y="48" width="6" height="21" fill="#7A5230" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 30 L40 17 L56 30 V50 H24Z" fill="#E8C77A" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 33 L40 13 L61 33" fill="none" stroke="#C8443A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="40" cy="34" r="5" fill="currentColor"/><path d="M35 44 H45" fill="none" stroke="#5A3B22" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g class="forest-float"><path d="M10 60 L6 57 L8 62Z" fill="#3F7393"/><ellipse cx="16" cy="61" rx="7" ry="5" fill="#5A9BC0" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="22" cy="55" r="4" fill="#5A9BC0" 