<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Antler branch / 鹿角枝"><title>Antler branch / 鹿角枝</title><desc>Bare bark branch forking like a pair of antlers, with fresh green buds at the tips, swaying in the wind. For wilderness, deer trails and branching paths. / 像一对鹿角般分叉的光秃树枝，枝梢冒出嫩绿新芽，随风摇曳。用于荒野、鹿径与分支路径。</desc><defs><filter id="forest-shade-antler-branch" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.2" stdDeviation="0" flood-color="#2E3326" flood-opacity=".18"/></filter></defs><style>.forest-sway{animation:forest-sway 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes forest-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion:reduce){.forest-sway,.forest-float,.forest-pulse,.forest-glow,.forest-blink,.forest-flow,.forest-creep,.forest-sparkle,.forest-drip{animation:none!important}}</style><g filter="url(#forest-shade-antler-branch)"><path d="M22 70 Q40 62 58 70Z" fill="#8DB255"/><g class="forest-sway"><path d="M40 70 V48 M40 52 Q28 45 24 30 M24 30 L22 17 M24 31 L13 24 M29 42 L16 40 M40 52 Q52 45 56 30 M56 30 L58 17 M56 31 L67 24 M51 42 L64 40" fill="none" stroke="#7A5230" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="21" cy="13" rx="4" ry="2.4" fill="#4E8F45" transform="rotate(-70 21 13)"/><ellipse cx="59" cy="13" rx="4" ry="2.4" fill="#4E8F45" transform="rotate(70 59 13)"/><ellipse cx="10" cy="22" rx="4" ry="2.4" fill="#4E8F45" transform="rotate(-30 10 22)"/><ellipse cx="70" cy="22" rx="4" ry="2.4" fill="#4E8F45" transform="rotate(30 70 22)"/><ellipse cx="13" cy="39" rx="4" ry="2.4" fill="#4E8F45" transform="rotate(10 13 39)"/><ellipse cx="67" cy="39" rx="4" ry="2.4" fill="#4E8F45" transform="rotate(-10 67 39)"/></g></g></svg>
