<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Owl / 猫头鹰"><title>Owl / 猫头鹰</title><desc>Round brown owl with ear tufts perched on a branch, its big cream eyes blinking slowly. For wisdom, night mode and learning. / 圆滚滚的棕色猫头鹰立在枝头，竖着耳羽，奶油色大眼睛缓缓眨动。用于智慧、夜间模式与学习。</desc><defs><filter id="forest-shade-owl" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.2" stdDeviation="0" flood-color="#2E3326" flood-opacity=".18"/></filter></defs><style>.forest-blink{animation:forest-blink 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes forest-blink{0%,44%,52%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}@media (prefers-reduced-motion:reduce){.forest-sway,.forest-float,.forest-pulse,.forest-glow,.forest-blink,.forest-flow,.forest-creep,.forest-sparkle,.forest-drip{animation:none!important}}</style><g filter="url(#forest-shade-owl)"><path d="M8 65 H72" fill="none" stroke="#5A3B22" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="66" cy="60" rx="5" ry="2.5" fill="#4E8F45" transform="rotate(-30 66 60)"/><path d="M26 23 L24 11 L34 18Z M54 23 L56 11 L46 18Z" fill="#7A5230" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 31 Q22 63 40 63 Q58 63 56 31 Q56 16 40 16 Q24 16 24 31Z" fill="#7A5230" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="40" cy="50" rx="10" ry="11" fill="#D9BC8C"/><path d="M36 47 l2 2 l2 -2 M40 53 l2 2 l2 -2" fill="none" stroke="#7A5230" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><g class="forest-blink"><circle cx="32" cy="32" r="7.5" fill="#FBF5E1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="48" cy="32" r="7.5" fill="#FBF5E1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="32" r="3.2" fill="currentColor"/><circle cx="48" cy="32" r="3.2" fill="currentColor"/></g><path d="M37 39 L40 44 L43 39Z" fill="#D9772E"/><path d="M35 63 V67 M45 63 V67" fill="none" stroke="#D9772E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
