<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Mushroom house / 蘑菇小屋"><title>Mushroom house / 蘑菇小屋</title><desc>Red-capped mushroom cottage with cream spots, an arched door and two round windows glowing warm. For home, cozy spaces and the forest kit cover. / 红色斑点伞盖的蘑菇小屋，拱形木门，两扇圆窗暖光明灭。用于首页、温馨空间与森林套件封面。</desc><defs><filter id="forest-shade-mushroom-house" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.2" stdDeviation="0" flood-color="#2E3326" flood-opacity=".18"/></filter></defs><style>.forest-glow{animation:forest-glow 1.8s ease-in-out infinite}@keyframes forest-glow{0%,100%{opacity:.35}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.forest-sway,.forest-float,.forest-pulse,.forest-glow,.forest-blink,.forest-flow,.forest-creep,.forest-sparkle,.forest-drip{animation:none!important}}</style><g filter="url(#forest-shade-mushroom-house)"><path d="M8 69 H72" fill="none" stroke="#8DB255" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 69 l2 -5 l2 5 M62 69 l2 -5 l2 5" fill="none" stroke="#8DB255" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="22" y="40" width="36" height="29" rx="5" fill="#FBF5E1" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M34 69 V58 A6 6 0 0 1 46 58 V69Z" fill="#7A5230" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="28" cy="52" r="4" fill="#D9F25A" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="forest-glow"/><circle cx="52" cy="52" r="4" fill="#D9F25A" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="forest-glow" style="animation-delay:0.6s"/><path d="M11 40 Q11 11 40 11 Q69 11 69 40 Q40 47 11 40Z" fill="#C8443A" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g fill="#FBF5E1"><circle cx="25" cy="28" r="4"/><circle cx="41" cy="19" r="3.5"/><circle cx="55" cy="30" r="4.5"/><circle cx="37" cy="33" r="2.5"/></g></g></svg>
