<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none">
  <defs>
    <style>
      .pop { transform-origin: center; animation: pop 1.6s ease-in-out infinite; }
      .pop2 { transform-origin: center; animation: pop 1.6s ease-in-out 0.2s infinite; }
      .pop3 { transform-origin: center; animation: pop 1.6s ease-in-out 0.4s infinite; }
      .spin { transform-origin: 80px 80px; animation: spin 8s linear infinite; }
      .float { animation: float 2.4s ease-in-out infinite; }
      .pulse { animation: pulse 1.8s ease-in-out infinite; }
      @keyframes pop {
        0%,100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes float {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      @keyframes pulse {
        0%,100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.06); }
      }
    </style>
  </defs>

  <!-- 1 star -->
  <g class="pop" transform="translate(40,40)">
    <polygon points="40,4 48,28 74,28 52,44 60,70 40,54 20,70 28,44 6,28 32,28" fill="#FFB703"/>
  </g>

  <!-- 2 heart -->
  <g class="pop2" transform="translate(140,36)">
    <path d="M40 68 C40 68 8 48 8 28 C8 14 20 8 30 8 C36 8 40 12 40 12 C40 12 44 8 50 8 C60 8 72 14 72 28 C72 48 40 68 40 68Z" fill="#FB5607"/>
  </g>

  <!-- 3 bolt -->
  <g class="pop3" transform="translate(250,40)">
    <path d="M48 4 L20 44 H38 L28 76 L64 36 H46 Z" fill="#8338EC"/>
  </g>

  <!-- 4 gear -->
  <g class="spin" transform="translate(360,40)">
    <circle cx="40" cy="40" r="14" fill="#3A86FF"/>
    <path d="M40 8 L44 18 L36 18 Z M40 62 L44 52 L36 52 Z M8 40 L18 36 L18 44 Z M72 40 L62 36 L62 44 Z M18 18 L26 24 L22 28 Z M62 62 L54 56 L58 52 Z M62 18 L54 24 L58 28 Z M18 62 L26 56 L22 52 Z" fill="#3A86FF"/>
    <circle cx="40" cy="40" r="8" fill="#fff"/>
  </g>

  <!-- 5 cloud -->
  <g class="float" transform="translate(480,48)">
    <ellipse cx="28" cy="36" rx="22" ry="14" fill="#8ECAE6"/>
    <ellipse cx="48" cy="32" rx="18" ry="16" fill="#8ECAE6"/>
    <ellipse cx="66" cy="38" rx="16" ry="12" fill="#8ECAE6"/>
  </g>

  <!-- 6 pin -->
  <g class="pulse" transform="translate(620,36)">
    <path d="M40 8 C24 8 12 20 12 36 C12 56 40 80 40 80 C40 80 68 56 68 36 C68 20 56 8 40 8Z" fill="#EF233C"/>
    <circle cx="40" cy="34" r="10" fill="#fff"/>
  </g>

  <!-- 7 chat -->
  <g class="pop" transform="translate(40,160)">
    <rect x="8" y="12" width="72" height="48" rx="14" fill="#06D6A0"/>
    <polygon points="24,60 20,78 40,60" fill="#06D6A0"/>
  </g>

  <!-- 8 camera -->
  <g class="float" transform="translate(150,160)">
    <rect x="10" y="24" width="64" height="44" rx="8" fill="#118AB2"/>
    <circle cx="42" cy="46" r="12" fill="#fff"/>
    <circle cx="42" cy="46" r="7" fill="#118AB2"/>
    <rect x="28" y="16" width="20" height="10" rx="3" fill="#118AB2"/>
  </g>

  <!-- 9 music -->
  <g class="pop2" transform="translate(270,160)">
    <path d="M28 20 V58" stroke="#FF006E" stroke-width="6" stroke-linecap="round"/>
    <circle cx="22" cy="62" r="10" fill="#FF006E"/>
    <path d="M28 20 L58 12 V50" stroke="#FF006E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="52" cy="54" r="10" fill="#FF006E"/>
  </g>

  <!-- 10 check -->
  <g class="pulse" transform="translate(400,160)">
    <circle cx="40" cy="40" r="32" fill="#2ECC71"/>
    <path d="M22 42 L34 54 L58 28" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 11 arrow -->
  <g class="pop3" transform="translate(520,160)">
    <rect x="12" y="32" width="40" height="16" rx="4" fill="#F4A261"/>
    <polygon points="48,20 76,40 48,60" fill="#F4A261"/>
  </g>

  <!-- 12 spark -->
  <g class="spin" transform="translate(660,160)">
    <path d="M40 4 L46 28 L70 34 L46 40 L40 64 L34 40 L10 34 L34 28 Z" fill="#FFD60A"/>
  </g>

  <!-- labels -->
  <g font-family="system-ui,sans-serif" font-size="12" fill="#334155">
    <text x="40" y="130">star</text>
    <text x="140" y="130">heart</text>
    <text x="250" y="130">bolt</text>
    <text x="360" y="130">gear</text>
    <text x="480" y="130">cloud</text>
    <text x="620" y="130">pin</text>
    <text x="40" y="250">chat</text>
    <text x="150" y="250">camera</text>
    <text x="270" y="250">music</text>
    <text x="400" y="250">check</text>
    <text x="520" y="250">arrow</text>
    <text x="660" y="250">spark</text>
  </g>
</svg>
