<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="Druid staff / 法杖"><title>Druid staff / 法杖</title><desc>Gnarled bark staff with a curled head cradling a softly pulsing golden seed-gem, two leaves budding on the shaft. For magic, skills and power.</desc><style>.druid-pulse{animation:druid-pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes druid-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.8;transform:scale(1.08)}}@media (prefers-reduced-motion:reduce){.druid-pulse,.druid-float,.druid-spin,.druid-sway,.druid-pop{animation:none!important}}</style><path d="M34 72 L40 28" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 28 C37 14 55 9 57 20 C58 29 47 31 46 24" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(38 46) rotate(-150)"><path d="M0 0 Q5.5 -4.6 11 0 Q5.5 4.6 0 0Z" fill="#86AD55" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M1 0 H9" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(37 54) rotate(-20)"><path d="M0 0 Q5.0 -4.2 10 0 Q5.0 4.2 0 0Z" fill="#86AD55" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M1 0 H8" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><g class="druid-pulse"><circle cx="49" cy="20" r="4.5" fill="#C9A23A" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="47.8" cy="18.6" r="1.2" fill="#FBF6E6"/></g></svg>
