<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="Bark shield / 树皮盾"><title>Bark shield / 树皮盾</title><desc>Heater shield of layered bark with grain lines and a living leaf emblem, popping like a block. For defense, protection and armor.</desc><style>.druid-pop{animation:druid-pop 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes druid-pop{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.12)}90%{transform:scale(.96)}}@media (prefers-reduced-motion:reduce){.druid-pulse,.druid-float,.druid-spin,.druid-sway,.druid-pop{animation:none!important}}</style><g class="druid-pop"><path d="M40 11 L63 19 V39 C63 55 52 65 40 70 C28 65 17 55 17 39 V19Z" fill="#A27449" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M26 22 C24 34 28 48 32 62"/><path d="M54 22 C56 34 52 48 48 62"/><path d="M22 30 C21 38 22 44 25 52"/><path d="M58 30 C59 38 58 44 55 52"/></g><circle cx="40" cy="40" r="11" fill="#F5EFDC" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(33 44) rotate(-50)"><path d="M0 0 Q7.5 -6.3 15 0 Q7.5 6.3 0 0Z" fill="#86AD55" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M1 0 H13" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>
