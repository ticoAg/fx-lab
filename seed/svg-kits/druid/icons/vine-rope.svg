<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="Vine rope / 藤蔓绳"><title>Vine rope / 藤蔓绳</title><desc>Two twisted vine strands braided into a rope with leaves sprouting along it, swaying in a breeze. For links, binding, climbing and connections.</desc><style>.druid-sway{animation:druid-sway 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes druid-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}@media (prefers-reduced-motion:reduce){.druid-pulse,.druid-float,.druid-spin,.druid-sway,.druid-pop{animation:none!important}}</style><g class="druid-sway"><g fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M40 10 C28 20 52 28 40 38 C28 48 52 56 40 70"/></g><g fill="none" stroke="#A27449" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M40 10 C52 20 28 28 40 38 C52 48 28 56 40 70"/></g><g transform="translate(45 24) rotate(-30)"><path d="M0 0 Q5.5 -4.6 11 0 Q5.5 4.6 0 0Z" fill="#86AD55" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M1 0 H9" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(35 40) rotate(-150)"><path d="M0 0 Q5.5 -4.6 11 0 Q5.5 4.6 0 0Z" fill="#86AD55" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M1 0 H9" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(45 54) rotate(-30)"><path d="M0 0 Q5.0 -4.2 10 0 Q5.0 4.2 0 0Z" fill="#86AD55" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M1 0 H8" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="40" cy="70" r="2.5" fill="currentColor"/></g></svg>
