<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="Oak leaf / 橡叶"><title>Oak leaf / 橡叶</title><desc>Lobed oak leaf in leaf green with a moss midrib and veins, a tiny acorn at its stem, swaying. For nature, seasons, eco and growth stats.</desc><style>.druid-sway{animation:druid-sway 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes druid-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}@media (prefers-reduced-motion:reduce){.druid-pulse,.druid-float,.druid-spin,.druid-sway,.druid-pop{animation:none!important}}</style><g class="druid-sway"><path d="M40 12 C46 12 48 18 46 22 C52 20 56 24 52 30 C60 30 62 36 56 40 C62 42 62 50 54 50 C56 56 50 60 44 56 L40 62 L36 56 C30 60 24 56 26 50 C18 50 18 42 24 40 C18 36 20 30 28 30 C24 24 28 20 34 22 C32 18 34 12 40 12Z" fill="#86AD55" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M40 18 V70"/><path d="M40 28 L48 24 M40 28 L32 24 M40 38 L52 34 M40 38 L28 34 M40 48 L50 46 M40 48 L30 46"/></g></g><g><ellipse cx="52" cy="67" rx="4" ry="4.5" fill="#C9A23A" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M47.5 64.5 Q52 61 56.5 64.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
