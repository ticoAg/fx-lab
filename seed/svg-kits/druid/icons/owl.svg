<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="Night owl / 夜枭"><title>Night owl / 夜枭</title><desc>Round owl perched on a branch with ear tufts, a gold beak and big moon-silver eyes that pop open. For wisdom, watch, hints and observation.</desc><style>.druid-pop{animation:druid-pop 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes druid-pop{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.12)}90%{transform:scale(.96)}}@media (prefers-reduced-motion:reduce){.druid-pulse,.druid-float,.druid-spin,.druid-sway,.druid-pop{animation:none!important}}</style><path d="M10 66 H70" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(62 66) rotate(-40)"><path d="M0 0 Q4.5 -3.8 9 0 Q4.5 3.8 0 0Z" fill="#86AD55" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M1 0 H7" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M22 30 L24 16 L32 24 Q40 21 48 24 L56 16 L58 30 C62 44 58 62 40 62 C22 62 18 44 22 30Z" fill="#A27449" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 50 Q40 58 50 50 M32 55 Q40 61 48 55" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><g class="druid-pop"><circle cx="32" cy="36" r="7" fill="#ECE3BF" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="48" cy="36" r="7" fill="#ECE3BF" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="36" r="2.6" fill="currentColor"/><circle cx="48" cy="36" r="2.6" fill="currentColor"/></g><path d="M37 43 L43 43 L40 48Z" fill="#C9A23A" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M34 62 V66 M38 62 V66 M42 62 V66 M46 62 V66"/></g></svg>
