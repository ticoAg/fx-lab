<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="Crescent moon / 新月"><title>Crescent moon / 新月</title><desc>Cream crescent moon with a silver outline drifting among three small gold stars. For night mode, sleep, rest and lunar events.</desc><style>.druid-float{animation:druid-float 3s ease-in-out infinite}@keyframes druid-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@media (prefers-reduced-motion:reduce){.druid-pulse,.druid-float,.druid-spin,.druid-sway,.druid-pop{animation:none!important}}</style><g class="druid-float"><path d="M40 16 A24 24 0 1 0 40 64 A30 30 0 0 1 40 16Z" fill="#ECE3BF" stroke="#8E9AA6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><g fill="#C9A23A"><path d="M56 20 L57.5 24 L61.5 25.5 L57.5 27 L56 31 L54.5 27 L50.5 25.5 L54.5 24Z"/><path d="M63 44 L64 46.5 L66.5 47.5 L64 48.5 L63 51 L62 48.5 L59.5 47.5 L62 46.5Z"/><circle cx="52" cy="58" r="1.8"/></g></g></svg>
