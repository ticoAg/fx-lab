<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="Stone cairn / 石堆"><title>Stone cairn / 石堆</title><desc>Stacked cairn of four rounded stones with a moss tuft on top, gently swaying as if balanced. For waypoints, markers, balance and checkpoints.</desc><style>.druid-sway{animation:druid-sway 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes druid-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}@media (prefers-reduced-motion:reduce){.druid-pulse,.druid-float,.druid-spin,.druid-sway,.druid-pop{animation:none!important}}</style><path d="M10 70 H70" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g class="druid-sway"><ellipse cx="40" cy="62" rx="22" ry="8" fill="#B3AC9C" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="38" cy="48" rx="16" ry="7" fill="#C4BEAF" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="41" cy="36" rx="11" ry="5.5" fill="#B3AC9C" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="40" cy="26" rx="7" ry="4" fill="#C4BEAF" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M36 22 Q40 17 44 22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(40 20) rotate(-60)"><path d="M0 0 Q3.5 -2.9 7 0 Q3.5 2.9 0 0Z" fill="#86AD55" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M1 0 H5" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>
