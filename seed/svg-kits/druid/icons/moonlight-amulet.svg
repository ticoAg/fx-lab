<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="Moonlight amulet / 月光护符"><title>Moonlight amulet / 月光护符</title><desc>Silver-cream disc amulet on a cord, a crescent moon set inside a gold rim, glowing with a gentle pulse. For buffs, blessings and night powers.</desc><style>.druid-pulse{animation:druid-pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes druid-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.8;transform:scale(1.08)}}@media (prefers-reduced-motion:reduce){.druid-pulse,.druid-float,.druid-spin,.druid-sway,.druid-pop{animation:none!important}}</style><path d="M22 10 L40 32 L58 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g class="druid-pulse"><circle cx="40" cy="48" r="18" fill="#ECE3BF" stroke="#C9A23A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M44 37 A11 11 0 1 0 44 59 A13 13 0 0 1 44 37Z" fill="#8E9AA6"/><circle cx="49" cy="44" r="1.4" fill="#C9A23A"/><circle cx="51" cy="52" r="1" fill="#C9A23A"/></g><circle cx="40" cy="31" r="2.5" fill="#C9A23A" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
