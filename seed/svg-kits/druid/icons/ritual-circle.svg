<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="Ritual circle / 仪式圆环"><title>Ritual circle / 仪式圆环</title><desc>Standing-stone ritual circle: a slowly turning rune ring around a moon-gold triangle and four marker stones. For rituals, events, portals and loading.</desc><style>.druid-spin{animation:druid-spin 14s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes druid-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.druid-pulse,.druid-float,.druid-spin,.druid-sway,.druid-pop{animation:none!important}}</style><g class="druid-spin"><circle cx="40" cy="40" r="29" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="40" cy="40" r="24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M40 9 V14 M40 66 V71 M9 40 H14 M66 40 H71 M18 18 L21.5 21.5 M62 18 L58.5 21.5 M18 62 L21.5 58.5 M62 62 L58.5 58.5"/></g></g><polygon points="40,25 53,48 27,48" fill="none" stroke="#C9A23A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="40" cy="40" r="4" fill="#ECE3BF" stroke="#8E9AA6" stroke-width="1.6"/><g fill="#B3AC9C" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="37" y="16" width="6" height="7" rx="2"/><rect x="37" y="57" width="6" height="7" rx="2"/><rect x="16" y="37" width="7" height="6" rx="2"/><rect x="57" y="37" width="7" height="6" rx="2"/></g></svg>
