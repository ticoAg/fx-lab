<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="Wolf paw / 狼爪印"><title>Wolf paw / 狼爪印</title><desc>Bark-brown wolf paw print with a main pad, four oval toes and small claw tips, popping like a fresh track. For tracking, companions and beast forms.</desc><style>.druid-pop{animation:druid-pop 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes druid-pop{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.12)}90%{transform:scale(.96)}}@media (prefers-reduced-motion:reduce){.druid-pulse,.druid-float,.druid-spin,.druid-sway,.druid-pop{animation:none!important}}</style><g class="druid-pop"><path d="M40 44 C50 44 58 54 56 61 C54 67 47 64 40 64 C33 64 26 67 24 61 C22 54 30 44 40 44Z" fill="currentColor" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><g fill="currentColor" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="22" cy="38" rx="5" ry="6.5" transform="rotate(-25 22 38)"/><ellipse cx="33" cy="27" rx="5" ry="7"/><ellipse cx="47" cy="27" rx="5" ry="7"/><ellipse cx="58" cy="38" rx="5" ry="6.5" transform="rotate(25 58 38)"/></g><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 29 L16 25 M33 18 V14 M47 18 V14 M62 29 L64 25"/></g></g></svg>
