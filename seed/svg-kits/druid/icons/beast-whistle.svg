<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="Beast whistle / 唤兽哨"><title>Beast whistle / 唤兽哨</title><desc>Carved bone whistle on a cord with finger holes, sending out pulsing sound arcs. For summons, pets, calls and notifications.</desc><style>.druid-pulse{animation:druid-pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes druid-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.8;transform:scale(1.08)}}@media (prefers-reduced-motion:reduce){.druid-pulse,.druid-float,.druid-spin,.druid-sway,.druid-pop{animation:none!important}}</style><g transform="rotate(-30 34 48)"><rect x="12" y="42" width="42" height="13" rx="6.5" fill="#ECE3BF" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 48.5 H20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="30" cy="48.5" r="2" fill="currentColor"/><circle cx="38" cy="48.5" r="2" fill="currentColor"/><circle cx="46" cy="48.5" r="2" fill="currentColor"/></g><path d="M20 60 Q14 70 24 72 Q32 72 30 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g class="druid-pulse"><g fill="none" stroke="#C9A23A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M54 20 A8 8 0 0 1 60 30"/><path d="M58 13 A16 16 0 0 1 68 31"/></g></g></svg>
