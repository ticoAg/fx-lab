<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="Seed pouch / 种子袋"><title>Seed pouch / 种子袋</title><desc>Drawstring leather pouch tied with cord, a few seeds spilled beside it and a sprout swaying from the opening. For inventory, resources and growth.</desc><style>.druid-sway{animation:druid-sway 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes druid-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}@media (prefers-reduced-motion:reduce){.druid-pulse,.druid-float,.druid-spin,.druid-sway,.druid-pop{animation:none!important}}</style><path d="M30 33 C17 42 17 66 40 66 C63 66 63 42 50 33Z" fill="#A27449" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M29 33 Q40 29 51 33" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 37 Q40 41 50 37" fill="none" stroke="#C9A23A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 37 L56 44 M50 37 L58 39" fill="none" stroke="#C9A23A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g class="druid-sway"><path d="M40 32 V18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(40 22) rotate(-150)"><path d="M0 0 Q5.0 -4.2 10 0 Q5.0 4.2 0 0Z" fill="#86AD55" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M1 0 H8" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(40 19) rotate(-30)"><path d="M0 0 Q5.0 -4.2 10 0 Q5.0 4.2 0 0Z" fill="#86AD55" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M1 0 H8" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g></g><g fill="#C9A23A" stroke="currentColor" stroke-width="1"><ellipse cx="62" cy="64" rx="2.5" ry="1.8"/><ellipse cx="67" cy="60" rx="2" ry="1.5"/><ellipse cx="14" cy="64" rx="2.2" ry="1.6"/></g></svg>
