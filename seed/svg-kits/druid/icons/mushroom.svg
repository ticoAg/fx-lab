<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="Forest mushroom / 林菇"><title>Forest mushroom / 林菇</title><desc>Terracotta-capped toadstool with cream spots on a stout stem, a tuft of grass at its base, popping up. For foraging, potions, consumables and growth.</desc><style>.druid-pop{animation:druid-pop 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes druid-pop{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.12)}90%{transform:scale(.96)}}@media (prefers-reduced-motion:reduce){.druid-pulse,.druid-float,.druid-spin,.druid-sway,.druid-pop{animation:none!important}}</style><path d="M12 70 H68" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 70 L20 63 L23 70 M58 70 L61 62 L63 70" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g class="druid-pop"><path d="M32 44 C32 56 31 64 29 68 H51 C49 64 48 56 48 44Z" fill="#FBF6E6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 44 C12 22 68 22 68 44 Q40 50 12 44Z" fill="#BF6A4B" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><g fill="#FBF6E6"><circle cx="28" cy="34" r="3.5"/><circle cx="44" cy="29" r="3"/><circle cx="56" cy="38" r="2.5"/><circle cx="38" cy="40" r="2"/></g></g></svg>
