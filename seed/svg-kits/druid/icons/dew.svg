<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="Moon dew / 月露"><title>Moon dew / 月露</title><desc>A single pale dew drop with a moonlit highlight, floating above a leaf. For water, healing, mana and freshness.</desc><style>.druid-float{animation:druid-float 3s ease-in-out infinite}@keyframes druid-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@media (prefers-reduced-motion:reduce){.druid-pulse,.druid-float,.druid-spin,.druid-sway,.druid-pop{animation:none!important}}</style><g class="druid-float"><path d="M40 12 C40 12 23 34 23 46 A17 17 0 0 0 57 46 C57 34 40 12 40 12Z" fill="#C6D9DC" stroke="#8E9AA6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M31 44 A9 9 0 0 0 36 54" fill="none" stroke="#FBF6E6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="46" cy="38" r="1.6" fill="#FBF6E6"/></g><path d="M14 70 Q40 58 66 70 Q40 76 14 70Z" fill="#86AD55" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 70 H62" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
