<svg xmlns="http://www.w3.org/2000/svg" id="witch-alchemy-toad-root" viewBox="0 0 80 80" width="80" height="80" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="witch-alchemy-toad-title witch-alchemy-toad-desc">
<title id="witch-alchemy-toad-title">Warty toad / 蟾蜍</title>
<desc id="witch-alchemy-toad-desc">Squatting toad with horizontal golden pupils, parotoid glands, pale throat, splayed foretoes and folded hind legs. Selectively placed warts catch light above a mossy stone; a restrained breathing-like lift preserves the original motion. Fixed colors, currentColor contours. / 蹲伏蟾蜍有横瞳金眼、耳后腺、浅色咽腹、张开的四指前足和折叠后腿。少量按解剖位置安排的疣粒带独立受光，青苔石承托身体，呼吸般轻动。固定绿、石与金色，轮廓随 currentColor。</desc>
<style>#witch-alchemy-toad-root,#witch-alchemy-toad-root *{animation-play-state:inherit}.witch-alchemy-toad-pop{animation:witch-alchemy-toad-pop 6s cubic-bezier(.45,0,.55,1) infinite;animation-play-state:inherit;transform-box:view-box}@keyframes witch-alchemy-toad-pop{0%,80%,100%{transform:translateY(0)}88%{transform:translateY(-.65px)}}@media(prefers-reduced-motion:reduce){#witch-alchemy-toad-root *{animation:none!important}}</style>
