<svg xmlns="http://www.w3.org/2000/svg" id="witch-alchemy-black-cat-root" viewBox="0 0 80 80" width="80" height="80" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="witch-alchemy-black-cat-title witch-alchemy-black-cat-desc">
<title id="witch-alchemy-black-cat-title">Black cat / 黑猫</title>
<desc id="witch-alchemy-black-cat-desc">Three-quarter seated black cat with a shaped haunch, distinct forelegs and a tapering tail wrapped around its paws. Slit pupils, soft ears, muzzle and whiskers follow feline anatomy; a brass crescent hangs from a leather collar. Subtle sway, fixed colors, currentColor contours. / 四分之三坐姿黑猫具有明确后胯、前腿和绕爪尾巴，细长竖瞳、耳内绒毛、口鼻和胡须遵循猫的结构。皮革项圈悬挂铜月牙，身体轻微摆动。固定蓝灰毛色与金色眼睛，轮廓随 currentColor。</desc>
<style>#witch-alchemy-black-cat-root,#witch-alchemy-black-cat-root *{animation-play-state:inherit}.witch-alchemy-black-cat-sway{animation:witch-alchemy-black-cat-sway 7s cubic-bezier(.45,0,.55,1) infinite;animation-play-state:inherit;transform-box:view-box}@keyframes witch-alchemy-black-cat-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}@media(prefers-reduced-motion:reduce){#witch-alchemy-black-cat-root *{animation:none!important}}</style>
