<svg xmlns="http://www.w3.org/2000/svg" id="witch-alchemy-lantern-root" viewBox="0 0 80 80" width="80" height="80" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="witch-alchemy-lantern-title witch-alchemy-lantern-desc">
<title id="witch-alchemy-lantern-title">Witch&#x27;s lantern / 女巫提灯</title>
<desc id="witch-alchemy-lantern-desc">Brass lantern with riveted rails, arched vents, framed glass and a molded foot. A gently flickering candle illuminates wax and metal within the lantern; no exterior backdrop. Fixed materials with currentColor contours. / 黄铜提灯以铆接灯沿、拱形通风口、细框玻璃和模制底座构成。烛火在玻璃内轻闪，蜡滴与金属反光清晰，光色限制在灯体内。固定材质色，轮廓随 currentColor。</desc>
<style>#witch-alchemy-lantern-root,#witch-alchemy-lantern-root *{animation-play-state:inherit}.witch-alchemy-lantern-pulse{animation:witch-alchemy-lantern-pulse 5s cubic-bezier(.45,0,.55,1) infinite;animation-play-state:inherit;transform-box:view-box}@keyframes witch-alchemy-lantern-pulse{0%,100%{opacity:1}50%{opacity:.78}}@media(prefers-reduced-motion:reduce){#witch-alchemy-lantern-root *{animation:none!important}}</style>
