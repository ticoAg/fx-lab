<svg xmlns="http://www.w3.org/2000/svg" id="witch-alchemy-nightshade-root" viewBox="0 0 80 80" width="80" height="80" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="witch-alchemy-nightshade-title witch-alchemy-nightshade-desc">
<title id="witch-alchemy-nightshade-title">Belladonna sprig / 颠茄枝</title>
<desc id="witch-alchemy-nightshade-desc">Botanical belladonna with alternate veined ovate leaves, pendant five-lobed violet bells and glossy dark berries in persistent calyces. Connected stems and flower stalks curve naturally; the flowers sway lightly. Fixed botanical colors, currentColor contours. / 颠茄以交互生长的卵形脉纹叶、下垂紫色五裂钟花和带宿存花萼的亮黑浆果绘成植物图版。枝干弧度和花柄真实连接，花朵轻摆。固定叶、花与浆果色，细轮廓随 currentColor。</desc>
<style>#witch-alchemy-nightshade-root,#witch-alchemy-nightshade-root *{animation-play-state:inherit}.witch-alchemy-nightshade-sway{animation:witch-alchemy-nightshade-sway 7s cubic-bezier(.45,0,.55,1) infinite;animation-play-state:inherit;transform-box:view-box}@keyframes witch-alchemy-nightshade-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}@media(prefers-reduced-motion:reduce){#witch-alchemy-nightshade-root *{animation:none!important}}</style>
