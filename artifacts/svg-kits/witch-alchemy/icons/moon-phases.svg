<svg xmlns="http://www.w3.org/2000/svg" id="witch-alchemy-moon-phases-root" viewBox="0 0 80 80" width="80" height="80" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="witch-alchemy-moon-phases-title witch-alchemy-moon-phases-desc">
<title id="witch-alchemy-moon-phases-title">Moon phases / 月相轮</title>
<desc id="witch-alchemy-moon-phases-desc">Engraved brass lunar wheel around a central relief of maria and craters. Eight distinctly shaded moon phases orbit very slowly, with open space between the metal rings. Fixed metal and lunar colors, currentColor contours. / 黄铜刻度月相轮围绕有月海与环形山的中央月盘，八个月相缓慢公转。明暗月面与刻度具有独立材质，不使用大面积底板。固定金属和月面色，外轮廓随 currentColor。</desc>
