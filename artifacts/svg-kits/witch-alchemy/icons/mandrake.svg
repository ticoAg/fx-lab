<svg xmlns="http://www.w3.org/2000/svg" id="witch-alchemy-mandrake-root" viewBox="0 0 80 80" width="80" height="80" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="witch-alchemy-mandrake-title witch-alchemy-mandrake-desc">
<title id="witch-alchemy-mandrake-title">Mandrake root / 曼德拉草</title>
<desc id="witch-alchemy-mandrake-desc">Folkloric mandrake formed from branching taproots and fine rootlets, with a small face in the root folds. Veined leaves and amber berries rise from the crown; a restrained lift keeps the original animation. Fixed botanical colors, currentColor contours. / 曼德拉草以真实分叉主根和细须根组成民俗小人，浅刻面孔隐藏在根部褶纹中。顶端叶丛具有脉络与卷曲方向，琥珀浆果伸出叶间，根体轻跳。固定植物、土根与浆果色，轮廓随 currentColor。</desc>
<style>#witch-alchemy-mandrake-root,#witch-alchemy-mandrake-root *{animation-play-state:inherit}.witch-alchemy-mandrake-pop{animation:witch-alchemy-mandrake-pop 6s cubic-bezier(.45,0,.55,1) infinite;animation-play-state:inherit;transform-box:view-box}@keyframes witch-alchemy-mandrake-pop{0%,80%,100%{transform:translateY(0)}88%{transform:translateY(-.65px)}}@media(prefers-reduced-motion:reduce){#witch-alchemy-mandrake-root *{animation:none!important}}</style>
