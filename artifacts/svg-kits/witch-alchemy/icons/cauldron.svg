<svg xmlns="http://www.w3.org/2000/svg" id="witch-alchemy-cauldron-root" viewBox="0 0 80 80" width="80" height="80" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="witch-alchemy-cauldron-title witch-alchemy-cauldron-desc">
<title id="witch-alchemy-cauldron-title">Bubbling cauldron / 沸腾坩埚</title>
<desc id="witch-alchemy-cauldron-desc">Riveted copper and cast-iron cauldron with an emerald brew, substantial rim, wooden stirrer and crossed logs. Flame and steam move gently; fixed material colors with currentColor contours. / 铜箍三足铸铁坩埚，内盛翡翠绿药液；厚实锅沿、铆钉、木搅拌杆与交叉劈柴具有独立材质，火焰和蒸汽轻动。固定材质色，轮廓随 currentColor。</desc>
<style>#witch-alchemy-cauldron-root,#witch-alchemy-cauldron-root *{animation-play-state:inherit}.witch-alchemy-cauldron-float{animation:witch-alchemy-cauldron-float 6s cubic-bezier(.45,0,.55,1) infinite;animation-play-state:inherit;transform-box:view-box}@keyframes witch-alchemy-cauldron-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.9px)}}.witch-alchemy-cauldron-pulse{animation:witch-alchemy-cauldron-pulse 5s cubic-bezier(.45,0,.55,1) infinite;animation-play-state:inherit;transform-box:view-box}@keyframes witch-alchemy-cauldron-pulse{0%,100%{opacity:1}50%{opacity:.78}}@media(prefers-reduced-motion:reduce){#witch-alchemy-cauldron-root *{animation:none!important}}</style>
