<svg xmlns="http://www.w3.org/2000/svg" id="witch-alchemy-crystal-ball-root" viewBox="0 0 80 80" width="80" height="80" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="witch-alchemy-crystal-ball-title witch-alchemy-crystal-ball-desc">
<title id="witch-alchemy-crystal-ball-title">Crystal ball / 水晶球</title>
<desc id="witch-alchemy-crystal-ball-desc">Smoky crystal sphere with amethyst mist and lunar emblems, shaped window highlights and rim reflections. Curved brass supports rest on a turned wooden plinth; the inner mist subtly pulses. Fixed materials with currentColor contours. / 烟色水晶球内有紫雾与月星，玻璃的窗形反光和边缘反射强化球体。黄铜弧形托架承重于车削木座，紫雾轻微明暗变化。固定材质色，轮廓随 currentColor。</desc>
<style>#witch-alchemy-crystal-ball-root,#witch-alchemy-crystal-ball-root *{animation-play-state:inherit}.witch-alchemy-crystal-ball-pulse{animation:witch-alchemy-crystal-ball-pulse 5s cubic-bezier(.45,0,.55,1) infinite;animation-play-state:inherit;transform-box:view-box}@keyframes witch-alchemy-crystal-ball-pulse{0%,100%{opacity:1}50%{opacity:.78}}@media(prefers-reduced-motion:reduce){#witch-alchemy-crystal-ball-root *{animation:none!important}}</style>
