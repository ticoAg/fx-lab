<svg xmlns="http://www.w3.org/2000/svg" id="witch-alchemy-mortar-pestle-root" viewBox="0 0 80 80" width="80" height="80" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="witch-alchemy-mortar-pestle-title witch-alchemy-mortar-pestle-desc">
<title id="witch-alchemy-mortar-pestle-title">Mortar &amp; pestle / 研钵与杵</title>
<desc id="witch-alchemy-mortar-pestle-desc">Thick green-gray stone mortar with a copper foot, crushed herbs and a gently moving pestle behind its rim. Layered fresh leaves, seeds and carved detail; fixed materials with currentColor contours. / 厚壁灰绿石研钵带铜饰底座，内盛鲜叶和捣碎的草药，石杵在钵沿之后轻轻摆动；叶片、散落种子与刻饰各有清楚层次。固定材质色，轮廓随 currentColor。</desc>
<style>#witch-alchemy-mortar-pestle-root,#witch-alchemy-mortar-pestle-root *{animation-play-state:inherit}.witch-alchemy-mortar-pestle-sway{animation:witch-alchemy-mortar-pestle-sway 7s cubic-bezier(.45,0,.55,1) infinite;animation-play-state:inherit;transform-box:view-box}@keyframes witch-alchemy-mortar-pestle-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}@media(prefers-reduced-motion:reduce){#witch-alchemy-mortar-pestle-root *{animation:none!important}}</style>
