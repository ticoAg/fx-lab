<svg xmlns="http://www.w3.org/2000/svg" id="witch-alchemy-wax-seal-root" viewBox="0 0 80 80" width="80" height="80" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="witch-alchemy-wax-seal-title witch-alchemy-wax-seal-desc">
<title id="witch-alchemy-wax-seal-title">Wax seal / 火漆印</title>
<desc id="witch-alchemy-wax-seal-desc">Burgundy poured wax with an irregular rim, recessed medallion and readable lunar botanical relief over two notched ribbons. Fixed dark recesses and warm highlights describe its thickness; a subtle lift preserves the original motion. / 酒红火漆以不规则浇蜡边缘、下凹圆章和月星植物浮雕构成，压在两条紫灰燕尾丝带上。局部高光与固定深色凹槽区分蜡的厚度，印章轻动。固定材质色，轮廓随 currentColor。</desc>
