<svg xmlns="http://www.w3.org/2000/svg" id="witch-alchemy-hourglass-root" viewBox="0 0 80 80" width="80" height="80" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="witch-alchemy-hourglass-title witch-alchemy-hourglass-desc">
<title id="witch-alchemy-hourglass-title">Hourglass / 沙漏</title>
<desc id="witch-alchemy-hourglass-desc">Turned walnut posts and brass plates around twin glass bulbs. Golden sand falls in a fine stream onto a lower mound, with glass highlights and detailed joints. The frame sways subtly; fixed materials with currentColor contours. / 胡桃木车削立柱与黄铜托板围住双泡玻璃，金沙从上锥细流落向下方沙丘。玻璃高光、连接环与底部阴影独立绘制，整体仅轻微摆动。固定材质色，轮廓随 currentColor。</desc>
<style>#witch-alchemy-hourglass-root,#witch-alchemy-hourglass-root *{animation-play-state:inherit}.witch-alchemy-hourglass-pulse{animation:witch-alchemy-hourglass-pulse 5s cubic-bezier(.45,0,.55,1) infinite;animation-play-state:inherit;transform-box:view-box}@keyframes witch-alchemy-hourglass-pulse{0%,100%{opacity:1}50%{opacity:.78}}.witch-alchemy-hourglass-sway{animation:witch-alchemy-hourglass-sway 7s cubic-bezier(.45,0,.55,1) infinite;animation-play-state:inherit;transform-box:view-box}@keyframes witch-alchemy-hourglass-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}@media(prefers-reduced-motion:reduce){#witch-alchemy-hourglass-root *{animation:none!important}}</style>
