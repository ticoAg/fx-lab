<svg xmlns="http://www.w3.org/2000/svg" id="witch-alchemy-owl-root" viewBox="0 0 80 80" width="80" height="80" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="witch-alchemy-owl-title witch-alchemy-owl-desc">
<title id="witch-alchemy-owl-title">Owl / 猫头鹰</title>
<desc id="witch-alchemy-owl-desc">Tawny owl with structured facial discs, brow feathers, a small hooked bill, overlapping primaries and a shaped tail. Talons grip the branch; chest markings follow the plumage and golden eyes gently glint. Fixed colors, currentColor contours. / 褐色猫头鹰以双面盘、眉羽、细钩喙、层叠飞羽与尾羽重绘，足爪紧扣树枝。胸部羽斑按羽片安排，金色双眼只有轻微光泽变化。固定羽、木、月与金色，轮廓随 currentColor。</desc>
<style>#witch-alchemy-owl-root,#witch-alchemy-owl-root *{animation-play-state:inherit}.witch-alchemy-owl-pulse{animation:witch-alchemy-owl-pulse 5s cubic-bezier(.45,0,.55,1) infinite;animation-play-state:inherit;transform-box:view-box}@keyframes witch-alchemy-owl-pulse{0%,100%{opacity:1}50%{opacity:.78}}@media(prefers-reduced-motion:reduce){#witch-alchemy-owl-root *{animation:none!important}}</style>
