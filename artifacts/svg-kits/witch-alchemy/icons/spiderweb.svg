<svg xmlns="http://www.w3.org/2000/svg" id="witch-alchemy-spiderweb-root" viewBox="0 0 80 80" width="80" height="80" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="witch-alchemy-spiderweb-title witch-alchemy-spiderweb-desc">
<title id="witch-alchemy-spiderweb-title">Dewy spiderweb / 挂露蛛网</title>
<desc id="witch-alchemy-spiderweb-desc">Orb web suspended from a twig, with unequal radial anchors, sagging spiral silk and a few natural gaps. Dew collects at junctions; an eight-legged orb-weaver and hanging spider complete the gently swaying web. Fixed twig and dew colors, currentColor silk. / 树枝悬挂的圆蛛网由不等长放射丝、自然下垂的螺旋丝和少量断口构成，露珠在丝结处聚集。中心圆蛛与垂丝小蛛具八足，网面轻摆。固定树枝与露珠色，细网线随 currentColor。</desc>
<style>#witch-alchemy-spiderweb-root,#witch-alchemy-spiderweb-root *{animation-play-state:inherit}.witch-alchemy-spiderweb-sway{animation:witch-alchemy-spiderweb-sway 7s cubic-bezier(.45,0,.55,1) infinite;animation-play-state:inherit;transform-box:view-box}@keyframes witch-alchemy-spiderweb-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}@media(prefers-reduced-motion:reduce){#witch-alchemy-spiderweb-root *{animation:none!important}}</style>
