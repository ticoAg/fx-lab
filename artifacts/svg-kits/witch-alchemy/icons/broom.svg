<svg xmlns="http://www.w3.org/2000/svg" id="witch-alchemy-broom-root" viewBox="0 0 80 80" width="80" height="80" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="witch-alchemy-broom-title witch-alchemy-broom-desc">
<title id="witch-alchemy-broom-title">Besom broom / 女巫扫帚</title>
<desc id="witch-alchemy-broom-desc">Curved knotted ash handle, individually shaped birch switches, a copper-toned binding and a small leafy offshoot. The broom gently sways; grain follows the construction. Fixed wood, metal and leaf colors with currentColor contours. / 有节疤的弯曲梣木柄连接分束桦枝，铜色绳缠绕束口，枝梢自然展开，带一小段新叶。扫帚轻轻摆动，线条沿真实枝条走向绘制。固定木、铜与叶色，轮廓随 currentColor。</desc>
<style>#witch-alchemy-broom-root,#witch-alchemy-broom-root *{animation-play-state:inherit}.witch-alchemy-broom-sway{animation:witch-alchemy-broom-sway 7s cubic-bezier(.45,0,.55,1) infinite;animation-play-state:inherit;transform-box:view-box}@keyframes witch-alchemy-broom-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}@media(prefers-reduced-motion:reduce){#witch-alchemy-broom-root *{animation:none!important}}</style>
