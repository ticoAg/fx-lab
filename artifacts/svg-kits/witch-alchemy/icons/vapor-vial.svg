<svg xmlns="http://www.w3.org/2000/svg" id="witch-alchemy-vapor-vial-root" viewBox="0 0 80 80" width="80" height="80" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="witch-alchemy-vapor-vial-title witch-alchemy-vapor-vial-desc">
<title id="witch-alchemy-vapor-vial-title">Vapor vial / 雾气药瓶</title>
<desc id="witch-alchemy-vapor-vial-desc">Smoky amethyst potion vial with a brass mouth, tied neck and crescent label; the removed cork sits beside it. Three open curls of vapor and small bubbles rise gently, with restrained glass reflections. Fixed material colors, currentColor contours. / 烟色药瓶盛有紫晶药液，瓶口铜圈、颈部绳结与月牙标签层次明确，拔出的软木塞停在一旁。三股有留白的紫雾与小气泡轻浮，玻璃反光保持克制。固定材质色，轮廓随 currentColor。</desc>
<style>#witch-alchemy-vapor-vial-root,#witch-alchemy-vapor-vial-root *{animation-play-state:inherit}.witch-alchemy-vapor-vial-float{animation:witch-alchemy-vapor-vial-float 6s cubic-bezier(.45,0,.55,1) infinite;animation-play-state:inherit;transform-box:view-box}@keyframes witch-alchemy-vapor-vial-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.9px)}}.witch-alchemy-vapor-vial-pulse{animation:witch-alchemy-vapor-vial-pulse 5s cubic-bezier(.45,0,.55,1) infinite;animation-play-state:inherit;transform-box:view-box}@keyframes witch-alchemy-vapor-vial-pulse{0%,100%{opacity:1}50%{opacity:.78}}@media(prefers-reduced-motion:reduce){#witch-alchemy-vapor-vial-root *{animation:none!important}}</style>
