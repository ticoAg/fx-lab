<svg xmlns="http://www.w3.org/2000/svg" id="witch-alchemy-pentacle-root" viewBox="0 0 80 80" width="80" height="80" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="witch-alchemy-pentacle-title witch-alchemy-pentacle-desc">
<title id="witch-alchemy-pentacle-title">Star-in-circle (original) / 五芒星环（原创）</title>
<desc id="witch-alchemy-pentacle-desc">Open brass star lattice with crossing relief, engraved double rings, five emerald settings and a subtly pulsing central amethyst. Original folkloric lunar and elemental geometry without pseudo-writing. Fixed materials with currentColor contours. / 开放式黄铜星环以交错星带、细刻双环与五颗翡翠铆座构成，中央紫晶轻微闪动。月、星、水滴与三角饰纹保持原创民俗几何，不使用伪符文字。固定材质色，外轮廓随 currentColor。</desc>
<style>#witch-alchemy-pentacle-root,#witch-alchemy-pentacle-root *{animation-play-state:inherit}.witch-alchemy-pentacle-pulse{animation:witch-alchemy-pentacle-pulse 5s cubic-bezier(.45,0,.55,1) infinite;animation-play-state:inherit;transform-box:view-box}@keyframes witch-alchemy-pentacle-pulse{0%,100%{opacity:1}50%{opacity:.78}}@media(prefers-reduced-motion:reduce){#witch-alchemy-pentacle-root *{animation:none!important}}</style>
