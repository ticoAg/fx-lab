<svg xmlns="http://www.w3.org/2000/svg" id="witch-alchemy-alembic-root" viewBox="0 0 80 80" width="80" height="80" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="witch-alchemy-alembic-title witch-alchemy-alembic-desc">
<title id="witch-alchemy-alembic-title">Alembic still / 蒸馏器</title>
<desc id="witch-alchemy-alembic-desc">Copper alembic head and descending beak above a smoky glass flask, iron tripod and spirit lamp. A subtle moving condensate drop reaches an amber receiver. Fixed materials with currentColor contours. / 铜制穹顶蒸馏头连通长导管，烟色玻璃蒸馏瓶置于铁架和酒精灯上，冷凝液滴落琥珀色接收瓶。固定铜、玻璃与药液色，轮廓随 currentColor。</desc>
<style>#witch-alchemy-alembic-root,#witch-alchemy-alembic-root *{animation-play-state:inherit}.witch-alchemy-alembic-float{animation:witch-alchemy-alembic-float 6s cubic-bezier(.45,0,.55,1) infinite;animation-play-state:inherit;transform-box:view-box}@keyframes witch-alchemy-alembic-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.9px)}}.witch-alchemy-alembic-pulse{animation:witch-alchemy-alembic-pulse 5s cubic-bezier(.45,0,.55,1) infinite;animation-play-state:inherit;transform-box:view-box}@keyframes witch-alchemy-alembic-pulse{0%,100%{opacity:1}50%{opacity:.78}}@media(prefers-reduced-motion:reduce){#witch-alchemy-alembic-root *{animation:none!important}}</style>
