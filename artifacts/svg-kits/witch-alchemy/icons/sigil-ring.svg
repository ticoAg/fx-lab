<svg xmlns="http://www.w3.org/2000/svg" id="witch-alchemy-sigil-ring-root" viewBox="0 0 80 80" width="80" height="80" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="witch-alchemy-sigil-ring-title witch-alchemy-sigil-ring-desc">
<title id="witch-alchemy-sigil-ring-title">Sigil ring / 符文法阵</title>
<desc id="witch-alchemy-sigil-ring-desc">Copper engraved outer ring around a slowly rotating heptagram and interlocking triangles. Amethyst nodes and a central lunar medallion form a precise openwork talisman with geometric engraving. Fixed metals and jewels, currentColor contours. / 铜制刻度外环包围缓慢旋转的七芒星与相交三角，紫晶节点和中央月珠组成精密护符。装饰采用可读的几何刻线而非伪文字，环间透明。固定金属与宝石色，轮廓随 currentColor。</desc>
<style>#witch-alchemy-sigil-ring-root,#witch-alchemy-sigil-ring-root *{animation-play-state:inherit}.witch-alchemy-sigil-ring-spin{animation:witch-alchemy-sigil-ring-spin 120s linear infinite;animation-play-state:inherit;transform-box:view-box}@keyframes witch-alchemy-sigil-ring-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){#witch-alchemy-sigil-ring-root *{animation:none!important}}</style>
