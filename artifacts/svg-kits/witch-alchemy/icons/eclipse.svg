<svg xmlns="http://www.w3.org/2000/svg" id="witch-alchemy-eclipse-root" viewBox="0 0 80 80" width="80" height="80" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="witch-alchemy-eclipse-title witch-alchemy-eclipse-desc">
<title id="witch-alchemy-eclipse-title">Eclipse / 日食</title>
<desc id="witch-alchemy-eclipse-desc">A dark slate lunar disc occludes the sun, leaving a golden limb, tapered coronal filaments, Baily’s beads and a diamond-ring glint. The engraved outer ring remains open; the corona pulses gently without a background glow. Fixed celestial colors, currentColor accents. / 深蓝灰月盘遮住太阳，外沿仅保留黄铜色日缘、细长火焰状日冕、贝利珠与钻石环闪光。刻度环镂空，日冕缓慢变亮变暗，不铺设光晕背景。固定天体与金色，细外环随 currentColor。</desc>
<style>#witch-alchemy-eclipse-root,#witch-alchemy-eclipse-root *{animation-play-state:inherit}.witch-alchemy-eclipse-pulse{animation:witch-alchemy-eclipse-pulse 5s cubic-bezier(.45,0,.55,1) infinite;animation-play-state:inherit;transform-box:view-box}@keyframes witch-alchemy-eclipse-pulse{0%,100%{opacity:1}50%{opacity:.78}}@media(prefers-reduced-motion:reduce){#witch-alchemy-eclipse-root *{animation:none!important}}</style>
