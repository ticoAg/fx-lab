<svg xmlns="http://www.w3.org/2000/svg" id="witch-alchemy-grimoire-root" viewBox="0 0 80 80" width="80" height="80" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="witch-alchemy-grimoire-title witch-alchemy-grimoire-desc">
<title id="witch-alchemy-grimoire-title">Open grimoire / 魔法书</title>
<desc id="witch-alchemy-grimoire-desc">Open leather grimoire with curved parchment, layered signatures, spine and brass corners. A botanical plate and precise star diagram replace pseudo-text; a red bookmark hangs below gently floating lunar ornaments. Fixed materials, currentColor contours. / 皮面魔法书展开弯曲的羊皮纸书页，书芯、书脊与铜包角清晰分层。左页为草药图版，右页为精细几何星图，红丝带垂落，月星轻浮；不含伪文字。固定材质色，轮廓随 currentColor。</desc>
<style>#witch-alchemy-grimoire-root,#witch-alchemy-grimoire-root *{animation-play-state:inherit}.witch-alchemy-grimoire-float{animation:witch-alchemy-grimoire-float 6s cubic-bezier(.45,0,.55,1) infinite;animation-play-state:inherit;transform-box:view-box}@keyframes witch-alchemy-grimoire-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.9px)}}@media(prefers-reduced-motion:reduce){#witch-alchemy-grimoire-root *{animation:none!important}}</style>
