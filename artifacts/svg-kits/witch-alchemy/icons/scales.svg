<svg xmlns="http://www.w3.org/2000/svg" id="witch-alchemy-scales-root" viewBox="0 0 80 80" width="80" height="80" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="witch-alchemy-scales-title witch-alchemy-scales-desc">
<title id="witch-alchemy-scales-title">Scales of balance / 天平</title>
<desc id="witch-alchemy-scales-desc">Crescent-topped brass balance with a stable column, pivot and stepped foot. Suspended chains connect both lips of each pan; crystals and a feather balance on the gently swaying beam. Fixed materials with currentColor contours. / 月牙黄铜天平的立柱、枢轴与阶梯底座稳定承重，链条准确连接两只浅盘。一侧紫晶、一侧羽毛，横梁轻轻摇摆，太阳浮雕点缀立柱。固定材质色，轮廓随 currentColor。</desc>
<style>#witch-alchemy-scales-root,#witch-alchemy-scales-root *{animation-play-state:inherit}.witch-alchemy-scales-sway{animation:witch-alchemy-scales-sway 7s cubic-bezier(.45,0,.55,1) infinite;animation-play-state:inherit;transform-box:view-box}@keyframes witch-alchemy-scales-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}@media(prefers-reduced-motion:reduce){#witch-alchemy-scales-root *{animation:none!important}}</style>
