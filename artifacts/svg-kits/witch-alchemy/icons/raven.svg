<svg xmlns="http://www.w3.org/2000/svg" id="witch-alchemy-raven-root" viewBox="0 0 80 80" width="80" height="80" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="witch-alchemy-raven-title witch-alchemy-raven-desc">
<title id="witch-alchemy-raven-title">Raven / 渡鸦</title>
<desc id="witch-alchemy-raven-desc">Raven with a heavy hooked bill, throat hackles, layered folded primaries and wedge tail. Scaled toes grip a gnarled branch; slate plumage carries restrained teal reflections beneath a crescent. Subtle sway, fixed materials, currentColor contours. / 渡鸦以厚喙、喉蓑羽、层叠收翼与楔形尾重塑侧影，鳞状足趾牢扣虬枝。深蓝灰羽毛带克制的青绿反光，金眼与新月点明主题，身体轻摆。固定羽、木与月色，轮廓随 currentColor。</desc>
<style>#witch-alchemy-raven-root,#witch-alchemy-raven-root *{animation-play-state:inherit}.witch-alchemy-raven-sway{animation:witch-alchemy-raven-sway 7s cubic-bezier(.45,0,.55,1) infinite;animation-play-state:inherit;transform-box:view-box}@keyframes witch-alchemy-raven-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}@media(prefers-reduced-motion:reduce){#witch-alchemy-raven-root *{animation:none!important}}</style>
