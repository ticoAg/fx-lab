<svg xmlns="http://www.w3.org/2000/svg" id="witch-alchemy-potion-bottles-root" viewBox="0 0 80 80" width="80" height="80" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="witch-alchemy-potion-bottles-title witch-alchemy-potion-bottles-desc">
<title id="witch-alchemy-potion-bottles-title">Potion bottles / 药水瓶组</title>
<desc id="witch-alchemy-potion-bottles-desc">Three smoky glass vessels with emerald, amethyst and amber liquids. Waxed cork, glass stopper, botanical label and crescent tag are carefully constructed; bubbles drift gently. Fixed materials, currentColor contours. / 三种轮廓的烟色玻璃药瓶，分别盛翡翠、紫晶与琥珀色药液。软木与火漆、玻璃球塞、植物标签和月牙铜牌均重新绘制，药液气泡轻浮。固定材质色，轮廓随 currentColor。</desc>
