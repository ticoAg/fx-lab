<svg xmlns="http://www.w3.org/2000/svg" id="witch-alchemy-witch-hat-root" viewBox="0 0 80 80" width="80" height="80" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="witch-alchemy-witch-hat-title witch-alchemy-witch-hat-desc">
<title id="witch-alchemy-witch-hat-title">Witch&#x27;s hat / 女巫尖帽</title>
<desc id="witch-alchemy-witch-hat-desc">Folded plum-gray felt hat with a shaped brim, fitted leather band, stitched patch, brass buckle and tucked feather. A tiny star hangs from the tip as the hat sways. Fixed felt, leather and brass colors with currentColor contours. / 紫灰毡帽的折弯帽尖与宽帽檐重新塑形，皮革帽带、缝补片和方形铜扣贴合帽身，羽毛插在帽带后。帽子轻摆，星形吊坠保留。固定毡、皮革与黄铜色，轮廓随 currentColor。</desc>
<style>#witch-alchemy-witch-hat-root,#witch-alchemy-witch-hat-root *{animation-play-state:inherit}.witch-alchemy-witch-hat-sway{animation:witch-alchemy-witch-hat-sway 7s cubic-bezier(.45,0,.55,1) infinite;animation-play-state:inherit;transform-box:view-box}@keyframes witch-alchemy-witch-hat-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}@media(prefers-reduced-motion:reduce){#witch-alchemy-witch-hat-root *{animation:none!important}}</style>
