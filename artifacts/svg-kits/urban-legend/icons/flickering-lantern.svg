<svg xmlns="http://www.w3.org/2000/svg" id="urban-legend-flickering-lantern-art" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-labelledby="urban-legend-flickering-lantern-title urban-legend-flickering-lantern-desc" stroke-linecap="round" stroke-linejoin="round">
<title id="urban-legend-flickering-lantern-title">Flickering lantern / 摇曳的提灯</title>
<desc id="urban-legend-flickering-lantern-desc">A patinated hurricane lantern with bowed guards, amber glass, a double flame, a riveted fuel tank and three pale moths. Transparent background; material and shadow colors are fixed, with currentColor reserved for restrained contour accents.</desc>
<style>#urban-legend-flickering-lantern-art,#urban-legend-flickering-lantern-art *{animation-play-state:inherit}
.urban-legend-flickering-lantern-pulse{animation:urban-legend-flickering-lantern-pulse 4.8s ease-in-out infinite}
.urban-legend-flickering-lantern-float{animation:urban-legend-flickering-lantern-float 6s ease-in-out infinite}
.urban-legend-flickering-lantern-sway{animation:urban-legend-flickering-lantern-sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 85%}
.urban-legend-flickering-lantern-pop{animation:urban-legend-flickering-lantern-pop 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes urban-legend-flickering-lantern-pulse{0%,100%{opacity:1}48%{opacity:.72}58%{opacity:.93}}
@keyframes urban-legend-flickering-lantern-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.65px)}}
@keyframes urban-legend-flickering-lantern-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}
@keyframes urban-legend-flickering-lantern-pop{0%,80%,100%{transform:translateY(0)}85%,93%{transform:translateY(-.35px)}89%{transform:translateY(.15px)}}
@media(prefers-reduced-motion:reduce){#urban-legend-flickering-lantern-art *{animation:none!important}}</style>
