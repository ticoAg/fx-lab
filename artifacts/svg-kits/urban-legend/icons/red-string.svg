<svg xmlns="http://www.w3.org/2000/svg" id="urban-legend-red-string-art" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-labelledby="urban-legend-red-string-title urban-legend-red-string-desc" stroke-linecap="round" stroke-linejoin="round">
<title id="urban-legend-red-string-title">Red string board / 红线线索板</title>
<desc id="urban-legend-red-string-desc">Three instant photos and a clipping are linked by muted red thread: a stranger, a house with one amber window and a watching eye; pins hold the paper and a small brass bell hangs below. Transparent background; material and shadow colors are fixed, with currentColor reserved for restrained contour accents.</desc>
<style>#urban-legend-red-string-art,#urban-legend-red-string-art *{animation-play-state:inherit}
.urban-legend-red-string-pulse{animation:urban-legend-red-string-pulse 4.8s ease-in-out infinite}
.urban-legend-red-string-float{animation:urban-legend-red-string-float 6s ease-in-out infinite}
.urban-legend-red-string-sway{animation:urban-legend-red-string-sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 85%}
.urban-legend-red-string-pop{animation:urban-legend-red-string-pop 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes urban-legend-red-string-pulse{0%,100%{opacity:1}48%{opacity:.72}58%{opacity:.93}}
@keyframes urban-legend-red-string-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.65px)}}
@keyframes urban-legend-red-string-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}
@keyframes urban-legend-red-string-pop{0%,80%,100%{transform:translateY(0)}85%,93%{transform:translateY(-.35px)}89%{transform:translateY(.15px)}}
@media(prefers-reduced-motion:reduce){#urban-legend-red-string-art *{animation:none!important}}</style>
