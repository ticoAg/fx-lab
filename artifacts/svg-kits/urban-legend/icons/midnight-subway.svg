<svg xmlns="http://www.w3.org/2000/svg" id="urban-legend-midnight-subway-art" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-labelledby="urban-legend-midnight-subway-title urban-legend-midnight-subway-desc" stroke-linecap="round" stroke-linejoin="round">
<title id="urban-legend-midnight-subway-title">Midnight subway / 午夜地铁</title>
<desc id="urban-legend-midnight-subway-desc">A last train emerges from a masonry tunnel on converging rails: a curved metal nose, twin lamps, blank destination board and a lone passenger behind reflective glass. Transparent background; material and shadow colors are fixed, with currentColor reserved for restrained contour accents.</desc>
<style>#urban-legend-midnight-subway-art,#urban-legend-midnight-subway-art *{animation-play-state:inherit}
.urban-legend-midnight-subway-pulse{animation:urban-legend-midnight-subway-pulse 4.8s ease-in-out infinite}
.urban-legend-midnight-subway-float{animation:urban-legend-midnight-subway-float 6s ease-in-out infinite}
.urban-legend-midnight-subway-sway{animation:urban-legend-midnight-subway-sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 85%}
.urban-legend-midnight-subway-pop{animation:urban-legend-midnight-subway-pop 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes urban-legend-midnight-subway-pulse{0%,100%{opacity:1}48%{opacity:.72}58%{opacity:.93}}
@keyframes urban-legend-midnight-subway-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.65px)}}
@keyframes urban-legend-midnight-subway-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}
@keyframes urban-legend-midnight-subway-pop{0%,80%,100%{transform:translateY(0)}85%,93%{transform:translateY(-.35px)}89%{transform:translateY(.15px)}}
@media(prefers-reduced-motion:reduce){#urban-legend-midnight-subway-art *{animation:none!important}}</style>
