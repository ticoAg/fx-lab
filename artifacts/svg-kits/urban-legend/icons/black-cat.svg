<svg xmlns="http://www.w3.org/2000/svg" id="urban-legend-black-cat-art" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-labelledby="urban-legend-black-cat-title urban-legend-black-cat-desc" stroke-linecap="round" stroke-linejoin="round">
<title id="urban-legend-black-cat-title">Black cat / 黑猫</title>
<desc id="urban-legend-black-cat-desc">A black cat sits in three-quarter view on a brick parapet, looking back with amber slit eyes; shoulders, haunches and paws are clearly formed, and the tail curls over the ledge under a cold moon. Transparent background; material and shadow colors are fixed, with currentColor reserved for restrained contour accents.</desc>
<style>#urban-legend-black-cat-art,#urban-legend-black-cat-art *{animation-play-state:inherit}
.urban-legend-black-cat-pulse{animation:urban-legend-black-cat-pulse 4.8s ease-in-out infinite}
.urban-legend-black-cat-float{animation:urban-legend-black-cat-float 6s ease-in-out infinite}
.urban-legend-black-cat-sway{animation:urban-legend-black-cat-sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 85%}
.urban-legend-black-cat-pop{animation:urban-legend-black-cat-pop 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes urban-legend-black-cat-pulse{0%,100%{opacity:1}48%{opacity:.72}58%{opacity:.93}}
@keyframes urban-legend-black-cat-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.65px)}}
@keyframes urban-legend-black-cat-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}
@keyframes urban-legend-black-cat-pop{0%,80%,100%{transform:translateY(0)}85%,93%{transform:translateY(-.35px)}89%{transform:translateY(.15px)}}
@media(prefers-reduced-motion:reduce){#urban-legend-black-cat-art *{animation:none!important}}</style>
