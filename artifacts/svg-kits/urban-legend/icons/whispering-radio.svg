<svg xmlns="http://www.w3.org/2000/svg" id="urban-legend-whispering-radio-art" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-labelledby="urban-legend-whispering-radio-title urban-legend-whispering-radio-desc" stroke-linecap="round" stroke-linejoin="round">
<title id="urban-legend-whispering-radio-title">Whispering radio / 低语的收音机</title>
<desc id="urban-legend-whispering-radio-desc">An arched wooden radio has carved grille openings, twin knobs, an amber tuning dial and narrow edge highlights; three pale, faced whispers drift above. Transparent background; material and shadow colors are fixed, with currentColor reserved for restrained contour accents.</desc>
<style>#urban-legend-whispering-radio-art,#urban-legend-whispering-radio-art *{animation-play-state:inherit}
.urban-legend-whispering-radio-pulse{animation:urban-legend-whispering-radio-pulse 4.8s ease-in-out infinite}
.urban-legend-whispering-radio-float{animation:urban-legend-whispering-radio-float 6s ease-in-out infinite}
.urban-legend-whispering-radio-sway{animation:urban-legend-whispering-radio-sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 85%}
.urban-legend-whispering-radio-pop{animation:urban-legend-whispering-radio-pop 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes urban-legend-whispering-radio-pulse{0%,100%{opacity:1}48%{opacity:.72}58%{opacity:.93}}
@keyframes urban-legend-whispering-radio-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.65px)}}
@keyframes urban-legend-whispering-radio-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}
@keyframes urban-legend-whispering-radio-pop{0%,80%,100%{transform:translateY(0)}85%,93%{transform:translateY(-.35px)}89%{transform:translateY(.15px)}}
@media(prefers-reduced-motion:reduce){#urban-legend-whispering-radio-art *{animation:none!important}}</style>
