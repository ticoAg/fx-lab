<svg xmlns="http://www.w3.org/2000/svg" id="urban-legend-dead-phone-art" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-labelledby="urban-legend-dead-phone-title urban-legend-dead-phone-desc" stroke-linecap="round" stroke-linejoin="round">
<title id="urban-legend-dead-phone-title">Unplugged ringing phone / 断线还在响的电话</title>
<desc id="urban-legend-dead-phone-desc">A heavy rotary phone with a curved case, brass dial and Bakelite receiver catches narrow highlights; the cut cable exposes frayed wires while the phone keeps ringing. Transparent background; material and shadow colors are fixed, with currentColor reserved for restrained contour accents.</desc>
<style>#urban-legend-dead-phone-art,#urban-legend-dead-phone-art *{animation-play-state:inherit}
.urban-legend-dead-phone-pulse{animation:urban-legend-dead-phone-pulse 4.8s ease-in-out infinite}
.urban-legend-dead-phone-float{animation:urban-legend-dead-phone-float 6s ease-in-out infinite}
.urban-legend-dead-phone-sway{animation:urban-legend-dead-phone-sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 85%}
.urban-legend-dead-phone-pop{animation:urban-legend-dead-phone-pop 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes urban-legend-dead-phone-pulse{0%,100%{opacity:1}48%{opacity:.72}58%{opacity:.93}}
@keyframes urban-legend-dead-phone-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.65px)}}
@keyframes urban-legend-dead-phone-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}
@keyframes urban-legend-dead-phone-pop{0%,80%,100%{transform:translateY(0)}85%,93%{transform:translateY(-.35px)}89%{transform:translateY(.15px)}}
@media(prefers-reduced-motion:reduce){#urban-legend-dead-phone-art *{animation:none!important}}</style>
