<svg xmlns="http://www.w3.org/2000/svg" id="urban-legend-cassette-player-art" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-labelledby="urban-legend-cassette-player-title urban-legend-cassette-player-desc" stroke-linecap="round" stroke-linejoin="round">
<title id="urban-legend-cassette-player-title">Portable cassette player / 随身磁带机</title>
<desc id="urban-legend-cassette-player-desc">A portable cassette player in three-quarter view has piano keys, visible twin reels, speaker slots and a volume wheel; a cable curls toward two earbuds beside a small drifting whisper. Transparent background; material and shadow colors are fixed, with currentColor reserved for restrained contour accents.</desc>
<style>#urban-legend-cassette-player-art,#urban-legend-cassette-player-art *{animation-play-state:inherit}
.urban-legend-cassette-player-pulse{animation:urban-legend-cassette-player-pulse 4.8s ease-in-out infinite}
.urban-legend-cassette-player-float{animation:urban-legend-cassette-player-float 6s ease-in-out infinite}
.urban-legend-cassette-player-sway{animation:urban-legend-cassette-player-sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 85%}
.urban-legend-cassette-player-pop{animation:urban-legend-cassette-player-pop 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes urban-legend-cassette-player-pulse{0%,100%{opacity:1}48%{opacity:.72}58%{opacity:.93}}
@keyframes urban-legend-cassette-player-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.65px)}}
@keyframes urban-legend-cassette-player-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}
@keyframes urban-legend-cassette-player-pop{0%,80%,100%{transform:translateY(0)}85%,93%{transform:translateY(-.35px)}89%{transform:translateY(.15px)}}
@media(prefers-reduced-motion:reduce){#urban-legend-cassette-player-art *{animation:none!important}}</style>
