<svg xmlns="http://www.w3.org/2000/svg" id="urban-legend-cracked-sidewalk-art" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-labelledby="urban-legend-cracked-sidewalk-title urban-legend-cracked-sidewalk-desc" stroke-linecap="round" stroke-linejoin="round">
<title id="urban-legend-cracked-sidewalk-title">Cracked sidewalk / 裂开的人行道</title>
<desc id="urban-legend-cracked-sidewalk-desc">Perspective paving slabs split along an irregular crevice with visible thickness and a dim crimson seam; a pale hand emerges among small weeds and chipped stone edges. Transparent background; material and shadow colors are fixed, with currentColor reserved for restrained contour accents.</desc>
<style>#urban-legend-cracked-sidewalk-art,#urban-legend-cracked-sidewalk-art *{animation-play-state:inherit}
.urban-legend-cracked-sidewalk-pulse{animation:urban-legend-cracked-sidewalk-pulse 4.8s ease-in-out infinite}
.urban-legend-cracked-sidewalk-float{animation:urban-legend-cracked-sidewalk-float 6s ease-in-out infinite}
.urban-legend-cracked-sidewalk-sway{animation:urban-legend-cracked-sidewalk-sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 85%}
.urban-legend-cracked-sidewalk-pop{animation:urban-legend-cracked-sidewalk-pop 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes urban-legend-cracked-sidewalk-pulse{0%,100%{opacity:1}48%{opacity:.72}58%{opacity:.93}}
@keyframes urban-legend-cracked-sidewalk-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.65px)}}
@keyframes urban-legend-cracked-sidewalk-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}
@keyframes urban-legend-cracked-sidewalk-pop{0%,80%,100%{transform:translateY(0)}85%,93%{transform:translateY(-.35px)}89%{transform:translateY(.15px)}}
@media(prefers-reduced-motion:reduce){#urban-legend-cracked-sidewalk-art *{animation:none!important}}</style>
