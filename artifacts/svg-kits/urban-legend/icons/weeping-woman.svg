<svg xmlns="http://www.w3.org/2000/svg" id="urban-legend-weeping-woman-art" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-labelledby="urban-legend-weeping-woman-title urban-legend-weeping-woman-desc" stroke-linecap="round" stroke-linejoin="round">
<title id="urban-legend-weeping-woman-title">Weeping woman / 哭泣的女人</title>
<desc id="urban-legend-weeping-woman-desc">A long-haired woman covers her face at the water’s edge; weighted ivory folds, two cold tears, quiet ripples and a broken reflection suggest grief. Transparent background; material and shadow colors are fixed, with currentColor reserved for restrained contour accents.</desc>
<style>#urban-legend-weeping-woman-art,#urban-legend-weeping-woman-art *{animation-play-state:inherit}
.urban-legend-weeping-woman-pulse{animation:urban-legend-weeping-woman-pulse 4.8s ease-in-out infinite}
.urban-legend-weeping-woman-float{animation:urban-legend-weeping-woman-float 6s ease-in-out infinite}
.urban-legend-weeping-woman-sway{animation:urban-legend-weeping-woman-sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 85%}
.urban-legend-weeping-woman-pop{animation:urban-legend-weeping-woman-pop 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes urban-legend-weeping-woman-pulse{0%,100%{opacity:1}48%{opacity:.72}58%{opacity:.93}}
@keyframes urban-legend-weeping-woman-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.65px)}}
@keyframes urban-legend-weeping-woman-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}
@keyframes urban-legend-weeping-woman-pop{0%,80%,100%{transform:translateY(0)}85%,93%{transform:translateY(-.35px)}89%{transform:translateY(.15px)}}
@media(prefers-reduced-motion:reduce){#urban-legend-weeping-woman-art *{animation:none!important}}</style>
