<svg xmlns="http://www.w3.org/2000/svg" id="urban-legend-crow-on-wire-art" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-labelledby="urban-legend-crow-on-wire-title urban-legend-crow-on-wire-desc" stroke-linecap="round" stroke-linejoin="round">
<title id="urban-legend-crow-on-wire-title">Crows on the wire / 电线上的乌鸦</title>
<desc id="urban-legend-crow-on-wire-desc">Three crows grip sagging wires while a fourth approaches on spread wings; a wooden pole, ceramic insulators and a strapped transformer form a complete piece of city infrastructure. Transparent background; material and shadow colors are fixed, with currentColor reserved for restrained contour accents.</desc>
<style>#urban-legend-crow-on-wire-art,#urban-legend-crow-on-wire-art *{animation-play-state:inherit}
.urban-legend-crow-on-wire-pulse{animation:urban-legend-crow-on-wire-pulse 4.8s ease-in-out infinite}
.urban-legend-crow-on-wire-float{animation:urban-legend-crow-on-wire-float 6s ease-in-out infinite}
.urban-legend-crow-on-wire-sway{animation:urban-legend-crow-on-wire-sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 85%}
.urban-legend-crow-on-wire-pop{animation:urban-legend-crow-on-wire-pop 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes urban-legend-crow-on-wire-pulse{0%,100%{opacity:1}48%{opacity:.72}58%{opacity:.93}}
@keyframes urban-legend-crow-on-wire-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.65px)}}
@keyframes urban-legend-crow-on-wire-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}
@keyframes urban-legend-crow-on-wire-pop{0%,80%,100%{transform:translateY(0)}85%,93%{transform:translateY(-.35px)}89%{transform:translateY(.15px)}}
@media(prefers-reduced-motion:reduce){#urban-legend-crow-on-wire-art *{animation:none!important}}</style>
