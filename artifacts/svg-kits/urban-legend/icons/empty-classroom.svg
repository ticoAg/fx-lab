<svg xmlns="http://www.w3.org/2000/svg" id="urban-legend-empty-classroom-art" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-labelledby="urban-legend-empty-classroom-title urban-legend-empty-classroom-desc" stroke-linecap="round" stroke-linejoin="round">
<title id="urban-legend-empty-classroom-title">Empty classroom / 空教室</title>
<desc id="urban-legend-empty-classroom-desc">An empty classroom with an angled wooden desk, a displaced chair, a midnight clock and loose papers; chalk strokes and a handprint remain on the dark board. Transparent background; material and shadow colors are fixed, with currentColor reserved for restrained contour accents.</desc>
<style>#urban-legend-empty-classroom-art,#urban-legend-empty-classroom-art *{animation-play-state:inherit}
.urban-legend-empty-classroom-pulse{animation:urban-legend-empty-classroom-pulse 4.8s ease-in-out infinite}
.urban-legend-empty-classroom-float{animation:urban-legend-empty-classroom-float 6s ease-in-out infinite}
.urban-legend-empty-classroom-sway{animation:urban-legend-empty-classroom-sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 85%}
.urban-legend-empty-classroom-pop{animation:urban-legend-empty-classroom-pop 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes urban-legend-empty-classroom-pulse{0%,100%{opacity:1}48%{opacity:.72}58%{opacity:.93}}
@keyframes urban-legend-empty-classroom-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.65px)}}
@keyframes urban-legend-empty-classroom-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}
@keyframes urban-legend-empty-classroom-pop{0%,80%,100%{transform:translateY(0)}85%,93%{transform:translateY(-.35px)}89%{transform:translateY(.15px)}}
@media(prefers-reduced-motion:reduce){#urban-legend-empty-classroom-art *{animation:none!important}}</style>
