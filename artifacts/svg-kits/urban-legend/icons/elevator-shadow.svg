<svg xmlns="http://www.w3.org/2000/svg" id="urban-legend-elevator-shadow-art" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-labelledby="urban-legend-elevator-shadow-title urban-legend-elevator-shadow-desc" stroke-linecap="round" stroke-linejoin="round">
<title id="urban-legend-elevator-shadow-title">Shadow in the elevator / 电梯里的影子</title>
<desc id="urban-legend-elevator-shadow-desc">An old elevator with a mechanical floor dial, worn metal doors and a narrow opening concealing a tall figure and pale fingers; amber light spills onto the threshold. Transparent background; material and shadow colors are fixed, with currentColor reserved for restrained contour accents.</desc>
<style>#urban-legend-elevator-shadow-art,#urban-legend-elevator-shadow-art *{animation-play-state:inherit}
.urban-legend-elevator-shadow-pulse{animation:urban-legend-elevator-shadow-pulse 4.8s ease-in-out infinite}
.urban-legend-elevator-shadow-float{animation:urban-legend-elevator-shadow-float 6s ease-in-out infinite}
.urban-legend-elevator-shadow-sway{animation:urban-legend-elevator-shadow-sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 85%}
.urban-legend-elevator-shadow-pop{animation:urban-legend-elevator-shadow-pop 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes urban-legend-elevator-shadow-pulse{0%,100%{opacity:1}48%{opacity:.72}58%{opacity:.93}}
@keyframes urban-legend-elevator-shadow-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.65px)}}
@keyframes urban-legend-elevator-shadow-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}
@keyframes urban-legend-elevator-shadow-pop{0%,80%,100%{transform:translateY(0)}85%,93%{transform:translateY(-.35px)}89%{transform:translateY(.15px)}}
@media(prefers-reduced-motion:reduce){#urban-legend-elevator-shadow-art *{animation:none!important}}</style>
