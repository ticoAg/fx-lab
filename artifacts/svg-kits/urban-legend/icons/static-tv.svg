<svg xmlns="http://www.w3.org/2000/svg" id="urban-legend-static-tv-art" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-labelledby="urban-legend-static-tv-title urban-legend-static-tv-desc" stroke-linecap="round" stroke-linejoin="round">
<title id="urban-legend-static-tv-title">Static television / 雪花电视</title>
<desc id="urban-legend-static-tv-desc">A wood-cased CRT on splayed legs, with rabbit-ear aerials, tuning knobs and speaker slots; curved green glass and analog scan interference partly conceal a long-haired figure. Transparent background; material and shadow colors are fixed, with currentColor reserved for restrained contour accents.</desc>
<style>#urban-legend-static-tv-art,#urban-legend-static-tv-art *{animation-play-state:inherit}
.urban-legend-static-tv-pulse{animation:urban-legend-static-tv-pulse 4.8s ease-in-out infinite}
.urban-legend-static-tv-float{animation:urban-legend-static-tv-float 6s ease-in-out infinite}
.urban-legend-static-tv-sway{animation:urban-legend-static-tv-sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 85%}
.urban-legend-static-tv-pop{animation:urban-legend-static-tv-pop 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes urban-legend-static-tv-pulse{0%,100%{opacity:1}48%{opacity:.72}58%{opacity:.93}}
@keyframes urban-legend-static-tv-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.65px)}}
@keyframes urban-legend-static-tv-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}
@keyframes urban-legend-static-tv-pop{0%,80%,100%{transform:translateY(0)}85%,93%{transform:translateY(-.35px)}89%{transform:translateY(.15px)}}
@media(prefers-reduced-motion:reduce){#urban-legend-static-tv-art *{animation:none!important}}</style>
