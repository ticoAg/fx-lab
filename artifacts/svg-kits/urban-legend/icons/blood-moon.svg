<svg xmlns="http://www.w3.org/2000/svg" id="urban-legend-blood-moon-art" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-labelledby="urban-legend-blood-moon-title urban-legend-blood-moon-desc" stroke-linecap="round" stroke-linejoin="round">
<title id="urban-legend-blood-moon-title">Blood moon / 血月</title>
<desc id="urban-legend-blood-moon-desc">A muted crimson moon has irregular maria, rim-lit craters and a shaded limb; low clouds pass between bare branches while bats skim the edge. Transparent background; material and shadow colors are fixed, with currentColor reserved for restrained contour accents.</desc>
<style>#urban-legend-blood-moon-art,#urban-legend-blood-moon-art *{animation-play-state:inherit}
.urban-legend-blood-moon-pulse{animation:urban-legend-blood-moon-pulse 4.8s ease-in-out infinite}
.urban-legend-blood-moon-float{animation:urban-legend-blood-moon-float 6s ease-in-out infinite}
.urban-legend-blood-moon-sway{animation:urban-legend-blood-moon-sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 85%}
.urban-legend-blood-moon-pop{animation:urban-legend-blood-moon-pop 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes urban-legend-blood-moon-pulse{0%,100%{opacity:1}48%{opacity:.72}58%{opacity:.93}}
@keyframes urban-legend-blood-moon-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.65px)}}
@keyframes urban-legend-blood-moon-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}
@keyframes urban-legend-blood-moon-pop{0%,80%,100%{transform:translateY(0)}85%,93%{transform:translateY(-.35px)}89%{transform:translateY(.15px)}}
@media(prefers-reduced-motion:reduce){#urban-legend-blood-moon-art *{animation:none!important}}</style>
