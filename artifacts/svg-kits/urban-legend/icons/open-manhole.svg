<svg xmlns="http://www.w3.org/2000/svg" id="urban-legend-open-manhole-art" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-labelledby="urban-legend-open-manhole-title urban-legend-open-manhole-desc" stroke-linecap="round" stroke-linejoin="round">
<title id="urban-legend-open-manhole-title">Open manhole / 敞开的井盖</title>
<desc id="urban-legend-open-manhole-desc">A thick cast-iron manhole rim surrounds rungs disappearing into darkness, two pairs of eyes and pale gripping fingers; a slotted cover lies aside under two wisps of steam. Transparent background; material and shadow colors are fixed, with currentColor reserved for restrained contour accents.</desc>
<style>#urban-legend-open-manhole-art,#urban-legend-open-manhole-art *{animation-play-state:inherit}
.urban-legend-open-manhole-pulse{animation:urban-legend-open-manhole-pulse 4.8s ease-in-out infinite}
.urban-legend-open-manhole-float{animation:urban-legend-open-manhole-float 6s ease-in-out infinite}
.urban-legend-open-manhole-sway{animation:urban-legend-open-manhole-sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 85%}
.urban-legend-open-manhole-pop{animation:urban-legend-open-manhole-pop 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes urban-legend-open-manhole-pulse{0%,100%{opacity:1}48%{opacity:.72}58%{opacity:.93}}
@keyframes urban-legend-open-manhole-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.65px)}}
@keyframes urban-legend-open-manhole-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}
@keyframes urban-legend-open-manhole-pop{0%,80%,100%{transform:translateY(0)}85%,93%{transform:translateY(-.35px)}89%{transform:translateY(.15px)}}
@media(prefers-reduced-motion:reduce){#urban-legend-open-manhole-art *{animation:none!important}}</style>
