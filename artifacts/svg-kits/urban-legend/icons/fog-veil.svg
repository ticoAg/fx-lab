<svg xmlns="http://www.w3.org/2000/svg" id="urban-legend-fog-veil-art" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-labelledby="urban-legend-fog-veil-title urban-legend-fog-veil-desc" stroke-linecap="round" stroke-linejoin="round">
<title id="urban-legend-fog-veil-title">Figure in the fog / 雾中人影</title>
<desc id="urban-legend-fog-veil-desc">A hatted stranger in a long coat under a patinated street lamp; amber eyes hide under the brim and low banks of mist obscure the feet. Transparent background; material and shadow colors are fixed, with currentColor reserved for restrained contour accents.</desc>
<style>#urban-legend-fog-veil-art,#urban-legend-fog-veil-art *{animation-play-state:inherit}
.urban-legend-fog-veil-pulse{animation:urban-legend-fog-veil-pulse 4.8s ease-in-out infinite}
.urban-legend-fog-veil-float{animation:urban-legend-fog-veil-float 6s ease-in-out infinite}
.urban-legend-fog-veil-sway{animation:urban-legend-fog-veil-sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 85%}
.urban-legend-fog-veil-pop{animation:urban-legend-fog-veil-pop 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes urban-legend-fog-veil-pulse{0%,100%{opacity:1}48%{opacity:.72}58%{opacity:.93}}
@keyframes urban-legend-fog-veil-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.65px)}}
@keyframes urban-legend-fog-veil-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}
@keyframes urban-legend-fog-veil-pop{0%,80%,100%{transform:translateY(0)}85%,93%{transform:translateY(-.35px)}89%{transform:translateY(.15px)}}
@media(prefers-reduced-motion:reduce){#urban-legend-fog-veil-art *{animation:none!important}}</style>
