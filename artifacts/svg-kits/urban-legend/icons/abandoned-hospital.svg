<svg xmlns="http://www.w3.org/2000/svg" id="urban-legend-abandoned-hospital-art" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-labelledby="urban-legend-abandoned-hospital-title urban-legend-abandoned-hospital-desc" stroke-linecap="round" stroke-linejoin="round">
<title id="urban-legend-abandoned-hospital-title">Abandoned hospital / 废弃医院</title>
<desc id="urban-legend-abandoned-hospital-desc">An abandoned hospital in three-quarter perspective, with broken windows, boarded doors, ivy and iron railings; one amber window holds a figure beneath a muted red moon. Transparent background; material and shadow colors are fixed, with currentColor reserved for restrained contour accents.</desc>
<style>#urban-legend-abandoned-hospital-art,#urban-legend-abandoned-hospital-art *{animation-play-state:inherit}
.urban-legend-abandoned-hospital-pulse{animation:urban-legend-abandoned-hospital-pulse 4.8s ease-in-out infinite}
.urban-legend-abandoned-hospital-float{animation:urban-legend-abandoned-hospital-float 6s ease-in-out infinite}
.urban-legend-abandoned-hospital-sway{animation:urban-legend-abandoned-hospital-sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 85%}
.urban-legend-abandoned-hospital-pop{animation:urban-legend-abandoned-hospital-pop 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes urban-legend-abandoned-hospital-pulse{0%,100%{opacity:1}48%{opacity:.72}58%{opacity:.93}}
@keyframes urban-legend-abandoned-hospital-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.65px)}}
@keyframes urban-legend-abandoned-hospital-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}
@keyframes urban-legend-abandoned-hospital-pop{0%,80%,100%{transform:translateY(0)}85%,93%{transform:translateY(-.35px)}89%{transform:translateY(.15px)}}
@media(prefers-reduced-motion:reduce){#urban-legend-abandoned-hospital-art *{animation:none!important}}</style>
