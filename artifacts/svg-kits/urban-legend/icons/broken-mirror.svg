<svg xmlns="http://www.w3.org/2000/svg" id="urban-legend-broken-mirror-art" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-labelledby="urban-legend-broken-mirror-title urban-legend-broken-mirror-desc" stroke-linecap="round" stroke-linejoin="round">
<title id="urban-legend-broken-mirror-title">Broken mirror / 破碎的镜子</title>
<desc id="urban-legend-broken-mirror-desc">An oval mirror with patinated metal, an aged brass rim and curled ornaments surrounds fractured cool glass; a muted red eye hides in an unfamiliar reflection above fallen shards. Transparent background; material and shadow colors are fixed, with currentColor reserved for restrained contour accents.</desc>
<style>#urban-legend-broken-mirror-art,#urban-legend-broken-mirror-art *{animation-play-state:inherit}
.urban-legend-broken-mirror-pulse{animation:urban-legend-broken-mirror-pulse 4.8s ease-in-out infinite}
.urban-legend-broken-mirror-float{animation:urban-legend-broken-mirror-float 6s ease-in-out infinite}
.urban-legend-broken-mirror-sway{animation:urban-legend-broken-mirror-sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 85%}
.urban-legend-broken-mirror-pop{animation:urban-legend-broken-mirror-pop 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes urban-legend-broken-mirror-pulse{0%,100%{opacity:1}48%{opacity:.72}58%{opacity:.93}}
@keyframes urban-legend-broken-mirror-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.65px)}}
@keyframes urban-legend-broken-mirror-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}
@keyframes urban-legend-broken-mirror-pop{0%,80%,100%{transform:translateY(0)}85%,93%{transform:translateY(-.35px)}89%{transform:translateY(.15px)}}
@media(prefers-reduced-motion:reduce){#urban-legend-broken-mirror-art *{animation:none!important}}</style>
