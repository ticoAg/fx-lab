<svg xmlns="http://www.w3.org/2000/svg" id="urban-legend-hallway-door-art" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-labelledby="urban-legend-hallway-door-title urban-legend-hallway-door-desc" stroke-linecap="round" stroke-linejoin="round">
<title id="urban-legend-hallway-door-title">Door at the end of the hall / 走廊尽头的门</title>
<desc id="urban-legend-hallway-door-desc">A cutaway corridor uses one-point perspective, converging tiled flooring, wall panels and side doors to lead toward an ajar red door, a watching eye and a long floor shadow. Transparent background; material and shadow colors are fixed, with currentColor reserved for restrained contour accents.</desc>
<style>#urban-legend-hallway-door-art,#urban-legend-hallway-door-art *{animation-play-state:inherit}
.urban-legend-hallway-door-pulse{animation:urban-legend-hallway-door-pulse 4.8s ease-in-out infinite}
.urban-legend-hallway-door-float{animation:urban-legend-hallway-door-float 6s ease-in-out infinite}
.urban-legend-hallway-door-sway{animation:urban-legend-hallway-door-sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 85%}
.urban-legend-hallway-door-pop{animation:urban-legend-hallway-door-pop 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes urban-legend-hallway-door-pulse{0%,100%{opacity:1}48%{opacity:.72}58%{opacity:.93}}
@keyframes urban-legend-hallway-door-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.65px)}}
@keyframes urban-legend-hallway-door-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}
@keyframes urban-legend-hallway-door-pop{0%,80%,100%{transform:translateY(0)}85%,93%{transform:translateY(-.35px)}89%{transform:translateY(.15px)}}
@media(prefers-reduced-motion:reduce){#urban-legend-hallway-door-art *{animation:none!important}}</style>
