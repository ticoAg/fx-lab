<svg xmlns="http://www.w3.org/2000/svg" id="urban-legend-cursed-doll-art" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-labelledby="urban-legend-cursed-doll-title urban-legend-cursed-doll-desc" stroke-linecap="round" stroke-linejoin="round">
<title id="urban-legend-cursed-doll-title">Cursed doll / 诅咒人偶</title>
<desc id="urban-legend-cursed-doll-desc">A porcelain doll in a faded crimson dress and bone lace, with articulated limbs, leather shoes, a button eye, a crack and a stitched smile; two fine pins pierce the cloth. Transparent background; material and shadow colors are fixed, with currentColor reserved for restrained contour accents.</desc>
<style>#urban-legend-cursed-doll-art,#urban-legend-cursed-doll-art *{animation-play-state:inherit}
.urban-legend-cursed-doll-pulse{animation:urban-legend-cursed-doll-pulse 4.8s ease-in-out infinite}
.urban-legend-cursed-doll-float{animation:urban-legend-cursed-doll-float 6s ease-in-out infinite}
.urban-legend-cursed-doll-sway{animation:urban-legend-cursed-doll-sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 85%}
.urban-legend-cursed-doll-pop{animation:urban-legend-cursed-doll-pop 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes urban-legend-cursed-doll-pulse{0%,100%{opacity:1}48%{opacity:.72}58%{opacity:.93}}
@keyframes urban-legend-cursed-doll-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.65px)}}
@keyframes urban-legend-cursed-doll-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}
@keyframes urban-legend-cursed-doll-pop{0%,80%,100%{transform:translateY(0)}85%,93%{transform:translateY(-.35px)}89%{transform:translateY(.15px)}}
@media(prefers-reduced-motion:reduce){#urban-legend-cursed-doll-art *{animation:none!important}}</style>
