<svg xmlns="http://www.w3.org/2000/svg" id="urban-legend-vhs-tape-art" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-labelledby="urban-legend-vhs-tape-title urban-legend-vhs-tape-desc" stroke-linecap="round" stroke-linejoin="round">
<title id="urban-legend-vhs-tape-title">Cursed video tape / 诅咒录像带</title>
<desc id="urban-legend-vhs-tape-desc">An angled video cassette reveals molded sidewalls, twin reels and a worn paper label crossed out in red; a brown-black tape ribbon twists below. Transparent background; material and shadow colors are fixed, with currentColor reserved for restrained contour accents.</desc>
<style>#urban-legend-vhs-tape-art,#urban-legend-vhs-tape-art *{animation-play-state:inherit}
.urban-legend-vhs-tape-pulse{animation:urban-legend-vhs-tape-pulse 4.8s ease-in-out infinite}
.urban-legend-vhs-tape-float{animation:urban-legend-vhs-tape-float 6s ease-in-out infinite}
.urban-legend-vhs-tape-sway{animation:urban-legend-vhs-tape-sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 85%}
.urban-legend-vhs-tape-pop{animation:urban-legend-vhs-tape-pop 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes urban-legend-vhs-tape-pulse{0%,100%{opacity:1}48%{opacity:.72}58%{opacity:.93}}
@keyframes urban-legend-vhs-tape-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.65px)}}
@keyframes urban-legend-vhs-tape-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}
@keyframes urban-legend-vhs-tape-pop{0%,80%,100%{transform:translateY(0)}85%,93%{transform:translateY(-.35px)}89%{transform:translateY(.15px)}}
@media(prefers-reduced-motion:reduce){#urban-legend-vhs-tape-art *{animation:none!important}}</style>
