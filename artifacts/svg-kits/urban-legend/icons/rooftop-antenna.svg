<svg xmlns="http://www.w3.org/2000/svg" id="urban-legend-rooftop-antenna-art" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-labelledby="urban-legend-rooftop-antenna-title urban-legend-rooftop-antenna-desc" stroke-linecap="round" stroke-linejoin="round">
<title id="urban-legend-rooftop-antenna-title">Rooftop antenna / 天台天线</title>
<desc id="urban-legend-rooftop-antenna-desc">A rooftop aerial, guy wires and a drooping cable cross a raised water tank and an angled brick parapet beneath a cold moon; a long-haired figure stands at the edge. Transparent background; material and shadow colors are fixed, with currentColor reserved for restrained contour accents.</desc>
<style>#urban-legend-rooftop-antenna-art,#urban-legend-rooftop-antenna-art *{animation-play-state:inherit}
.urban-legend-rooftop-antenna-pulse{animation:urban-legend-rooftop-antenna-pulse 4.8s ease-in-out infinite}
.urban-legend-rooftop-antenna-float{animation:urban-legend-rooftop-antenna-float 6s ease-in-out infinite}
.urban-legend-rooftop-antenna-sway{animation:urban-legend-rooftop-antenna-sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 85%}
.urban-legend-rooftop-antenna-pop{animation:urban-legend-rooftop-antenna-pop 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes urban-legend-rooftop-antenna-pulse{0%,100%{opacity:1}48%{opacity:.72}58%{opacity:.93}}
@keyframes urban-legend-rooftop-antenna-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.65px)}}
@keyframes urban-legend-rooftop-antenna-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}
@keyframes urban-legend-rooftop-antenna-pop{0%,80%,100%{transform:translateY(0)}85%,93%{transform:translateY(-.35px)}89%{transform:translateY(.15px)}}
@media(prefers-reduced-motion:reduce){#urban-legend-rooftop-antenna-art *{animation:none!important}}</style>
