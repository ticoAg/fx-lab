<svg xmlns="http://www.w3.org/2000/svg" id="urban-legend-payphone-art" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-labelledby="urban-legend-payphone-title urban-legend-payphone-desc" stroke-linecap="round" stroke-linejoin="round">
<title id="urban-legend-payphone-title">Ringing payphone / 响铃的公用电话</title>
<desc id="urban-legend-payphone-desc">An angled public payphone with an amber hood, a green display, twelve keys, coin slot and return; its receiver hangs from a coiled armored cable. Transparent background; material and shadow colors are fixed, with currentColor reserved for restrained contour accents.</desc>
<style>#urban-legend-payphone-art,#urban-legend-payphone-art *{animation-play-state:inherit}
.urban-legend-payphone-pulse{animation:urban-legend-payphone-pulse 4.8s ease-in-out infinite}
.urban-legend-payphone-float{animation:urban-legend-payphone-float 6s ease-in-out infinite}
.urban-legend-payphone-sway{animation:urban-legend-payphone-sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 85%}
.urban-legend-payphone-pop{animation:urban-legend-payphone-pop 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes urban-legend-payphone-pulse{0%,100%{opacity:1}48%{opacity:.72}58%{opacity:.93}}
@keyframes urban-legend-payphone-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.65px)}}
@keyframes urban-legend-payphone-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}
@keyframes urban-legend-payphone-pop{0%,80%,100%{transform:translateY(0)}85%,93%{transform:translateY(-.35px)}89%{transform:translateY(.15px)}}
@media(prefers-reduced-motion:reduce){#urban-legend-payphone-art *{animation:none!important}}</style>
