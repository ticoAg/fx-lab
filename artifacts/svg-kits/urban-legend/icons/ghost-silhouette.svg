<title id="urban-legend-ghost-silhouette-title">Ghost silhouette / 幽灵剪影</title>
<desc id="urban-legend-ghost-silhouette-desc">A hooded apparition with cold eyes in a hollow face, reaching sleeves and layered bone-white cloth unfolding into a ragged hem. Transparent background; material and shadow colors are fixed, with currentColor reserved for restrained contour accents.</desc>
<style>#urban-legend-ghost-silhouette-art,#urban-legend-ghost-silhouette-art *{animation-play-state:inherit}
.urban-legend-ghost-silhouette-pulse{animation:urban-legend-ghost-silhouette-pulse 4.8s ease-in-out infinite}
.urban-legend-ghost-silhouette-float{animation:urban-legend-ghost-silhouette-float 6s ease-in-out infinite}
.urban-legend-ghost-silhouette-sway{animation:urban-legend-ghost-silhouette-sway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 85%}
.urban-legend-ghost-silhouette-pop{animation:urban-legend-ghost-silhouette-pop 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes urban-legend-ghost-silhouette-pulse{0%,100%{opacity:1}48%{opacity:.72}58%{opacity:.93}}
@keyframes urban-legend-ghost-silhouette-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.65px)}}
@keyframes urban-legend-ghost-silhouette-sway{0%,100%{transform:rotate(-.65deg)}50%{transform:rotate(.65deg)}}
@keyframes urban-legend-ghost-silhouette-pop{0%,80%,100%{transform:translateY(0)}85%,93%{transform:translateY(-.35px)}89%{transform:translateY(.15px)}}
@media(prefers-reduced-motion:reduce){#urban-legend-ghost-silhouette-art *{animation:none!important}}</style>
